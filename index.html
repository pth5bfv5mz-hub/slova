ста","pointed":"указывал","pointing":"направленный","police":"полиция, полицейский","polite":"вежливый","poor":"бедный","post":"почта (post office)","pots":"горшки","price":"Прайс (фамилия)","print":"отпечаток","prison":"тюрьма","promised":"пообещала","prove":"доказать","pulled":"вытащила","purpose":"цель (on purpose — нарочно)","pushed":"отодвинула","put":"положила","queen":"королева","quiet":"тихий","quietly":"тихо","ran":"побежали","rang":"зазвонил","real":"настоящий","red":"красный","relative":"родственник","repair":"исправить","richest":"самый богатый","room":"комната","rowe":"Роу (фамилия)","rowe's":"миссис Роу (чей)","rule":"правило","said":"сказал(а)","sat":"сидела","saw":"увидела","say":"говорить","school":"школа","second":"секунда","see":"видеть (see you — увидимся)","september":"сентябрь","sergeant":"сержант","serious":"серьёзный","seven":"семь","seventy":"семьдесят","shaking":"дрожали","she":"она","shining":"светило","short":"короткий","should":"должен","showed":"показала","silent":"молчаливый","sitting":"сидя","sleep":"спать","slowly":"медленно","small":"маленький","smallest":"самый маленький","smiled":"улыбнулась","so":"так, поэтому","soft":"мягкий","sold":"продала","somebody":"кто-то","someone":"кто-то","something":"что-то","soon":"скоро","sorry":"простите","station":"участок","stay":"оставаться","stayed":"оставалась","steal":"украсть","still":"неподвижно","stolen":"украл","stones":"камни","stood":"стояла, держалась","stopped":"остановилась","story":"история","straight":"прямо","stranger":"чужой человек","such":"такой","suddenly":"вдруг","suit":"костюм","sun":"солнце","surprised":"удивлённый","talk":"говорить","tall":"высокий","tea":"чай","tell":"сказать, рассказать","terrible":"ужасный","than":"чем","thanked":"поблагодарила","that":"что, тот, это","that's":"это (есть)","the":"(опр. артикль)","their":"их","them":"их, им","then":"потом, тогда","there":"там, туда","these":"эти","they":"они","thief":"вор","thin":"худой, тонкий","thing":"вещь","things":"вещи","think":"думать","thirty":"тридцать","this":"этот, это","thousands":"тысячи","time":"время","tiny":"крошечный","to":"к, в, (инфинитив)","told":"рассказала, сказал","tonight":"сегодня ночью","too":"слишком","took":"взяла, сделала","touch":"трогать","touched":"потрогала","toward":"к, по направлению","town":"город","travel":"разносятся","trees":"деревья","truth":"правда","turned":"повернулся","twenty":"двадцать","two":"два, двое","under":"под","understood":"поняли","until":"пока не","up":"вверх","upstairs":"наверху","usually":"обычно","value":"ценность","very":"очень","victor":"Виктор (имя)","victor's":"Виктора","violet":"фиалка","voice":"голос","waiting":"ждал(и)","walked":"обошла, пошла","warm":"тёплый","was":"был(а)","water":"поливать","way":"выход; путь, смысл","we":"мы","wedding":"свадебный","went":"пошли; стало","were":"были","wet":"влажный, мокрый","what":"что","when":"когда","where":"где","white":"белый","who":"кто, который","whole":"весь, целый","wide":"широко","wife":"жена","will":"(буд. время)","window":"окно","windows":"окна","winter":"зимний","with":"с","woman":"женщина","woman's":"женский","words":"слова","work":"работа","worked":"работал","would":"бы, (буд. в прош.)","wrong":"неправильно","years":"годы, лет","yesterday":"вчера","yet":"ещё, пока","you":"вы","your":"ваш"},"vocab":{"there":2,"nanny":22,"see":42,"enter":62,"earth":82,"lamp":102,"clouds":122,"gate":142,"should":162,"warm":182,"something":202,"passed":223,"stay":243,"stayed":243,"prove":263,"marry":283,"wide":304,"almost":324,"obeys":344,"challenge":364,"cozy":384,"bit":412,"immediately":433,"breath":460,"action":483,"value":504,"explosion":526,"mark":547,"relative":568,"impact":589,"harm":610,"offended":631}},{"id":3,"title_en":"The Crow on the Pass","title_ru":"Ворона на перевале","genre":"Приключения","summary_ru":"Переводчица отправляется через опасный горный перевал, чтобы вернуть старое кольцо, которое её бабушка когда-то увезла из далёкой деревни.","paragraphs":[{"en":"Lena had not taken a vacation for three years. She worked as a translator in a big city, and her days were full of contracts, emails and software updates. So when her grandmother died and left her a small wooden box, Lena finally took two weeks off. Inside the box there was an old silver ring and a letter in a language that Lena had studied at university but had never really used.","ru":"Лена не брала отпуск три года. Она работала переводчицей в большом городе, и её дни были заполнены контрактами, письмами и обновлениями программ. Поэтому, когда умерла её бабушка и оставила ей маленькую деревянную шкатулку, Лена наконец взяла две недели отдыха. В шкатулке лежали старое серебряное кольцо и письмо на языке, который Лена изучала в университете, но никогда по-настоящему не использовала."},{"en":"The letter was short, and Lena was able to translate most of it in one evening. “This ring does not belong to me,” her grandmother had written. “It belongs to my sister, Vera. I took it when I left our village sixty years ago. Please take it back to Kalna, behind the mountains. Do it for me. I have been sorry all my life.”","ru":"Письмо было коротким, и Лена смогла перевести большую его часть за один вечер. «Это кольцо не принадлежит мне, — написала бабушка. — Оно принадлежит моей сестре, Вере. Я взяла его, когда уехала из нашей деревни шестьдесят лет назад. Пожалуйста, верни его в Кальну, за горами. Сделай это ради меня. Я жалела об этом всю жизнь»."},{"en":"Lena had never heard about a sister. She looked at the map. Kalna was a tiny village on the other side of a high pass. There was no road, only an old path. “Prepare well,” said the woman at the tourist office in the last town. “The weather in these mountains changes very fast. And take cash. Nobody in Kalna has a card machine.”","ru":"Лена никогда не слышала ни о какой сестре. Она посмотрела на карту. Кальна была крошечной деревней по другую сторону высокого перевала. Дороги туда не было, только старая тропа. «Хорошо подготовьтесь, — сказала женщина в туристическом офисе последнего городка. — Погода в этих горах меняется очень быстро. И возьмите наличные. В Кальне ни у кого нет терминала для карт»."},{"en":"The next morning Lena met her guide, Tomas, an old man with a grey beard and a quiet voice. He looked at her new boots, her big backpack and the bright yellow umbrella on it, and he smiled.","ru":"На следующее утро Лена встретилась со своим проводником, Томасом, стариком с седой бородой и тихим голосом. Он посмотрел на её новые ботинки, на большой рюкзак и на ярко-жёлтый зонт, привязанный к нему, и улыбнулся."},{"en":"“An umbrella?” he asked. “Up there, the wind will take it away in a minute.”\n“Then it will have an interesting life,” Lena said.","ru":"«Зонт? — спросил он. — Там, наверху, ветер унесёт его за минуту».\n«Значит, у него будет интересная жизнь», — ответила Лена."},{"en":"They started walking. For the first hours the path went through a green forest, and Tomas talked about the mountains. Lena listened carefully. She was happy. At university she had only had books and recordings, and she had never talked to native speakers for more than five minutes. “Your approach to languages is strange,” Tomas told her. “You know difficult words, but you don't know how to ask for bread.” She laughed. It was true.","ru":"Они отправились в путь. Первые часы тропа шла через зелёный лес, и Томас рассказывал о горах. Лена внимательно слушала. Она была счастлива. В университете у неё были только книги и записи, и она никогда не разговаривала с носителями языка дольше пяти минут. «Странный у тебя подход к языкам, — сказал ей Томас. — Трудные слова ты знаешь, а как попросить хлеба — не знаешь». Она засмеялась. Это была правда."},{"en":"Around noon a black crow began to follow them. It flew from tree to tree, always a little ahead, and sometimes it shouted at them. “In my village,” Tomas said, “people say that a crow on the path shows you your destiny. Good or bad, nobody knows.”\n“Do you believe that?”\n“I believe in good boots,” he answered.","ru":"Около полудня за ними начала лететь чёрная ворона. Она перелетала с дерева на дерево, всегда чуть впереди, и иногда кричала на них. «В моей деревне, — сказал Томас, — говорят, что ворона на тропе показывает тебе твою судьбу. Хорошую или плохую — никто не знает».\n«Вы в это верите?»\n«Я верю в хорошие ботинки», — ответил он."},{"en":"In the afternoon they reached the river. Usually, Tomas said, it was easy to cross it on the stones. But snow had melted high in the mountains, and now the water was brown, fast and loud. Lena could feel its force through the ground under her feet.","ru":"Днём они дошли до реки. Обычно, сказал Томас, её легко перейти по камням. Но высоко в горах растаял снег, и теперь вода была бурой, быстрой и шумной. Лена чувствовала её силу через землю под ногами."},{"en":"“We can wait until tomorrow,” said Tomas. “Or we can try the old crossing higher up.”\nLena thought about her two short weeks and about the box in her backpack. “Let's try,” she said. A minute later she was full of regret. Halfway across, a stone moved under her boot, and she fell into the icy water. The river pulled her down. For a long, terrible moment she was sure she was going to drown.","ru":"«Можем подождать до завтра, — сказал Томас. — Или попробовать старую переправу выше по течению».\nЛена подумала о своих двух коротких неделях и о шкатулке в рюкзаке. «Давайте попробуем», — сказала она. Через минуту она была полна сожаления. На полпути камень сдвинулся у неё под ботинком, и она упала в ледяную воду. Река потянула её вниз. Долгое, ужасное мгновение она была уверена, что утонет."},{"en":"Then a strong hand took her backpack. Tomas pulled her out onto the rocks with incredible force for a man of seventy. Lena lay on the stones, coughing and shaking. Her yellow umbrella was gone, carried away forever by the brown water.\n“Well,” said Tomas, breathing hard, “now it has an interesting life.”","ru":"Тут сильная рука схватила её рюкзак. Томас вытащил её на камни с невероятной для семидесятилетнего человека силой. Лена лежала на камнях, кашляя и дрожа. Её жёлтый зонт исчез, навсегда унесённый бурой водой.\n«Что ж, — сказал Томас, тяжело дыша, — теперь у него интересная жизнь»."},{"en":"Before dark they found an old shepherds' hut. Tomas made a fire in the stone fireplace, and Lena dried her clothes and her grandmother's letter. Luckily, the ring was still safe in its little box in her pocket. She was exhausted. Her legs hurt, her hands hurt, and she had never been so cold in her life. For a moment she thought that the whole trip was a failure. But she was alive.","ru":"До темноты они нашли старую пастушью хижину. Томас развёл огонь в каменном камине, а Лена высушила одежду и бабушкино письмо. К счастью, кольцо по-прежнему лежало в своей коробочке у неё в кармане. Она была измучена. Ноги болели, руки болели, и ей никогда в жизни не было так холодно. На мгновение ей показалось, что вся поездка — неудача. Но она была жива."},{"en":"Outside, the mist came down from the mountains and covered everything. Then they heard a sound: a sad, thin cry, not far from the hut.\n“An animal?” Lena whispered.\n“I will go and investigate,” Tomas said, and took his torch.\n“Not alone,” said Lena, and followed him.","ru":"Снаружи с гор спустился туман и всё укрыл. Потом они услышали звук — печальный, тонкий крик неподалёку от хижины.\n«Животное?» — прошептала Лена.\n«Пойду выясню, в чём дело», — сказал Томас и взял фонарь.\n«Не один», — сказала Лена и пошла за ним."},{"en":"Behind the hut they found the crow. Its leg was caught in an old wire trap. When Lena came closer, it opened its black beak and screamed at her. “Shh,” she said softly. “I'm not going to hurt you.” Her fingers were still cold, but she worked slowly and patiently, and at last she released the bird. The crow did not fly away. It sat on the roof of the hut and watched them all night.","ru":"За хижиной они нашли ворону. Её лапа попала в старый проволочный капкан. Когда Лена подошла ближе, птица раскрыла чёрный клюв и закричала на неё. «Тише, — мягко сказала Лена. — Я не сделаю тебе больно». Пальцы у неё всё ещё были холодными, но она работала медленно и терпеливо и наконец освободила птицу. Ворона не улетела. Она сидела на крыше хижины и всю ночь смотрела на них."},{"en":"The next day was the hardest. The path climbed up and up through rocks and snow, and the wind was icy. Lena's feet were wet, and every step hurt. But she endured it without a word. Only once she stopped and said, “I can't. I really can't.”","ru":"Следующий день был самым тяжёлым. Тропа поднималась всё выше и выше среди камней и снега, а ветер был ледяным. Ноги у Лены промокли, и каждый шаг причинял боль. Но она терпела, не говоря ни слова. Лишь однажды она остановилась и сказала: «Я не могу. Правда не могу»."},{"en":"Tomas did not shout at her. “I never raise my voice in the mountains,” he said calmly. “The mountains are always louder than me. Just take one more step. Then another one. That is the only way to cross them.”","ru":"Томас не стал на неё кричать. «Я никогда не повышаю голос в горах, — спокойно сказал он. — Горы всегда громче меня. Просто сделай ещё один шаг. Потом ещё один. Только так их и можно перейти»."},{"en":"At the top of the pass, the mist suddenly opened. Below them lay a green valley with a small village, a church and a few dozen houses. “Kalna,” said Tomas. The crow flew over their heads and down into the valley, as if it was showing them the way.","ru":"На вершине перевала туман вдруг расступился. Внизу лежала зелёная долина с маленькой деревней, церковью и несколькими десятками домов. «Кальна», — сказал Томас. Ворона пролетела над их головами и спустилась в долину, словно показывая им дорогу."},{"en":"In the village, people came out of their houses to look at the strangers. Lena spoke to them in their language, slowly and with mistakes, and they answered with surprised smiles. Then she asked about Vera, and their faces changed. “Vera lives in the last house, near the forest,” said a boy. “But be careful. She is a witch.”","ru":"В деревне люди выходили из домов, чтобы посмотреть на чужаков. Лена говорила с ними на их языке, медленно и с ошибками, а они отвечали удивлёнными улыбками. Потом она спросила о Вере, и их лица изменились. «Вера живёт в последнем доме, у леса, — сказал мальчик. — Но будьте осторожны. Она ведьма»."},{"en":"The last house was small and old, and there were crows on its roof. An old woman opened the door. She had white hair and very dark, sharp eyes, the same eyes as Lena's grandmother. For a moment Lena could not speak. Then she took out the ring.\n“My name is Lena,” she said. “I think this belongs to you.”","ru":"Последний дом был маленьким и старым, а на его крыше сидели вороны. Дверь открыла старая женщина. У неё были белые волосы и очень тёмные, острые глаза — такие же, как у Лениной бабушки. На мгновение Лена не могла вымолвить ни слова. Потом она достала кольцо.\n«Меня зовут Лена, — сказала она. — Думаю, это принадлежит вам»."},{"en":"The old woman looked at the ring for a long time. Then she turned and walked slowly to her fireplace. She sat down, and Lena saw that she was crying. “Come in,” she said at last. “Both of you.”","ru":"Старая женщина долго смотрела на кольцо. Потом она повернулась и медленно пошла к своему камину. Она села, и Лена увидела, что она плачет. «Входите, — сказала она наконец. — Оба»."},{"en":"That evening Vera told them the story. Sixty years ago, two sisters had loved the same young man. He gave the ring to Vera. But one night her sister took it and ran away with him across the mountains. “I was so angry,” Vera said. “I said terrible things. Then people in the village decided that I had put a curse on her. That is why they call me a witch. Children are afraid of me. For sixty years I have lived alone with my crows.”","ru":"В тот вечер Вера рассказала им всю историю. Шестьдесят лет назад две сестры любили одного и того же юношу. Он подарил кольцо Вере. Но однажды ночью её сестра взяла его и убежала с ним через горы. «Я была так зла, — сказала Вера. — Я говорила ужасные вещи. А потом люди в деревне решили, что я её прокляла. Поэтому меня и называют ведьмой. Дети меня боятся. Шестьдесят лет я живу одна со своими воронами»."},{"en":"“She didn't marry him,” Lena said quietly. “He left her after one year. She worked in a factory, and then she became a teacher. She never came back because she was ashamed. In her letter she says that she lost her honour, and she lost her sister. She says that you were the biggest regret of her life.”","ru":"«Она не вышла за него замуж, — тихо сказала Лена. — Он бросил её через год. Она работала на фабрике, а потом стала учительницей. Она так и не вернулась, потому что ей было стыдно. В письме она пишет, что потеряла честь и потеряла сестру. Она пишет, что вы — самое большое сожаление её жизни»."},{"en":"Vera listened without moving. Then she asked Lena to read the letter aloud. Lena read it twice: first in her own language, and then again in a careful translation, word by word. When she finished, the old woman took her hand and held it for a long time.","ru":"Вера слушала не шевелясь. Потом она попросила Лену прочитать письмо вслух. Лена прочитала его дважды: сначала на своём языке, а потом ещё раз — в тщательном переводе, слово за словом. Когда она закончила, старая женщина взяла её за руку и долго не отпускала."},{"en":"“Your grandmother was always the brave one,” Vera said. “And you have her eyes and her crazy courage. Who tries to cross the river in spring?”\nTomas laughed loudly for the first time in two days.","ru":"«Твоя бабушка всегда была смелой, — сказала Вера. — А у тебя её глаза и её безумная храбрость. Кто же пытается перейти реку весной?»\nТомас громко рассмеялся — впервые за два дня."},{"en":"Lena wanted to pay Tomas with the cash she had brought, but he shook his head. “Keep it for the way back,” he said. “And buy a new umbrella. A useful one this time.”","ru":"Лена хотела заплатить Томасу наличными, которые привезла с собой, но он покачал головой. «Оставь на обратную дорогу, — сказал он. — И купи новый зонт. На этот раз полезный»."},{"en":"On her last morning in Kalna, Lena stood with Vera at the door. The crow from the pass was sitting on the fence. “It came back with you,” Vera said. “My crows always know who belongs here.”\n“Do I belong here?” Lena asked.\n“That is your destiny, and you must decide it yourself,” Vera said with a smile. “But listen to me. You came too late for your grandmother. You did not come too late for me.”","ru":"В последнее утро в Кальне Лена стояла с Верой у двери. Ворона с перевала сидела на заборе. «Она вернулась вместе с тобой, — сказала Вера. — Мои вороны всегда знают, кто здесь свой».\n«А я здесь своя?» — спросила Лена.\n«Это твоя судьба, и решать её тебе самой, — с улыбкой сказала Вера. — Но послушай меня. Ты пришла слишком поздно для своей бабушки. Но не слишком поздно для меня»."},{"en":"In the valley Lena's phone finally found a signal. There were forty new emails, three updates and a message from her boss: “When are you coming back?” She looked at the green valley, at the old woman and at the black bird on the fence. Then she switched off the phone, turned around and went back inside, where Vera was making tea by the fireplace.","ru":"В долине телефон Лены наконец поймал сигнал. Там было сорок новых писем, три обновления и сообщение от начальника: «Когда вы вернётесь?» Она посмотрела на зелёную долину, на старую женщину и на чёрную птицу на заборе. Потом выключила телефон, повернулась и вернулась в дом, где Вера заваривала чай у камина."}],"gloss":{"a":"(артикль), один","able":"способный (быть в состоянии)","about":"о, около","across":"через, поперёк","afraid":"боящийся","after":"после, через","afternoon":"день, после полудня","again":"снова","ago":"назад","ahead":"впереди","alive":"живой","all":"весь, все","alone":"один, одна","aloud":"вслух","always":"всегда","an":"(артикл ":"Ленин","let's":"давай(те)","letter":"письмо","life":"жизнь","listen":"слушать","listened":"слушала","little":"маленький","lived":"жила","lives":"живёт","long":"долгий, долго","look":"смотреть","looked":"посмотрел(а)","lost":"потеряла","loud":"громкий","louder":"громче","loudly":"громко","loved":"любили","luckily":"к счастью","machine":"терминал, машина","made":"развёл, сделал","making":"заваривала","man":"человек, мужчина","map":"карта","marry":"выйти замуж","me":"меня, мне","melted":"растаял","message":"сообщение","met":"встретила","minute":"минута","minutes":"минуты","mist":"туман","mistakes":"ошибки","moment":"мгновение","more":"больше, ещё","morning":"утро","most":"большая часть","mountains":"горы","moved":"сдвинулся","moving":"двигаясь","must":"должна","my":"мой","name":"имя","native":"родной","near":"около","never":"никогда","new":"новый","next":"следующий","night":"ночь","no":"нет, никакой","nobody":"никто","noon":"полдень","not":"не","now":"теперь","of":"из, (родительный падеж)","off":"выключила, отдых","office":"офис","old":"старый","on":"на","once":"однажды","one":"один","only":"только","onto":"на","opened":"открыла, расступился","or":"или","other":"другой","our":"наш","out":"из, наружу","outside":"снаружи","over":"над","own":"собственный","pass":"перевал","path":"тропа","patiently":"терпеливо","pay":"заплатить","people":"люди","phone":"телефон","please":"пожалуйста","pocket":"карман","prepare":"подготовиться","pulled":"вытащил, тянула","put":"наложила","quiet":"тихий","quietly":"тихо","raise":"повышать","ran":"убежала","reached":"дошли","read":"читать, прочитала","really":"действительно","recordings":"записи","regret":"сожаление","released":"освободила","ring":"кольцо","river":"река","road":"дорога","rocks":"камни, скалы","roof":"крыша","sad":"печальный","safe":"в безопасности","said":"сказал(а)","same":"тот же","sat":"сидела, села","saw":"увидела","say":"говорят","says":"пишет, говорит","screamed":"закричала","seventy":"семьдесят","shaking":"дрожа","sharp":"острый","she":"она","shepherds":"пастухов","shh":"тише","shook":"покачал","short":"короткий","shout":"кричать","shouted":"кричала","showing":"показывая","shows":"показывает","side":"сторона","signal":"сигнал","silver":"серебряный","sister":"сестра","sisters":"сёстры","sitting":"сидела","sixty":"шестьдесят","slowly":"медленно","small":"маленький","smile":"улыбка","smiled":"улыбнулся","smiles":"улыбки","snow":"снег","so":"так, поэтому","softly":"мягко","software":"программы","sometimes":"иногда","sorry":"сожалеющий","sound":"звук","speak":"говорить","speakers":"говорящие","spoke":"говорила","spring":"весна","started":"начали","step":"шаг","still":"всё ещё","stone":"камень","stones":"камни","stood":"стояла","stopped":"остановилась","story":"история","strange":"странный","strangers":"чужаки","strong":"сильный","studied":"изучала","suddenly":"вдруг","sure":"уверенный","surprised":"удивлённый","switched":"выключила","take":"взять, сделать","taken":"брала","talked":"говорил(а)","tea":"чай","teacher":"учительница","terrible":"ужасный","than":"чем","that":"что, тот, это","the":"(артикль)","their":"их","them":"их, им","then":"потом, тогда","there":"там","these":"эти","they":"они","thin":"тонкий","things":"вещи","think":"думать","this":"этот, это","thought":"подумала","three":"три","through":"через, сквозь","time":"раз, время","tiny":"крошечный","to":"к, в, (частица)","told":"сказал, рассказала","tomas":"Томас (имя)","tomorrow":"завтра","too":"слишком","took":"взяла","top":"вершина","torch":"фонарь","tourist":"туристический","town":"городок","translate":"перевести","translation":"перевод","translator":"переводчица","trap":"капкан","tree":"дерево","tries":"пытается","trip":"поездка","true":"правда","try":"попробовать","turned":"повернулась","twice":"дважды","two":"два","umbrella":"зонт","under":"под","university":"университет","until":"до","up":"вверх, наверху","updates":"обновления","used":"использовала","useful":"полезный","usually":"обычно","vacation":"отпуск","valley":"долина","vera":"Вера (имя)","very":"очень","village":"деревня","voice":"голос","wait":"ждать","walked":"пошла","walking":"идти пешком","wanted":"хотела","was":"был(а)","watched":"смотрела","water":"вода","way":"путь, способ","we":"мы","weather":"погода","weeks":"недели","well":"хорошо, что ж","went":"шла, вернулась","were":"были","wet":"мокрый","when":"когда","where":"где","whispered":"прошептала","white":"белый","who":"кто","whole":"весь","why":"почему","will":"(буд. время)","wind":"ветер","wire":"проволочный","witch":"ведьма","with":"с","without":"без","woman":"женщина","wooden":"деревянный","word":"слово","words":"слова","worked":"работала","written":"написала","year":"год","years":"лет, годы","yellow":"жёлтый","you":"ты, вы","young":"молодой","your":"твой, ваш","yourself":"сама"},"vocab":{"these":3,"turned":23,"native":43,"speakers":43,"feet":63,"listened":83,"listen":83,"umbrella":103,"translate":123,"translation":123,"drown":143,"witch":163,"fireplace":183,"incredible":203,"forever":224,"belong":244,"belongs":244,"useful":264,"cash":284,"crow":305,"crows":305,"prepare":325,"honour":345,"regret":365,"vacation":385,"mist":413,"destiny":434,"force":461,"exhausted":484,"failure":505,"updates":527,"endured":548,"investigate":569,"released":590,"approach":611,"raise":632,"voice":632}},{"id":4,"title_en":"The Robot Who Lost at Chess","title_ru":"Робот, который проиграл в шахматы","genre":"Научная фантастика","summary_ru":"Старый робот в горной деревне впервые проигрывает в шахматы — и с этого момента начинает чувствовать то, чего нет в его программе.","paragraphs":[{"en":"In the small village of Kerno, high in the mountains, there was only one robot. Its official name was HX-7, but everyone called it Tobi. Tobi lived in a stone house near the forest with an old woman named Marta, and every morning at six o'clock she turned him on.","ru":"В маленькой деревне Керно, высоко в горах, был только один робот. Официально его звали HX-7, но все называли его Тоби. Тоби жил в каменном доме рядом с лесом со старой женщиной по имени Марта, и каждое утро в шесть часов она его включала."},{"en":"Marta made soap. She made it the old way, with oil, herbs and honey, and once a week Tobi carried the boxes down to the market. People said that Marta's soap was the best in the region. Tobi did not know what “best” meant. He only knew that he had to bring the boxes, count the money and come back before dark.","ru":"Марта варила мыло. Она делала его по-старому, из масла, трав и мёда, и раз в неделю Тоби относил коробки вниз, на рынок. Люди говорили, что мыло Марты — лучшее в округе. Тоби не знал, что значит «лучшее». Он знал только, что должен принести коробки, пересчитать деньги и вернуться до темноты."},{"en":"In the evenings Marta and Tobi played chess. She had an old chess set that her husband, Pavel, had made before he died. The pieces were small and smooth, made of dark wood, and the white queen had a crack in her crown. Tobi could calculate a million moves in a second, so he always won. Marta never minded. “You play like a machine,” she laughed. “Because I am a machine,” Tobi answered.","ru":"По вечерам Марта и Тоби играли в шахматы. У неё был старый шахматный набор, который её муж Павел сделал перед смертью. Фигуры были маленькие и гладкие, из тёмного дерева, а у белой королевы была трещина в короне. Тоби мог просчитать миллион ходов за секунду, поэтому всегда выигрывал. Марта никогда не возражала. «Ты играешь как машина», — смеялась она. «Потому что я машина», — отвечал Тоби."},{"en":"Then one evening, something strange happened. Marta moved her knight, and Tobi saw that she had made a mistake. He could win in three moves. But he did not take her queen. He moved a small pawn instead, and two moves later Marta shouted, “Checkmate!” It was his first defeat. Tobi looked at the board for a long time. He did not understand why he had done it. He only knew that Marta's happy face had been more important than the game.","ru":"Но однажды вечером случилось что-то странное. Марта пошла конём, и Тоби увидел, что она совершила ошибку. Он мог выиграть в три хода. Но он не взял её королеву. Вместо этого он двинул маленькую пешку, и через два хода Марта закричала: «Мат!» Это было его первое поражение. Тоби долго смотрел на доску. Он не понимал, почему так сделал. Он знал только, что счастливое лицо Марты было важнее игры."},{"en":"After that night, the strange things did not stop. When the rain hit the window, Tobi stopped and listened. When Marta sang in the kitchen, he liked her voice, and he did not know what “liked” meant either. He began to walk slowly through the forest behind the house, just to look at the light between the trees. None of this was in his program.","ru":"После той ночи странности не прекратились. Когда дождь стучал в окно, Тоби останавливался и слушал. Когда Марта пела на кухне, ему нравился её голос, и он тоже не знал, что значит «нравился». Он начал медленно ходить по лесу за домом, только чтобы смотреть на свет между деревьями. Ничего этого не было в его программе."},{"en":"In spring, Marta's grandson Daniel came to visit her from the city. He was a tall young man with a loud laugh, and Marta was so happy that she cooked all day. Daniel carried the soap boxes to the market. Daniel played chess with her. Daniel sat in Tobi's chair near the fire.","ru":"Весной внук Марты, Даниэль, приехал из города навестить её. Это был высокий молодой человек с громким смехом, и Марта была так счастлива, что готовила целый день. Даниэль носил коробки с мылом на рынок. Даниэль играл с ней в шахматы. Даниэль сидел в кресле Тоби рядом с камином."},{"en":"Tobi stood in the corner and felt something hot and heavy inside his chest, where there was only a battery. He searched his memory for a word. Finally he found it in an old dictionary file: jealous. He was jealous. A robot was jealous of a human. He was so confused that he walked into the door frame twice.","ru":"Тоби стоял в углу и чувствовал что-то горячее и тяжёлое внутри груди, где был только аккумулятор. Он искал в памяти слово. Наконец он нашёл его в старом файле словаря: ревнивый. Он ревновал. Робот ревновал к человеку. Он был так растерян, что дважды врезался в дверной косяк."},{"en":"Daniel noticed. “Grandma,” he said quietly at dinner, “your robot isn't working properly. Yesterday I saw it standing in the garden for an hour, looking at a flower. That's not normal. You should call the company.”","ru":"Даниэль это заметил. «Бабушка, — тихо сказал он за ужином, — твой робот работает неправильно. Вчера я видел, как он целый час стоял в саду и смотрел на цветок. Это ненормально. Тебе надо позвонить в компанию»."},{"en":"“He's fine,” said Marta. But Daniel had already sent a message.","ru":"«С ним всё в порядке», — сказала Марта. Но Даниэль уже отправил сообщение."},{"en":"A week later, an engineer arrived in the village. Her name was Lena Orlova, and she was younger than Tobi expected, with tired eyes and a grey company uniform. She stopped at the entrance of the house and looked at Tobi for a long time before she said hello.","ru":"Через неделю в деревню приехала инженер. Её звали Лена Орлова, и она была моложе, чем ожидал Тоби, с усталыми глазами и в серой форме компании. Она остановилась у входа в дом и долго смотрела на Тоби, прежде чем поздороваться."},{"en":"“I need to check his memory,” she told Marta. “If he has developed what we call ‘emotional errors’, I must take him back to the central warehouse.” “And what happens there?” Marta asked. Lena did not look at her. “The robots are switched off and kept in storage. Some people call it the prison. It's not a nice place.”","ru":"«Мне нужно проверить его память, — сказала она Марте. — Если у него появились так называемые „эмоциональные ошибки“, я должна забрать его на центральный склад». «А что там происходит?» — спросила Марта. Лена не смотрела на неё. «Роботов выключают и держат на хранении. Некоторые называют это тюрьмой. Это не самое приятное место»."},{"en":"That night, Marta could not sleep. She sat at the kitchen table, turning something small in her fingers. It was her wedding ring. Tobi had seen it many times on a chain around her neck. “Pavel gave me this fifty years ago,” she said. “He worked for that company too, you know. He built the first robots like you. He always said that one day a machine would learn to feel, and that people would be afraid of it.”","ru":"В ту ночь Марта не могла уснуть. Она сидела за кухонным столом и крутила в пальцах что-то маленькое. Это было её обручальное кольцо. Тоби много раз видел его на цепочке у неё на шее. «Павел подарил мне его пятьдесят лет назад, — сказала она. — Знаешь, он тоже работал в этой компании. Он строил первых роботов, таких как ты. Он всегда говорил, что однажды машина научится чувствовать и что люди будут этого бояться»."},{"en":"In the morning, the ring had disappeared. Marta searched the whole house, crying. Then Tobi remembered: yesterday she had walked to the old bridge across the river, where she and Pavel used to sit together. The chain must have broken there.","ru":"Утром кольцо исчезло. Марта, плача, обыскала весь дом. Тогда Тоби вспомнил: вчера она ходила к старому мосту через реку, где они с Павлом когда-то сидели вместе. Цепочка, должно быть, порвалась там."},{"en":"Tobi went to the river without asking. He found the place quickly — he could see a small gold light under the bridge, on a rock in the middle of the fast water. To reach it, he had to climb down the wet stones. His feet were not made for this. Halfway down, he slipped and fell. His left arm hit the rock and stopped moving. Water came into his body. For the first time in his life, he felt vulnerable — literally breakable, like glass.","ru":"Тоби пошёл к реке, никого не спросив. Он быстро нашёл место — он видел маленький золотой огонёк под мостом, на камне посреди быстрой воды. Чтобы добраться до него, ему пришлось спускаться по мокрым камням. Его ноги не были для этого созданы. На полпути он поскользнулся и упал. Левая рука ударилась о камень и перестала двигаться. Вода попала внутрь корпуса. Впервые в жизни он почувствовал себя уязвимым — буквально хрупким, как стекло."},{"en":"But he did not go back. He climbed the last two metres with one arm, took the ring, and slowly climbed up again.","ru":"Но он не повернул назад. Он преодолел последние два метра с одной рукой, взял кольцо и медленно взобрался обратно наверх."},{"en":"When he returned to the house, Lena was waiting at the entrance with her computer. She saw the broken arm, the water, the mud. Tobi walked past her and gave the ring to Marta. Marta held it to her chest and could not speak.","ru":"Когда он вернулся к дому, Лена ждала у входа со своим компьютером. Она увидела сломанную руку, воду, грязь. Тоби прошёл мимо неё и отдал кольцо Марте. Марта прижала его к груди и не могла говорить."},{"en":"Lena connected her computer to Tobi's head and read his memory for an hour. Tobi waited. He thought about the warehouse. He thought about the dark. And he noticed that he was afraid, which was also not in his program.","ru":"Лена подключила компьютер к голове Тоби и целый час читала его память. Тоби ждал. Он думал о складе. Он думал о темноте. И он заметил, что ему страшно, — а этого тоже не было в его программе."},{"en":"Finally Lena looked up. “There is a lot of evidence here,” she said quietly. “The chess game. The flower. The jealousy. The ring. By the rules, I must take him. I have done this many times. I have a lot of experience with cases like this.”","ru":"Наконец Лена подняла глаза. «Здесь много доказательств, — тихо сказала она. — Шахматная партия. Цветок. Ревность. Кольцо. По правилам я должна его забрать. Я делала это много раз. У меня большой опыт в таких случаях»."},{"en":"“Please,” said Marta. “Can't you forgive him for being different?”","ru":"«Пожалуйста, — сказала Марта. — Неужели вы не можете простить его за то, что он не такой, как все?»"},{"en":"“It's not about forgiving,” Lena said. “There is something else.” She turned the screen so that Marta could see it. Deep inside Tobi's program there was a small hidden file. At the top of it were two letters: P.V.","ru":"«Дело не в прощении, — сказала Лена. — Здесь есть кое-что ещё». Она повернула экран, чтобы Марта могла его видеть. Глубоко внутри программы Тоби был маленький скрытый файл. Наверху стояли две буквы: P.V."},{"en":"“Pavel Vinter,” Lena said. “Your husband. He was my teacher at university. At the company they say he made a mistake in the code of the first robots — a strange piece that nobody could understand. They tried to remove it for years.” She looked at Tobi. “It wasn't a mistake. He wrote it on purpose. It lets a robot learn from experience, not just from rules. It grows slowly, like a plant. In most robots it never wakes up. In yours, it did.”","ru":"«Павел Винтер, — сказала Лена. — Ваш муж. Он был моим преподавателем в университете. В компании говорят, что он совершил ошибку в коде первых роботов — странный кусок, который никто не мог понять. Его годами пытались удалить». Она посмотрела на Тоби. «Это была не ошибка. Он написал его специально. Он позволяет роботу учиться на опыте, а не только по правилам. Он растёт медленно, как растение. В большинстве роботов он так и не просыпается. В вашем — проснулся»."},{"en":"“So what will you do?” asked Daniel from the door. He looked ashamed now.","ru":"«И что вы будете делать?» — спросил Даниэль от двери. Теперь ему, похоже, было стыдно."},{"en":"Lena was silent for a moment. “My job is to judge if a robot is dangerous. The company's expectations are clear. They want machines that work, not machines that think about flowers.” She closed the computer. “But I don't think it is my job to judge if a robot is alive.”","ru":"Лена помолчала. «Моя работа — судить, опасен ли робот. Ожидания компании ясны. Им нужны машины, которые работают, а не машины, которые думают о цветах». Она закрыла компьютер. «Но я не думаю, что моя работа — судить, живой ли робот»."},{"en":"She wrote something on her tablet and showed it to them. Inspection result: no errors found. Unit HX-7 is unique. Recommendation: leave in the village for further observation. “My boss has to approve it,” she said, “but he never reads my reports properly.”","ru":"Она что-то написала на планшете и показала им. Результат проверки: ошибок не обнаружено. Устройство HX-7 уникально. Рекомендация: оставить в деревне для дальнейшего наблюдения. «Мой начальник должен это утвердить, — сказала она, — но он никогда как следует не читает мои отчёты»."},{"en":"Marta laughed and cried at the same time. Daniel shook Lena's hand. Tobi stood in the middle of the room with his broken arm and did not know what to do with his face, because robot faces cannot move. So he did the only natural thing he could think of. He went to the kitchen and made everyone tea.","ru":"Марта смеялась и плакала одновременно. Даниэль пожал Лене руку. Тоби стоял посреди комнаты со сломанной рукой и не знал, что делать со своим лицом, потому что лица роботов не двигаются. Поэтому он сделал единственное естественное, что пришло ему в голову. Он пошёл на кухню и заварил всем чай."},{"en":"That evening, Lena stayed for dinner. Later, Marta took out the chess set and put it on the table. “Play with him,” she said to Lena. “But be careful. He has learned to lose.”","ru":"В тот вечер Лена осталась на ужин. Позже Марта достала шахматный набор и поставила его на стол. «Сыграйте с ним, — сказала она Лене. — Но будьте осторожны. Он научился проигрывать»."},{"en":"Outside, the rain started to hit the window again. Tobi stopped in the middle of a move and listened. It was, he decided, a beautiful sound.","ru":"На улице дождь снова застучал в окно. Тоби остановился посреди хода и прислушался. Это, решил он, был красивый звук."}],"gloss":{"a":"(неопр. артикль)","about":"о, про","across":"через","afraid":"боится, страшно","after":"после","again":"снова","ago":"назад","alive":"живой","all":"все, весь"," г, регион","remembered":"вспомнил","remove":"удалить","reports":"отчёты","result":"результат","returned":"вернулся; возвращённый","ring":"кольцо","river":"река","robot":"робот","robots":"роботы","rock":"камень, скала","room":"комната","rules":"правила","said":"сказал(а)","same":"тот же","sang":"пела","sat":"сидел(а)","saw":"увидел(а)","say":"говорят","screen":"экран","searched":"искал, обыскала","second":"второй; секунда","see":"видеть","seen":"видел","sent":"отправил","set":"набор","she":"она","shook":"пожал","should":"следует","shouted":"закричала","showed":"показал(а)","silent":"молчаливый","sit":"сидеть","six":"шесть","sleep":"спать","slipped":"поскользнулся","slowly":"медленно","small":"маленький","smooth":"гладкий","so":"так, поэтому","soap":"мыло","some":"некоторые","something":"что-то","sound":"звук","speak":"говорить","spring":"весна","standing":"стоящий","started":"начал","stayed":"остался","stone":"каменный","stones":"камни","stood":"стоял(а)","stop":"прекращаться","stopped":"остановился","storage":"хранение","strange":"странный","switched":"выключены (switched off)","table":"стол","tablet":"планшет","take":"взять, забрать","tall":"высокий","tea":"чай","teacher":"преподаватель","than":"чем","that":"что, тот, который","that's":"это","the":"(артикль)","them":"их, им","then":"затем, тогда","there":"там; (есть)","they":"они","thing":"вещь","things":"вещи","think":"думать","this":"этот, это","thought":"подумал(а)","three":"три","through":"через, по","time":"время, раз","times":"раз","tired":"усталый","to":"к, в, (инфинитив)","tobi":"Тоби (имя)","tobi's":"Тоби (чей)","together":"вместе","told":"сказал(а)","too":"тоже, слишком","took":"взяла, достала","top":"верх","trees":"деревья","tried":"пытались","turned":"включала (turned on); повернула","turning":"вертя","twice":"дважды","two":"два","under":"под","understand":"понимать","uniform":"форма","unique":"уникальный","unit":"устройство","university":"университет","up":"вверх","used":"(used to — раньше)","v":"В (буква)","village":"деревня","vinter":"Винтер (фамилия)","visit":"посетить, навестить","voice":"голос","vulnerable":"уязвимый","waited":"ждал","waiting":"ждал(а)","wakes":"просыпается","walk":"ходить, прогулка","walked":"пошёл, вошёл","want":"хотят","warehouse":"склад","was":"был(а)","wasn't":"не было","water":"вода","way":"способ","we":"мы","wedding":"свадебный, обручальный","week":"неделя","went":"пошёл, пошли","were":"были","wet":"мокрый","what":"что, какой","when":"когда","where":"где","which":"который, что","white":"белый","whole":"весь, целый","why":"почему","will":"(буд. время)","win":"выиграть","window":"окно","with":"с","without":"без","woman":"женщина","won":"выигрывал","wood":"дерево (материал)","word":"слово","work":"работать, работа","worked":"работал","working":"работающий","would":"(было бы, будет)","wrote":"написал(а)","years":"лет, годы","yesterday":"вчера","you":"ты, вы","young":"молодой","younger":"моложе","your":"твой, ваш","yours":"ваш","arrived":"приехала"},"vocab":{"mistake":4,"turned":24,"on":24,"visit":44,"soap":64,"voice":84,"village":104,"wood":124,"near":144,"disappeared":164,"bring":184,"climb":204,"climbed":204,"natural":225,"defeat":245,"alive":265,"ring":285,"entrance":306,"experience":326,"prison":346,"forgive":366,"forgiving":366,"judge":386,"across":414,"expectations":435,"jealous":462,"confused":485,"properly":507,"evidence":528,"set":549,"vulnerable":570,"unique":591,"approve":612,"literally":634}},{"id":5,"title_en":"Kevin's Big Day","title_ru":"Большой день Кевина","genre":"Комедия","summary_ru":"Офисный работник Кевин спешит на самое важное совещание в своей карьере, но всё в этот день идёт не так.","paragraphs":[{"en":"Kevin Bell had worked at Greenleaf Furniture for six years, and in all that time he had never been late. Not once. So when he opened his eyes and saw that the old clock next to his bed said 8:40, he jumped up so fast that he fell straight onto the floor.","ru":"Кевин Белл проработал в компании «Гринлиф Мебель» шесть лет и за всё это время ни разу не опоздал. Ни единого раза. Поэтому, когда он открыл глаза и увидел, что старые часы у кровати показывают 8:40, он вскочил так быстро, что упал прямо на пол."},{"en":"Today was the most important day of his career. At ten o'clock he had to show the new company structure to Mr. Harmon, the owner, and to two rich men who wanted to invest in Greenleaf. “If they like your plan, the company will grow,” his boss, Linda, had told him. “And you may be the next head of the department.” It was a rare opportunity, and Kevin was very hopeful.","ru":"Сегодня был самый важный день в его карьере. В десять часов он должен был представить новую структуру компании мистеру Хармону, владельцу, и двум богатым людям, которые хотели вложить деньги в «Гринлиф». «Если им понравится твой план, компания вырастет, — сказала ему его начальница Линда. — И, может быть, ты станешь следующим руководителем отдела». Это была редкая возможность, и Кевин был полон надежд."},{"en":"His doctor had told him to do some exercise every morning to reduce stress. Kevin decided he could do both things at once. He tried to do push-ups while he was putting on his trousers. It was not a good exercise. He lost his balance, fell back onto his old wooden chair, and the chair broke into three pieces.","ru":"Врач говорил ему, что нужно каждое утро делать упражнения, чтобы уменьшить стресс. Кевин решил, что может делать два дела сразу. Он попытался отжиматься, пока надевал брюки. Это было неудачное упражнение. Он потерял равновесие, упал назад на свой старый деревянный стул, и стул развалился на три части."},{"en":"There was no time for breakfast. Kevin picked up the most important thing in the flat: a large cardboard box. Inside it was a small model of the new office, with tiny desks, tiny people and tiny plants. He had built it himself over three weekends. He also took his phone, but the screen stayed black. He had forgotten to charge it.","ru":"На завтрак времени не было. Кевин взял самую важную вещь в квартире — большую картонную коробку. Внутри была маленькая модель нового офиса с крошечными столами, крошечными людьми и крошечными растениями. Он сам собирал её три выходных подряд. Он взял и телефон, но экран оставался чёрным. Кевин забыл его зарядить."},{"en":"When Kevin went out of the house, the street was strangely quiet. “That's unusual,” he thought. On a normal morning he had to fight through a crowd at the bus stop. Today there was only an old woman with a cat in a basket. The bus was almost empty, and the driver was singing.","ru":"Когда Кевин вышел из дома, на улице было странно тихо. «Необычно», — подумал он. Обычным утром ему приходилось пробиваться через толпу на остановке. Сегодня там была только пожилая женщина с кошкой в корзинке. Автобус был почти пустой, а водитель пел."},{"en":"The Greenleaf office was a tall glass building next to the lake. To save time, Kevin got off the bus early and ran through the park. But in the middle of the park he found a big market, with music, flags and a huge crowd. He held the box above his head and tried to avoid the people, the children and the balloons.","ru":"Офис «Гринлифа» находился в высоком стеклянном здании рядом с озером. Чтобы сэкономить время, Кевин вышел из автобуса пораньше и побежал через парк. Но посреди парка он наткнулся на большой рынок с музыкой, флагами и огромной толпой. Он держал коробку над головой и старался обходить людей, детей и воздушные шары."},{"en":"A man at a stall pushed a warm pie into his free hand. “Try it! It's free today!” Kevin was so hungry that he took a bite while he was running. It was delicious. For about five seconds, it was the best moment of his day.","ru":"Мужчина у прилавка сунул ему в свободную руку тёплый пирожок. «Попробуйте! Сегодня бесплатно!» Кевин был так голоден, что откусил кусок прямо на бегу. Пирожок был очень вкусный. Секунд пять это был лучший момент его дня."},{"en":"Then a very large dog saw the pie. The dog jumped at Kevin, and Kevin did the only thing he could think of: he threw the pie as far as he could. The dog ran after it. Unfortunately, the dog's lead was caught on the strap of Kevin's bag. The bag flew off his shoulder, followed the dog across the grass and landed with a loud splash in the lake.","ru":"И тут пирожок заметила очень большая собака. Собака прыгнула на Кевина, и Кевин сделал единственное, что пришло ему в голову: бросил пирожок как можно дальше. Собака побежала за ним. К несчастью, её поводок зацепился за ремень сумки Кевина. Сумка слетела с его плеча, пронеслась за собакой по траве и с громким всплеском упала в озеро."},{"en":"A young woman who was training for a marathon stopped next to him. She looked at the water, then at Kevin. “Was there anything important in that bag?” she asked. Kevin thought about it. His wallet. His keys. And his access card for the office. “No,” he said. “Only my whole life.”","ru":"Рядом с ним остановилась молодая женщина, которая тренировалась к марафону. Она посмотрела на воду, потом на Кевина. «В этой сумке было что-нибудь важное?» — спросила она. Кевин подумал. Кошелёк. Ключи. И пропуск в офис. «Нет, — ответил он. — Только вся моя жизнь»."},{"en":"He still had the box, so he ran on. At the front door of the glass building, Bob from security was sitting in his chair and reading a newspaper. He looked up in surprise. “Kevin? What are you doing here?”","ru":"Коробка всё ещё была у него, поэтому он побежал дальше. У главного входа стеклянного здания на своём стуле сидел Боб из охраны и читал газету. Он удивлённо поднял глаза. «Кевин? Что ты здесь делаешь?»"},{"en":"“Bob, please, I'm late for the meeting. My card is in the lake. Let me in.” Bob shook his head sadly. “No card, no access. Mr. Harmon made that rule himself. I can't break it, not even for you.” Kevin wanted to call Linda, but his phone was still dead. It was 9:50.","ru":"«Боб, пожалуйста, я опаздываю на совещание. Мой пропуск в озере. Впусти меня». Боб грустно покачал головой. «Нет пропуска — нет доступа. Мистер Хармон сам ввёл это правило. Я не могу его нарушить, даже ради тебя». Кевин хотел позвонить Линде, но телефон по-прежнему не работал. Было 9:50."},{"en":"So Kevin walked around the building. The borders of the company's land were marked by a tall fence with roses along it. Behind the roses he found what he was looking for: a small open window on the ground floor. It was the window of the staff kitchen. Kevin pushed the box through first, then climbed in after it.","ru":"Тогда Кевин пошёл вокруг здания. Границы территории компании были обозначены высоким забором, вдоль которого росли розы. За розами он нашёл то, что искал: маленькое открытое окно на первом этаже. Это было окно кухни для сотрудников. Кевин сначала просунул в него коробку, а потом залез следом."},{"en":"He landed in the middle of the kitchen table, right on top of a large chocolate cake. Someone had written on it in pink letters: “Happy Birthday, Bob!” Kevin stood up slowly. There was chocolate on his trousers, chocolate on his shirt and chocolate in his hair. He felt a terrible wave of guilt. Bob was a good man. Bob did not deserve this.","ru":"Он приземлился посреди кухонного стола, прямо на большой шоколадный торт. На нём кто-то написал розовыми буквами: «С днём рождения, Боб!» Кевин медленно поднялся. Шоколад был у него на брюках, на рубашке и в волосах. Его накрыла ужасная волна вины. Боб был хорошим человеком. Боб не заслужил такого."},{"en":"“It's for the company,” Kevin reminded himself. “I'll buy him a new cake.” He picked up the box and ran up the stairs to the fifth floor. He did not even think about the lift. He arrived at the meeting room at exactly ten o'clock, breathing hard, and opened the door.","ru":"«Это ради компании, — напомнил себе Кевин. — Куплю ему новый торт». Он схватил коробку и побежал по лестнице на пятый этаж. О лифте он даже не подумал. Он добрался до переговорной ровно в десять, тяжело дыша, и открыл дверь."},{"en":"The room was empty. The chairs stood neatly around the table. The coffee machine was switched off. There was nobody there at all.","ru":"Комната была пуста. Стулья аккуратно стояли вокруг стола. Кофемашина была выключена. Там вообще никого не было."},{"en":"Kevin sat down on the floor. He switched on the computer in the corner to check his email, and there it was, at the top of the screen, a message from Linda: “Just to remind you again, Kevin: Friday is Founders' Day, a public holiday. The office is closed. The meeting is on MONDAY. Have a nice long weekend!” She had reminded him twice. He had not checked his email since Wednesday.","ru":"Кевин сел на пол. Он включил компьютер в углу, чтобы проверить почту, и вот оно, в самом верху экрана, — письмо от Линды: «Ещё раз напоминаю, Кевин: пятница — День основателей, государственный праздник. Офис закрыт. Совещание в ПОНЕДЕЛЬНИК. Хороших длинных выходных!» Она напоминала ему дважды. Он не проверял почту со среды."},{"en":"That explained everything: the quiet street, the empty bus, the market in the park. Kevin put his head in his hands. “I fell off a chair, lost my bag in a lake and destroyed Bob's birthday cake,” he said to the empty room, “to come to work on a holiday.”","ru":"Это объясняло всё: тихую улицу, пустой автобус, рынок в парке. Кевин обхватил голову руками. «Я упал со стула, утопил сумку в озере и уничтожил торт Боба, — сказал он пустой комнате, — чтобы прийти на работу в праздник»."},{"en":"At that moment he heard voices in the corridor. The door opened, and Mr. Harmon walked in, followed by two men in expensive coats. Kevin recognised them from their photos. They were the investors.","ru":"В этот момент он услышал голоса в коридоре. Дверь открылась, и вошёл мистер Хармон, а за ним двое мужчин в дорогих пальто. Кевин узнал их по фотографиям. Это были инвесторы."},{"en":"“I wanted to show our guests the building on a quiet day,” Mr. Harmon began, and then he stopped. He looked at Kevin, at the chocolate, and at the box. “Bell? Why are you sitting on the floor? And why are you... brown?”","ru":"«Я хотел показать нашим гостям здание в тихий день», — начал мистер Хармон и тут же замолчал. Он посмотрел на Кевина, на шоколад и на коробку. «Белл? Почему вы сидите на полу? И почему вы... коричневый?»"},{"en":"Kevin was not able to invent a good story, so he told them the truth. He told them about the clock, the chair, the dog, the pie, the lake, the window and the cake. When he finished, there was a long silence. Then the older investor began to laugh. He laughed so much that he had to sit down.","ru":"Кевин не смог придумать хорошую историю, поэтому рассказал правду. Он рассказал им о часах, стуле, собаке, пирожке, озере, окне и торте. Когда он закончил, наступила долгая тишина. Потом старший из инвесторов начал смеяться. Он смеялся так сильно, что ему пришлось сесть."},{"en":"“A man who fights a dog and climbs through a window to get to work on a holiday,” he said at last, wiping his eyes. “I want to invest in a company with people like that. Show us what's in the box, young man.”","ru":"«Человек, который сражается с собакой и лезет в окно, чтобы попасть на работу в праздник, — сказал он наконец, вытирая глаза. — Я хочу вкладывать деньги в компанию, где работают такие люди. Покажите нам, что в коробке, молодой человек»."},{"en":"So Kevin opened the box and showed them the tiny desks, the tiny people and the tiny plants. He explained the new structure: fewer meetings, smaller teams, and a plan to reduce costs by fifteen percent. The investors asked a lot of questions. Kevin answered all of them. He was surprised how calm he felt. After a day like this, nothing could frighten him.","ru":"И Кевин открыл коробку и показал им крошечные столы, крошечных людей и крошечные растения. Он объяснил новую структуру: меньше совещаний, команды поменьше и план по сокращению расходов на пятнадцать процентов. Инвесторы задали много вопросов. Кевин ответил на все. Он сам удивился, насколько спокойно себя чувствует. После такого дня его уже ничто не могло напугать."},{"en":"“With this plan, we can expect a big rise in sales next year,” the younger investor said, and he shook Kevin's hand. Chocolate stayed on his fingers, but he didn't seem to mind.","ru":"«С таким планом в следующем году можно ожидать большого роста продаж», — сказал младший инвестор и пожал Кевину руку. На его пальцах остался шоколад, но его это, похоже, не смутило."},{"en":"On Monday morning Kevin arrived at work early, of course. Linda was waiting for him with an envelope. Inside was a letter from Mr. Harmon: Kevin was now head of the department, with a pay rise. There was also a check for a thousand dollars, as a reward for “unusual dedication to the company.”","ru":"В понедельник утром Кевин, конечно, пришёл на работу рано. Линда ждала его с конвертом. Внутри было письмо от мистера Хармона: теперь Кевин стал руководителем отдела с повышением зарплаты. Там был ещё и чек на тысячу долларов — награда за «необычную преданность компании»."},{"en":"Kevin spent part of the reward on a new chair, a new phone and the biggest chocolate cake in the city. He carried the cake to the front door himself and gave it to Bob. Bob looked at the cake, then at Kevin, and smiled. Then he gave Kevin a new access card. It was hanging on a very long, very strong string.","ru":"Часть награды Кевин потратил на новый стул, новый телефон и самый большой шоколадный торт в городе. Он сам донёс торт до главного входа и вручил его Бобу. Боб посмотрел на торт, потом на Кевина и улыбнулся. Потом он дал Кевину новый пропуск. Тот висел на очень длинном и очень прочном шнурке."},{"en":"“Keep it around your neck,” said Bob. “And Kevin? Next time, please check the calendar.”","ru":"«Носи его на шее, — сказал Боб. — И ещё, Кевин... В следующий раз, пожалуйста, проверяй календарь»."}],"gloss":{"a":"(неопр. артикль)","able":"способный (смог)","about":"о, около","above":"над","access":"доступ","across":"через, по","after":"после, за","again":"сн ning":"бежал","sadly":"грустно","said":"сказал","sales":"продажи","sat":"сел","save":"сэкономить","saw":"увидел","screen":"экран","seconds":"секунды","security":"охрана","seem":"казаться","she":"она","shirt":"рубашка","shook":"покачал, пожал","shoulder":"плечо","show":"показать","showed":"показал","silence":"тишина","since":"с (тех пор)","singing":"пел","sit":"сесть","sitting":"сидел","six":"шесть","slowly":"медленно","small":"маленький","smaller":"поменьше","smiled":"улыбнулся","so":"так, поэтому","some":"немного","someone":"кто-то","spent":"потратил","splash":"всплеск","staff":"сотрудники","stairs":"лестница","stall":"прилавок","stayed":"оставался","still":"всё ещё","stood":"стоял(и)","stop":"остановка","stopped":"остановился","story":"история","straight":"прямо","strangely":"странно","strap":"ремень","street":"улица","stress":"стресс","string":"шнурок","strong":"прочный","structure":"структура","surprise":"удивление","surprised":"удивлён","switched":"включил, выключен","table":"стол","tall":"высокий","teams":"команды","ten":"десять","terrible":"ужасный","that":"что, тот, это","that's":"это (есть)","the":"(артикль)","their":"их","them":"их, им","then":"потом, тогда","there":"там","they":"они","thing":"вещь","things":"дела, вещи","think":"думать","this":"этот","thought":"подумал","thousand":"тысяча","three":"три","threw":"бросил","through":"через","time":"время; раз","tiny":"крошечный","to":"к, в, (инфинитив)","today":"сегодня","told":"сказал(а)","took":"взял","top":"верх","training":"тренировалась","tried":"пытался","trousers":"брюки","truth":"правда","try":"попробуйте","twice":"дважды","two":"два","unfortunately":"к несчастью","unusual":"необычный","up":"вверх","ups":"(push-ups) отжимания","us":"нам","very":"очень","voices":"голоса","waiting":"ждала","walked":"пошёл, вошёл","wallet":"кошелёк","want":"хочу","wanted":"хотел","warm":"тёплый","was":"был","water":"вода","wave":"волна","we":"мы","wednesday":"среда","weekend":"выходные","weekends":"выходные","went":"(went out) вышел","were":"были","what":"что","what's":"что (есть)","when":"когда","while":"пока","who":"который, кто","whole":"весь","why":"почему","will":"(будущее время)","window":"окно","wiping":"вытирая","with":"с","woman":"женщина","wooden":"деревянный","work":"работа","worked":"работал","written":"написал","year":"год","years":"лет","you":"ты, вы","young":"молодой","younger":"младший","your":"твой, ваш"},"vocab":{"exercise":5,"check":25,"checked":25,"training":45,"think":65,"thought":65,"went":85,"out":85,"box":105,"lake":125,"threw":145,"remind":165,"reminded":165,"may":185,"chair":205,"chairs":205,"structure":226,"grow":246,"unusual":266,"call":286,"security":307,"able":327,"opportunity":347,"crowd":367,"avoid":387,"invest":415,"rise":436,"guilt":464,"hopeful":487,"reduce":508,"middle":529,"borders":550,"access":571,"delicious":592,"reward":613,"rare":635}},{"id":6,"title_en":"The Night Guard","title_ru":"Ночной сторож","genre":"Ужасы","summary_ru":"Молодой человек соглашается охранять ночью заброшенную больницу на холме, но старый сторож даёт ему три странных правила.","paragraphs":[{"en":"The last bus to the hill left the town at nine o'clock, and Mark was the only passenger. Rain was hitting the windows, and the driver kept looking at him in the mirror. “Are you going to the old hospital?” he asked at last.","ru":"Последний автобус на холм уходил из города в девять часов, и Марк был единственным пассажиром. Дождь бил в окна, а водитель всё время смотрел на него в зеркало. «Вы едете в старую больницу?» — наконец спросил он."},{"en":"“Yes,” Mark said with more confidence than he really felt. “I'm the new night guard.”","ru":"«Да, — ответил Марк с большей уверенностью, чем чувствовал на самом деле. — Я новый ночной сторож»."},{"en":"The driver did not say anything for a long time. Then he stopped the bus at the gate and opened the door. “Good luck, son,” he said. “Most guards don't stay more than one night.”","ru":"Водитель долго молчал. Потом он остановил автобус у ворот и открыл дверь. «Удачи, сынок, — сказал он. — Большинство сторожей не остаются больше чем на одну ночь»."},{"en":"At first sight, Saint Agnes Hospital looked like a perfect place for a horror film. It was a long grey building on top of a rock, with dark windows and a broken clock above the door. It had been closed for twenty years. Now the city wanted to restore it and turn it into a museum, and somebody had to watch it at night. The pay was good, and Mark needed money.","ru":"С первого взгляда больница Святой Агнессы казалась идеальным местом для фильма ужасов. Это было длинное серое здание на вершине скалы, с тёмными окнами и сломанными часами над дверью. Она была закрыта двадцать лет. Теперь город хотел восстановить её и превратить в музей, и кто-то должен был охранять её по ночам. Платили хорошо, а Марку нужны были деньги."},{"en":"An old man was waiting for him at the entrance. He was tall and thin, with a weak voice and very pale hands. “I'm Henry,” he said. “I worked here for forty years. Come in. It is time I showed you everything.”","ru":"У входа его ждал старик. Он был высокий и худой, со слабым голосом и очень бледными руками. «Я Генри, — сказал он. — Я проработал здесь сорок лет. Заходи. Пора мне всё тебе показать»."},{"en":"Henry gave him a heavy bunch of keys, a torch and an old hammer. “What is the hammer for?” Mark asked. “The doors here are old,” Henry answered. “Sometimes they get stuck. And sometimes...” He did not finish.","ru":"Генри дал ему тяжёлую связку ключей, фонарик и старый молоток. «А молоток зачем?» — спросил Марк. «Двери здесь старые, — ответил Генри. — Иногда их заедает. А иногда...» Он не договорил."},{"en":"They walked along endlessly long corridors. Henry showed him the empty wards, where rusty beds still lay in rows, and the doctors' rooms, where old papers lay on the floor. Mark collected a few of them. They were lists of patients, ordinary citizens of the town, with names, ages and dates. Next to many of the names somebody had drawn a small cross.","ru":"Они шли по бесконечно длинным коридорам. Генри показал ему пустые палаты, где рядами всё ещё стояли ржавые кровати, и кабинеты врачей, где на полу лежали старые бумаги. Марк собрал несколько из них. Это были списки пациентов, обычных граждан города, с именами, возрастом и датами. Рядом со многими именами кто-то нарисовал маленький крестик."},{"en":"“There are only three rules,” Henry said when they came back to the entrance. “First, don't sleep. Second, if you hear a bell, don't answer it. Third, never go to the floor below this one. The basement is closed. There is nothing there for you.”","ru":"«Есть только три правила, — сказал Генри, когда они вернулись ко входу. — Первое: не спи. Второе: если услышишь звонок, не отвечай на него. Третье: никогда не спускайся на этаж ниже этого. Подвал закрыт. Тебе там делать нечего»."},{"en":"“What's in the basement?” Mark asked. Henry looked at him for a long moment. “The old operating rooms,” he said quietly. “And the morgue.” Then he put on his coat and walked out into the rain. Mark expected to hear a car, but there was no sound at all except the wind.","ru":"«А что в подвале?» — спросил Марк. Генри долго смотрел на него. «Старые операционные, — тихо сказал он. — И морг». Потом он надел пальто и вышел под дождь. Марк ожидал услышать машину, но не было вообще никаких звуков, кроме ветра."},{"en":"For the first two hours everything was fine. Mark sat at the desk near the entrance with a bright lamp, a flask of coffee and a book. He walked around the building every hour, as Henry had told him. Slowly his confidence began to increase. It was just an old building, he told himself. Old buildings make noises. That's all.","ru":"Первые два часа всё было хорошо. Марк сидел за столом у входа с яркой лампой, термосом кофе и книгой. Каждый час он обходил здание, как велел Генри. Постепенно его уверенность начала расти. Это просто старое здание, говорил он себе. Старые здания издают звуки. Вот и всё."},{"en":"At midnight he went up to the third floor. From the window of an old ward he could see the lights of the town far below, small and warm. He thought about his flat, his bed, and his little sister, who always laughed at his fears. “One night,” he said to the window. “Only one night, and then I will have money for the whole month.” Behind him, in the dark corridor, a door closed very quietly.","ru":"В полночь он поднялся на третий этаж. Из окна старой палаты были видны огни города далеко внизу, маленькие и тёплые. Он думал о своей квартире, о своей кровати и о младшей сестре, которая всегда смеялась над его страхами. «Одна ночь, — сказал он окну. — Всего одна ночь, и у меня будут деньги на целый месяц». Позади него, в тёмном коридоре, очень тихо закрылась дверь."},{"en":"He turned quickly, but the corridor was empty. “Hello?” he said. Nobody answered. He told himself that it was the wind, and he went back down to his desk, a little faster than he had come up.","ru":"Он быстро обернулся, но коридор был пуст. «Эй?» — сказал он. Никто не ответил. Он сказал себе, что это ветер, и вернулся вниз к своему столу — чуть быстрее, чем поднимался."},{"en":"At one o'clock the lamp went out. The electricity in the whole building was gone. Mark sat in complete darkness, and his heart was beating fast. He switched on his torch and waited. After a minute the power was restored, and the lamp shone again. Mark laughed nervously. “Perfect,” he said aloud. “Just perfect.”","ru":"В час ночи лампа погасла. Электричество пропало во всём здании. Марк сидел в полной темноте, и сердце его быстро билось. Он включил фонарик и стал ждать. Через минуту электричество восстановилось, и лампа снова засветилась. Марк нервно засмеялся. «Идеально, — сказал он вслух. — Просто идеально»."},{"en":"Then he heard the bell. It was a thin, weak sound, like the bells patients used to call nurses. It came from somewhere below him. Ring. Ring. Ring. Mark remembered the second rule and did not move. The bell rang endlessly, for ten minutes, twenty, thirty. Then it stopped, and the silence was even more horrible.","ru":"Потом он услышал звонок. Это был тонкий, слабый звук, как у колокольчиков, которыми пациенты вызывали медсестёр. Он шёл откуда-то снизу. Дзинь. Дзинь. Дзинь. Марк вспомнил второе правило и не двигался. Звонок звенел бесконечно: десять минут, двадцать, тридцать. Потом он стих, и тишина была ещё ужаснее."},{"en":"And then a voice called his name. “Mark... Mark, please, help me...” It was a woman's voice, and it was coming from the basement.","ru":"А потом голос позвал его по имени: «Марк... Марк, пожалуйста, помоги мне...» Это был женский голос, и он доносился из подвала."},{"en":"Mark knew it was a bad idea. He knew it as well as he knew his own name. But the voice sounded so tired, so frightened, so similar to his mother's voice, that he could not stay in his chair. He took the hammer and the torch and went to the stairs.","ru":"Марк знал, что это плохая идея. Он знал это так же хорошо, как своё имя. Но голос звучал так устало, так испуганно, так похоже на голос его матери, что он не смог усидеть на стуле. Он взял молоток и фонарик и пошёл к лестнице."},{"en":"The door to the basement was locked. Mark tried every key, and the last one opened it. Cold air came up from the darkness, with a smell of earth and medicine. He went down slowly. On the wall below the stairs somebody had painted a snake around a stick, the old sign of medicine. In the light of the torch the snake seemed to move.","ru":"Дверь в подвал была заперта. Марк перепробовал все ключи, и последний открыл её. Из темноты поднялся холодный воздух с запахом земли и лекарств. Он медленно спустился. На стене под лестницей кто-то нарисовал змею, обвившую палку, — старый знак медицины. В свете фонарика змея, казалось, двигалась."},{"en":"The basement corridor was long and narrow. At the end of it there was a metal door, and behind the door something was moving. He could hear a sound: something heavy was being dragged across the floor, slowly, again and again.","ru":"Коридор подвала был длинным и узким. В конце его была металлическая дверь, и за дверью что-то двигалось. Он слышал звук: что-то тяжёлое тащили по полу, медленно, снова и снова."},{"en":"Mark stood still and listened. His torch was getting weak, and its light was turning yellow. He thought about the bus, about the town, about his warm bed. He could still turn around. He could go back up the stairs, sit at his desk and wait for the morning. Nobody would ever know. But then the voice called again, quietly and sadly, from behind the metal door.","ru":"Марк замер и прислушался. Фонарик слабел, и его свет становился жёлтым. Он подумал об автобусе, о городе, о своей тёплой кровати. Он ещё мог повернуть назад. Мог подняться по лестнице, сесть за стол и ждать утра. Никто бы никогда не узнал. Но тут голос позвал снова, тихо и печально, из-за металлической двери."},{"en":"“Who's there?” Mark shouted. His voice was not as strong as he wanted. “This is private property. I'm calling the police!”","ru":"«Кто там?» — крикнул Марк. Голос его звучал не так твёрдо, как ему хотелось. «Это частная собственность. Я звоню в полицию!»"},{"en":"The dragging stopped. Then the voice said, very close to the door: “Don't be rude, young man. Nobody has visited me for such a long time.”","ru":"Волочение прекратилось. Потом голос сказал совсем близко от двери: «Не груби, молодой человек. Меня так давно никто не навещал»."},{"en":"Mark lifted the hammer. He could not rely on his legs any more; they were shaking. Slowly, the metal door began to open by itself. Inside, in the bright light of his torch, he saw a room full of beds. On every bed lay a figure under a white sheet. And in the middle of the room stood an old woman in a nurse's uniform. She was smiling at him with real joy. “At last,” she said. “A new patient. It is time for your medicine.”","ru":"Марк поднял молоток. Он больше не мог полагаться на свои ноги: они дрожали. Медленно металлическая дверь начала открываться сама. Внутри, в ярком свете фонарика, он увидел комнату, полную кроватей. На каждой кровати под белой простынёй лежала фигура. А посреди комнаты стояла старая женщина в форме медсестры. Она улыбалась ему с настоящей радостью. «Наконец-то, — сказала она. — Новый пациент. Пора принимать лекарство»."},{"en":"Mark ran. He did not remember the stairs or the corridors. He only remembered the cold hands that touched his shoulders, and the bell that started ringing again behind him. He fell near the entrance, hit his head on the floor, and everything went black.","ru":"Марк побежал. Он не помнил ни лестницы, ни коридоров. Он помнил только холодные руки, которые касались его плеч, и звонок, который снова зазвенел у него за спиной. Он упал у входа, ударился головой об пол, и всё почернело."},{"en":"When he woke up, it was morning. Sunlight was coming through the dirty windows. A man in a suit was standing over him. It was Mr Collins, the director of the museum project, whom Mark had met at the interview.","ru":"Когда он проснулся, было утро. Сквозь грязные окна проникал солнечный свет. Над ним стоял мужчина в костюме. Это был мистер Коллинз, директор проекта музея, с которым Марк познакомился на собеседовании."},{"en":"“Are you all right?” Collins asked. “You look horrible. What happened? And how did you get in? I was supposed to meet you here last night with the keys, but my car broke down. I called you, but you didn't answer.”","ru":"«Вы в порядке? — спросил Коллинз. — Вы ужасно выглядите. Что случилось? И как вы вошли? Я должен был встретить вас здесь вчера вечером с ключами, но у меня сломалась машина. Я звонил вам, но вы не ответили»."},{"en":"Mark sat up slowly. “Henry let me in,” he said. “The old guard. He gave me the keys.”","ru":"Марк медленно сел. «Меня впустил Генри, — сказал он. — Старый сторож. Он дал мне ключи»."},{"en":"Collins's face became white. “Henry?” he repeated. “Henry Walsh? He was the guard here when the hospital was still open. He died in the fire in the basement, together with the night nurse and all her patients. That was twenty years ago. Certainly you are joking.”","ru":"Лицо Коллинза побелело. «Генри? — повторил он. — Генри Уолш? Он был здесь сторожем, когда больница ещё работала. Он погиб при пожаре в подвале вместе с ночной медсестрой и всеми её пациентами. Это было двадцать лет назад. Вы, конечно, шутите»."},{"en":"Mark did not answer. He looked down at his hands. He was still holding the old hammer, and there was a name cut into its wooden handle: H. WALSH.","ru":"Марк не ответил. Он посмотрел на свои руки. Он всё ещё держал старый молоток, и на его деревянной ручке было вырезано имя: Г. УОЛШ."},{"en":"That afternoon, before he took the bus back to town, Mark walked into the small garden behind the hospital. In the tall grass he found the grave. The stone was old and grey, but somebody had put fresh flowers on it. Mark left the hammer on a rock next to it and did not look back.","ru":"В тот день, прежде чем сесть на автобус обратно в город, Марк зашёл в маленький сад за больницей. В высокой траве он нашёл могилу. Камень был старым и серым, но кто-то положил на него свежие цветы. Марк оставил молоток на камне рядом с ней и не оглянулся."},{"en":"He never went back. But sometimes, late at night, he has the strange impression that somewhere below his floor a small bell is ringing, and that a patient voice is waiting for him to answer.","ru":"Он больше никогда туда не возвращался. Но иногда, поздно ночью, у него возникает странное впечатление, что где-то этажом ниже звенит маленький колокольчик и терпеливый голос ждёт, когда он ответит."}],"gloss":{"a":"(неопр. артикль)","above":"над","across":"по, через","after":"через, после","afternoon":"день (после полудня)","again":"снова","ages":"возраст","agnes":"Агнесса (имя)","ago":"назад","air":"воздух","all":"все, весь; вообще","along":"вдоль, по","aloud":"вслух","an":"(неопр. артикль)","and":"и","answer":"отве
