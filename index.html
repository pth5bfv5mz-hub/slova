<style>
/* Layout: one narrow column like a stack of index cards; tabs on top, card in the middle, stats below. */
:root{
  --paper:#11151f; --card:#1a2030; --ink:#e7ebf5; --muted:#98a2bd; --line:#2c3447;
  --accent:#7d95ff; --accent-ink:#0d1220; --mark:#ffd84a;
  --good:#5fd08d; --good-bg:#183326; --mid-bg:#3a3317; --bad:#ff8080; --bad-bg:#3a1d22; color-scheme:dark;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151f; --card:#1a2030; --ink:#e7ebf5; --muted:#98a2bd; --line:#2c3447;
  --accent:#7d95ff; --accent-ink:#0d1220; --mark:#ffd84a;
  --good:#5fd08d; --good-bg:#183326; --mid-bg:#3a3317; --bad:#ff8080; --bad-bg:#3a1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --card:#1a2030; --ink:#e7ebf5; --muted:#98a2bd; --line:#2c3447;
  --accent:#7d95ff; --accent-ink:#0d1220; --mark:#ffd84a;
  --good:#5fd08d; --good-bg:#183326; --mid-bg:#3a3317; --bad:#ff8080; --bad-bg:#3a1d22; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo span{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:6px;padding:0 2px}
.sync{font-size:12px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
nav button{font:600 14px var(--f-body);border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.big{border:0;background:var(--accent);color:var(--accent-ink);font:600 17px var(--f-body);padding:15px 18px;border-radius:12px;cursor:pointer;width:100%}
.big:disabled{opacity:.45;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px var(--f-body);padding:12px 14px;border-radius:12px;cursor:pointer}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 18px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(20,30,60,.35)}
.dirtag{align-self:flex-start;font:600 11px var(--f-mono);letter-spacing:.06em;background:var(--paper);color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
.prompt{font-family:var(--f-display);font-weight:500;font-size:clamp(26px,7vw,38px);line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tr{text-align:center;color:var(--muted);font-size:14px;margin-top:-10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 12px;font-size:16px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-height:54px;overflow-wrap:anywhere}
.opt b{font:600 12px var(--f-mono);color:var(--muted);padding-top:3px}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.inp{width:100%;font:500 20px var(--f-body);padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb strong{color:var(--ink)}
.fb.mid{background:var(--mid-bg);color:var(--ink)}
.prompt.sent{font-family:var(--f-body);font-weight:500;font-size:clamp(21px,5.6vw,27px);line-height:1.35}
.prompt mark,.ref mark{background:none;color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:7px;text-decoration-skip-ink:none;padding:0}
textarea.inp{min-height:100px;resize:vertical;font-size:18px;line-height:1.4;font-family:var(--f-body)}
.ref{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:16px;display:flex;flex-direction:column;gap:4px}
.ref .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.ref .k:first-child{margin-top:0}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--paper);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:280px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:76px 1fr 56px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.blk .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.blk .track i{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .w{min-width:0;overflow-wrap:anywhere}
.li .w small{display:block;color:var(--muted);font-size:13px}
.li .n{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:3px;background:var(--line)}
.dot.s1{background:var(--mark)} .dot.s2{background:var(--good)} .dot.s3{background:var(--bad)}
.num{font:12px var(--f-mono);color:var(--muted);margin-right:6px}
.empty{color:var(--muted);font-size:14px}
.warn{font-size:13px;background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px}
.res{font-family:var(--f-display);font-weight:700;font-size:48px;text-align:center;font-variant-numeric:tabular-nums}
.res small{display:block;font:500 15px var(--f-body);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="logo">Слова<span>·тест</span></div>
    <div class="sync" id="sync">Прогресс сохраняется на этом устройстве</div>
  </header>
  <nav role="tablist">
    <button id="tab-test" role="tab" aria-selected="true" data-tab="test">Тест</button>
    <button id="tab-stats" role="tab" aria-selected="false" data-tab="stats">Статистика</button>
    <button id="tab-dict" role="tab" aria-selected="false" data-tab="dict">Словарь</button>
  </nav>
  <main id="view"></main>
</div>

const BLOCKS = [[1,100],[101,200],[201,300],[301,400],[401,500],[501,600],[601,652]];
const DIRS = {er:'EN → RU', re:'RU → EN'};
const MASTER = 3; // правильных подряд, чтобы слово считалось выученным

/* ---------- текст и проверка ответа ---------- */
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[.,!?;:"'«»]/g,' ').replace(/\s+/g,' ').trim();
const parts = s => s.split(/[\/,]/).map(norm).filter(Boolean);
function ruParts(w){ const p = parts(w.ru); const extra=[]; for(const x of p){ if(x.startsWith('к ')) extra.push(x.slice(2)); } return p.concat(extra); }
function enVariants(w){ const e=norm(w.en); const v=[e]; if(e.startsWith('to ')) v.push(e.slice(3)); if(e.startsWith('a ')) v.push(e.slice(2)); return v; }
function lev(a,b){ if(Math.abs(a.length-b.length)>1) return 2; const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function accepted(w,dir){
  if(dir==='er') return ruParts(w);
  const mine = new Set(ruParts(w)); const out = new Set(enVariants(w));
  for(const o of WORDS){ if(o!==w && ruParts(o).some(p=>mine.has(p))) enVariants(o).forEach(v=>out.add(v)); }
  return [...out];
}
function check(input, w, dir){
  const a = norm(input); if(!a) return {ok:false};
  const acc = accepted(w,dir);
  if(acc.includes(a)) return {ok:true};
  const typo = acc.find(x=>x.length>=5 && lev(a,x)===1);
  if(typo) return {ok:true, typo};
  return {ok:false};
}

/* ---------- хранилище ---------- */
const LS_KEY = 'slova-test-v1';
const blank = () => ({v:1, updated:0, words:{}, days:{}, sessions:[]});
let S = blank();
function lsRead(){ try{ const t=localStorage.getItem(LS_KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function sane(x){ if(!x||typeof x!=='object') return blank(); return {v:1, updated:+x.updated||0, words:x.words&&typeof x.words==='object'?x.words:{}, days:x.days&&typeof x.days==='object'?x.days:{}, sessions:Array.isArray(x.sessions)?x.sessions:[]}; }
S = sane(lsRead());

let dbDoc = null, saving = false, dirty = false, saveTimer = null;
function save(){
  S.updated = Date.now(); lsWrite();
  if(!dbDoc) return; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if(!dbDoc || saving || !dirty) return; saving = true; dirty = false;
  try{ await dbDoc.set(JSON.parse(JSON.stringify(S))); setSync('Прогресс сохранён в аккаунте'); }
  catch(e){ dirty = true; setSync('Не удалось сохранить в аккаунт, сохранено на устройстве'); }
  saving = false; if(dirty) saveTimer = setTimeout(flush, 3000);
}
function setSync(t){ document.getElementById('sync').textContent = t; }
async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc('data/users/'+id+'/state/main');
    const snap = await Promise.race([ref.get(), new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
    dbDoc = ref;
    if(snap.exists){ const remote = sane(snap.data()); if(remote.updated > S.updated){ S = remote; lsWrite(); render(); } else if(S.updated > remote.updated){ dirty=true; flush(); } }
    else if(S.updated){ dirty=true; flush(); }
    setSync('Прогресс сохраняется в аккаунте');
  }catch(e){ /* остаёмся на локальном хранении */ }
}

/* ---------- учёт ответов ---------- */
const today = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function rec(key,dir){ const w = S.words[key] ||= {}; return w[dir] ||= {c:0,x:0,s:0,t:0}; }
function peek(key,dir){ return S.words[key]?.[dir]; }
function record(key,dir,ok){
  const r = rec(key,dir); if(ok){ r.c++; r.s++; } else { r.x++; r.s=0; } r.t = Date.now();
  const d = S.days[today()] ||= {r:0,w:0,q:0}; ok ? d.r++ : d.w++;
  save();
}
function status(key,dir){ const r=peek(key,dir); if(!r) return 0; if(r.s>=MASTER) return 2; if(r.x>0 && r.s<2) return 3; return 1; }

/* ---------- настройки и подбор вопросов ---------- */
const SET_KEY = 'slova-test-settings';
let cfg = {dir:'er', mode:'sent', blocks:[0], filter:'smart', count:20};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem(SET_KEY)||'{}')); }catch(e){}
if(cfg.mode!=='type' && cfg.mode!=='sent') cfg.mode = 'sent';
function saveCfg(){ try{ localStorage.setItem(SET_KEY, JSON.stringify(cfg)); }catch(e){} }

function pool(){
  const bl = cfg.blocks.length ? cfg.blocks : BLOCKS.map((_,i)=>i);
  return WORDS.filter(w => bl.some(i => w.n>=BLOCKS[i][0] && w.n<=BLOCKS[i][1]));
}
function dirFor(){ return cfg.dir==='mix' ? (Math.random()<.5?'er':'re') : cfg.dir; }
function buildQuiz(opts={}){
  let base = opts.words || pool();
  const items = [];
  for(const w of base){
    if(cfg.mode==='sent' && !SENT[w.n]) continue;
    const dir = dirFor();
    const r = peek(w.key,dir);
    let weight;
    if(opts.words) weight = 1;
    else if(cfg.filter==='new'){ if(r) continue; weight=1; }
    else if(cfg.filter==='weak'){ if(!r || status(w.key,dir)!==3) continue; weight=1+r.x; }
    else if(cfg.filter==='all') weight = 1;
    else weight = !r ? 2.5 : r.s>=MASTER ? 0.35 : 1 + r.x*1.2 - r.s*0.25 + Math.min(3,(Date.now()-r.t)/864e5/3);
    items.push({w,dir,weight:Math.max(.05,weight)});
  }
  const n = opts.words ? items.length : (cfg.count==='all' ? items.length : Math.min(cfg.count, items.length));
  const out = [];
  while(out.length<n && items.length){
    let tot = items.reduce((a,b)=>a+b.weight,0), r = Math.random()*tot, i = 0;
    for(; i<items.length-1; i++){ r -= items[i].weight; if(r<=0) break; }
    out.push(items.splice(i,1)[0]);
  }
  return out.map(({w,dir})=>({w,dir}));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function options(w,dir){
  const mine = new Set(ruParts(w));
  const cand = shuffle(WORDS.filter(o => o!==w && !ruParts(o).some(p=>mine.has(p)))).slice(0,3);
  return shuffle([w,...cand]).map(o => ({w:o, label: dir==='er' ? o.ru : o.en}));
}

/* ---------- экраны ---------- */
const view = document.getElementById('view');
let tab = 'test';
let Q = null; // текущий тест
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===tab));
  if(tab==='test') Q ? (Q.done ? renderResult() : renderQuestion()) : renderSetup();
  else if(tab==='stats') renderStats();
  else renderDict();
}
document.querySelector('nav').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0); });

function chip(group,val,label,on){ return `<button class="chip" data-g="${group}" data-v="${val}" aria-pressed="${on}">${label}</button>`; }
function renderSetup(){
  const p = pool();
  const learnedHere = p.filter(w => status(w.key, cfg.dir==='re'?'re':'er')===2).length;
  view.innerHTML = `<div class="panel">
    <div class="group"><div class="lbl">Направление</div><div class="chips">
      ${chip('dir','er','Английский → русский',cfg.dir==='er')}${chip('dir','re','Русский → английский',cfg.dir==='re')}${chip('dir','mix','Вперемешку',cfg.dir==='mix')}</div></div>
    <div class="group"><div class="lbl">Как отвечать</div><div class="chips">
      ${chip('mode','type','Написать слово',cfg.mode==='type')}${chip('mode','sent','Переводить предложения',cfg.mode==='sent')}</div>${cfg.mode==='sent'?'<div class="hint">Каждое слово в своём предложении: переводишь предложение целиком, нужное слово подсвечено. Claude подсказывает, есть ли ошибки, а засчитать ответ или нет, решаешь ты.</div>':''}</div>
    <div class="group"><div class="lbl">Какие слова (номера по таблице)</div><div class="chips">
      ${chip('blk','all','Все 1–652',!cfg.blocks.length)}${BLOCKS.map((b,i)=>chip('blk',i,b[0]+'–'+b[1],cfg.blocks.includes(i))).join('')}</div>
      <div class="hint">В выбранных: ${p.length} слов, выучено ${learnedHere}. Можно отметить несколько диапазонов.</div></div>
    <div class="group"><div class="lbl">Что спрашивать</div><div class="chips">
      ${chip('filter','smart','Умный подбор',cfg.filter==='smart')}${chip('filter','new','Только новые',cfg.filter==='new')}${chip('filter','weak','Только ошибки',cfg.filter==='weak')}${chip('filter','all','Все подряд',cfg.filter==='all')}</div>
      <div class="hint">${{smart:'Чаще спрашивает слова с ошибками и те, что давно не повторялись.',new:'Слова, которых ещё не было в тестах в этом направлении.',weak:'Слова, где последний ответ был неверным.',all:'Случайные слова без учёта прогресса.'}[cfg.filter]}</div></div>
    <div class="group"><div class="lbl">Сколько вопросов</div><div class="chips">
      ${[10,20,30,50].map(n=>chip('count',n,n,cfg.count===n)).join('')}${chip('count','all','Все',cfg.count==='all')}</div></div>
    <button class="big" id="start">Начать тест</button>
    <div class="hint" id="startmsg"></div>
  </div>`;
  view.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const g=c.dataset.g, v=c.dataset.v;
    if(g==='blk'){ if(v==='all') cfg.blocks=[]; else { const i=+v; cfg.blocks = cfg.blocks.includes(i)?cfg.blocks.filter(x=>x!==i):[...cfg.blocks,i].sort((a,b)=>a-b); } }
    else if(g==='count') cfg.count = v==='all'?'all':+v;
    else cfg[g]=v;
    saveCfg(); renderSetup();
  });
  document.getElementById('start').onclick = () => startQuiz();
}
function startQuiz(words){
  const items = buildQuiz(words?{words}:{});
  if(!items.length){ const m=document.getElementById('startmsg'); if(m) m.textContent = cfg.filter==='weak' ? 'Ошибок в этих словах пока нет. Выбери другой режим.' : cfg.filter==='new' ? 'Новых слов в этом диапазоне не осталось.' : 'Нет слов для теста.'; return; }
  Q = {items, i:0, right:0, wrong:[], mode:cfg.mode, started:Date.now(), answered:false};
  (S.days[today()] ||= {r:0,w:0,q:0}).q++; save();
  tab='test'; render();
}
function renderQuestion(){
  const it = Q.items[Q.i], w = it.w, dir = it.dir;
  if(!it.opts && Q.mode==='choice') it.opts = options(w,dir);
  const sent = Q.mode==='sent' && SENT[w.n];
  const prompt = dir==='er' ? w.en : w.ru;
  view.innerHTML = `<div class="panel" style="gap:14px">
    <div class="qtop"><span>Вопрос ${Q.i+1} из ${Q.items.length}</span><span>Верно: ${Q.right} · Ошибок: ${Q.wrong.length}</span></div>
    <div class="bar"><i style="width:${Q.i/Q.items.length*100}%"></i></div>
    <div class="card">
      <span class="dirtag">${DIRS[dir]} · №${w.n}</span>
      ${sent?`<div class="prompt sent" lang="${dir==='er'?'en':'ru'}">${hl(dir==='er'?sent.en:sent.ru, dir==='er'?sent.ek:sent.rk)}</div>`:`<div class="prompt" lang="${dir==='er'?'en':'ru'}">${esc(prompt)}</div>`}
      ${dir==='er'&&w.tr?`<div class="tr">[${esc(w.tr)}]</div>`:''}
      ${sent?`<form id="f" class="group" autocomplete="off"><textarea class="inp" id="answer" rows="3" placeholder="${dir==='er'?'Переведи предложение на русский':'Translate the sentence into English'}" lang="${dir==='er'?'ru':'en'}" autocapitalize="sentences" spellcheck="false"></textarea><div class="row"><button class="big" type="submit">Проверить</button><button class="ghost" type="button" id="idk">Не знаю</button></div></form>`
      : Q.mode==='choice'
        ? `<div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${k+1}</b><span>${esc(o.label)}</span></button>`).join('')}</div>`
        : `<form id="f" class="group" autocomplete="off"><input class="inp" id="answer" placeholder="${dir==='er'?'Перевод на русском':'Перевод на английском'}" lang="${dir==='er'?'ru':'en'}" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="row"><button class="big" type="submit">Проверить</button><button class="ghost" type="button" id="idk">Не знаю</button></div></form>`}
      <div id="fb"></div>
    </div>
    <div class="row"><button class="ghost" id="quit">Закончить тест</button></div>
  </div>`;
  document.getElementById('quit').onclick = () => { Q.done = true; finish(); };
  if(Q.mode==='choice'){
    view.querySelectorAll('.opt').forEach(b => b.onclick = () => answerChoice(+b.dataset.k));
  } else {
    const inp = document.getElementById('answer'); setTimeout(()=>inp.focus({preventScroll:true}),30);
    const go = sent ? answerSent : answerType;
    document.getElementById('f').onsubmit = e => { e.preventDefault(); if(Q.busy) return; if(Q.answered){ next(); return; } if(!inp.value.trim()) return; go(inp.value); };
    document.getElementById('idk').onclick = () => { if(!Q.answered && !Q.busy) go(''); };
    if(sent) inp.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('f').requestSubmit(); } });
  }
}
function correctText(w,dir){ return dir==='er' ? w.ru : w.en; }
function showFb(ok, w, dir, extra=''){
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="group"><div class="fb ${ok?'ok':'no'}">${ok?'Верно!':'Неверно.'} ${extra}<br>${esc(w.en)}${w.tr?` [${esc(w.tr)}]`:''} — <strong>${esc(w.ru)}</strong></div><button class="big" id="next">${Q.i+1<Q.items.length?'Дальше':'Результат'}</button></div>`;
  const nb = document.getElementById('next'); nb.onclick = next; if(Q.mode==='choice') nb.focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest'});
}
function score(ok,it){ Q.answered = true; record(it.w.key,it.dir,ok); if(ok) Q.right++; else Q.wrong.push(it); }
function answerChoice(k){
  if(Q.answered) return; const it = Q.items[Q.i]; const ok = it.opts[k].w===it.w;
  view.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(it.opts[j].w===it.w) b.classList.add('ok'); else if(j===k) b.classList.add('no'); });
  score(ok,it); showFb(ok,it.w,it.dir);
}
function answerType(val){
  const it = Q.items[Q.i]; const res = check(val,it.w,it.dir);
  const inp = document.getElementById('answer'); inp.readOnly = true; document.getElementById('idk').disabled = true;
  view.querySelector('#f .big').hidden = true;
  const w = it.w;
  if(!val.trim()){ score(false,it); showFb(false,w,it.dir); return; }
  Q.busy = true;
  const cls = res.typo ? 'mid' : res.ok ? 'ok' : 'no';
  const head = res.typo ? `Похоже, верно, но есть опечатка: правильно <strong>${esc(res.typo)}</strong>.` : res.ok ? 'Похоже, верно.' : 'Похоже, неверно.';
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="group"><div class="fb ${cls}">${head}</div>
    <div class="ref"><span class="k">Твой ответ</span><span>${esc(val.trim())}</span><span class="k">По словарю</span><span>${esc(w.en)}${w.tr?` [${esc(w.tr)}]`:''} — <strong>${esc(w.ru)}</strong></span></div>
    ${verdictBtns()}</div>`;
  bindVerdict(ok => score(ok,it));
  fb.scrollIntoView({block:'nearest'});
}
function verdictBtns(){ return `<div class="hint">Как засчитать этот ответ? Решение за тобой, проверка выше только подсказка.</div><div class="selfgrade"><button class="big" id="sg-ok" style="background:var(--good)">Верно</button><button class="big" id="sg-no" style="background:var(--bad)">Неверно</button></div>`; }
function bindVerdict(apply){
  const pick = ok => { if(!Q.busy) return; Q.busy = false; apply(ok); next(); };
  document.getElementById('sg-ok').onclick = () => pick(true);
  document.getElementById('sg-no').onclick = () => pick(false);
}
function hl(s, key){ const i = key ? s.indexOf(key) : -1; return i<0 ? esc(s) : esc(s.slice(0,i))+'<mark>'+esc(key)+'</mark>'+esc(s.slice(i+key.length)); }
function stem(x){ const n=x.length; return n>=6 ? x.slice(0,n-2) : n>=4 ? x.slice(0,n-1) : x; }
function kwMatch(ans, targets){
  const toks = norm(ans).split(' ');
  return targets.filter(Boolean).some(tg => { let tt = norm(tg).split(' ').filter(Boolean); if(tt.length>1) tt = tt.filter(x=>x.length>2); if(!tt.length) return false;
    return tt.every(x => { const st = stem(x); return toks.some(k => k.startsWith(st)); }); });
}
let SAMPLE = null;
function sentPrompt(w,dir,s,val){
  const src = dir==='er'?s.en:s.ru, ref = dir==='er'?s.ru:s.en;
  return `Ты проверяешь перевод ученика (взрослый, родной язык русский, уровень английского A2–B1). Направление: ${dir==='er'?'с английского на русский':'с русского на английский'}.
Исходное предложение: "${src}"
Эталонный перевод: "${ref}"
Ключевое слово: "${dir==='er'?s.ek:s.rk}". По словарю ученика его перевод: "${dir==='er'?w.ru:w.en}". Подходит любая уместная форма или синоним.
Ответ ученика: "${val.trim()}"

Оценивай по смыслу и грамматике, мягко: другой порядок слов, синонимы и стилистические отличия от эталона допустимы.
verdict: "correct" — смысл передан, грамматика в порядке; "minor" — смысл понятен, но есть мелкие ошибки (артикль, окончание, время, опечатка); "wrong" — смысл искажён или предложение переведено не полностью.
wordOk: true, если ключевое слово переведено правильно.
comment: 1–2 коротких предложения по-русски, на «ты», без глаголов прошедшего времени, которые выдают пол (пиши «в твоём ответе», а не «ты написал»). Если ошибки есть, назови главную.
fixed: ответ ученика с минимальными исправлениями, или тот же текст, если ошибок нет.
Ответь только JSON: {"verdict":"correct","wordOk":true,"comment":"...","fixed":"..."}`;
}
function scoreSent(it, ok, wordOk){ Q.answered = true; record(it.w.key, it.dir, wordOk); if(ok) Q.right++; else Q.wrong.push(it); }
function sentFb(it, val, r){
  const w=it.w, dir=it.dir, s=SENT[w.n], ref = dir==='er'?s.ru:s.en, refKey = dir==='er'?s.rk:s.ek;
  const cls = r.self?'mid':r.verdict==='correct'?'ok':r.verdict==='minor'?'mid':'no';
  const head = r.final?'Без ответа.':r.self?'':r.verdict==='correct'?'Claude: верно.':r.verdict==='minor'?'Claude: почти верно.':'Claude: неверно.';
  const fixed = r.fixed && norm(r.fixed)!==norm(val) ? `<span class="k">Твой перевод с исправлениями</span><span>${esc(r.fixed)}</span>` : '';
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="group"><div class="fb ${cls}">${head} ${r.comment?esc(r.comment):''}</div>
    <div class="ref"><span class="k">Эталонный перевод</span><span>${hl(ref, refKey)}</span>${fixed}
    <span class="k">Слово</span><span>${esc(w.en)}${w.tr?` [${esc(w.tr)}]`:''} — ${esc(w.ru)}${r.final?'':` · ${r.wordOk?'<span style="color:var(--good)">в переводе есть</span>':'<span style="color:var(--bad)">в переводе не видно</span>'}`}</span></div>
    ${r.final?`<button class="big" id="next">${Q.i+1<Q.items.length?'Дальше':'Результат'}</button>`:`${verdictBtns()}${r.why?`<div class="hint">${esc(r.why)}</div>`:''}`}</div>`;
  if(r.final){ const nb=document.getElementById('next'); nb.onclick = next; nb.focus({preventScroll:true}); }
  else { Q.busy = true; bindVerdict(ok => scoreSent(it, ok, ok)); }
  fb.scrollIntoView({block:'nearest'});
}
async function answerSent(val){
  const it = Q.items[Q.i], w = it.w, dir = it.dir, s = SENT[w.n];
  Q.busy = true;
  const inp = document.getElementById('answer'); inp.readOnly = true; document.getElementById('idk').disabled = true; view.querySelector('#f .big').hidden = true;
  const kwOk = kwMatch(val, dir==='er' ? [...ruParts(w), s.rk] : [...enVariants(w), s.ek]);
  if(!val.trim()){ scoreSent(it, false, false); sentFb(it, val, {final:true, verdict:'wrong', wordOk:false, comment:'Посмотри перевод и попробуй запомнить это предложение.'}); return; }
  if(SAMPLE){
    document.getElementById('fb').innerHTML = '<div class="fb mid">Claude проверяет перевод…</div>';
    try{
      const r = await SAMPLE.json(sentPrompt(w,dir,s,val), {modelTier:'quick'});
      if(!Q || Q.items[Q.i]!==it) return;
      const verdict = ['correct','minor','wrong'].includes(r?.verdict) ? r.verdict : (kwOk?'minor':'wrong');
      const wordOk = typeof r?.wordOk==='boolean' ? r.wordOk : kwOk;
      sentFb(it, val, {verdict, wordOk, comment: typeof r?.comment==='string'?r.comment:'', fixed: typeof r?.fixed==='string'?r.fixed:''});
      return;
    }catch(e){
      if(!Q || Q.items[Q.i]!==it) return;
      if(e?.code==='not_granted') SAMPLE = null;
      sentFb(it, val, {self:true, wordOk:kwOk, verdict:kwOk?'minor':'wrong', comment: kwOk?'Нужное слово в переводе есть.':'Нужного слова в переводе не видно.', why: e?.code==='not_granted' ? 'Проверка через Claude не разрешена, поэтому оценка за тобой.' : 'Claude сейчас не ответил, поэтому оценка за тобой.'});
      return;
    }
  }
  sentFb(it, val, {self:true, wordOk:kwOk, verdict:kwOk?'minor':'wrong', comment: kwOk?'Нужное слово в переводе есть.':'Нужного слова в переводе не видно.'});
}
function next(){ Q.answered=false; Q.busy=false; Q.i++; if(Q.i>=Q.items.length){ Q.done=true; finish(); } else render(); }
function finish(){
  const n = Q.right + Q.wrong.length;
  if(n){ S.sessions.unshift({t:Date.now(), dir:cfg.dir, mode:Q.mode, n, r:Q.right}); S.sessions = S.sessions.slice(0,60); save(); }
  render();
}
function renderResult(){
  const n = Q.right + Q.wrong.length; const pct = n ? Math.round(Q.right/n*100) : 0;
  view.innerHTML = `<div class="panel">
    <div class="res">${Q.right} / ${n}<small>${n?pct+'% правильных ответов':'Ни одного ответа'}</small></div>
    ${Q.wrong.length?`<div class="group"><div class="lbl">Ошибки (${Q.wrong.length})</div><div class="list">${Q.wrong.map(({w})=>`<div class="li"><div class="w"><span class="num">${w.n}</span>${esc(w.en)}<small>${esc(w.ru)}</small>${Q.mode==='sent'&&SENT[w.n]?`<small>${esc(SENT[w.n].en)} — ${esc(SENT[w.n].ru)}</small>`:''}</div></div>`).join('')}</div></div>`:(n?'<div class="fb ok">Без единой ошибки.</div>':'')}
    <div class="row">${Q.wrong.length?'<button class="big" id="redo">Повторить ошибки</button>':''}<button class="${Q.wrong.length?'ghost':'big'}" id="again">Новый тест</button></div>
  </div>`;
  const redo = document.getElementById('redo'); if(redo) redo.onclick = () => { const ws = Q.wrong.map(x=>x.w); Q=null; startQuiz(ws); };
  document.getElementById('again').onclick = () => { Q=null; render(); };
}

/* ---------- статистика ---------- */
function streakDays(){ let n=0; const d=new Date(); if(!S.days[today(d)]?.r && !S.days[today(d)]?.w) d.setDate(d.getDate()-1);
  for(;;){ const k=today(d); const x=S.days[k]; if(x && (x.r+x.w)>0){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
function renderStats(){
  let R=0,W=0; for(const k in S.days){ R+=S.days[k].r; W+=S.days[k].w; }
  const tot=R+W, acc = tot?Math.round(R/tot*100):0;
  const cnt = dir => { let m=0,s=0; for(const w of WORDS){ const st=status(w.key,dir); if(st) s++; if(st===2) m++; } return {m,s}; };
  const er=cnt('er'), re=cnt('re');
  // последние 14 дней
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=today(d); days.push({k, d, r:S.days[k]?.r||0, w:S.days[k]?.w||0}); }
  const max = Math.max(10, ...days.map(x=>x.r+x.w)); const nice = Math.ceil(max/10)*10;
  const Wd=380,H=170,L=30,B=24,T=10, bw=(Wd-L-6)/14;
  const y = v => T + (H-T-B)*(1-v/nice);
  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Ответы за 14 дней">`;
  for(const t of [0,nice/2,nice]){ svg+=`<line x1="${L}" x2="${Wd}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="JetBrains Mono,monospace">${t}</text>`; }
  days.forEach((x,i)=>{ const cx=L+i*bw+3, w=bw-6;
    if(x.r) svg+=`<rect x="${cx}" y="${y(x.r)}" width="${w}" height="${y(0)-y(x.r)}" rx="2" fill="var(--good)"><title>${x.k}: верно ${x.r}</title></rect>`;
    if(x.w) svg+=`<rect x="${cx}" y="${y(x.r+x.w)}" width="${w}" height="${y(x.r)-y(x.r+x.w)}" rx="2" fill="var(--bad)"><title>${x.k}: ошибок ${x.w}</title></rect>`;
    if(i%3===1||i===13) svg+=`<text x="${cx+w/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="${i===13?'var(--ink)':'var(--muted)'}" font-family="JetBrains Mono,monospace">${x.d.getDate()}.${String(x.d.getMonth()+1).padStart(2,'0')}</text>`;
  });
  svg+='</svg>';
  const hard = WORDS.map(w=>{ const a=peek(w.key,'er')||{c:0,x:0}, b=peek(w.key,'re')||{c:0,x:0}; return {w, x:a.x+b.x, c:a.c+b.c}; }).filter(o=>o.x>0).sort((a,b)=>b.x-a.x || a.c-b.c).slice(0,15);
  const fmt = t => new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  view.innerHTML = `<div class="panel">
    <div class="tiles">
      <div class="tile"><span class="v">${tot}</span><span class="k">ответов всего</span></div>
      <div class="tile"><span class="v">${acc}%</span><span class="k">правильных</span></div>
      <div class="tile"><span class="v">${er.m}<small style="font-size:14px;color:var(--muted)"> / ${WORDS.length}</small></span><span class="k">выучено EN → RU</span></div>
      <div class="tile"><span class="v">${re.m}<small style="font-size:14px;color:var(--muted)"> / ${WORDS.length}</small></span><span class="k">выучено RU → EN</span></div>
      <div class="tile"><span class="v">${streakDays()}</span><span class="k">дней подряд</span></div>
      <div class="tile"><span class="v">${(S.days[today()]?.r||0)+(S.days[today()]?.w||0)}</span><span class="k">ответов сегодня</span></div>
    </div>
    <div class="hint">Слово считается выученным после ${MASTER} правильных ответов подряд. Одна ошибка — и оно снова в работе.</div>
  </div>
  <div class="panel">
    <div class="lbl">Последние 14 дней</div>
    <div class="chart">${svg}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>верно</span><span><i style="background:var(--bad)"></i>ошибки</span></div>
  </div>
  <div class="panel">
    <div class="lbl">Прогресс по диапазонам</div>
    <div class="blocks">${BLOCKS.map(([a,b])=>{ const ws=WORDS.filter(w=>w.n>=a&&w.n<=b); let m=0,s=0,e=0; ws.forEach(w=>{ for(const d of ['er','re']){ const st=status(w.key,d); if(st===2)m++; else if(st===3)e++; else if(st===1)s++; } }); const T2=ws.length*2;
      return `<div class="blk"><span>${a}–${b}</span><span class="track"><i style="width:${m/T2*100}%;background:var(--good)"></i><i style="width:${s/T2*100}%;background:var(--mark)"></i><i style="width:${e/T2*100}%;background:var(--bad)"></i></span><span style="text-align:right">${Math.round(m/T2*100)}%</span></div>`; }).join('')}</div>
    <div class="legend" style="flex-wrap:wrap"><span><i style="background:var(--good)"></i>выучено</span><span><i style="background:var(--mark)"></i>в процессе</span><span><i style="background:var(--bad)"></i>ошибка</span></div>
    <div class="hint">Считаются оба направления: каждое слово надо выучить и с английского, и с русского.</div>
  </div>
  <div class="panel">
    <div class="lbl">Трудные слова</div>
    ${hard.length?`<div class="list">${hard.map(o=>`<div class="li"><div class="w"><span class="num">${o.w.n}</span>${esc(o.w.en)}<small>${esc(o.w.ru)}</small></div><div class="n" style="color:var(--bad)">ошибок ${o.x}<br><span style="color:var(--muted)">верно ${o.c}</span></div></div>`).join('')}</div><button class="big" id="hardgo">Тренировать эти слова</button>`:'<div class="empty">Пока ошибок нет. Пройди пару тестов, и здесь появятся слова, которые даются тяжелее всего.</div>'}
  </div>
  <div class="panel">
    <div class="lbl">История тестов</div>
    ${S.sessions.length?`<div class="list">${S.sessions.slice(0,15).map(s=>`<div class="li"><div class="w">${fmt(s.t)}<small>${s.dir==='mix'?'вперемешку':DIRS[s.dir]} · ${s.mode==='sent'?'предложения':s.mode==='type'?'ввод':'выбор'}</small></div><div class="n">${s.r} / ${s.n}<br>${Math.round(s.r/s.n*100)}%</div></div>`).join('')}</div>`:'<div class="empty">Здесь будут результаты каждого теста.</div>'}
  </div>
  <div class="panel">
    <div class="lbl">Сброс</div>
    <div class="hint">Удаляет весь прогресс и статистику. Отменить нельзя.</div>
    <div class="row" id="resetrow"><button class="ghost" id="reset">Сбросить статистику</button></div>
  </div>`;
  const hg=document.getElementById('hardgo'); if(hg) hg.onclick=()=>startQuiz(hard.map(o=>o.w));
  document.getElementById('reset').onclick=()=>{ document.getElementById('resetrow').innerHTML='<button class="big" id="yes" style="background:var(--bad)">Да, удалить всё</button><button class="ghost" id="no">Отмена</button>';
    document.getElementById('yes').onclick=()=>{ S=blank(); save(); renderStats(); }; document.getElementById('no').onclick=renderStats; };
}

/* ---------- словарь ---------- */
let dq = '';
function renderDict(){
  view.innerHTML = `<div class="panel">
    <input class="inp" id="search" placeholder="Поиск по-английски или по-русски" value="${esc(dq)}" autocomplete="off" style="font-size:16px">
    <div class="legend" style="flex-wrap:wrap"><span>Точки: EN→RU, RU→EN</span><span><i style="background:var(--good)"></i>выучено</span><span><i style="background:var(--mark)"></i>в процессе</span><span><i style="background:var(--bad)"></i>ошибка</span></div>
    <div class="list" id="dlist"></div>
  </div>`;
  const s = document.getElementById('search');
  const fill = () => { const q = norm(dq); const ws = q ? WORDS.filter(w => norm(w.en).includes(q) || norm(w.ru).includes(q) || String(w.n)===q) : WORDS;
    document.getElementById('dlist').innerHTML = ws.length ? ws.map(w=>`<div class="li"><div class="w"><span class="num">${w.n}</span>${esc(w.en)}${w.tr?` <span class="hint">[${esc(w.tr)}]</span>`:''}<small>${esc(w.ru)}</small></div><div class="n"><span class="dot s${status(w.key,'er')}" title="EN→RU"></span><span class="dot s${status(w.key,'re')}" title="RU→EN"></span></div></div>`).join('') : '<div class="empty">Ничего не найдено.</div>'; };
  s.oninput = () => { dq = s.value; fill(); };
  fill();
}

/* ---------- клавиатура ---------- */
document.addEventListener('keydown', e => {
  if(tab!=='test' || !Q || Q.done || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(Q.mode==='choice' && !Q.answered && /^[1-4]$/.test(e.key)) answerChoice(+e.key-1);
  else if(Q.answered && e.key==='Enter' && document.activeElement?.id!=='next'){ e.preventDefault(); next(); }
});

render();
connect();
if(window.claude?.use) claude.use('sample').then(s => { SAMPLE = s; }).catch(()=>{});
</script>

<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
