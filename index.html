":"с","woman":"женщина","wood":"дерево (материал)","wooden":"деревянный","work":"работать","worked":"работал","worse":"хуже","would":"бы, (буд. в прош.)","years":"годы, лет","yellow":"жёлтый","you":"ты, вы","you're":"ты","young":"молодой","your":"твой, свой","yours":"твой"},"vocab":{"playlist":10,"suddenly":30,"gift":50,"excited":70,"beard":90,"boat":110,"refrigerator":130,"carry":150,"carried":150,"clever":170,"boards":190,"anything":211,"skill":231,"busy":251,"attention":271,"safe":292,"touching":312,"wedding":332,"observe":352,"freedom":372,"treated":393,"decision":420,"suppose":442,"skip":470,"guilty":492,"purpose":513,"reflection":534,"circumstances":555,"benefits":576,"pepper":597,"lack":618,"victim":640}},{"id":11,"title_en":"The Wolf of Brindle","title_ru":"Волк из Бриндла","genre":"Фэнтези","summary_ru":"Когда по ночам в деревню приходит огромный волк, а дети начинают болеть, девушка Мара идёт за помощью к лесной ведьме, которую все в деревне боятся.","paragraphs":[{"en":"In the village of Brindle, every door had a silver fork attached to it. The forks were old and black, and nobody really remembered why they were there. \"For luck,\" the grandmothers said, and they touched them each time they went out. \"To keep the witch away.\"","ru":"В деревне Бриндл к каждой двери была прикреплена серебряная вилка. Вилки были старыми и почерневшими, и никто толком не помнил, зачем они там. «На удачу», — говорили бабушки и касались их каждый раз, выходя из дома. «Чтобы ведьма не подходила»."},{"en":"Mara was nineteen, and she did not believe in luck. She believed in hard work, clean water and her own two strong arms. However, that winter she began to believe in other things too.","ru":"Маре было девятнадцать, и она не верила в удачу. Она верила в тяжёлый труд, чистую воду и свои две сильные руки. Однако той зимой она начала верить и в другое."},{"en":"It started with a noise. Every night, just after midnight, something walked around the village. It was heavy, and the snow cried under its feet. In the morning there were tracks as big as plates, and once a whole cow disappeared from a farm. The men said that it was a wolf, but no wolf was that big. It was a predator of a kind that nobody in Brindle had ever seen before.","ru":"Всё началось с шума. Каждую ночь, сразу после полуночи, что-то ходило вокруг деревни. Оно было тяжёлым, и снег стонал у него под ногами. Утром находили следы размером с тарелку, а однажды с фермы пропала целая корова. Мужчины говорили, что это волк, но таких больших волков не бывает. Это был хищник такой породы, какой в Бриндле никто никогда не видел."},{"en":"Then the children began to get sick. First the miller's son, then the two little girls from the farm opposite the church, and then Mara's own brother, Tom. He was seven. He lay in bed with a hot face and did not speak, and he looked at the window all night, as if he was waiting for someone. Mara sat with him every night and held his hot hand.","ru":"Потом начали болеть дети. Сначала сын мельника, потом две маленькие девочки с фермы напротив церкви, а потом и родной брат Мары, Том. Ему было семь. Он лежал в постели с горячим лицом, не говорил ни слова и всю ночь смотрел в окно, как будто кого-то ждал. Мара каждую ночь сидела с ним и держала его горячую руку."},{"en":"The village council met in the church. Mara stood at the back and listened. The old men talked and talked. They read a long review of every bad winter since the year 1800, and they agreed that it was all the fault of the witch who lived in the forest. But nobody made a decision. Mara's anxiety grew with every word. At last she walked out into the snow and turned towards the trees.","ru":"Деревенский совет собрался в церкви. Мара стояла в самом конце и слушала. Старики говорили и говорили. Они зачитали длинный обзор каждой плохой зимы начиная с 1800 года и согласились, что во всём виновата ведьма, которая живёт в лесу. Но решения никто не принял. С каждым словом беспокойство Мары росло. Наконец она вышла на снег и повернула к деревьям."},{"en":"The witch's house stood alone at the edge of the forest. It was small and crooked, and smoke rose from its chimney. Dry plants hung under the roof, and a black cat watched her from the window with yellow eyes. Before Mara could knock, the door opened.","ru":"Дом ведьмы стоял одиноко на краю леса. Он был маленький и кривой, и из трубы поднимался дым. Под крышей висели сушёные травы, а чёрный кот следил за ней из окна жёлтыми глазами. Мара не успела постучать — дверь открылась сама."},{"en":"\"Come in,\" said a woman's voice. \"You're letting the cold in.\"","ru":"«Входи, — сказал женский голос. — Ты впускаешь холод»."},{"en":"\"I'm sorry to disturb you,\" Mara began, but the witch had already turned away. She was not old and ugly, as the stories said. She was perhaps fifty, with grey hair tied at her neck and calm brown eyes. Her name was Ilsa. She gave Mara a cup of hot tea and sat down opposite her at the table.","ru":"«Простите, что беспокою», — начала Мара, но ведьма уже отвернулась. Она не была старой и уродливой, как говорилось в сказках. Ей было лет пятьдесят, седые волосы были собраны на шее, а карие глаза смотрели спокойно. Её звали Ильза. Она дала Маре чашку горячего чая и села напротив неё за стол."},{"en":"\"You've come about the wolf,\" Ilsa said. \"And the children.\"","ru":"«Ты пришла из-за волка, — сказала Ильза. — И из-за детей»."},{"en":"\"Is it your curse?\" Mara asked. \"Tell me exactly what you want, and I'll give it to you. Money, food — anything. Just stop it.\"","ru":"«Это ваше проклятие? — спросила Мара. — Скажите точно, чего вы хотите, и я вам это дам. Деньги, еду — что угодно. Только остановите это»."},{"en":"Ilsa laughed, but it was not a happy laugh. \"I didn't make this curse, child. Your village made it. Let me give you a short tour of its history.\" She took a thick book from the shelf and opened it on the table.","ru":"Ильза засмеялась, но смех был невесёлым. «Не я наложила это проклятие, дитя. Его создала твоя деревня. Позволь мне провести для тебя небольшую экскурсию по её истории». Она сняла с полки толстую книгу и раскрыла её на столе."},{"en":"\"Fifty years ago, my mother lived in Brindle. She was a healer. She helped every family in the village. Then one year the harvest failed, and people were hungry and frightened. They needed someone to blame. They said that my mother was a witch who had poisoned the fields. They came to her house at night with torches. They broke her windows and attached those silver forks to every door, so that she could never come in again. Then they drove us into the forest. I was five years old.\"","ru":"«Пятьдесят лет назад моя мать жила в Бриндле. Она была целительницей. Она помогала каждой семье в деревне. Потом однажды случился неурожай, и люди были голодны и напуганы. Им нужен был кто-то виноватый. Они сказали, что моя мать — ведьма, которая отравила поля. Они пришли к её дому ночью с факелами. Они разбили ей окна и прикрепили эти серебряные вилки к каждой двери, чтобы она больше никогда не смогла войти. А потом прогнали нас в лес. Мне было пять лет»."},{"en":"Mara's face was burning. She remembered her grandfather's quiet face at dinner, and how he never went near the forest. \"My grandfather was on the council then,\" she said slowly.","ru":"Лицо Мары горело. Она вспомнила тихое лицо дедушки за ужином и то, что он никогда не подходил к лесу. «Мой дедушка тогда был в совете», — медленно сказала она."},{"en":"\"I know. He threw the first stone.\" Ilsa did not say it angrily. She said it in the way that people say it is raining. \"My mother forgave them before she died. But a curse does not need the person who was hurt. It grows by itself, out of shame. Your village has carried that shame for fifty years, and nobody has ever said a word about it. Shame is like water behind a wall. One day the wall collapses.\"","ru":"«Знаю. Он бросил первый камень». Ильза сказала это без злобы. Она сказала это так, как люди говорят, что идёт дождь. «Моя мать простила их перед смертью. Но проклятию не нужен тот, кого обидели. Оно растёт само, из стыда. Твоя деревня несёт этот стыд пятьдесят лет, и никто ни разу не сказал о нём ни слова. Стыд — как вода за стеной. Однажды стена рушится»."},{"en":"\"The wolf,\" Mara whispered.","ru":"«Волк», — прошептала Мара."},{"en":"\"The wolf is made of everything that Brindle wanted to forget. It is hungry because it has never been fed the truth. And it takes the children because children are the only ones who can still see it clearly.\"","ru":"«Волк сделан из всего, что Бриндл хотел забыть. Он голоден, потому что его никогда не кормили правдой. А детей он забирает потому, что только дети ещё могут видеть его ясно»."},{"en":"\"Then how do I stop it? Can you kill it?\"","ru":"«Тогда как мне его остановить? Вы можете его убить?»"},{"en":"\"No. I can only prolong the time and give your brother a few more days with my medicine.\" Ilsa pushed a small bottle across the table. \"The real task is yours. Someone from Brindle must meet the wolf, look at it and accept it. Not fight it. Not run from it. Accept it.\"","ru":"«Нет. Я могу лишь продлить время и дать твоему брату ещё несколько дней с помощью моего лекарства». Ильза подвинула через стол маленький пузырёк. «Настоящая задача — твоя. Кто-то из Бриндла должен встретить волка, посмотреть на него и принять его. Не сражаться с ним. Не убегать от него. Принять»."},{"en":"\"That makes no sense,\" Mara said. \"And why should I trust you? Everyone says you're a witch.\"","ru":"«В этом нет смысла, — сказала Мара. — И почему я должна вам доверять? Все говорят, что вы ведьма»."},{"en":"\"Then don't trust me. Trust your brother's eyes. He sees the wolf every night, doesn't he?\" Ilsa closed the book. \"Above all, people hate to hear what they have done. That's why the wolf is still here.\"","ru":"«Тогда не доверяй мне. Доверься глазам своего брата. Он ведь видит волка каждую ночь, правда?» Ильза закрыла книгу. «Больше всего на свете люди не любят слышать о том, что они сделали. Поэтому волк до сих пор здесь»."},{"en":"Mara walked home through the snow with the bottle in her pocket and a terrible weight on her shoulders. She gave Tom the medicine, and his face grew a little cooler. Then she went to the door, took the old silver fork in her hand and pulled it off. It was harder than she expected, because the nails were deep. When it came free at last, she felt strangely light.","ru":"Мара шла домой по снегу с пузырьком в кармане и страшной тяжестью на плечах. Она дала Тому лекарство, и его лицо стало чуть прохладнее. Потом она подошла к двери, взяла старую серебряную вилку в руку и сорвала её. Это оказалось труднее, чем она думала, — гвозди сидели глубоко. Когда вилка наконец поддалась, Мара почувствовала странную лёгкость."},{"en":"She did not sleep that night. She sat by Tom's bed and listened to the wind. At midnight she heard the noise again: the heavy steps, the breaking snow. She put on her coat and went outside.","ru":"В ту ночь она не спала. Она сидела у кровати Тома и слушала ветер. В полночь она снова услышала шум: тяжёлые шаги, хруст снега. Она надела пальто и вышла на улицу."},{"en":"The wolf was standing in the middle of the village square. It was as tall as a horse, and its fur was dark and moving, like smoke. Its eyes were the colour of torches. Mara's legs were shaking. Every part of her wanted to run back inside. Instead, she walked forward.","ru":"Волк стоял посреди деревенской площади. Он был ростом с лошадь, а его шерсть была тёмной и шевелилась, как дым. Глаза у него были цвета факелов. У Мары дрожали ноги. Всё в ней хотело убежать обратно в дом. Но вместо этого она пошла вперёд."},{"en":"\"I know who you are,\" she said, and her voice was louder than she expected. \"My grandfather threw a stone at a good woman. Brindle drove her into the forest because we were afraid. It was wrong. I'm sorry.\"","ru":"«Я знаю, кто ты, — сказала она, и её голос прозвучал громче, чем она ожидала. — Мой дедушка бросил камень в добрую женщину. Бриндл прогнал её в лес, потому что мы боялись. Это было неправильно. Прости»."},{"en":"The wolf did not move. Lights began to appear in the windows around the square. Doors opened. People came out in their nightclothes and stood in the snow, too frightened to speak.","ru":"Волк не двигался. В окнах вокруг площади начали загораться огни. Открывались двери. Люди выходили в ночных рубашках и стояли в снегу, слишком напуганные, чтобы говорить."},{"en":"Mara took another step, and then another. The wolf lowered its great head. She could feel its breath, warm and smelling of burnt wood. Then she did something that she had never thought she would do. She put her arms around its neck and hugged it.","ru":"Мара сделала ещё шаг, а потом ещё один. Волк опустил свою огромную голову. Она чувствовала его дыхание, тёплое, пахнущее горелым деревом. И тогда она сделала то, чего никогда не думала сделать. Она обвила руками его шею и обняла его."},{"en":"For a long moment, nothing happened. Then the wolf began to change. The smoke grew lighter and lighter, until it was pure white, like the snow itself. And in Mara's arms there was not a wolf any more, but an old woman with kind eyes, who touched Mara's face with her hand and smiled. Then she was gone, and the night was quiet.","ru":"Долгое мгновение ничего не происходило. Потом волк начал меняться. Дым становился всё светлее и светлее, пока не стал чисто-белым, как сам снег. И в руках Мары был уже не волк, а старая женщина с добрыми глазами, которая коснулась ладонью лица Мары и улыбнулась. А потом она исчезла, и ночь стала тихой."},{"en":"The next morning Tom woke up hungry and asked for porridge. The other children got better too. Nobody in Brindle talked about the wolf, but by the end of the week every silver fork had been taken off every door. The old men were upset at first, and some of them cried. Then they walked together to the house at the edge of the forest, knocked on the door and waited.","ru":"На следующее утро Том проснулся голодным и попросил каши. Другие дети тоже поправились. Никто в Бриндле не говорил о волке, но к концу недели с каждой двери сняли каждую серебряную вилку. Старики сначала были расстроены, а некоторые даже плакали. Потом они вместе пошли к дому на краю леса, постучали в дверь и стали ждать."},{"en":"Ilsa opened it and looked at them for a long time. \"Well,\" she said at last. \"Come in. You're letting the cold in.\"","ru":"Ильза открыла и долго смотрела на них. «Что ж, — сказала она наконец. — Входите. Вы впускаете холод»."},{"en":"Mara often thought about that winter afterwards. It was not luck that had saved Brindle, and it was not magic. It was something more amazing and much more difficult: the moment when a whole village stopped running from its own story. Ilsa still lives in the house at the edge of the forest, but now the children of Brindle visit her every week, and nobody calls her a witch any more.","ru":"Потом Мара часто вспоминала ту зиму. Бриндл спасла не удача и не магия. Это было нечто куда более удивительное и куда более трудное: мгновение, когда целая деревня перестала убегать от собственной истории. Ильза и сейчас живёт в доме на краю леса, но теперь дети Бриндла каждую неделю приходят к ней в гости, и никто больше не называет её ведьмой."}],"gloss":{"a":"(неопр. артикль)","about":"о, об; из-за","above":"над (above all — прежде всего)","accept":"принять","across":"через","afraid":"испуганный","after":"после","afterwards":"потом, впоследствии","again":"снова","ago":"назад","agreed":"согласились","all":"весь, все (above all)","alone":"одиноко","already":"уже","amazing":"удивительный","an":"(неопр. артикль)","and":"и","angrily":"сердито","another":"ещё один","anxiety":"беспокойство","any":"(not any more — больше не)","anything":"что угодно","appear":"появляться","are":"(есть) — ты/вы","arms":"руки","around":"вокруг","as":"как","asked":"спросила; попросил","at":"в, у, на","attache ить","square":"площадь","standing":"стоял","started":"началось","step":"шаг","steps":"шаги","still":"всё ещё","stone":"камень","stood":"стояла","stop":"остановить","stopped":"перестала","stories":"сказки","story":"история","strangely":"странно","strong":"сильный","table":"стол","taken":"снят","takes":"забирает","talked":"говорили","tall":"высокий","task":"задача","tea":"чай","tell":"скажите","terrible":"страшный","than":"чем","that":"что; тот, та","that's":"это (есть)","the":"(опр. артикль)","their":"их, свои","them":"их","then":"потом, тогда","there":"там","they":"они","thick":"толстый","things":"вещи","this":"это","those":"те","thought":"думала","threw":"бросил","through":"через, по","tied":"собранный","time":"время, раз","to":"к, в; (частица)","together":"вместе","tom":"Том (имя)","tom's":"Тома","too":"тоже; слишком","took":"взяла, сняла; сделала","torches":"факелы","touched":"касались; коснулась","tour":"экскурсия","towards":"к, по направлению к","tracks":"следы","trees":"деревья","trust":"доверять","truth":"правда","turned":"повернула; отвернулась","two":"два","ugly":"уродливый","under":"под","until":"пока не","up":"(woke up — проснулся)","upset":"расстроенный","us":"нас","village":"деревня","visit":"навещают","voice":"голос","waited":"ждали","waiting":"ждал","walked":"ходило; шла","wall":"стена","want":"хотите","wanted":"хотел(о)","warm":"тёплый","was":"был(а)","watched":"следил","water":"вода","way":"способ, так","we":"мы","week":"неделя","weight":"вес, тяжесть","well":"что ж","went":"выходили; пошла","were":"были","what":"что","when":"когда","whispered":"прошептала","white":"белый","who":"кто, который","whole":"целый","why":"зачем, почему","wind":"ветер","window":"окно","windows":"окна","winter":"зима","witch":"ведьма","witch's":"ведьмы","with":"с","woke":"проснулся","wolf":"волк","woman":"женщина","woman's":"женский","wood":"дерево","word":"слово","work":"труд","would":"бы; (буд. в прош.)","wrong":"неправильно","year":"год","years":"лет, годы","yellow":"жёлтый","you":"ты, вы","you're":"ты (есть)","you've":"ты (уже)","your":"твой, ваш","yours":"твоя"},"vocab":{"luck":11,"noise":31,"hugged":51,"shoulders":71,"arms":91,"come":111,"in":111,"trust":131,"still":151,"amazing":171,"exactly":191,"neck":212,"whole":232,"upset":252,"accept":272,"tour":293,"each":313,"weight":333,"above":353,"all":353,"review":373,"sense":401,"opposite":421,"disturb":444,"anxiety":471,"shame":493,"collapses":514,"attached":535,"pure":556,"prolong":577,"fork":598,"forks":598,"task":619,"predator":641}},{"id":12,"title_en":"Batch Fourteen","title_ru":"Партия четырнадцать","genre":"Триллер","summary_ru":"Дегустатор шоколадной фабрики начинает получать с неизвестного номера сообщения от человека, который знает о ней слишком много.","paragraphs":[{"en":"Nora Fields had a rare ability. She could put a piece of chocolate in her mouth and tell you everything about it: where the cocoa came from, how much sugar was inside, even how long it had been in the box. For six years she had worked as a taster at the Bellwood chocolate factory, the biggest building in the small grey town of Bellwood.","ru":"У Норы Филдс была редкая способность. Она могла положить в рот кусочек шоколада и рассказать о нём всё: откуда какао, сколько в нём сахара, даже как долго он пролежал в коробке. Шесть лет она работала дегустатором на шоколадной фабрике «Беллвуд», самом большом здании в маленьком сером городке Беллвуд."},{"en":"The first message came on a Tuesday night in November. Nora was sitting on her sofa with a cup of tea when her phone buzzed. The number was unknown.","ru":"Первое сообщение пришло во вторник вечером в ноябре. Нора сидела на диване с чашкой чая, когда её телефон завибрировал. Номер был неизвестен."},{"en":"“Your plant is thirsty, Nora.”","ru":"«Твоё растение хочет пить, Нора»."},{"en":"She looked at the window. On the windowsill stood a small green plant that her mother had given her. Its leaves were low and yellow. She had forgotten to water it for two weeks. Nora felt cold. She lived on the third floor. Nobody could see her windowsill from the street — or could they? She got up, filled a glass with water and gave the plant a drink. Her hands were not completely steady.","ru":"Она посмотрела на окно. На подоконнике стояло маленькое зелёное растение, которое ей подарила мама. Его листья опустились и пожелтели. Она забыла поливать его две недели. Нору бросило в холод. Она жила на третьем этаже. Никто не мог увидеть её подоконник с улицы — или всё-таки мог? Она встала, налила стакан воды и полила растение. Руки у неё слегка дрожали."},{"en":"“Who is this?” she wrote. There was no answer.","ru":"«Кто это?» — написала она. Ответа не было."},{"en":"The next evening, when she came home from work, another message was waiting. “Nice red cap today.” Nora took off her red cap and threw it on the table. She closed the curtains, then checked the lock on the door twice. For a long time she sat in the dark and listened to the noises outside: cars, a dog, a neighbour's television.","ru":"На следующий вечер, когда она пришла домой с работы, её ждало ещё одно сообщение. «Милая красная кепка сегодня». Нора сняла красную кепку и бросила её на стол. Она задёрнула шторы, потом дважды проверила замок на двери. Долго она сидела в темноте и слушала звуки снаружи: машины, собаку, соседский телевизор."},{"en":"She thought about her ex-boyfriend, Dan. Dan had always bragged about his ability to find anything about anyone on the internet. Probably this was his idea of a joke. She called him.","ru":"Она подумала о своём бывшем парне, Дэне. Дэн всегда хвастался своей способностью найти в интернете что угодно о ком угодно. Вероятно, это была его идея шутки. Она позвонила ему."},{"en":"“Messages? From me?” Dan laughed. “Nora, I haven't thought about you for months. You're going crazy in that little town.” He hung up. Strangely, she believed him.","ru":"«Сообщения? От меня? — засмеялся Дэн. — Нора, я не вспоминал о тебе несколько месяцев. Ты сходишь с ума в этом маленьком городке». Он повесил трубку. Как ни странно, она ему поверила."},{"en":"At midnight the phone buzzed again. This time the message was longer. “Don't be afraid. I am not watching you. I am watching them. Tomorrow they will make batch 14. Taste it carefully.”","ru":"В полночь телефон снова завибрировал. На этот раз сообщение было длиннее. «Не бойся. Я слежу не за тобой. Я слежу за ними. Завтра они будут делать партию 14. Попробуй её внимательно»."},{"en":"Nora did not sleep that night. In the morning she went to the factory as usual. The building was warm and smelled of sugar. She put on her white coat and sat down at her table in the tasting room. At eleven o'clock a worker brought her a tray with small pieces of chocolate from batch 14. All morning she could not stop looking at the other workers. Was one of them sending the messages? Old Sam from the night shift? The quiet girl from the packing line? Everyone looked normal and busy.","ru":"Нора не спала в ту ночь. Утром она, как обычно, пошла на фабрику. В здании было тепло и пахло сахаром. Она надела белый халат и села за свой стол в дегустационной комнате. В одиннадцать часов рабочий принёс ей поднос с маленькими кусочками шоколада из партии 14. Всё утро она не могла перестать смотреть на других рабочих. Может, сообщения посылает кто-то из них? Старый Сэм из ночной смены? Тихая девушка с упаковочной линии? Все выглядели обычными и занятыми."},{"en":"She lifted the first piece with a silver spoon and put it on her tongue. Sweet, rich, smooth — and then, at the very end, something else. A light, bitter taste, like almonds. There were no almonds in this recipe. Something was in the chocolate that should not be there.","ru":"Она подняла первый кусочек серебряной ложкой и положила его на язык. Сладкий, насыщенный, мягкий — а потом, в самом конце, что-то ещё. Лёгкий горький вкус, как у миндаля. В этом рецепте не было миндаля. В шоколаде было что-то, чего там быть не должно."},{"en":"She went straight to the office of the manager, Mr. Gerald Crane. Crane was a big man with a loud voice who constantly bragged about his new contract with the largest supermarket in the country. On his desk stood a photo of his new car.","ru":"Она пошла прямо в кабинет управляющего, мистера Джеральда Крейна. Крейн был крупным мужчиной с громким голосом, который постоянно хвастался своим новым контрактом с крупнейшим супермаркетом в стране. На его столе стояла фотография его новой машины."},{"en":"“Bitter?” He put a piece in his mouth and chewed. “It tastes perfect to me. You're tired, Nora. Take a day off.”","ru":"«Горький?» Он положил кусочек в рот и прожевал. «По-моему, вкус идеальный. Ты устала, Нора. Возьми выходной»."},{"en":"“Mr. Crane, it is necessary to stop the line and test the chocolate in a laboratory.”","ru":"«Мистер Крейн, необходимо остановить линию и проверить шоколад в лаборатории»."},{"en":"His smile vanished. “The line stops when I say it stops,” he said. “Batch 14 goes to the shops on Friday. Close the door on your way out.”","ru":"Его улыбка исчезла. «Линия останавливается, когда я говорю, что она останавливается, — сказал он. — Партия 14 поступает в магазины в пятницу. Закрой дверь, когда будешь выходить»."},{"en":"That night the unknown number wrote again. “He will blame you. Your name is on every tasting report. He blamed me the same way.” Then a picture came: a map of the factory, drawn by hand. There was a red cross on a small room under the old stairs, behind the boiler room. Under the map were the words: “Accessible only through the low door behind the boilers. Tomorrow, 7 p.m., when the shift changes. I will distract them. Take photos of everything.”","ru":"В ту ночь неизвестный номер написал снова. «Он обвинит тебя. Твоё имя стоит на каждом отчёте о дегустации. Меня он обвинил точно так же». Потом пришла картинка: карта фабрики, нарисованная от руки. Красный крестик стоял на маленькой комнате под старой лестницей, за котельной. Под картой были слова: «Доступна только через низкую дверь за котлами. Завтра, в 7 вечера, когда меняется смена. Я их отвлеку. Сфотографируй всё»."},{"en":"Nora read the message ten times. Fear told her to stay at home. But she was curious too, and she was angry. If children ate that chocolate, they could get very sick, and nobody would ever know why. She thought about it for a long time. At last she put the phone in her pocket and wrote one word: “OK.”","ru":"Нора прочитала сообщение десять раз. Страх говорил ей остаться дома. Но ей было и любопытно, и она злилась. Если дети съедят этот шоколад, они могут тяжело заболеть, и никто никогда не узнает почему. Она долго думала об этом. Наконец она положила телефон в карман и написала одно слово: «Хорошо»."},{"en":"At five to seven she was standing in the dark corridor near the boiler room. At exactly seven, the fire alarm started to ring. Workers began to move toward the exits, talking and laughing. Nobody looked at Nora. She found the low door, bent down and went through.","ru":"Без пяти семь она стояла в тёмном коридоре возле котельной. Ровно в семь зазвонила пожарная тревога. Рабочие начали двигаться к выходам, разговаривая и смеясь. Никто не смотрел на Нору. Она нашла низкую дверь, наклонилась и прошла внутрь."},{"en":"The little room smelled of dust and chemicals. Under a dirty lamp stood six plastic boxes. She lifted the lid of the first one. Inside were brown bottles. Someone had cut the labels off, but on one bottle a small piece of the label was still there, with a skull and the word “POISON.” Next to the boxes lay a folder. In it Nora discovered letters from Marlow Sweets, Bellwood's biggest competitor. “When Bellwood's name is destroyed,” one letter said, “we will buy the factory at a low price, and you will have your money, Mr. Crane.”","ru":"В маленькой комнате пахло пылью и химикатами. Под грязной лампой стояли шесть пластиковых ящиков. Она подняла крышку первого. Внутри были коричневые бутылки. Кто-то срезал этикетки, но на одной бутылке ещё остался маленький кусок этикетки с черепом и словом «ЯД». Рядом с ящиками лежала папка. В ней Нора обнаружила письма от «Марлоу Свитс», главного конкурента «Беллвуда». «Когда имя „Беллвуда“ будет уничтожено, — говорилось в одном письме, — мы купим фабрику по низкой цене, и вы получите свои деньги, мистер Крейн»."},{"en":"Her hands were shaking as she took photos. Then she heard steps. The low door opened. Nora had just enough time to hide behind the boxes. Gerald Crane came in, talking on his phone.","ru":"Её руки дрожали, пока она фотографировала. Потом она услышала шаги. Низкая дверь открылась. Нора едва успела спрятаться за ящиками. Вошёл Джеральд Крейн, разговаривая по телефону."},{"en":"“No, the alarm was nothing. Just a distraction, some idiot pressed the button. Don't worry. If anyone gets sick, the taster will take the blame. She signed every report.” He laughed. “Poor Nora.”","ru":"«Нет, тревога — ерунда. Просто кто-то отвлекал внимание, какой-то идиот нажал кнопку. Не волнуйся. Если кто-нибудь заболеет, вину возьмёт на себя дегустатор. Она подписывала каждый отчёт». Он засмеялся. «Бедная Нора»."},{"en":"Nora could not breathe. She pressed her hand over her mouth. Crane picked up the folder, looked around and went out. She heard the key turn in the lock. For a few seconds she could hear only her own heart. She was alone, in a secret room, with six boxes of poison.","ru":"Нора не могла дышать. Она прижала руку ко рту. Крейн взял папку, огляделся и вышел. Она услышала, как в замке повернулся ключ. Несколько секунд она слышала только собственное сердце. Она была одна, в тайной комнате, с шестью ящиками яда."},{"en":"She was locked in. She took out her phone. Battery: four percent. She wrote with shaking fingers: “I'm locked in the room.” The answer came immediately: “Don't move. I'm coming.”","ru":"Её заперли. Она достала телефон. Заряд: четыре процента. Дрожащими пальцами она написала: «Я заперта в комнате». Ответ пришёл сразу: «Не двигайся. Я иду»."},{"en":"Ten minutes passed, then twenty. Tears ran down her face. Then the key turned again. Nora took a heavy bottle in her hand. The door opened, and a woman came in — a thin woman of about fifty in a grey cap.","ru":"Прошло десять минут, потом двадцать. Слёзы текли по её лицу. Потом ключ снова повернулся. Нора взяла в руку тяжёлую бутылку. Дверь открылась, и вошла женщина — худая женщина лет пятидесяти в серой кепке."},{"en":"“Nora? Fortunately, my uncle still has a key to every door in this building. He's the night guard.” The woman smiled sadly. “My name is Ruth Shaw.”","ru":"«Нора? К счастью, у моего дяди до сих пор есть ключ от каждой двери в этом здании. Он ночной сторож». Женщина грустно улыбнулась. «Меня зовут Рут Шоу»."},{"en":"Nora knew the name. Everybody in Bellwood knew it. Two years ago, Ruth Shaw had been the factory's taster. Then some children got sick after they ate Bellwood chocolate, and Crane blamed her. Ruth lost her job, her friends and her good name. One day she simply vanished from town. Some people said that she had moved to the sea. Others said that she had died.","ru":"Нора знала это имя. Все в Беллвуде его знали. Два года назад Рут Шоу была дегустатором фабрики. Потом несколько детей заболели, съев шоколад «Беллвуд», и Крейн обвинил её. Рут потеряла работу, друзей и доброе имя. Однажды она просто исчезла из города. Одни говорили, что она переехала к морю. Другие — что она умерла."},{"en":"“I lost my faith in the police,” Ruth said. “I had no proof — only my tongue, and nobody believes a tongue. So I rented a room across the street from your flat, and I watched Crane, and I watched you. I'm sorry about the plant and the cap. I needed you to believe me.”","ru":"«Я потеряла веру в полицию, — сказала Рут. — У меня не было доказательств — только мой язык, а языку никто не верит. Поэтому я сняла комнату через улицу от твоей квартиры и следила за Крейном, и следила за тобой. Прости за растение и кепку. Мне нужно было, чтобы ты мне поверила»."},{"en":"“You have proof now,” Nora said, and she showed her the photos.","ru":"«Теперь у тебя есть доказательства», — сказала Нора и показала ей фотографии."},{"en":"The police came to the factory that same night. Batch 14 never reached the shops. Gerald Crane was arrested at the airport two days later, with a ticket to Spain in his pocket. Marlow Sweets lost its contract with the supermarket, and the newspapers wrote about the brave taster from Bellwood for weeks.","ru":"Полиция приехала на фабрику той же ночью. Партия 14 так и не попала в магазины. Джеральда Крейна арестовали в аэропорту через два дня с билетом в Испанию в кармане. «Марлоу Свитс» потеряла контракт с супермаркетом, а газеты несколько недель писали о смелой дегустаторше из Беллвуда."},{"en":"A week later, Nora and Ruth sat in Nora's kitchen. The plant on the windowsill was green again. Nora broke a piece of chocolate from a new bar and gave it to Ruth. “Tell me what you taste,” she said. Ruth closed her eyes. “Cocoa from Ghana. Too much sugar. And no lies.” They both laughed. “Thanks, Ruth,” Nora said quietly. “Thanks for everything.”","ru":"Через неделю Нора и Рут сидели на кухне у Норы. Растение на подоконнике снова было зелёным. Нора отломила кусочек от новой плитки шоколада и дала его Рут. «Скажи, какой у него вкус», — сказала она. Рут закрыла глаза. «Какао из Ганы. Слишком много сахара. И никакой лжи». Они обе засмеялись. «Спасибо, Рут, — тихо сказала Нора. — Спасибо за всё»."}],"gloss":{"a":"(неопр. артикль)","ability":"способность","about":"о; около","accessible":"доступный","across":"через","afraid":"бояться (be afraid)","after":"после","again":"снова","ago":"назад","airport":"аэропорт","alarm":"тревога, сигнализация","all":"весь","almonds":"миндаль","alone":"одна","always":"всегда","am":"(есть)","and":"и, а","angry":"злой, сердитый","another":"ещё один","answer":"ответ","anyone":"кто-нибудь, кто угодно","anything":"что угодно","around":"вокруг","arrested":"арестован","as":"как; пока й","reached":"попала, достигла","read":"прочитала","recipe":"рецепт","red":"красный","rented":"сняла","report":"отчёт","rich":"насыщенный","ring":"звонить","room":"комната","ruth":"Рут (имя)","sadly":"грустно","said":"сказал(а)","sam":"Сэм (имя)","same":"тот же","sat":"сидела, села","say":"говорю","sea":"море","seconds":"секунды","secret":"тайный","see":"видеть","sending":"посылает","seven":"семь","shaking":"дрожали","shaw":"Шоу (фамилия)","she":"она","shift":"смена","shops":"магазины","should":"должен","showed":"показала","sick":"больной","signed":"подписывала","silver":"серебряный","simply":"просто","sitting":"сидела","six":"шесть","skull":"череп","sleep":"спала","small":"маленький","smelled":"пахло","smile":"улыбка","smiled":"улыбнулась","smooth":"мягкий, гладкий","so":"поэтому","sofa":"диван","some":"некоторые, какой-то","someone":"кто-то","something":"что-то","sorry":"прости","spain":"Испания","spoon":"ложка","stairs":"лестница","standing":"стояла","started":"начала","stay":"остаться","steady":"твёрдый, спокойный","steps":"шаги","still":"всё ещё","stood":"стояло","stop":"остановить, перестать","stops":"останавливается","straight":"прямо","strangely":"странно","street":"улица","sugar":"сахар","supermarket":"супермаркет","sweet":"сладкий","sweets":"сладости (Свитс)","table":"стол","take":"возьми, взять","talking":"разговаривая","taste":"вкус; пробовать","taster":"дегустатор","tastes":"на вкус","tasting":"дегустационный","tea":"чай","tears":"слёзы","television":"телевизор","tell":"сказать, рассказать","ten":"десять","test":"проверить","thanks":"спасибо","that":"тот, который, что","the":"(опр. артикль)","them":"их, за ними","then":"потом","there":"там","they":"они","thin":"худой","third":"третий","thirsty":"хочет пить","this":"этот, это","thought":"думала","threw":"бросила","through":"через, внутрь","ticket":"билет","time":"время, раз","times":"раз","tired":"уставший","to":"к, в, (инфинитив)","today":"сегодня","told":"говорил","tomorrow":"завтра","tongue":"язык","too":"тоже; слишком","took":"сняла, взяла","toward":"к, по направлению","town":"город","tray":"поднос","tuesday":"вторник","turn":"повернуться","turned":"повернулся","twenty":"двадцать","twice":"дважды","two":"два","uncle":"дядя","under":"под","unknown":"неизвестный","up":"(вверх; hung up, got up)","usual":"обычно (as usual)","vanished":"исчезла","very":"самый; очень","voice":"голос","waiting":"ждало","warm":"тёплый","was":"был(а)","watched":"следила","watching":"слежу","water":"вода; поливать","way":"путь, способ","we":"мы","week":"неделя","weeks":"недели","went":"пошла","were":"были","what":"что","when":"когда","where":"где, откуда","white":"белый","who":"кто, который","why":"почему","will":"(буд. время)","window":"окно","windowsill":"подоконник","with":"с","woman":"женщина","word":"слово","words":"слова","work":"работа","worked":"работала","worker":"рабочий","workers":"рабочие","worry":"волноваться","would":"(бы, буд. в прош.)","wrote":"написала","years":"годы, лет","yellow":"жёлтый","you":"ты, вы","you're":"ты (есть)","your":"твой"},"vocab":{"thanks":12,"outside":32,"taste":52,"cap":72,"cut":92,"factory":112,"accessible":132,"move":152,"crazy":172,"tears":192,"piece":213,"necessary":233,"ability":253,"fear":273,"low":294,"map":314,"fortunately":334,"breathe":354,"discovered":374,"lifted":402,"probably":422,"blame":445,"blamed":445,"distraction":472,"curious":494,"vanished":515,"faith":536,"plant":557,"constantly":578,"spoon":599,"distract":620,"bragged":642}},{"id":13,"title_en":"The Shepherd's Plate","title_ru":"Тарелка пастуха","genre":"Ограбление","summary_ru":"Четверо воров готовят ночное ограбление городского музея, но у их предводительницы есть цель поважнее, чем золотая тарелка.","paragraphs":[{"en":"The cafe was on the second floor of a shopping mall, and from its window you could see the grey roof of the City Museum. Marta always chose places like this: busy, noisy and full of people who never looked at anyone. She sat with her back to the wall, drank her black coffee and waited for her team.","ru":"Кафе находилось на втором этаже торгового центра, и из его окна была видна серая крыша Городского музея. Марта всегда выбирала такие места: людные, шумные и полные людей, которые ни на кого не смотрят. Она сидела спиной к стене, пила чёрный кофе и ждала свою команду."},{"en":"Oskar arrived first, with two laptops and a bag of sweets. Then came Viktor, an old man in an expensive coat, who looked at the cafe's sandwiches with disgust. The last was Bella, nineteen years old, the youngest of them. She sat down, smiled and put a wallet on the table.","ru":"Первым пришёл Оскар с двумя ноутбуками и пакетом конфет. Потом появился Виктор, пожилой мужчина в дорогом пальто, который посмотрел на бутерброды в кафе с отвращением. Последней пришла Белла, девятнадцати лет, самая младшая из них. Она села, улыбнулась и положила на стол кошелёк."},{"en":"“Whose is that?” asked Marta.\n“The man at the next table,” said Bella. “Sorry. It's a habit.”\n“Give it back. Now,” said Marta. “And try to change that behaviour before Friday. A thief who steals for fun is a thief who gets caught.”","ru":"«Чей это?» — спросила Марта.\n«Того мужчины за соседним столиком, — сказала Белла. — Простите. Привычка».\n«Верни его. Сейчас же, — сказала Марта. — И постарайся изменить это поведение до пятницы. Вор, который ворует ради забавы, — это вор, которого поймают»."},{"en":"Bella sighed, stood up and walked past the man's table. When she came back, the wallet was in his pocket again, and he had noticed nothing.","ru":"Белла вздохнула, встала и прошла мимо столика того мужчины. Когда она вернулась, кошелёк снова был у него в кармане, а он ничего не заметил."},{"en":"Marta opened a folder. Inside there was a photo of a small golden plate. In the middle of it, an artist had painted a young shepherd with three white sheep on a green hill.\n“The Shepherd's Plate,” she said. “Four hundred years old. It stands alone in the Great Hall, in a glass case, and it is the most famous thing in the museum. Especially since the director, Mr Grant, became famous himself. He is on television, in magazines, everywhere.”","ru":"Марта открыла папку. Внутри лежала фотография маленькой золотой тарелки. В её центре художник нарисовал юного пастуха с тремя белыми овцами на зелёном холме.\n«Тарелка пастуха, — сказала она. — Ей четыреста лет. Она стоит одна в Большом зале, в стеклянной витрине, и это самая знаменитая вещь в музее. Особенно с тех пор, как директор, мистер Грант, сам стал знаменитым. Он на телевидении, в журналах, повсюду»."},{"en":"“How much money is it?” asked Oskar.\n“More than all of us will earn in our lives,” Viktor answered. He touched his stomach and made a face. “Excuse me. My stomach always hurts before a job. Forty years, and it is still the same.”","ru":"«И сколько она стоит?» — спросил Оскар.\n«Больше, чем все мы заработаем за всю жизнь», — ответил Виктор. Он потрогал живот и поморщился. «Прошу прощения. У меня всегда болит желудок перед делом. Сорок лет — и всё так же»."},{"en":"Over the next week Marta taught them everything. She taught Oskar the security system and showed him every camera. She taught Bella how the night guards worked: when they were tired, when they drank coffee, when they looked at their phones. “Watch people's behaviour,” she said. “For example, the old guard on the second floor always stops at the window at two o'clock. He likes to look at the moon. That gives us four minutes.”","ru":"Всю следующую неделю Марта учила их всему. Она научила Оскара системе охраны и показала ему каждую камеру. Она научила Беллу тому, как работают ночные охранники: когда они устают, когда пьют кофе, когда смотрят в телефоны. «Следи за поведением людей, — говорила она. — Например, старый охранник на втором этаже всегда останавливается у окна в два часа. Он любит смотреть на луну. Это даёт нам четыре минуты»."},{"en":"Bella thought it was the most exciting week of her life. Oskar thought it was the most boring one. Viktor said nothing and drank a lot of tea for his stomach.","ru":"Белла считала, что это самая захватывающая неделя в её жизни. Оскар считал, что самая скучная. Виктор ничего не говорил и пил много чая для желудка."},{"en":"On Thursday evening Bella could not sleep. She walked around her small flat and thought about everything that could go wrong. What if the guard did not stop at the window? What if Viktor's fingers were too slow? At midnight she sent a message to Marta: “Are you sure about this?” The answer came after one minute: “I have been sure for fifteen years. Go to sleep.”","ru":"В четверг вечером Белла не могла уснуть. Она ходила по своей маленькой квартире и думала обо всём, что может пойти не так. Что, если охранник не остановится у окна? Что, если пальцы Виктора окажутся слишком медленными? В полночь она отправила Марте сообщение: «Вы в этом уверены?» Ответ пришёл через минуту: «Я уверена уже пятнадцать лет. Ложись спать»."},{"en":"On Friday night, at five minutes to two, they were inside. Oskar sat in a van nearby, in front of six screens, and spoke to them through tiny earphones. “Camera three is sleeping,” he said. “Camera four is sleeping. You have a clear way to the Great Hall.”","ru":"В пятницу ночью, без пяти два, они были внутри. Оскар сидел в фургоне поблизости перед шестью экранами и говорил с ними через крошечные наушники. «Камера три спит, — сказал он. — Камера четыре спит. Путь к Большому залу свободен»."},{"en":"The hall was dark and very quiet. Moonlight came through the high windows and fell on the glass case in the middle of the room. Viktor knelt down and began to work on the lock with his thin old fingers. Bella stood next to him. She was so anxious that she could hear her own heart.","ru":"В зале было темно и очень тихо. Лунный свет падал через высокие окна на стеклянную витрину посреди комнаты. Виктор опустился на колени и принялся за замок своими тонкими старыми пальцами. Белла стояла рядом с ним. Она так волновалась, что слышала стук собственного сердца."},{"en":"The lock opened with a soft click. Marta lifted the glass and took the plate out. She held it in her hands for a long moment, and Bella saw something strange on her face. It was not happiness. It was pain.","ru":"Замок открылся с тихим щелчком. Марта подняла стекло и вынула тарелку. Она долго держала её в руках, и Белла увидела на её лице что-то странное. Это была не радость. Это была боль."},{"en":"“Marta?” Bella whispered.\n“I'm fine,” said Marta. She turned the plate over and looked at the back. Then she gave it to Viktor. “Tell her,” she said.","ru":"«Марта?» — прошептала Белла.\n«Я в порядке», — сказала Марта. Она перевернула тарелку и посмотрела на обратную сторону. Потом передала её Виктору. «Скажи ей», — сказала она."},{"en":"Viktor looked at the plate for only five seconds. “It's a fake,” he said. “A good one. But the gold is too bright, and look here: this sheep has its shadow on the wrong side. A real artist four hundred years ago would never make that mistake. It's a small flaw, and only an expert can see it.”","ru":"Виктор смотрел на тарелку всего пять секунд. «Это подделка, — сказал он. — Хорошая. Но золото слишком яркое, и посмотри сюда: у этой овцы тень не с той стороны. Настоящий художник четыреста лет назад никогда бы не сделал такой ошибки. Это маленький недостаток, и увидеть его может только эксперт»."},{"en":"“A fake?” said Oskar in their ears. “So we did all this for nothing?”\n“No,” said Marta. “We did all this because I knew it was a fake. I just needed to be sure.”","ru":"«Подделка? — раздался в их ушах голос Оскара. — Значит, мы всё это делали зря?»\n«Нет, — сказала Марта. — Мы всё это делали, потому что я знала, что это подделка. Мне просто нужно было убедиться»."},{"en":"Then, in the dark hall, she told them the true narrative. Fifteen years ago, a painting disappeared from this museum. The police never found the thief, but someone had to be responsible, so the museum blamed the night guard. He lost his job, his friends and his good name. Two years later he died, a tired, sad man who never stopped saying, “It wasn't me.”\n“He was my father,” Marta said.","ru":"И тогда, в тёмном зале, она рассказала им подлинную историю. Пятнадцать лет назад из этого музея пропала картина. Полиция так и не нашла вора, но кто-то должен был ответить, и музей обвинил ночного охранника. Он потерял работу, друзей и доброе имя. Через два года он умер — усталый, печальный человек, который до конца повторял: «Это был не я».\n«Он был моим отцом», — сказала Марта."},{"en":"“At that time Mr Grant was a young assistant,” she went on. “After the theft he received a big promotion. Later he became director. And last year I received a letter from a friend in Switzerland. A rich collector there has a golden plate with a shepherd and three sheep on it. He bought it from Mr Grant.”","ru":"«Мистер Грант тогда был молодым ассистентом, — продолжила она. — После кражи он получил большое повышение. Позже он стал директором. А в прошлом году я получила письмо от друга из Швейцарии. У одного богатого коллекционера там есть золотая тарелка с пастухом и тремя овцами. Он купил её у мистера Гранта»."},{"en":"Nobody spoke. Bella wanted to cry, and she did not even know why.\n“So this is revenge,” Viktor said quietly. It was not a question.\n“It is justice,” Marta answered. “But yes. Maybe it is revenge too.”","ru":"Никто не произнёс ни слова. Белле хотелось плакать, и она сама не знала почему.\n«Значит, это месть», — тихо сказал Виктор. Это был не вопрос.\n«Это справедливость, — ответила Марта. — Но да. Может быть, и месть тоже»."},{"en":"“I'm sorry, it's a very sad story,” said Oskar, “but unfortunately we have a problem. The guard on the second floor has finished looking at the moon. You have two minutes.”","ru":"«Простите, это очень грустная история, — сказал Оскар, — но, к сожалению, у нас проблема. Охранник на втором этаже закончил смотреть на луну. У вас две минуты»."},{"en":"Marta took a thick envelope out of her pocket and put it in the empty case, next to the fake plate. Inside were copies of letters, bank papers and photos of the plate in Switzerland. Then she said, “Oskar. Now.”","ru":"Марта достала из кармана толстый конверт и положила его в пустую витрину рядом с поддельной тарелкой. Внутри были копии писем, банковские документы и фотографии тарелки в Швейцарии. Потом она сказала: «Оскар. Давай»."},{"en":"In the van, Oskar pressed a key. At once every screen in the museum, in the Great Hall, in the shop, in the cafe, and even the big screen outside on the street, showed the same photo: Mr Grant, smiling and shaking hands with the collector, with the golden plate between them.","ru":"В фургоне Оскар нажал клавишу. Сразу же каждый экран в музее — в Большом зале, в магазине, в кафе и даже большой экран снаружи, на улице, — показал одну и ту же фотографию: мистер Грант, улыбаясь, пожимает руку коллекционеру, а между ними золотая тарелка."},{"en":"Then the alarm began to scream. “Go, go, go!” said Oskar. They ran through the back door, across the dark yard and into the van, and Oskar drove away slowly, like a man who had nothing to hide.","ru":"Тут завыла сигнализация. «Бегом, бегом, бегом!» — сказал Оскар. Они выбежали через заднюю дверь, пересекли тёмный двор и запрыгнули в фургон, и Оскар медленно уехал, как человек, которому нечего скрывать."},{"en":"The next morning the news was everywhere. The police had found the fake plate and the envelope. Journalists stood in front of Mr Grant's house. People on the street were taking pictures of the big screen, which nobody could switch off. By lunchtime Mr Grant had lost his job, and the police wanted to ask him a lot of questions. In one night, all his power was gone.","ru":"На следующее утро новости были повсюду. Полиция нашла поддельную тарелку и конверт. Журналисты стояли перед домом мистера Гранта. Люди на улице фотографировали большой экран, который никто не мог выключить. К обеду мистер Грант потерял работу, а у полиции появилось к нему много вопросов. За одну ночь вся его власть исчезла."},{"en":"The four of them met again in the cafe at the mall. Viktor ate a sandwich, and this time he did not look at it with disgust. “My stomach feels better,” he said, surprised. “Forty years, and this is the first time it feels better after a job.”","ru":"Вчетвером они снова встретились в кафе в торговом центре. Виктор съел бутерброд и на этот раз не смотрел на него с отвращением. «Желудку лучше, — удивлённо сказал он. — Сорок лет — и впервые ему лучше после дела»."},{"en":"“But we didn't steal anything,” Bella said. “No gold. No money. Nothing.”\n“We stole his story,” said Marta. “For fifteen years everybody believed his narrative. Now they will believe my father's.” She smiled. For the first time since they had met, she let her face express what she really felt. “Sometimes the worth of a thing is not in gold.”","ru":"«Но мы же ничего не украли, — сказала Белла. — Ни золота. Ни денег. Ничего».\n«Мы украли его историю, — сказала Марта. — Пятнадцать лет все верили его рассказу. Теперь будут верить рассказу моего отца». Она улыбнулась. Впервые с тех пор, как они познакомились, она позволила своему лицу выразить то, что действительно чувствовала. «Иногда ценность вещи не в золоте»."},{"en":"Oskar raised his cup. “To Marta's father.”\n“To Marta's father,” said the others.","ru":"Оскар поднял чашку. «За отца Марты».\n«За отца Марты», — повторили остальные."},{"en":"When they stood up to leave, Marta stopped. She checked her coat, then looked at Bella.\n“My keys,” she said. “Bella. Really?”","ru":"Когда они встали, чтобы уйти, Марта остановилась. Она проверила пальто, потом посмотрела на Беллу.\n«Мои ключи, — сказала она. — Белла. Серьёзно?»"},{"en":"Bella put the keys on a plate on the table and gave her an innocent smile. “Sorry,” she said. “Old habits. You taught me a lot of useful stuff this week. You just didn't teach me how to stop.”\n“Out,” said Marta. But she was laughing.","ru":"Белла положила ключи на тарелку на столе и невинно улыбнулась. «Простите, — сказала она. — Старые привычки. Вы научили меня многим полезным вещам на этой неделе. Просто не научили, как остановиться».\n«Вон», — сказала Марта. Но она смеялась."}],"gloss":{"a":"(артикль), один","about":"о, около","across":"через, поперёк","after":"после, через","again":"снова","ago":"назад","alarm":"сигнализация","all":"весь, все","alone":"один, одна","always":"всегда","an":"(артикль)","and":"и, а","answer":"ответ","answered":"ответил(а)","anxious":"тревожный, взволнованный","anyone":"кто-либо","anything":"ничего (в отриц.)","are":"есть, являются","around":"около, вокруг","arrived":"пришёл","artist":"художник","ask":"попросить, спросить","asked":"спросил(а), попросила","assistant":"ассистент","at":"в, у, на","ate":"съел","away":"прочь","back":"обратно, спина, обратная сторона","bag":"пакет, сумка","bank":"банковский","be":"быть","became":"стал(а)","because":"потому что","been":"была (pp от be)","before":"до, перед","began":"начал(а)","behaviour":"поведение","believe":"верить","believed":"верили","bella":"Белла (имя)","better":"лучше","between":"между","big":"большой","black":"чёрный","blamed":"обвинил","boring":"скучный","bought":"купил","bright":"яркий","busy":"людный, оживлённый","but":"но","by":"к (времени)","cafe":"кафе","cafe's":"в кафе (кафе)","came":"пришёл, пришла","camera":"камера","can":"мочь","case":"витрина","caught":"пойманный","change":"изменить","checked":"проверила","chose":"выбирала","city":"город","clear":"свободный, чистый","click":"щелчок","coat":"пальто","coffee":"кофе","collector":"коллекционер","copies":"копии","could":"мог(ла)","cry":"плакать","cup":"чашка","dark":"тёмный, темнота","did":"(вспом. гл.), сделал","didn't":"не (прош.)","died":"умерла","director":"директор","disappeared":"пропала","disgust":"отвращение","door":"дверь","down":"вниз","drank":"пил(а)","drove":"уехал (на машине)","earn":"заработать","earphones":"наушники","ears":"уши","empty":"пустой","envelope": ly":"тихо","raised":"поднял","ran":"выбежали","real":"настоящий","really":"действительно","received":"получил(а)","responsible":"ответственный","revenge":"месть","rich":"богатый","roof":"крыша","room":"комната","sad":"печальный","said":"сказал(а)","same":"тот же","sandwich":"бутерброд","sandwiches":"бутерброды","sat":"сидел, села","saw":"увидела","saying":"говорить","scream":"выть, кричать","screen":"экран","screens":"экраны","second":"второй","seconds":"секунды","security":"охрана","see":"видеть","sent":"отправила","shadow":"тень","shaking":"дрожа","she":"она","sheep":"овца, овцы","shepherd":"пастух","shepherd's":"пастуха","shop":"магазин","shopping":"торговый (shopping mall)","showed":"показал(а)","side":"сторона","sighed":"вздохнула","since":"с тех пор как","six":"шесть","sleep":"спать","sleeping":"спит","slow":"медленный","slowly":"медленно","small":"маленький","smile":"улыбка","smiled":"улыбнулся","smiling":"улыбаясь","so":"так, поэтому","soft":"тихий, мягкий","someone":"кто-то","something":"что-то","sometimes":"иногда","sorry":"простите","spoke":"говорил, произнёс","stands":"стоит","steal":"украсть","steals":"ворует","still":"всё ещё","stole":"украли","stomach":"желудок, живот","stood":"стоял(а), встали","stop":"остановиться","stopped":"остановилась","stops":"останавливается","story":"история","strange":"странный","street":"улица","stuff":"вещи","sure":"уверенный","surprised":"удивлённый","sweets":"конфеты","switch":"выключить (switch off)","switzerland":"Швейцария","system":"система","table":"стол","taking":"делая (снимки)","taught":"учила, научила","tea":"чай","teach":"научить","team":"команда","television":"телевидение","tell":"сказать","than":"чем","that":"что, тот, это","the":"(артикль)","theft":"кража","their":"их","them":"их, им","then":"потом, тогда","there":"там","they":"они","thick":"толстый","thief":"вор","thin":"тонкий","thing":"вещь","this":"этот, это","thought":"подумала","three":"три","through":"через, сквозь","thursday":"четверг","time":"раз, время","tiny":"крошечный","tired":"усталый","to":"к, в, (частица)","told":"рассказала","too":"слишком","took":"взяла","touched":"потрогал","true":"правда","try":"попробовать","turned":"перевернула","two":"два","unfortunately":"к сожалению","up":"вверх, наверху","us":"нам, нас","useful":"полезный","van":"фургон","very":"очень","viktor":"Виктор (имя)","viktor's":"Виктора","waited":"ждала","walked":"прошла, ходила","wall":"стена","wallet":"кошелёк","wanted":"хотела","was":"был(а)","wasn't":"не был","watch":"следить","way":"путь, как","we":"мы","week":"неделя","went":"продолжила (went on)","were":"были","what":"что","when":"когда","which":"который","whispered":"прошептала","white":"белый","who":"кто","whose":"чей","why":"почему","will":"(буд. время)","window":"окно","windows":"окна","with":"с","work":"работать","worked":"работали","worth":"ценность","would":"бы","wrong":"не тот, неправильный","yard":"двор","year":"год","years":"лет, годы","yes":"да","you":"ты, вы","young":"молодой","youngest":"самая младшая"},"vocab":{"better":13,"inside":33,"tired":53,"taught":73,"teach":73,"stomach":93,"cry":113,"exciting":133,"sheep":153,"pain":173,"stands":193,"stood":193,"received":214,"screens":234,"screen":234,"express":254,"hall":274,"mall":295,"nearby":315,"unfortunately":335,"pocket":355,"plate":375,"especially":403,"example":423,"behaviour":446,"habit":473,"habits":473,"anxious":495,"worth":516,"power":537,"narrative":558,"flaw":579,"revenge":600,"stuff":622,"disgust":643}},{"id":14,"title_en":"The Voices in the Reading Room","title_ru":"Голоса в читальном зале","genre":"Мистика","summary_ru":"Нина устраивается ночным сторожем в старую библиотеку маленького городка — и на восьмую ночь слышит в пустом читальном зале детский шёпот.","paragraphs":[{"en":"Nina arrived in the town of Larkwell on a cold evening in November. The journey had taken two days: three trains, a bus, and a long walk from the station in the rain. She was tired, wet and hungry, but she did not care. After a difficult year in the city — a lost job, a broken engagement, too many evenings alone — she wanted something quiet. And a night job at a small town library sounded like the quietest thing in the world.","ru":"Нина приехала в городок Ларкуэлл холодным ноябрьским вечером. Путешествие заняло два дня: три поезда, автобус и долгая прогулка под дождём от станции. Она устала, промокла и проголодалась, но ей было всё равно. После тяжёлого года в городе — потерянная работа, разорванная помолвка, слишком много вечеров в одиночестве — ей хотелось тишины. А ночная работа в маленькой городской библиотеке казалась самым тихим занятием на свете."},{"en":"The library was an old red building in the middle of the main square. Across the street there was a pharmacy with a green light over the door, and that was the only light on the square after nine o'clock.","ru":"Библиотека была старым красным зданием посреди главной площади. Через дорогу была аптека с зелёным фонарём над дверью, и после девяти часов это был единственный свет на площади."},{"en":"The man who gave her the keys was the pharmacist, Mr. Hale. He was very old and very thin, with long white hands and kind, nervous eyes. He also looked after the library building, he explained, because nobody else wanted to.","ru":"Ключи ей дал аптекарь, мистер Хейл. Он был очень старым и очень худым, с длинными белыми руками и добрыми, беспокойными глазами. Он объяснил, что ещё и присматривает за зданием библиотеки, потому что больше никто не хочет."},{"en":"“The work is easy,” he said. “You sort the returned books, you check the windows, you keep the place warm. Nobody comes at night. You will probably die of boredom.” He smiled, but the smile was gone quickly. “One more thing. If you hear anything strange in the reading room, don't go in. Just stay in the office and wait for the morning.” “What kind of strange?” Nina asked. But Mr. Hale had already turned to leave.","ru":"«Работа лёгкая, — сказал он. — Разбираете возвращённые книги, проверяете окна, следите, чтобы было тепло. Ночью никто не приходит. Вы, наверное, умрёте от скуки». Он улыбнулся, но улыбка быстро исчезла. «И ещё одно. Если услышите что-нибудь странное в читальном зале, не заходите туда. Просто оставайтесь в кабинете и ждите утра». «Странное — это какое?» — спросила Нина. Но мистер Хейл уже повернулся, чтобы уйти."},{"en":"For the first week, nothing happened. Hale was right about the boredom. Nina sorted books, drank too much tea and washed the dishes in the tiny kitchen behind the office again and again, just to have something to do. Sometimes she watched the snow falling on the square and the green light of the pharmacy.","ru":"Первую неделю ничего не происходило. Хейл был прав насчёт скуки. Нина разбирала книги, пила слишком много чая и снова и снова мыла посуду в крошечной кухне за кабинетом, лишь бы чем-то заняться. Иногда она смотрела, как снег падает на площадь, и на зелёный огонёк аптеки."},{"en":"On the eighth night, she heard the first whisper.","ru":"На восьмую ночь она услышала первый шёпот."},{"en":"It came from the reading room — a large hall with high windows and long wooden tables. It was so quiet that at first she thought it was the wind. Then she understood that it was a voice. A child's voice. A kid was whispering something, very fast, as if he was trying to remember it.","ru":"Он доносился из читального зала — большой комнаты с высокими окнами и длинными деревянными столами. Он был таким тихим, что сначала она подумала, что это ветер. Потом она поняла, что это голос. Детский голос. Ребёнок что-то шептал, очень быстро, как будто пытался это запомнить."},{"en":"Nina stood very still. Her mind looked for an external explanation: a radio, a neighbour, the pipes. But the building stood alone, and the radio in the office was off. She told herself to stay in the office, as Mr. Hale had said. She pretended to read a book. She read the same page five times.","ru":"Нина замерла. Её разум искал внешнее объяснение: радио, сосед, трубы. Но здание стояло отдельно, а радио в кабинете было выключено. Она велела себе оставаться в кабинете, как сказал мистер Хейл. Она притворилась, что читает книгу. Она прочитала одну и ту же страницу пять раз."},{"en":"Then a second voice spoke, and it was not a whisper. It was a man's voice, deep and loud, full of cold frustration. “Louder, boy! The audience can't hear you. Do you think they came here to listen to a mouse?”","ru":"Затем заговорил второй голос, и это был не шёпот. Это был мужской голос, низкий и громкий, полный холодного разочарования. «Громче, мальчик! Зрители тебя не слышат. Ты думаешь, они пришли сюда слушать мышь?»"},{"en":"Something hit a table — once, twice — like a heavy stick. The child's voice broke. Then there was laughter: many children laughing together. And then silence.","ru":"Что-то ударило по столу — раз, другой — как тяжёлая палка. Детский голос сорвался. Потом раздался смех: много детей смеялись вместе. А потом — тишина."},{"en":"Nina did not sleep at all that day. In the afternoon she went to the town archive and looked through old papers. She found the answer quickly. Before it became a library, the building had been a school. Its director, a man called Edmund Crane, was famous in the town. Every year he organised a poetry evening, and the children had to read poems on stage in front of their parents. The reading room had been the school hall. The stage was still there, under the bookshelves.","ru":"Нина в тот день совсем не спала. После обеда она пошла в городской архив и просмотрела старые бумаги. Ответ она нашла быстро. До того как стать библиотекой, здание было школой. Её директор, человек по имени Эдмунд Крейн, был известен в городе. Каждый год он устраивал вечер поэзии, и дети должны были читать стихи на сцене перед родителями. Читальный зал раньше был школьным залом. Сцена всё ещё была там, под книжными полками."},{"en":"An old newspaper article from 1958 described one of those evenings. A boy had forgotten the words of his poem. Mr. Crane, the article said with pride, “did not allow the boy to leave the stage until he finished, because a strong school does not accept weakness.” The boy's name was not written. Crane himself had been dead for more than forty years.","ru":"Старая газетная статья 1958 года описывала один из таких вечеров. Мальчик забыл слова своего стихотворения. Мистер Крейн, с гордостью сообщала статья, «не позволил мальчику уйти со сцены, пока тот не закончил, потому что сильная школа не принимает слабости». Имя мальчика не было указано. Сам Крейн был мёртв уже больше сорока лет."},{"en":"That night the voices came again, and the next night, and the next. Always the same scene. The whisper. The angry man. The stick hitting the table. The laughter. Nina felt overwhelmed. She could not eat; she jumped at every sound. Perhaps she should leave, she thought. Perhaps the city had not been so bad after all.","ru":"В ту ночь голоса пришли снова, и на следующую ночь, и на следующую. Всегда одна и та же сцена. Шёпот. Злой мужчина. Палка, бьющая по столу. Смех. Нина была совершенно измотана. Она не могла есть; она вздрагивала от каждого звука. Может быть, ей стоит уехать, думала она. Может быть, город был не так уж и плох."},{"en":"But on the fourth night something new happened. The lights in the whole building went out. Nina sat in total darkness, her heart beating loudly. With shaking hands she found the lighter in her bag — she did not smoke, but she always carried one on a trip — and lit it. The small flame showed the door of the reading room. It was open. She was sure she had shut it.","ru":"Но на четвёртую ночь случилось кое-что новое. Во всём здании погас свет. Нина сидела в полной темноте, и её сердце громко стучало. Дрожащими руками она нашла в сумке зажигалку — она не курила, но всегда брала её с собой в поездку — и зажгла её. Маленькое пламя осветило дверь читального зала. Она была открыта. Нина была уверена, что закрыла её."},{"en":"Despite her fear, she went in.","ru":"Несмотря на страх, она вошла."},{"en":"The room was empty and cold. She looked around. On the old stage, between two bookshelves, something white lay on the floor. She picked it up. It was a page from a school notebook, yellow with age. A poem was written on it in a child's careful hand. It was called “The Journey Home”. At the bottom, in red ink, someone had written: Weak. Must improve. — E. Crane.","ru":"Зал был пустым и холодным. Она огляделась вокруг. На старой сцене, между двумя книжными полками, на полу лежало что-то белое. Она подняла это. Это была страница из школьной тетради, пожелтевшая от времени. На ней аккуратным детским почерком было написано стихотворение. Оно называлось «Путешествие домой». Внизу красными чернилами кто-то написал: Слабо. Нужно улучшить. — Э. Крейн."},{"en":"In the corner of the page there was a name, small, almost hidden: Thomas Hale.","ru":"В углу страницы было имя, маленькое, почти незаметное: Томас Хейл."},{"en":"The next morning Nina crossed the square and walked into the pharmacy. Mr. Hale was behind the counter. When he saw the yellow page in her hand, his face became grey.","ru":"На следующее утро Нина пересекла площадь и вошла в аптеку. Мистер Хейл стоял за прилавком. Когда он увидел жёлтую страницу у неё в руке, его лицо стало серым."},{"en":"“You were the boy,” she said softly.","ru":"«Тем мальчиком были вы», — тихо сказала она."},{"en":"For a long time he didn't answer. Then he sat down on a small chair behind the counter, like a man who was very tired. “Edmund Crane was my father,” he said. “He wanted me to be strong. He thought the best way to make a child strong was to humiliate him in front of everybody. I stood on that stage for forty minutes that night. I could not remember the last verse. I didn't cry. I didn't fight. I just stood there while they laughed.” He looked at his thin hands. “After that I never read anything aloud again. Not even to my own kids.”","ru":"Он долго не отвечал. Потом сел на маленький стул за прилавком, как очень уставший человек. «Эдмунд Крейн был моим отцом, — сказал он. — Он хотел, чтобы я был сильным. Он считал, что лучший способ сделать ребёнка сильным — унизить его перед всеми. Той ночью я простоял на сцене сорок минут. Я не мог вспомнить последнюю строфу. Я не плакал. Я не сопротивлялся. Я просто стоял, пока они смеялись». Он посмотрел на свои худые руки. «После этого я больше никогда ничего не читал вслух. Даже собственным детям»."},{"en":"“And the voices?” Nina asked. “I have heard them every night since my father died,” he said. “That's why I can't stay in that building. I think he is still waiting. Perhaps I am, too.”","ru":"«А голоса?» — спросила Нина. «Я слышу их каждую ночь с тех пор, как умер отец, — сказал он. — Поэтому я не могу оставаться в том здании. Думаю, он всё ещё ждёт. Может быть, и я тоже»."},{"en":"Nina put the page on the counter. “Then let's finish it,” she said.","ru":"Нина положила страницу на прилавок. «Тогда давайте закончим это», — сказала она."},{"en":"That night, they went into the reading room together. Mr. Hale held the lighter; Nina held the page. At midnight the whisper began, the small, fast, frightened voice of a boy. Then the loud voice of the dead man: “Louder! The audience can't hear you!”","ru":"Той ночью они вместе вошли в читальный зал. Мистер Хейл держал зажигалку, Нина — страницу. В полночь начался шёпот, тихий, быстрый, испуганный голос мальчика. Затем громкий голос мёртвого: «Громче! Зрители тебя не слышат!»"},{"en":"Mr. Hale's hands were shaking. Nina could see the struggle in his face — seventy years of fear against one small piece of paper. Then he stepped onto the old stage. He did not look at the page. He did not need it. He knew everything by heart; he had known it all his life.","ru":"Руки мистера Хейла дрожали. Нина видела борьбу на его лице — семьдесят лет страха против одного маленького листка бумаги. Затем он шагнул на старую сцену. Он не смотрел на страницу. Она была ему не нужна. Он знал всё наизусть; он знал это всю жизнь."},{"en":"He read the poem from the beginning to the end, slowly and clearly, in a voice that filled the whole room. When he came to the last verse — the verse he could not remember at nine years old — his voice became stronger, not weaker.","ru":"Он прочитал стихотворение от начала до конца, медленно и чётко, голосом, который заполнил весь зал. Когда он дошёл до последней строфы — той, которую не смог вспомнить в девять лет, — его голос стал сильнее, а не слабее."},{"en":"Then silence. No laughter. No stick. Only the snow against the high windows.","ru":"Потом — тишина. Ни смеха. Ни палки. Только снег за высокими окнами."},{"en":"And then, very quietly, from the dark at the back of the hall, a man's voice said something that Nina could hardly hear. Not “louder”. Not “improve”. Just two words: “Well done.”","ru":"А потом очень тихо, из темноты в глубине зала, мужской голос сказал что-то, что Нина едва расслышала. Не «громче». Не «улучшить». Всего два слова: «Молодец, хорошо»."},{"en":"Mr. Hale stood on the stage with tears on his old face. He did not answer — not yet. He stood there a little longer, as if he was listening to applause that only he could hear.","ru":"Мистер Хейл стоял на сцене со слезами на старом лице. Он не ответил — пока ещё нет. Он постоял там ещё немного, как будто слушал аплодисменты, которые слышал только он."},{"en":"The voices never came back. Nina stayed in Larkwell. In spring, the library began a new evening event: every Friday, anyone could come and read a poem aloud. Nobody laughed, and nobody was judged. The first reader was a thin old pharmacist, and the first poem he read was called “The Journey Home”.","ru":"Голоса больше не вернулись. Нина осталась в Ларкуэлле. Весной библиотека начала новые вечерние встречи: каждую пятницу любой мог прийти и прочитать стихотворение вслух. Никто не смеялся, и никого не судили. Первым чтецом был худой старый аптекарь, и первое стихотворение, которое он прочитал, называлось «Путешествие домой»."}],"gloss":{"a":"(неопр. артикль)","about":"о, про","accept":"принимать","across":"через","after":"после","afternoon":"после обеда","again":"снова","against":"против, о (стекло)","age":"возраст, время","all":"все, весь","allow":"позволить","almost":"почти","alone":"один, отдельно","aloud":"вслух","already":"уже","also":"также","always":"всегда","am":"(есть) являюсь","an":"(неопр. артикль)","and":"и","angry":"злой","answer":"ответ, ответить","anyone":"любой","anything":"что-нибудь","applause":"аплодисменты","archive":"архив","around":"вокруг","arrived":"приехала","article":"статья","as":"как","asked":"спросил(а)","at":"в, у, на","audience":"аудитория, зрители","back":"назад, обратно","bad":"плохой","bag":"сумка","be":"быть","beating":"стучащий","became":"стал(о)","because":"потому что","been":"был(о)","before":"перед, до","began":"начал(ся)","beginning":"начало","behind":"за, позади","best":"лучший","between":"между","book":"книга","books":"книги","bookshelves":"книжные полки","boredom":"скука","bottom":"низ","boy":"мальчик","boy's":"мальчика","broke":"сорвался","broken":"сломанный","building":"здание","bus":"автобус","but":"но","by":"по, к","called":"назывался, звали","came":"пришёл, пришли","can't":"не могут, не могу","care":"заботиться (all равно)","careful":"осторожный, аккуратный","carried":"нёс, носил","chair":"стул, кресло","check":"проверить","child":"ребёнок","child's":"детский","children":"дети","city":"город","clearly":"чётко","cold":"холодный","come":"приходить","comes":"приходит","corner":"угол","could":"мог(ла)","counter":"прилавок","crane":"Крейн (фамилия)","crossed":"пересекла","cry":"плакать","dark":"темнота, тёмный","darkness":"темнота","day":"день","days":"дня","dead":"мёртвый","deep":"глубокий, глубоко","described":"описывала","despite":"несмотря на","did":"сделал(а); (вспом.)","didn't":"не (вспом.)","die":"умереть","died":"умер","difficult":"трудный","director":"директор","dishes":"посуда","do":"делать; (в
