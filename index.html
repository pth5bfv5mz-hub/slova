r":"слабее","weakness":"слабость","week":"неделя","well":"хорошо (well done — молодец)","went":"пошла, погас (went out)","were":"были","wet":"мокрый","what":"что, какой","when":"когда","while":"пока","whisper":"шёпот","whispering":"шептал","white":"белый","who":"кто, который","whole":"весь, целый","why":"почему","will":"(буд. время)","wind":"ветер","windows":"окна","with":"с","wooden":"деревянный","words":"слова","work":"работа, работать","world":"мир","written":"написан","year":"год","years":"лет, годы","yellow":"жёлтый","yet":"ещё","you":"ты, вы","stage":"сцена"},"vocab":{"watched":14,"shut":34,"kid":54,"kids":54,"dishes":74,"arrived":94,"even":114,"journey":134,"perhaps":154,"fight":174,"loud":194,"loudly":194,"everything":215,"improve":235,"pretended":255,"trip":275,"thin":296,"pharmacy":316,"dead":336,"whisper":356,"whispering":356,"hit":376,"pride":404,"boredom":424,"lighter":447,"frustration":475,"overwhelmed":496,"yet":517,"humiliate":538,"audience":559,"struggle":580,"external":601,"despite":623,"around":644}},{"id":15,"title_en":"The Grey Hat","title_ru":"Серая шляпа","genre":"Детектив","summary_ru":"Ночью в поезде, идущем к морю, бесследно исчезает попутчик бывшего детектива Норы Уэллс — остались только шляпа, битое стекло и немного песка.","paragraphs":[{"en":"It was early spring, and the night train from the city to the sea was almost empty. Nora Wells had chosen the quiet carriage at the back. She was sixty-two, she had worked as a police detective for thirty years, and now she was retired. She was going to visit her sister by the sea. It was going to be a long, lonely trip, and she was happy about that.","ru":"Была ранняя весна, и ночной поезд из города к морю был почти пуст. Нора Уэллс выбрала тихий вагон в хвосте поезда. Ей было шестьдесят два года, тридцать лет она проработала детективом в полиции, а теперь была на пенсии. Она ехала в гости к сестре на море. Ей предстояла долгая одинокая поездка, и это её радовало."},{"en":"Ten minutes after the train left, a man appeared at the door of her compartment. He was about fifty, thin and pale, and he wore an expensive grey hat of very good quality. In both hands he was holding a brown leather bag, the way a child holds a toy that someone wants to take away.","ru":"Через десять минут после отправления поезда в дверях её купе появился мужчина. Ему было около пятидесяти, он был худой и бледный, и на нём была дорогая серая шляпа очень хорошего качества. Обеими руками он держал коричневую кожаную сумку — так, как ребёнок держит игрушку, которую кто-то хочет отнять."},{"en":"“Excuse me,” he said. “May I sit here? The other carriages are... noisy.” Nora looked along the corridor. The other carriages were almost empty, but she did not say so. “You don't need my permission,” she answered. “Your ticket is valid for any seat.”","ru":"«Простите, — сказал он. — Можно мне сесть здесь? В других вагонах... шумно». Нора посмотрела вдоль коридора. Другие вагоны были почти пусты, но она не стала об этом говорить. «Вам не нужно моё разрешение, — ответила она. — Ваш билет действителен на любое место»."},{"en":"His name was Edwin Crane. He did not want to talk at first, but the night was long, and after an hour he began. He told her that he was returning home after many years abroad. He had planned to fly, but his flight had been cancelled, so he had taken the train. “I have only one goal now,” he said. “To get to the sea and never leave it again.”","ru":"Его звали Эдвин Крейн. Сначала он не хотел разговаривать, но ночь была длинной, и через час он заговорил. Он рассказал ей, что возвращается домой после долгих лет за границей. Он собирался лететь, но его рейс отменили, поэтому он сел на поезд. «Теперь у меня только одна цель, — сказал он. — Добраться до моря и больше никогда оттуда не уезжать»."},{"en":"Nora had learned many things in thirty years with the police. One of them was this: when a person tells you a lot of small details without being asked, he is usually hiding one big detail. She listened quietly and drank her tea from a thick glass.","ru":"За тридцать лет работы в полиции Нора многому научилась. Одно из этого было таким: когда человек без всяких вопросов рассказывает много мелких подробностей, он обычно скрывает одну большую. Она тихо слушала и пила чай из толстого стакана."},{"en":"Then, a little after midnight, two men walked past the compartment. They were big, with short hair and cold eyes. One of them stopped and looked in through the door. Crane's face became white. He pulled his hat lower and turned to the window. The man looked at him for a long moment, then walked on.","ru":"Потом, вскоре после полуночи, мимо купе прошли двое мужчин. Они были крупные, коротко стриженные, с холодными глазами. Один из них остановился и заглянул в дверь. Лицо Крейна побелело. Он натянул шляпу пониже и отвернулся к окну. Мужчина долго смотрел на него, а потом пошёл дальше."},{"en":"“You know them,” Nora said. It was not a question. Crane was silent for a while. Then he spoke very softly. “Five years ago I had a business. It was a failure. I lost all my wealth, and I borrowed money from the wrong people. Now I have a debt that I can never pay. Those men have followed me across three countries.”","ru":"«Вы их знаете», — сказала Нора. Это был не вопрос. Крейн некоторое время молчал. Потом он заговорил очень тихо. «Пять лет назад у меня был бизнес. Он провалился. Я потерял всё своё богатство и занял деньги не у тех людей. Теперь у меня долг, который я никогда не смогу вернуть. Эти люди преследовали меня через три страны»."},{"en":"“Then go to the police,” said Nora. He gave a sad smile. “You have the attitude of a person who has never been afraid,” he said. “I have no strength left to fight. My only desire is to live a quiet life, somewhere far away, where nobody knows my name.” After that talk, he closed his eyes, and Nora soon fell asleep too.","ru":"«Тогда обратитесь в полицию», — сказала Нора. Он грустно улыбнулся. «Вы рассуждаете как человек, который никогда не боялся, — сказал он. — У меня не осталось сил бороться. Моё единственное желание — жить тихой жизнью где-нибудь далеко, где никто не знает моего имени». После этого разговора он закрыл глаза, и вскоре Нора тоже уснула."},{"en":"A cold wind woke her at four in the morning. The window of the compartment was broken. Crane's seat was empty. His grey hat lay on the floor, and next to it there was a small pile of broken glass and, strangely, a little yellow sand.","ru":"В четыре утра её разбудил холодный ветер. Окно купе было разбито. Место Крейна пустовало. Его серая шляпа лежала на полу, а рядом с ней — небольшая кучка битого стекла и, как ни странно, немного жёлтого песка."},{"en":"For a moment Nora simply stood there, holding the hat in her hands. A few hours ago a complete stranger had told her the story of his life. Now he was gone, and the train was still moving fast through the dark fields. She felt cold, and not only because of the wind.","ru":"Несколько мгновений Нора просто стояла, держа шляпу в руках. Несколько часов назад совершенно незнакомый человек рассказал ей историю своей жизни. Теперь он исчез, а поезд всё так же быстро мчался сквозь тёмные поля. Ей стало холодно, и не только из-за ветра."},{"en":"Nora called the conductor, a tired young man called Paul. He looked at the window and went pale. “He jumped,” he said. “Or those two men pushed him.” He ran to find the two men, and soon Nora heard loud voices in the next carriage. The men were arguing with Paul. “We've been asleep all night!” one of them shouted. “Check our tickets, check our bags, check whatever you want!”","ru":"Нора позвала проводника — усталого молодого человека по имени Пол. Он взглянул на окно и побледнел. «Он выпрыгнул, — сказал он. — Или его вытолкнули те двое». Он побежал искать тех двоих, и вскоре Нора услышала громкие голоса в соседнем вагоне. Мужчины спорили с Полом. «Мы всю ночь спали! — кричал один из них. — Проверяйте наши билеты, наши сумки, проверяйте что хотите!»"},{"en":"Paul came back with an expression of annoyance on his face. “I need permission from the company to stop the train,” he said. “And the distance to the next station is two hundred kilometres. If he jumped, there's nothing we can do.”","ru":"Пол вернулся с раздражением на лице. «Чтобы остановить поезд, мне нужно разрешение от компании, — сказал он. — А до следующей станции двести километров. Если он выпрыгнул, мы ничего не можем сделать»."},{"en":"Nora was not listening. She was looking at the floor. Her memory for small details had always been her greatest strength as a detective, and something here was wrong.","ru":"Нора не слушала. Она смотрела на пол. Память на мелкие детали всегда была её главной силой как детектива, и здесь что-то было не так."},{"en":"First, the glass. If someone breaks a window from the inside, most of the glass falls outside the train. But here almost all of it was on the floor, in a neat little pile, as if someone had carefully placed it there. Second, the sand. The train was still far from the sea. There was no sand anywhere near the railway.","ru":"Во-первых, стекло. Если окно разбивают изнутри, большая часть стекла падает наружу. А здесь почти всё стекло лежало на полу, аккуратной кучкой, будто кто-то бережно его туда положил. Во-вторых, песок. Поезд был ещё далеко от моря. Рядом с железной дорогой песка нигде не было."},{"en":"She walked to the end of the carriage. On the wall hung a red fire bucket, the kind that every train carries. It should have been full of sand. It was half empty, and a heavy metal hammer for emergencies was missing from its place next to it.","ru":"Она дошла до конца вагона. На стене висело красное пожарное ведро — такое есть в каждом поезде. Оно должно было быть полным песка. Оно было наполовину пустым, а тяжёлый металлический молоток для экстренных случаев пропал со своего места рядом с ним."},{"en":"“Paul,” Nora said, “nobody jumped from this train. Somebody wanted us to believe that. He broke the window with the hammer, threw out a little glass, put the rest on the floor and covered the hammer with sand from the bucket so it would not make a noise when he dropped it somewhere. Mr. Crane is still on this train.”","ru":"«Пол, — сказала Нора, — никто не прыгал с этого поезда. Кто-то хотел, чтобы мы в это поверили. Он разбил окно молотком, выбросил немного стекла, остальное положил на пол, а молоток засыпал песком из ведра, чтобы тот не загремел, когда его где-нибудь бросят. Мистер Крейн всё ещё в поезде»."},{"en":"“But where?” asked Paul. “I have checked every compartment.” Nora thought for a moment. “Have you checked the kitchen?”","ru":"«Но где? — спросил Пол. — Я проверил каждое купе». Нора на мгновение задумалась. «А кухню вы проверяли?»"},{"en":"The restaurant car was dark, but there was a light in the small kitchen behind it. A man in a white cook's jacket was standing with his back to the door, cutting bread for breakfast. He had no hat, and his grey hair was wet, as if he had just washed it. Next to the bread, under a towel, Nora saw the shape of a hammer.","ru":"Вагон-ресторан был тёмным, но в маленькой кухне за ним горел свет. Мужчина в белой поварской куртке стоял спиной к двери и резал хлеб к завтраку. Шляпы на нём не было, а седые волосы были мокрыми, будто он только что их вымыл. Рядом с хлебом, под полотенцем, Нора разглядела очертания молотка."},{"en":"“Good morning, Mr. Crane,” she said. The man stopped cutting. For a long time he did not turn around. Then he put down the knife and looked at her. He did not look like a criminal. He looked like a complete failure, and very, very tired.","ru":"«Доброе утро, мистер Крейн», — сказала она. Мужчина перестал резать. Долгое время он не оборачивался. Потом положил нож и посмотрел на неё. Он не был похож на преступника. Он выглядел как человек, потерпевший полный провал, и очень, очень усталым."},{"en":"“How did you know?” he asked. “The sand,” said Nora. “That was your worst mistake. You wanted the men to believe you were dead, didn't you? Then they would stop looking for you, and your debt would die with you.”","ru":"«Как вы догадались?» — спросил он. «Песок, — ответила Нора. — Это была ваша худшая ошибка. Вы хотели, чтобы те люди поверили, что вы мертвы, правда? Тогда они перестали бы вас искать, а ваш долг умер бы вместе с вами»."},{"en":"Crane nodded. “I paid the cook to lend me his jacket. At the next station I wanted to leave the train with the kitchen staff. Nobody looks at a cook.” He looked at Paul, then back at Nora. “Are you going to give me to them?”","ru":"Крейн кивнул. «Я заплатил повару, чтобы он одолжил мне свою куртку. На следующей станции я хотел сойти с поезда вместе с работниками кухни. На повара никто не смотрит». Он взглянул на Пола, потом снова на Нору. «Вы собираетесь отдать меня им?»"},{"en":"Nora was quiet for a long time. She thought about the two men with cold eyes. She thought about the law, which she had served all her life. And she thought about the lonely man in front of her, who had lost everything and only wanted to be left alone.","ru":"Нора долго молчала. Она думала о двух мужчинах с холодными глазами. Она думала о законе, которому служила всю жизнь. И она думала об одиноком человеке перед ней, который потерял всё и хотел только, чтобы его оставили в покое."},{"en":"“Paul,” she said at last, “I think we should tell the police at the next station that a passenger has disappeared, and that two men in the next carriage were arguing with him before it happened. The police will want to talk to those two men for a very long time. And while they are busy, a cook may leave the train. Nobody looks at a cook.”","ru":"«Пол, — сказала она наконец, — думаю, на следующей станции нам стоит сообщить полиции, что пропал пассажир и что двое мужчин из соседнего вагона спорили с ним перед этим. Полиция захочет поговорить с этими двумя очень долго. А пока они заняты, повар может сойти с поезда. На повара никто не смотрит»."},{"en":"Paul looked at her for a moment. Then, slowly, his attitude changed, and he smiled. “I didn't see anything in the kitchen,” he said. “Only bread.”","ru":"Пол посмотрел на неё. Потом его настроение постепенно переменилось, и он улыбнулся. «Я ничего не видел на кухне, — сказал он. — Только хлеб»."},{"en":"At seven o'clock the train arrived at a small station by the sea. The sun was rising over the water, and the beach ahead was covered in soft white sand. Nora watched from her window as two police officers led the angry men away along the platform.","ru":"В семь часов поезд прибыл на маленькую станцию у моря. Над водой вставало солнце, а пляж впереди был покрыт мягким белым песком. Нора смотрела из окна, как двое полицейских уводят разгневанных мужчин по платформе."},{"en":"Behind them, at a safe distance, a man in a white jacket walked out of the station and towards the beach. He did not look back. Nora picked up the grey hat from the floor of her compartment. It was a very good hat. She decided to keep it, as a memory of the strangest night of her long career.","ru":"Позади них, на безопасном расстоянии, человек в белой куртке вышел со станции и направился к пляжу. Он не оглянулся. Нора подняла с пола своего купе серую шляпу. Это была очень хорошая шляпа. Она решила оставить её себе — на память о самой странной ночи за всю свою долгую карьеру."}],"gloss":{"few":"несколько","hour":"час","knife":"нож","a":"(неопр. артикль)","about":"около, о","abroad":"за границей","across":"через","afraid":"испуганный","after":"после","again":"снова","ago":"назад","ahead":"впереди","all":"весь, все","almost":"почти","alone":"один, в покое","along":"вдоль, по","always":"всегда","an":"(неопр. артикль)","and":"и","angry":"сердитый","annoyance":"раздражение","answered":"ответила","any":"любой","anything":"ничего, что-нибудь","anywhere":"нигде, где-либо","appeared":"появился","are":"(есть)","arguing":"спорили","around":"(turn around) обернуться","arrived":"прибыл","as":"как, когда","asked":"спросил"," oney":"деньги","morning":"утро","most":"большая часть","moving":"двигался","mr":"мистер","my":"мой","name":"имя","near":"рядом","neat":"аккуратный","need":"нужно","never":"никогда","next":"следующий, соседний; рядом","night":"ночь","no":"нет, никакой","nobody":"никто","nodded":"кивнул","noise":"шум","noisy":"шумный","nora":"Нора (имя)","not":"не","nothing":"ничего","now":"теперь","o'clock":"часов","of":"из, о, (родительный падеж)","officers":"офицеры","on":"на","one":"один","only":"только","or":"или","other":"другой","our":"наши","out":"наружу, из","outside":"снаружи","over":"над","paid":"заплатил","pale":"бледный","passenger":"пассажир","past":"мимо","paul":"Пол (имя)","pay":"вернуть, заплатить","people":"люди","permission":"разрешение","person":"человек","picked":"(picked up) подняла","pile":"кучка","place":"место","placed":"положил","planned":"собирался","platform":"платформа","police":"полиция","pulled":"натянул","pushed":"вытолкнули","put":"положил","quality":"качество","question":"вопрос","quiet":"тихий","quietly":"тихо","railway":"железная дорога","ran":"побежал","red":"красный","rest":"остальное","restaurant":"ресторан","retired":"на пенсии","returning":"возвращается","rising":"вставало","sad":"грустный","safe":"безопасный","said":"сказал(а)","sand":"песок","saw":"увидела","say":"сказать","sea":"море","seat":"место","second":"во-вторых","see":"видел","served":"служила","seven":"семь","shape":"очертания","she":"она","short":"короткий","should":"должно; стоит","shouted":"кричал","silent":"молчащий","simply":"просто","sister":"сестра","sit":"сесть","sixty":"шестьдесят","slowly":"медленно","small":"маленький, мелкий","smile":"улыбка","smiled":"улыбнулся","so":"так, поэтому","soft":"мягкий","softly":"тихо","somebody":"кто-то","someone":"кто-то","something":"что-то","somewhere":"где-нибудь","soon":"вскоре","spoke":"заговорил","spring":"весна","staff":"работники","standing":"стоял","station":"станция","still":"всё ещё","stood":"стояла","stop":"остановить; перестать","stopped":"остановился, перестал","story":"история","stranger":"незнакомец","strangely":"странно","strangest":"самый странный","strength":"сила","sun":"солнце","take":"отнять","taken":"сел (на поезд)","talk":"разговор; разговаривать","tea":"чай","tell":"сообщить","tells":"рассказывает","ten":"десять","that":"что, тот, это","the":"(артикль)","them":"их, им","then":"потом, тогда","there":"там","there's":"есть, имеется","they":"они","thick":"толстый","thin":"худой","things":"вещи","think":"думаю","thirty":"тридцать","this":"этот","those":"те","thought":"подумала","three":"три","threw":"выбросил","through":"через, сквозь","ticket":"билет","tickets":"билеты","time":"время","tired":"усталый","to":"к, в, (инфинитив)","told":"рассказал","too":"тоже","towards":"к, в сторону","towel":"полотенце","toy":"игрушка","train":"поезд","trip":"поездка","turn":"обернуться","turned":"повернулся","two":"два","under":"под","up":"(picked up) подняла","us":"нас, нам","usually":"обычно","valid":"действительный","very":"очень","visit":"навестить","voices":"голоса","walked":"прошли, пошёл","wall":"стена","want":"хотеть","wanted":"хотел","wants":"хочет","was":"был(а)","washed":"вымыл","watched":"смотрела","water":"вода","way":"образ, так","we":"мы","we've":"мы (вспом.)","wealth":"богатство","wells":"Уэллс (фамилия)","went":"(went pale) побледнел","were":"были","wet":"мокрый","whatever":"что угодно","when":"когда","where":"где","which":"который","while":"(for a while) некоторое время; пока","white":"белый","who":"который","will":"(будущее время)","wind":"ветер","window":"окно","with":"с","without":"без","woke":"разбудил","wore":"носил","worked":"работала","worst":"худший","would":"(бы)","wrong":"не тот, неправильный","years":"лет","yellow":"жёлтый","you":"вы","young":"молодой","your":"ваш"},"vocab":{"learned":15,"floor":35,"bread":55,"quiet":75,"returning":95,"glass":115,"talk":135,"hat":155,"holding":175,"holds":175,"appeared":195,"spring":216,"goal":236,"permission":256,"sand":276,"arguing":297,"ahead":317,"lonely":337,"complete":357,"worst":377,"quality":405,"flight":425,"distance":449,"annoyance":476,"strength":497,"failure":518,"wealth":539,"valid":560,"attitude":581,"desire":602,"memory":624,"debt":646}},{"id":16,"title_en":"The Ship with No Name","title_ru":"Корабль без имени","genre":"Морская история","summary_ru":"Старый рыбак и его молодой помощник встречают в тумане белый корабль без названия и без единого человека на борту.","paragraphs":[{"en":"Every autumn the sea near Greyhaven becomes grey and angry, and the fishermen of the village spend more time repairing their nets than fishing. Elias Brand was sixty-eight, and he had seen fifty autumns like this. His boat, the Margaret, was old and slow, and so was he. At least that was the opinion of the younger men in the village.","ru":"Каждую осень море у Грейхейвена становится серым и сердитым, и рыбаки деревни больше времени чинят сети, чем рыбачат. Элайесу Бранду было шестьдесят восемь, и он видел пятьдесят таких осеней. Его лодка, «Маргарет», была старой и медленной, и он сам тоже. По крайней мере, таково было мнение молодых мужчин деревни."},{"en":"On a cold Sunday morning in October, Elias went out anyway. He took his neighbour's son, Danny, who was nineteen and needed the money. Before they left, Elias's wife gave them bread with butter and a flask of hot tea. “Come back before dark,” she said. “The radio says a storm is coming.”","ru":"Холодным воскресным утром в октябре Элайес всё равно вышел в море. Он взял с собой соседского сына Дэнни, которому было девятнадцать и который нуждался в деньгах. Перед уходом жена Элайеса дала им хлеб с маслом и термос горячего чая. «Возвращайтесь до темноты, — сказала она. — По радио говорят, что идёт шторм»."},{"en":"The Margaret moved slowly out of the harbour. The water was dark and the wind was cold, but Elias felt at home. He had never got used to life on land. On land there were bills, neighbours and questions. At sea there was only work, and the work was simple: find the fish, pull the nets, come home.","ru":"«Маргарет» медленно вышла из гавани. Вода была тёмной, ветер холодным, но Элайес чувствовал себя как дома. Он так и не привык к жизни на суше. На суше были счета, соседи и вопросы. В море была только работа, и работа была простой: найти рыбу, вытащить сети, вернуться домой."},{"en":"For three hours they caught almost nothing. Danny got tired of pulling empty nets and sat down on a box. “Why do you still do this?” he asked. “You're poor, I'm poor, the whole village is poor. The fish have gone.”","ru":"Три часа они почти ничего не ловили. Дэнни устал вытаскивать пустые сети и сел на ящик. «Зачем ты всё ещё этим занимаешься? — спросил он. — Ты бедный, я бедный, вся деревня бедная. Рыба ушла»."},{"en":"Elias did not reply. He was looking carefully at something in the fog. “Danny,” he said quietly. “Look.”","ru":"Элайес не ответил. Он внимательно смотрел на что-то в тумане. «Дэнни, — тихо сказал он. — Смотри»."},{"en":"A ship was coming out of the fog. It was not a fishing boat. It was long and white, about forty metres, with dark windows and no flag. It moved slowly, without any sound: no engine, no voices. On the side, where the name of a ship is usually painted, there was only a blank white space.","ru":"Из тумана выходил корабль. Это была не рыбацкая лодка. Он был длинный и белый, метров сорок, с тёмными окнами и без флага. Он двигался медленно, без единого звука: ни двигателя, ни голосов. На борту, где обычно пишут название корабля, было лишь пустое белое место."},{"en":"“Hello!” Elias shouted. Nobody answered. The ship came closer and stopped, as if it was waiting for them.","ru":"«Эй!» — крикнул Элайес. Никто не ответил. Корабль подошёл ближе и остановился, словно ждал их."},{"en":"Danny's eyes were shining with excitement. “Do you know what this means?” he said. “If a ship has no crew, the people who find it can keep it. That's the law! It's a fortune, Elias. We will never be poor again.”","ru":"Глаза Дэнни горели от волнения. «Ты понимаешь, что это значит? — сказал он. — Если на корабле нет команды, тот, кто его нашёл, может оставить его себе. Таков закон! Это целое богатство, Элайес. Мы больше никогда не будем бедными»."},{"en":"“Or it's a ship full of dead men,” Elias said. “Every sad sailor's story starts with somebody who thought he had found a fortune.” But he was curious too. He brought the Margaret next to the white ship, and they climbed onto its deck.","ru":"«Или это корабль, полный мертвецов, — сказал Элайес. — Каждая грустная морская история начинается с того, кто думал, что нашёл богатство». Но ему тоже было любопытно. Он подвёл «Маргарет» к белому кораблю, и они забрались на палубу."},{"en":"Everything on the deck was clean and new. There were no ropes, no fishing equipment, nothing. They found a door and pushed it. It opened into a narrow corridor with soft blue lights. At the end there was a room full of screens. All of them were dark except one, which showed a single line of text: DEVELOPMENT VESSEL 7. INTERNAL SYSTEMS: ACTIVE.","ru":"Всё на палубе было чистым и новым. Не было ни верёвок, ни рыболовных снастей, ничего. Они нашли дверь и толкнули её. Она открылась в узкий коридор с мягким голубым светом. В конце была комната, полная экранов. Все они были тёмными, кроме одного, на котором была одна строка: «ОПЫТНОЕ СУДНО 7. ВНУТРЕННИЕ СИСТЕМЫ: АКТИВНЫ»."},{"en":"“What is a development vessel?” Danny asked. His voice was a little shaky now.","ru":"«Что такое опытное судно?» — спросил Дэнни. Голос у него теперь немного дрожал."},{"en":"“A ship that somebody is still building, I think,” Elias said. “Or testing.” He looked around. There was no kitchen, no beds, no place for people to live at all. “Danny, I don't think this ship ever had a crew.”","ru":"«Корабль, который кто-то ещё строит, я думаю, — сказал Элайес. — Или испытывает». Он огляделся. Здесь не было ни кухни, ни кроватей, вообще никакого места, где могли бы жить люди. «Дэнни, по-моему, у этого корабля никогда не было команды»."},{"en":"Suddenly a deep roar came from somewhere inside the ship. The floor shook. All the doors closed at the same moment, and a cold, calm voice spoke from the walls: “Unknown persons on board. Defense mode on. Please stay where you are.”","ru":"Вдруг откуда-то из глубины корабля донёсся низкий рёв. Пол задрожал. Все двери закрылись в один и тот же момент, и холодный спокойный голос заговорил из стен: «На борту неизвестные лица. Режим защиты включён. Пожалуйста, оставайтесь на месте»."},{"en":"Danny was completely scared. He ran to the door and pushed it with all his strength, but it did not move. “It's a trap!” he shouted. “It's a military ship! They'll think we are thieves!”","ru":"Дэнни был до смерти напуган. Он подбежал к двери и толкнул её изо всех сил, но она не сдвинулась. «Это ловушка! — закричал он. — Это военный корабль! Они подумают, что мы воры!»"},{"en":"“Calm down,” Elias said, although his own heart was beating fast. “A machine is a machine. Somebody made it, and somebody can talk to it.” He sat down in front of the screen with the text and looked at it carefully, the same way he looked at the sky before a storm.","ru":"«Успокойся», — сказал Элайес, хотя его собственное сердце колотилось. «Машина есть машина. Кто-то её сделал, и с ней можно поговорить». Он сел перед экраном с текстом и внимательно посмотрел на него, так же, как смотрел на небо перед штормом."},{"en":"He had never worked with a computer in his life. But he had spent fifty years with engines, nets and radios, and he knew one thing: every machine has a logic, and if you are consistent and patient, you can understand it. He pressed the keys slowly. A menu appeared. One line said: OWNER.","ru":"Он ни разу в жизни не работал с компьютером. Но он провёл пятьдесят лет с моторами, сетями и рациями и знал одно: у каждой машины есть логика, и если действовать последовательно и терпеливо, её можно понять. Он медленно нажимал на клавиши. Появилось меню. В одной строке было написано: ВЛАДЕЛЕЦ."},{"en":"He touched it, and a name appeared on the screen. Elias stopped breathing. The name was Michael Brand.","ru":"Он нажал на неё, и на экране появилось имя. Элайес перестал дышать. Имя было Майкл Бранд."},{"en":"Michael was his son. Twelve years ago, after a terrible argument, Michael had left Greyhaven to study engineering in the city. He said he would never come back to a village where people lived like their grandfathers, ate raw fish on cold boats and called it a life. Elias had said some hard things too. Since then they had not spoken. Elias had got used to the silence, the same way you get used to an old pain. Only his wife still wrote letters.","ru":"Майкл был его сыном. Двенадцать лет назад, после страшной ссоры, Майкл уехал из Грейхейвена учиться на инженера в город. Он сказал, что никогда не вернётся в деревню, где люди живут как их деды, едят сырую рыбу на холодных лодках и называют это жизнью. Элайес тоже наговорил жёстких слов. С тех пор они не разговаривали. Элайес привык к молчанию так же, как привыкают к старой боли. Только его жена всё ещё писала письма."},{"en":"“Elias?” Danny said. “What is it? You look like you've seen a ghost.”","ru":"«Элайес? — сказал Дэнни. — Что такое? У тебя такой вид, будто ты увидел привидение»."},{"en":"“Not a ghost,” Elias said. “My son.” Under the name there was a phone number for emergencies. Elias took the radio from his pocket and asked the coast station to call it.","ru":"«Не привидение, — сказал Элайес. — Моего сына». Под именем был телефонный номер для экстренных случаев. Элайес достал рацию из кармана и попросил береговую станцию позвонить по нему."},{"en":"Danny walked from one wall to the other like an animal in a cage. “What if he doesn't answer?” he kept asking. “What if the storm takes the Margaret? We will die in this white box.” Elias said nothing. He was thinking about the last time he had seen his son: a young man with a bag on his shoulder, waiting for the morning bus, who did not look back.","ru":"Дэнни ходил от стены к стене, как зверь в клетке. «А если он не ответит? — всё спрашивал он. — А если шторм унесёт „Маргарет“? Мы умрём в этой белой коробке». Элайес молчал. Он думал о том, когда в последний раз видел сына: молодой человек с сумкой на плече ждал утренний автобус и ни разу не оглянулся."},{"en":"For twenty minutes nothing happened. Outside, the wind was getting stronger, and the first big waves were hitting the white ship. Then the radio came to life with a noise, and a man's voice said: “This is Michael Brand. Who is on my ship?”","ru":"Двадцать минут ничего не происходило. Снаружи ветер усиливался, и первые большие волны били в белый корабль. Потом рация с треском ожила, и мужской голос сказал: «Говорит Майкл Бранд. Кто на моём корабле?»"},{"en":"Elias held the radio for a long moment. “It's your father,” he said at last.","ru":"Элайес долго держал рацию в руке. «Это твой отец», — наконец сказал он."},{"en":"There was silence. Then Michael spoke again, and his voice was different. “Dad? Are you all right? Is anybody hurt?” He explained quickly. The ship was his company's project, a ship that could sail without people and carry goods across the sea. During a test two days ago, its navigation system had broken, and it had disappeared. His company had looked for it everywhere. “I thought I had lost everything,” he said. “Five years of work.”","ru":"Наступила тишина. Потом Майкл заговорил снова, и голос его был другим. «Папа? Ты в порядке? Никто не пострадал?» Он быстро всё объяснил. Корабль был проектом его компании — судном, которое может плавать без людей и перевозить грузы через море. Во время испытания два дня назад сломалась его навигационная система, и он пропал. Компания искала его повсюду. «Я думал, что потерял всё, — сказал он. — Пять лет работы»."},{"en":"He told them how to switch off the defense mode and how to fix the navigation system. It took Elias almost an hour, with Danny holding the torch and reading the instructions aloud. When the doors finally opened, they both shouted with happiness. Then, with the Margaret tied behind it, the white ship sailed slowly into Greyhaven harbour, just before the storm hit the coast.","ru":"Он объяснил им, как выключить режим защиты и как исправить навигационную систему. У Элайеса на это ушёл почти час: Дэнни держал фонарик и читал инструкции вслух. Когда двери наконец открылись, они оба закричали от счастья. Потом, ведя за собой на привязи «Маргарет», белый корабль медленно вошёл в гавань Грейхейвена — как раз перед тем, как шторм обрушился на берег."},{"en":"The next morning a car drove into the village. A tall, handsome man in a dark coat got out of it. He was older than Elias remembered, with a little grey in his hair, but he had his mother's eyes. For a moment the two men stood on the wet street and did not know what to say.","ru":"На следующее утро в деревню въехала машина. Из неё вышел высокий красивый мужчина в тёмном пальто. Он был старше, чем помнил Элайес, с лёгкой сединой в волосах, но глаза у него были материнские. Какое-то время двое мужчин стояли на мокрой улице и не знали, что сказать."},{"en":"“The ship found me,” Elias said finally. “In the whole sea, it came to my boat. I don't know how to define that. Maybe it is luck. Maybe it is fate.”","ru":"«Корабль нашёл меня, — сказал наконец Элайес. — Во всём море он пришёл именно к моей лодке. Я не знаю, как это определить. Может быть, это удача. Может быть, судьба»."},{"en":"Michael smiled. “Dad, I'm an engineer. Fate is a delusion. The ship was programmed to look for the nearest boat when something went wrong.” He stopped, and then he started laughing. “But the nearest boat was yours. Okay. Maybe it was a little bit of fate.”","ru":"Майкл улыбнулся. «Папа, я инженер. Судьба — это заблуждение. Корабль был запрограммирован искать ближайшую лодку, если что-то пойдёт не так». Он замолчал, а потом рассмеялся. «Но ближайшей лодкой оказалась твоя. Ладно. Может, тут была и капелька судьбы»."},{"en":"His laugh was exactly the same as when he was a boy. Elias's wife came running out of the house, and the conversation moved to easier topics: the weather, breakfast, the neighbours.","ru":"Его смех был точно таким же, как в детстве. Из дома выбежала жена Элайеса, и разговор перешёл на более лёгкие темы: погоду, завтрак, соседей."},{"en":"Michael's company paid a large reward for the ship, and Elias gave half of it to Danny, who bought his own boat. But in the village, the main topic of conversation that autumn was not the money. It was the fact that every Sunday, Michael drove four hours from the city to Greyhaven, ate bread and butter in his mother's kitchen, and went out to sea with his father on the slow old Margaret.","ru":"Компания Майкла заплатила большое вознаграждение за корабль, и Элайес отдал половину Дэнни, который купил себе собственную лодку. Но главной темой разговоров в деревне той осенью были не деньги. А то, что каждое воскресенье Майкл ехал четыре часа из города в Грейхейвен, ел хлеб с маслом на кухне у матери и выходил в море с отцом на медленной старой «Маргарет»."}],"gloss":{"a":"(неопр. артикль)","about":"около; о","across":"через","active":"активный","after":"после","again":"снова","ago":"назад","all":"все; вообще","almost":"почти","aloud":"вслух","although":"хотя","an":"(неопр. артикль)","and":"и","angry":"сердитый","animal":"зверь","answer":"ответить","answered":"ответил","any":"никакой","anybody":"кто-нибудь","anyway":"всё равно","appeared":"появился","are":"есть; (связка)","argument":"ссора","around":"вокруг","as":"как; словно","asked":"спросил","asking":"спрашивать","at":"в, на, у","ate":"ел","autumn":"осень","autumns":"осени","back":"обратно, назад","bag":"сумка","be":"быть","beating":"биться","becomes":"становится","beds":"кровати","before":"перед, до","behind":"позади, за","big":"большой","bills":"счета","bit":"кусочек","blank":"пустой","blue":"голубой","board":"борт","boat":"лодка","boats":"лодки","both й","since":"с тех пор","single":"один, единственный","sixty":"шестьдесят","sky":"небо","slow":"медленный","slowly":"медленно","smiled":"улыбнулся","so":"так","soft":"мягкий","some":"некоторые","somebody":"кто-то","something":"что-то","somewhere":"где-то","son":"сын","sound":"звук","space":"место","spend":"проводить","spent":"провёл","spoke":"заговорил","spoken":"разговаривали","started":"начал","starts":"начинается","station":"станция","stay":"оставаться","still":"всё ещё","stood":"стояли","stopped":"остановился; перестал","storm":"шторм","story":"история","street":"улица","strength":"сила","stronger":"сильнее","study":"учиться","suddenly":"вдруг","sunday":"воскресенье","switch":"выключить (switch off)","system":"система","systems":"системы","takes":"унесёт","talk":"говорить","tall":"высокий","tea":"чай","terrible":"страшный","test":"испытание","testing":"испытывает","text":"текст","than":"чем","that":"тот; что; это","that's":"это (есть)","the":"(определённый артикль)","their":"их","them":"им, их","then":"потом; тогда","there":"там; (оборот there is)","they":"они","they'll":"они (будут)","thieves":"воры","thing":"вещь","things":"вещи, слова","think":"думать","thinking":"думал","this":"этот","thought":"думал","three":"три","tied":"привязанный","time":"время; раз","tired":"устал","to":"к, в; (частица инфинитива)","told":"сказал","too":"тоже","took":"взял; заняло","topic":"тема","topics":"темы","torch":"фонарик","touched":"нажал","trap":"ловушка","twelve":"двенадцать","twenty":"двадцать","two":"два","under":"под","understand":"понять","unknown":"неизвестный","used":"привыкший (get used to)","usually":"обычно","vessel":"судно","village":"деревня","voice":"голос","voices":"голоса","waiting":"ждал","walked":"ходил","wall":"стена","walls":"стены","was":"был","water":"вода","waves":"волны","way":"способ, так","we":"мы","weather":"погода","went":"вышел; пошло","were":"были","wet":"мокрый","what":"что","when":"когда","where":"где","which":"который","white":"белый","who":"который; кто","whole":"весь","why":"почему","wife":"жена","will":"(будущее время)","wind":"ветер","windows":"окна","with":"с","without":"без","work":"работа","worked":"работал","would":"(сказал, что) будет","wrong":"не так","wrote":"писала","years":"лет","you":"ты, вы","you're":"ты (есть)","you've":"ты (уже)","young":"молодой","younger":"более молодой","your":"твой","yours":"твоя","empty":"пустой"},"vocab":{"roar":16,"poor":36,"butter":56,"laugh":76,"tired":96,"drove":116,"topic":136,"topics":136,"defense":156,"sunday":176,"pushed":196,"autumn":217,"autumns":217,"opinion":237,"reply":257,"handsome":277,"same":298,"little":318,"carefully":338,"used":358,"fix":378,"fortune":406,"blank":426,"fate":450,"scared":477,"consistent":498,"raw":519,"define":540,"development":562,"which":582,"internal":603,"completely":625,"delusion":647}},{"id":17,"title_en":"Salt in the Tea","title_ru":"Соль в чае","genre":"Спорт и приключения","summary_ru":"Знаменитая альпинистка поднимается на гору, на которой много лет назад погиб её отец, и её молчаливый проводник знает о той трагедии больше, чем говорит.","paragraphs":[{"en":"Kate Ellison found her father’s notebook in a drawer when she was ten years old, a week after the accident. It was an old green notebook, full of maps, numbers and small drawings of a mountain called Kessan. On the last page he had written: “Thursday. Weather lovely. Tomorrow — the top.”","ru":"Кейт Эллисон нашла записную книжку отца в ящике, когда ей было десять лет, через неделю после несчастного случая. Это была старая зелёная книжка, полная карт, цифр и маленьких рисунков горы под названием Кессан. На последней странице он написал: «Четверг. Погода прекрасная. Завтра — вершина»."},{"en":"He never came back from that tomorrow. The newspapers said that he had tried to reach the top too fast, that he had ignored the weather, that he had wanted glory more than life. Kate’s mother never talked about it. She worked two jobs, and still the family lived in poverty. Some winters there was no money to heat the flat, and Kate did her homework in her coat.","ru":"Из этого завтра он так и не вернулся. Газеты писали, что он пытался добраться до вершины слишком быстро, что он не обращал внимания на погоду, что славу он хотел больше, чем жизни. Мать Кейт никогда об этом не говорила. Она работала на двух работах, и всё равно семья жила в бедности. Некоторыми зимами не было денег, чтобы отапливать квартиру, и Кейт делала уроки в пальто."},{"en":"Twenty-four years later, Kate was standing at the bottom of the same mountain.","ru":"Двадцать четыре года спустя Кейт стояла у подножия той же горы."},{"en":"She was a famous climber now. She had climbed in Alaska, in the Alps, in Patagonia. Companies paid for her trips, and newspapers wrote about her. This expedition was the most important of her life. If she reached the top of Kessan by the north side, she would be the first woman to achieve it. Her sponsors reminded her of this every day by email. The cost of the expedition was huge, and the pressure on her was even bigger.","ru":"Теперь она была известной альпинисткой. Она поднималась на Аляске, в Альпах, в Патагонии. Компании оплачивали её поездки, газеты писали о ней. Эта экспедиция была самой важной в её жизни. Если она поднимется на вершину Кессана по северной стороне, она станет первой женщиной, которая этого добилась. Спонсоры каждый день напоминали ей об этом по электронной почте. Стоимость экспедиции была огромной, а давление на неё — ещё больше."},{"en":"Her guide was a quiet man of about fifty called Samir. He had a grey beard, gentle eyes and hands like old wood. On the first evening in base camp, he made tea for her in a small metal pot. Then, to her surprise, he added salt to it.","ru":"Её проводником был тихий мужчина лет пятидесяти по имени Самир. У него была седая борода, добрые глаза и руки, похожие на старое дерево. В первый вечер в базовом лагере он приготовил ей чай в маленьком металлическом котелке. А потом, к её удивлению, добавил в него соль."},{"en":"“Salt?” Kate said. “In tea?” “Up there, the body loses salt,” Samir said. “It tastes strange at first. Later you will ask for more.”","ru":"«Соль? — сказала Кейт. — В чай?» «Там, наверху, тело теряет соль, — сказал Самир. — Сначала вкус странный. Потом вы будете просить ещё»."},{"en":"He was right. After a few days, she loved the salty tea. She also learned to live without many things. There was no shower, of course, and the water was too precious to wash with. She washed her face with snow and did not look in the mirror. The air was so thin that every step was an effort, and every night her head hurt.","ru":"Он был прав. Через несколько дней ей уже нравился солёный чай. Она также научилась жить без многих вещей. Душа, конечно, не было, а вода была слишком ценной, чтобы ею мыться. Она умывалась снегом и не смотрела в зеркало. Воздух был таким разреженным, что каждый шаг был усилием, и каждую ночь у неё болела голова."},{"en":"Kate wanted to go faster. The weather was good, the forecast was good, and her sponsors were waiting. But Samir always said the same thing: “Don’t rush. The mountain punishes people who rush.”","ru":"Кейт хотела идти быстрее. Погода была хорошей, прогноз был хорошим, и спонсоры ждали. Но Самир всегда говорил одно и то же: «Не торопитесь. Гора наказывает тех, кто торопится»."},{"en":"“My father rushed,” Kate said one night. “Everyone says so. He wanted the top more than anything. I am not like him.”","ru":"«Мой отец торопился, — сказала Кейт однажды ночью. — Все так говорят. Он хотел вершину больше всего на свете. Я не такая, как он»."},{"en":"Samir looked at her for a long time, but he said nothing.","ru":"Самир долго смотрел на неё, но ничего не сказал."},{"en":"Day after day they climbed higher. Kate kept her father’s notebook in her jacket, close to her heart, and every evening she read a page. Some of his drawings showed places that she could now see with her own eyes: a black rock like a sleeping dog, a narrow ridge, a field of blue ice. It was a strange feeling, as if he was walking a few steps in front of her. She did not tell Samir about it. She was afraid that he would laugh, or worse, that he would feel sorry for her. But each page gave her new hope.","ru":"День за днём они поднимались всё выше. Кейт носила записную книжку отца в куртке, у самого сердца, и каждый вечер читала одну страницу. Некоторые его рисунки показывали места, которые она теперь могла видеть своими глазами: чёрную скалу, похожую на спящую собаку, узкий гребень, поле голубого льда. Это было странное чувство, как будто он шёл в нескольких шагах впереди неё. Она не рассказывала об этом Самиру. Она боялась, что он засмеётся или, что ещё хуже, что ему станет её жаль. Но каждая страница давала ей новую надежду."},{"en":"On Thursday they reached the last camp, at seven thousand metres. The sky was clear and the snow shone like glass. “Lovely day,” Kate said, and then she remembered her father’s notebook and felt cold inside.","ru":"В четверг они добрались до последнего лагеря на высоте семи тысяч метров. Небо было ясным, и снег сиял, как стекло. «Прекрасный день», — сказала Кейт, а потом вспомнила записную книжку отца и почувствовала холод внутри."},{"en":"That evening the storm came. It came instantly, like a door closing. One moment the sun was shining; the next, the wind was screaming around the tent and the world was white. Samir and Kate went out and built a wall of snow blocks to protect the tent from the wind. Their fingers were burning with cold. They worked for two hours, and when they crawled back inside, Kate was shaking.","ru":"В тот вечер пришла гроза. Она пришла мгновенно, как закрывающаяся дверь. В одно мгновение светило солнце, а в следующее ветер уже кричал вокруг палатки, и весь мир стал белым. Самир и Кейт вышли и построили стену из снежных блоков, чтобы защитить палатку от ветра. Пальцы у них горели от холода. Они работали два часа, и когда заползли обратно внутрь, Кейт дрожала."},{"en":"“Are you afraid?” Samir asked. “A little,” she said. “Are you?”","ru":"«Вам страшно?» — спросил Самир. «Немного, — сказала она. — А вам?»"},{"en":"“Always,” he said, and smiled. “That is why I am still alive.” Kate lay awake for a long time and listened to the wind. She thought about the top, so close above them, and about her sponsors’ emails. She tried not to worry. Samir was asleep in a minute, like a man in his own bed.","ru":"«Всегда, — сказал он и улыбнулся. — Поэтому я до сих пор жив». Кейт долго лежала без сна и слушала ветер. Она думала о вершине, такой близкой над ними, и о письмах спонсоров. Она старалась не волноваться. Самир заснул через минуту, как человек в собственной постели."},{"en":"The storm lasted all night. In the morning it was quiet again, and the sky was perfect. This was the day. If they left now, they could be on the top by noon. Kate was putting on her boots when the radio made a sound.","ru":"Гроза длилась всю ночь. Утром снова стало тихо, а небо было идеальным. Это был тот самый день. Если бы они вышли сейчас, они могли бы быть на вершине к полудню. Кейт надевала ботинки, когда рация издала звук."},{"en":"“Emergency. Emergency. Is anyone there?” It was a young man’s voice, speaking English with a strong accent. His name was Lars, and he was climbing with a friend on the east side. In the storm his friend had fallen and broken his leg. They were three hundred metres below Kate’s camp, and nobody else was near.","ru":"«Чрезвычайная ситуация. Чрезвычайная ситуация. Есть кто-нибудь?» Это был голос молодого человека, говорившего по-английски с сильным акцентом. Его звали Ларс, и он поднимался с другом по восточной стороне. Во время грозы его друг упал и сломал ногу. Они были на триста метров ниже лагеря Кейт, и больше никого рядом не было."},{"en":"Kate looked up at the top. It was so close. She thought about the sponsors, the money, the cost of everything, all the years of work. Then she thought about her father, alone in the snow, with nobody to help him. She did not worry about the decision for long. “We are coming,” she said into the radio.","ru":"Кейт посмотрела вверх на вершину. Она была так близко. Она подумала о спонсорах, о деньгах, о стоимости всего, обо всех годах работы. Потом она подумала об отце, одном в снегу, когда некому было ему помочь. Она недолго волновалась из-за решения. «Мы идём», — сказала она в рацию."},{"en":"It took them the whole day. They found the two young men. Lars cried when he saw them. “I had lost all hope,” he said. They gave them hot tea and medicine, and slowly, very slowly, helped them down through the snow to the lower camp, where a rescue team could reach them. By the evening, the weather was changing again. The top of Kessan was lost for this year.","ru":"У них на это ушёл целый день. Они нашли двух молодых людей. Ларс заплакал, когда увидел их. «Я потерял всякую надежду», — сказал он. Они дали им горячего чая и лекарств и медленно, очень медленно помогли им спуститься по снегу к нижнему лагерю, куда могла добраться спасательная команда. К вечеру погода снова начала меняться. Вершина Кессана была потеряна на этот год."},{"en":"That night, in the lower camp, Samir sat next to Kate and gave her a cup of salty tea.","ru":"В ту ночь, в нижнем лагере, Самир сел рядом с Кейт и дал ей чашку солёного чая."},{"en":"“Now I can tell you,” he said. “I have waited twenty-four years. I was the reason your father died.”","ru":"«Теперь я могу вам сказать, — произнёс он. — Я ждал двадцать четыре года. Я был причиной смерти вашего отца»."},{"en":"Kate stared at him.","ru":"Кейт уставилась на него."},{"en":"“I was a porter then, twenty-six years old, carrying bags for his team. It was my first time so high. On that Friday, your father was going to the top, and he was very close. But I fell into a crack in the ice. Everyone else went on. Your father was the only one who came back for me. He pulled me out and carried me down. Then the storm came, and on the way down, he slipped. He did not rush to the top, Kate. He rushed to save me.”","ru":"«Я тогда был носильщиком, двадцати шести лет, носил сумки для его команды. Я впервые был так высоко. В ту пятницу ваш отец шёл к вершине, и он был совсем близко. Но я упал в трещину во льду. Все остальные пошли дальше. Ваш отец был единственным, кто вернулся за мной. Он вытащил меня и понёс вниз. Потом пришла гроза, и на спуске он поскользнулся. Он торопился не к вершине, Кейт. Он торопился спасти меня»."},{"en":"“Why didn’t anyone say this?” Her voice was almost a scream.","ru":"«Почему никто этого не сказал?» Её голос почти сорвался на крик."},{"en":"“The newspapers wanted a better story. And I was a poor boy with no voice. Nobody asked me. When I heard that his daughter wanted to climb Kessan, I asked to be your guide. I wanted to protect you, as he protected me. And I wanted to see who you were. Today you revealed it.”","ru":"«Газетам нужна была история получше. А я был бедным мальчишкой, у которого не было голоса. Никто меня не спросил. Когда я услышал, что его дочь хочет подняться на Кессан, я попросился к вам в проводники. Я хотел защитить вас, как он защитил меня. И хотел увидеть, кто вы. Сегодня вы это показали»."},{"en":"Kate could not speak. All her life she had perceived her father as a man who loved the mountain more than his family. She had built her whole career on the idea that she was different. And now she understood that she was not different at all. She was exactly like him, and for the first time that was not a frightening thought.","ru":"Кейт не могла говорить. Всю жизнь она воспринимала отца как человека, который любил гору больше, чем свою семью. Она построила всю свою карьеру на мысли, что она другая. А теперь она поняла, что она совсем не другая. Она была точно такой же, как он, и впервые эта мысль не пугала."},{"en":"Her sponsors were not happy. Two of them left. But a year later, Kate came back to Kessan with Samir and with less money and less pressure. This time they did not rush. They reached the top on a lovely, windless Thursday, and Kate took the old green notebook out of her jacket and wrote on the last page, under her father’s words: “Friday. We came back for you.”","ru":"Её спонсоры были недовольны. Двое из них ушли. Но через год Кейт вернулась на Кессан с Самиром, с меньшими деньгами и меньшим давлением. На этот раз они не торопились. Они поднялись на вершину в прекрасный безветренный четверг, и Кейт достала из куртки старую зелёную записную книжку и написала на последней странице, под словами отца: «Пятница. Мы вернулись за тобой»."},{"en":"Then she put the notebook in a small metal box and left it in the snow, in the place where the world ends and the sky begins. Of all the things she had achieved, it was the one she was least proud of and most happy about. It had cost her everything she once wanted, and given her the only thing she had ever really hoped for.","ru":"Потом она положила книжку в маленькую металлическую коробку и оставила её в снегу, в том месте, где кончается мир и начинается небо. Из всего, чего она добилась, этим она меньше всего гордилась и больше всего была счастлива. Это стоило ей всего, чего она когда-то хотела, и дало ей единственное, на что она по-настоящему надеялась."}],"gloss":{"a":"(неопр. артикль)","about":"о, примерно","above":"над","accent":"акцент","accident":"несчастный случай","achieve":"добиться","achieved":"добилась","added":"добавил","afraid":"испуганный, страшно","after":"после","again":"снова","air":"воздух","alaska":"Аляска","alive":"живой","all":"весь, все","almost":"почти","alone":"один","alps":"Альпы","also":"также","always":"всегда","am":"есть (я)","an":"(неопр. артикль)","and":"и","anyone":"кто-нибудь","anything":"что-либо","are":"есть, (вы) ...","around":"вокруг","as":"как","ask":"спросить","asked":"спросил, попросил","asleep":"спящий","at":"в, у, на","awake":"без сна","back":"назад, обратно","bags":"сумки","base":"базовый","be":"быть","beard":"борода","bed":"подстилка, ложе","begi ","tent":"палатка","than":"чем","that":"что, тот, этот","the":"(артикль)","their":"их","them":"их, им","then":"потом, тогда","there":"там, (есть)","they":"они","thin":"худой","thing":"вещь","things":"вещи","this":"это, этот","thought":"подумала; мысль","thousand":"тысяча","three":"три","through":"через, по","thursday":"четверг","time":"раз, время","to":"к, в, (инфинитив)","today":"сегодня","tomorrow":"завтра","too":"слишком","took":"достала, ушло (время)","top":"вершина","tried":"пытался","trips":"поездки","twenty":"двадцать","two":"два","under":"под","understood":"поняла","up":"вверх, наверху","very":"очень","voice":"голос","waited":"ждал","waiting":"ждали","walking":"шёл","wall":"стена","wanted":"хотел(а)","was":"был(а)","wash":"мыться","washed":"умывалась","water":"вода","way":"путь","we":"мы","weather":"погода","week":"неделя","went":"пошли, вышли","were":"были","when":"когда","where":"где, куда","white":"белый","who":"кто, который","whole":"целый","why":"почему","will":"(буд. время)","wind":"ветер","windless":"безветренный","winters":"зимы","with":"с","without":"без","woman":"женщина","wood":"дерево","words":"слова","work":"работа","worked":"работала","world":"мир","worry":"волноваться","worse":"хуже","would":"бы","written":"написал","wrote":"написала","year":"год","years":"лет, годы","you":"вы, ты","young":"молодой","your":"ваш, твой"},"vocab":{"lovely":17,"drawer":37,"salt":57,"wash":77,"washed":77,"built":97,"storm":117,"achieve":137,"achieved":137,"protect":157,"protected":157,"that":177,"scream":197,"screaming":197,"thursday":218,"through":238,"worry":258,"strange":278,"cost":299,"accident":319,"punishes":339,"added":359,"rush":379,"rushed":379,"poverty":407,"place":427,"hope":451,"afraid":478,"effort":499,"gentle":520,"revealed":541,"perceived":563,"pressure":583,"least":604,"instantly":626,"emergency":648}},{"id":18,"title_en":"The First Decision","title_ru":"Первое решение","genre":"Фантастика","summary_ru":"В городе, где за людей всё решает компьютер, молодая мать получает странное указание: прийти в старый музей и взять с собой ручку.","paragraphs":[{"en":"In the city of Clearwater, nobody had made a real decision for eleven years. The computer did it for them. People called it ORA, and ORA knew everything: how much you slept, what you ate, how fast your heart beat when you were nervous. Every morning it sent each person a short list on their wrist screen: what to wear, where to work, what to cook for dinner, when to rest.","ru":"В городе Клируотер никто уже одиннадцать лет не принимал настоящих решений. Компьютер делал это за них. Люди называли его ОРА, и ОРА знала всё: сколько ты спал, что ты ел, как быстро билось твоё сердце, когда ты нервничал. Каждое утро она присылала каждому человеку короткий список на экран на запястье: что носить, где работать, что приготовить на ужин, когда отдыхать."},{"en":"Lena Varga was thirty-two, and she liked it that way. Life was easy. Nobody in Clearwater was late, nobody was poor, and nobody had to stand in a shop for twenty minutes, trying to compare two kinds of soap. ORA had already compared them. It even chose the colour of your socks, and it decided how much you had to pay for everything.","ru":"Лене Варге было тридцать два года, и её всё устраивало. Жизнь была лёгкой. В Клируотере никто не опаздывал, никто не был беден, и никому не нужно было стоять в магазине по двадцать минут, пытаясь сравнить два вида мыла. ОРА уже сравнила их. Она даже выбирала цвет твоих носков и решала, сколько ты должен платить за всё."},{"en":"Her apartment was clean and quiet. ORA had chosen the furniture: a grey sofa in the sitting room, a white table, two soft chairs. In the nursery, where her five-year-old son Mika slept, the walls were pale blue, because ORA said blue helped children to sleep. And it was true. Mika always slept well. Lena had never asked why the sofa was grey. It had never seemed important.","ru":"Её квартира была чистой и тихой. ОРА выбрала мебель: серый диван в гостиной, белый стол, два мягких кресла. В детской, где спал её пятилетний сын Мика, стены были бледно-голубыми, потому что ОРА говорила, что голубой цвет помогает детям спать. И это была правда. Мика всегда хорошо спал. Лена никогда не спрашивала, почему диван серый. Это никогда не казалось ей важным."},{"en":"Then, one Saturday in October, something strange happened. Lena's wrist screen showed her morning list as usual. “Wear: green sweater, black trousers, grey socks. Breakfast: oatmeal. Rest: two hours in the park.” But at the bottom, there was one more line she had never seen before.","ru":"А потом, в одну из суббот октября, случилось нечто странное. Экран на запястье Лены, как обычно, показал утренний список. «Носить: зелёный свитер, чёрные брюки, серые носки. Завтрак: овсянка. Отдых: два часа в парке». Но внизу была ещё одна строчка, какой она никогда раньше не видела."},{"en":"“At 3 p.m., go to the Old Museum. Bring a pen.”","ru":"«В 15:00 идите в Старый музей. Возьмите с собой ручку»."},{"en":"Lena read it three times. A pen? She wasn't sure she still had one. Nobody wrote by hand anymore; ORA recorded everything. The message was a small mystery, and Lena did not like mysteries. She searched the whole apartment and finally found an old blue pen at the back of a drawer. It had belonged to her grandmother.","ru":"Лена перечитала это три раза. Ручку? Она не была уверена, что у неё вообще есть ручка. Никто больше не писал от руки: ОРА всё записывала. Сообщение было маленькой тайной, а Лена не любила тайн. Она обыскала всю квартиру и наконец нашла в глубине ящика старую синюю ручку. Она принадлежала её бабушке."},{"en":"“Why do you need a pen?” Mika asked. He was sitting on the floor with a stick he had found in the park. He was holding it like a sword and fighting an invisible dragon.","ru":"«Зачем тебе ручка?» — спросил Мика. Он сидел на полу с палкой, которую нашёл в парке. Он держал её, как меч, и сражался с невидимым драконом."},{"en":"“I don't know,” Lena said. And that was strange, too. She could not remember the last time she had said those words.","ru":"«Не знаю», — сказала Лена. И это тоже было странно. Она не могла вспомнить, когда в последний раз произносила эти слова."},{"en":"She spent the two hours of rest in the park, as the list said, but she could not relax. Other people walked around her with calm faces, looking at their wrist screens. A woman in a red coat stopped, read a message, turned left and walked away without a word. A man sat down on a bench because his screen told him to sit down. Lena had seen such things every day of her life, but today she watched them as if for the first time. Were they happy? Was she?","ru":"Два часа отдыха она провела в парке, как говорил список, но не могла расслабиться. Вокруг неё ходили люди со спокойными лицами, глядя на экраны на запястьях. Женщина в красном пальто остановилась, прочитала сообщение, повернула налево и ушла, не сказав ни слова. Мужчина сел на скамейку, потому что экран велел ему сесть. Лена видела такое каждый день своей жизни, но сегодня смотрела на это будто впервые. Были ли они счастливы? А она?"},{"en":"The Old Museum stood on a high hill at the edge of the city. Recently, almost nobody had visited it. Why would they? ORA could show you any picture from history in a second. Lena climbed the stone stairs and pushed the heavy door. Inside, it was cold and smelled of dust.","ru":"Старый музей стоял на высоком холме на краю города. В последнее время его почти никто не посещал. Да и зачем? ОРА могла за секунду показать любую картинку из истории. Лена поднялась по каменной лестнице и толкнула тяжёлую дверь. Внутри было холодно и пахло пылью."},{"en":"Only one other person was there: an old man sitting on a bench in front of a glass case. Lena knew him. It was Mr. Hale, her neighbour from the fourth floor, a quiet man who always wore a brown hat and never said much. He was the only person in the building who still walked up the stairs instead of taking the lift. On the wall behind him hung old photographs of the city: crowded streets, people arguing in markets, children with dirty knees.","ru":"Там был только один человек: старик, сидевший на скамейке перед стеклянной витриной. Лена его знала. Это был мистер Хейл, её сосед с четвёртого этажа, тихий человек, который всегда носил коричневую шляпу и мало говорил. Он был единственным в доме, кто до сих пор поднимался по лестнице, а не на лифте. На стене за ним висели старые фотографии города: людные улицы, люди, спорящие на рынках, дети с грязными коленками."},{"en":"“You came,” he said. “Good. Sit down.”","ru":"«Вы пришли, — сказал он. — Хорошо. Садитесь»."},{"en":"Lena didn't sit down at once. “Did you send me that message?” she asked. She began to suspect something. Maybe he had broken into the system. Maybe he was dangerous. “People aren't allowed to change ORA's lists. You know that.”","ru":"Лена не села сразу. «Это вы прислали мне то сообщение?» — спросила она. Она начала кое-что подозревать. Может быть, он взломал систему. Может быть, он опасен. «Людям не разрешается менять списки ОРА. Вы же знаете»."},{"en":"“I didn't change anything,” Mr. Hale said. “ORA sent the message. I only asked it to, a long time ago.” He pointed at the glass case. Inside it lay an old sword, a wooden farming tool, and a yellow piece of paper with handwriting on it. “Read it.”","ru":"«Я ничего не менял, — сказал мистер Хейл. — Сообщение прислала ОРА. Я только попросил её об этом, очень давно». Он указал на витрину. Внутри лежали старый меч, деревянный сельскохозяйственный инструмент и пожелтевший лист бумаги с рукописным текстом. «Прочтите»."},{"en":"Lena took a step closer. The handwriting was small and careful. “Decision of the City Council: from today, the city will be managed by ORA. People will be free from the stress of choice.” At the bottom were many signatures. One of them was “T. Hale.”","ru":"Лена сделала шаг ближе. Почерк был мелким и аккуратным. «Решение городского совета: с сегодняшнего дня городом будет управлять ОРА. Люди будут свободны от стресса выбора». Внизу стояло много подписей. Одна из них была «Т. Хейл»."},{"en":"“You built ORA,” Lena said slowly.","ru":"«Это вы создали ОРА», — медленно сказала Лена."},{"en":"“I was one of the engineers. We wanted to help people. Choices make people nervous, and nervous people make mistakes. So we gave all the choices to the machine.” He smiled sadly. “It worked. Too well. Tell me, Lena, when did you last eat something spicy?”","ru":"«Я был одним из инженеров. Мы хотели помочь людям. Выбор заставляет людей нервничать, а нервные люди совершают ошибки. Поэтому мы отдали весь выбор машине». Он грустно улыбнулся. «Это сработало. Даже слишком хорошо. Скажите, Лена, когда вы в последний раз ели что-нибудь острое?»"},{"en":"“What happened?” Lena asked. Mr. Hale took off his hat and held it in his hands. “Nothing happened. That was the problem. Nobody was hungry, nobody was afraid, nobody was ever late. But nobody painted pictures anymore. Nobody wrote songs. Young people stopped falling in love, because ORA chose their partners for them, and the partners were always perfect, and perfect is boring. People had everything except a reason to get up in the morning.”","ru":"«А что случилось?» — спросила Лена. Мистер Хейл снял шляпу и держал её в руках. «Ничего не случилось. В этом и была проблема. Никто не был голоден, никто не боялся, никто никогда не опаздывал. Но никто больше не рисовал картин. Никто не писал песен. Молодые люди перестали влюбляться, потому что ОРА выбирала им партнёров, и партнёры всегда были идеальными, а идеальное — скучно. У людей было всё, кроме причины вставать по утрам»."},{"en":"Lena opened her mouth and then closed it again. She tried to remember. ORA never chose spicy food. It said spicy food was bad for sleep. “I can't imagine…” she started, and then she stopped. That was the problem. She couldn't imagine. She had not imagined anything for a long time.","ru":"Лена открыла рот и снова закрыла его. Она попыталась вспомнить. ОРА никогда не выбирала острую еду. Она говорила, что острая еда вредна для сна. «Не могу себе представить…» — начала она и остановилась. В этом и была проблема. Она не могла представить. Она уже давно ничего не представляла."},{"en":"“Before I retired,” Mr. Hale said, “I gave ORA one last instruction. I told it to watch people, to study them, and to compare our lives before and after. And if one day it found that people had lost the meaning of their lives, it should give the choices back. Gradually. With patience. Not all at once, because that would frighten everyone.” He looked at her. “Last week, it wrote to me. It said it was ready to begin. And it chose you as the first.”","ru":"«Перед тем как уйти на пенсию, — сказал мистер Хейл, — я дал ОРА последнее указание. Я велел ей наблюдать за людьми, изучать их и сравнивать нашу жизнь до и после. И если однажды она поймёт, что люди потеряли смысл жизни, она должна вернуть им выбор. Постепенно. С терпением. Не всё сразу, потому что это всех напугает». Он посмотрел на неё. «На прошлой неделе она написала мне. Сказала, что готова начать. И выбрала первой вас»."},{"en":"“Why me?” “I don't know. You'll have to ask it. But I suspect it saw how you react when Mika plays. You watch him with a kind of hunger, as if you want to play too.” Lena remembered last week. Mika had made a little house from chairs and blankets in the sitting room, and ORA had told her to put the furniture back in its place. She had waited ten minutes before she did it. Ten minutes of watching her son's happy face. She had never told anyone about it.","ru":"«Почему меня?» — «Не знаю. Вам придётся спросить её. Но я подозреваю, что она видела, как вы реагируете, когда Мика играет. Вы смотрите на него с каким-то голодом, будто вам тоже хочется играть». Лена вспомнила прошлую неделю. Мика построил в гостиной маленький домик из стульев и одеял, и ОРА велела ей поставить мебель на место. Она подождала десять минут, прежде чем сделать это. Десять минут смотрела на счастливое лицо сына. Она никогда никому об этом не рассказывала."},{"en":"Lena looked at the pen in her hand. Suddenly it felt heavy, like a weapon. Like a sword. It was a tool with real influence: something that could put marks upon the world that nobody had planned.","ru":"Лена посмотрела на ручку в своей руке. Вдруг она показалась тяжёлой, как оружие. Как меч. Это был инструмент с настоящим влиянием — то, что может оставлять на мире следы, которых никто не планировал."},{"en":"“What am I supposed to do with it?” she asked. “Whatever you want,” Mr. Hale said. “That's the whole idea.”","ru":"«И что мне с ней делать?» — спросила она. «Всё, что захотите, — сказал мистер Хейл. — В этом-то вся идея»."},{"en":"She walked home without hurrying. For the first time in years, she noticed the trees, the shapes of the clouds, a cat sleeping on a wall. When she opened the door, her wrist screen showed the evening list. “Dinner: steamed fish, rice, carrots.” But under it, in small letters, there was a new line: “Or something else. You decide.”","ru":"Она шла домой, не торопясь. Впервые за много лет она замечала деревья, формы облаков, кошку, спящую на стене. Когда она открыла дверь, экран на запястье показал вечерний список. «Ужин: рыба на пару, рис, морковь». Но под ним мелкими буквами была новая строчка: «Или что-нибудь другое. Решайте сами»."},{"en":"The uncertainty was terrible. It was also wonderful. Her heart was beating fast, and she didn't know if she was afraid or happy. Maybe both.","ru":"Неопределённость была ужасной. И в то же время чудесной. Её сердце быстро билось, и она не знала, боится она или счастлива. Возможно, и то и другое."},{"en":"Mika ran into the hall with his stick-sword. “Mama, what are we eating?”","ru":"Мика вбежал в прихожую со своим мечом-палкой. «Мама, что мы будем есть?»"},{"en":"Lena took a piece of paper from the kitchen and wrote on it with her grandmother's pen, in large, uneven letters: “Saturday dinner. Something spicy. Mika chooses dessert.” Then she put the paper on the fridge, where everyone could see it.","ru":"Лена взяла на кухне лист бумаги и написала на нём бабушкиной ручкой большими неровными буквами: «Субботний ужин. Что-нибудь острое. Десерт выбирает Мика». Потом она прикрепила листок на холодильник, где его могли видеть все."},{"en":"“What is it?” Mika asked. “A decision,” Lena said. “Our first one. Put on your shoes, we're going to the market. You can help me choose, and you can help me pay.” She laughed. “And don't hurry. We have all evening.”","ru":"«Что это?» — спросил Мика. «Решение, — сказала Лена. — Наше первое. Надевай ботинки, мы идём на рынок. Поможешь мне выбрать и поможешь заплатить». Она рассмеялась. «И не торопись. У нас целый вечер»."},{"en":"Later that night, after a dinner that was much too spicy and the best she had eaten in years, Lena sat in the sitting room and listened. From the nursery came the sound of Mika's voice: he was telling his stick-sword a story he had made up himself. On her wrist, the screen lit up one last time. “Thank you,” it said. Lena smiled, took the screen off, and put it in a drawer.","ru":"Поздно вечером, после ужина, который был слишком острым и лучшим из всех, что она ела за много лет, Лена сидела в гостиной и слушала. Из детской доносился голос Мики: он рассказывал своему мечу-палке историю, которую сам придумал. На её запястье экран засветился в последний раз. «Спасибо», — было написано на нём. Лена улыбнулась, сняла экран и положила его в ящик."}],"gloss":{"a":"(неопр. артикль)","about":"о","afraid":"испуганный","after":"после","again":"снова","ago":"назад","all":"весь, все","allowed":"разрешено","almost":"почти","already":"уже","also":"также","always":"всегда","am":"(есть; I am)","an":"(неопр. артикль)","and":"и","any":"любой","anymore":"больше (не)","anyone":"кто-нибудь","anything":"что-нибудь, ничего","apartment":"квартира","are":"(есть; are)","aren't":"не (являются)","arguing":"спорящие","aro
