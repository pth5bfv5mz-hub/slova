<style>
/* Layout: one narrow column like a stack of index cards; tabs on top, card in the middle, stats below. */
:root{
  --paper:#11151f; --card:#1a2030; --ink:#e7ebf5; --muted:#98a2bd; --line:#2c3447;
  --accent:#7d95ff; --accent-ink:#0d1220; --mark:#ffd84a;
  --good:#5fd08d; --good-bg:#183326; --mid-bg:#3a3317; --bad:#ff8080; --bad-bg:#3a1d22; color-scheme:dark;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151f; --card:#1a2030; --ink:#e7ebf5; --muted:#98a2bd; --line:#2c3447;
  --accent:#7d95ff; --accent-ink:#0d1220; --mark:#ffd84a;
  --good:#5fd08d; --good-bg:#183326; --mid-bg:#3a3317; --bad:#ff8080; --bad-bg:#3a1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --card:#1a2030; --ink:#e7ebf5; --muted:#98a2bd; --line:#2c3447;
  --accent:#7d95ff; --accent-ink:#0d1220; --mark:#ffd84a;
  --good:#5fd08d; --good-bg:#183326; --mid-bg:#3a3317; --bad:#ff8080; --bad-bg:#3a1d22; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo span{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:6px;padding:0 2px}
.sync{font-size:12px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
nav button{font:600 14px var(--f-body);border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.big{border:0;background:var(--accent);color:var(--accent-ink);font:600 17px var(--f-body);padding:15px 18px;border-radius:12px;cursor:pointer;width:100%}
.big:disabled{opacity:.45;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px var(--f-body);padding:12px 14px;border-radius:12px;cursor:pointer}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 18px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(20,30,60,.35)}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.tcard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tcard .g{font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.tcard .t{font:500 18px/1.25 var(--f-display)}
.tcard .tr2{font-size:14px;color:var(--muted)}
.tcard .s{font-size:14px;line-height:1.4}
.badge{font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.badge.done{background:var(--good-bg);color:var(--good);border-color:transparent}
.badge.go{background:var(--mid-bg);color:var(--ink);border-color:transparent}
.reader{display:flex;flex-direction:column;gap:18px;padding-bottom:120px}
.reader h1{font:500 clamp(24px,6vw,32px)/1.2 var(--f-display);margin:0;text-wrap:balance}
.para{display:flex;flex-direction:column;gap:6px}
.para p{margin:0;font-size:19px;line-height:1.6}
.para .pru{font-size:16px;line-height:1.5;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.ptools{display:flex;gap:6px}
.pbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px var(--f-body);padding:4px 10px;border-radius:999px;cursor:pointer}
.tw{cursor:pointer;border-radius:4px}
.tw:hover{background:var(--line)}
.tw.v{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-style:dotted}
.tw.sel{background:var(--accent);color:var(--accent-ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px -10px rgba(0,0,0,.6);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet .row1{display:flex;align-items:center;gap:10px}
.sheet .wd{font:600 24px var(--f-display);flex:1;min-width:0;overflow-wrap:anywhere}
.sheet .gl{font-size:20px}
.sheet .dv{font-size:14px;color:var(--muted)}
.sheet .x{border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;padding:4px 8px}
.say{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.say svg{width:22px;height:22px}
.dirtag{align-self:flex-start;font:600 11px var(--f-mono);letter-spacing:.06em;background:var(--paper);color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
.prompt{font-family:var(--f-display);font-weight:500;font-size:clamp(26px,7vw,38px);line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tr{text-align:center;color:var(--muted);font-size:14px;margin-top:-10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 12px;font-size:16px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-height:54px;overflow-wrap:anywhere}
.opt b{font:600 12px var(--f-mono);color:var(--muted);padding-top:3px}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.inp{width:100%;font:500 20px var(--f-body);padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb strong{color:var(--ink)}
.fb.mid{background:var(--mid-bg);color:var(--ink)}
.prompt.sent{font-family:var(--f-body);font-weight:500;font-size:clamp(21px,5.6vw,27px);line-height:1.35}
.prompt mark,.ref mark{background:none;color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;text-underline-offset:7px;text-decoration-skip-ink:none;padding:0}
textarea.inp{min-height:100px;resize:vertical;font-size:18px;line-height:1.4;font-family:var(--f-body)}
.ref{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:16px;display:flex;flex-direction:column;gap:4px}
.ref .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.ref .k:first-child{margin-top:0}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--paper);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:280px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:76px 1fr 56px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.blk .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.blk .track i{display:block;height:100%}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .w{min-width:0;overflow-wrap:anywhere}
.li .w small{display:block;color:var(--muted);font-size:13px}
.li .n{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:3px;background:var(--line)}
.dot.s1{background:var(--mark)} .dot.s2{background:var(--good)} .dot.s3{background:var(--bad)}
.num{font:12px var(--f-mono);color:var(--muted);margin-right:6px}
.empty{color:var(--muted);font-size:14px}
.warn{font-size:13px;background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px}
.res{font-family:var(--f-display);font-weight:700;font-size:48px;text-align:center;font-variant-numeric:tabular-nums}
.res small{display:block;font:500 15px var(--f-body);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const WORDS = RAW.map(([n,en,ru,tr]) => ({n,en,ru,tr,key:en.toLowerCase()}));
const BYKEY = Object.fromEntries(WORDS.map(w=>[w.key,w]));
const BLOCKS = [[1,100],[101,200],[201,300],[301,400],[401,500],[501,600],[601,652]];
const DIRS = {er:'EN → RU', re:'RU → EN'};
const TTS = ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) ? window.speechSynthesis : null;
let VOICES = [];
function loadVoices(){ try{ VOICES = TTS.getVoices() || []; }catch(e){} }
if(TTS){ loadVoices(); try{ TTS.addEventListener('voiceschanged', loadVoices); }catch(e){} }
function pickVoice(lang){
  const vs = VOICES.filter(v => (v.lang||'').toLowerCase().replace('_','-').startsWith(lang));
  const pref = lang==='en' ? ['en-us','en-gb'] : ['ru-ru'];
  const good = vs.filter(v => pref.includes((v.lang||'').toLowerCase().replace('_','-')));
  return good.find(v => /samantha|daniel|karen|google|milena|yuri|premium|enhanced/i.test(v.name)) || good[0] || vs[0] || null;
}
function speak(text, lang, force){
  if(!TTS || !text || (cfg.voice==='off' && !force)) return;
  try{
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ', ').replace(/\(([^)]*)\)/g, ', $1,'));
    u.lang = lang==='en' ? 'en-US' : 'ru-RU';
    const v = pickVoice(lang); if(v) u.voice = v;
    u.rate = lang==='en' ? 0.9 : 1;
    TTS.speak(u);
  }catch(e){}
}
const MASTER = 3; // правильных подряд, чтобы слово считалось выученным

/* ---------- текст и проверка ответа ---------- */
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[.,!?;:"'«»]/g,' ').replace(/\s+/g,' ').trim();
const parts = s => s.split(/[\/,]/).map(norm).filter(Boolean);
function ruParts(w){ const p = parts(w.ru); const extra=[]; for(const x of p){ if(x.startsWith('к ')) extra.push(x.slice(2)); } return p.concat(extra); }
function enVariants(w){ const e=norm(w.en); const v=[e]; if(e.startsWith('to ')) v.push(e.slice(3)); if(e.startsWith('a ')) v.push(e.slice(2)); return v; }
function lev(a,b){ if(Math.abs(a.length-b.length)>1) return 2; const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function accepted(w,dir){
  if(dir==='er') return ruParts(w);
  const mine = new Set(ruParts(w)); const out = new Set(enVariants(w));
  for(const o of WORDS){ if(o!==w && ruParts(o).some(p=>mine.has(p))) enVariants(o).forEach(v=>out.add(v)); }
  return [...out];
}
function check(input, w, dir){
  const a = norm(input); if(!a) return {ok:false};
  const acc = accepted(w,dir);
  if(acc.includes(a)) return {ok:true};
  const typo = acc.find(x=>x.length>=5 && lev(a,x)===1);
  if(typo) return {ok:true, typo};
  return {ok:false};
}

/* ---------- хранилище ---------- */
const LS_KEY = 'slova-test-v1';
const blank = () => ({v:1, updated:0, words:{}, days:{}, sessions:[], read:{}});
let S = blank();
function lsRead(){ try{ const t=localStorage.getItem(LS_KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function sane(x){ if(!x||typeof x!=='object') return blank(); return {v:1, updated:+x.updated||0, words:x.words&&typeof x.words==='object'?x.words:{}, days:x.days&&typeof x.days==='object'?x.days:{}, sessions:Array.isArray(x.sessions)?x.sessions:[], read:x.read&&typeof x.read==='object'?x.read:{}}; }
S = sane(lsRead());

let dbDoc = null, saving = false, dirty = false, saveTimer = null;
function save(){
  S.updated = Date.now(); lsWrite();
  if(!dbDoc) return; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if(!dbDoc || saving || !dirty) return; saving = true; dirty = false;
  try{ await dbDoc.set(JSON.parse(JSON.stringify(S))); setSync('Прогресс сохранён в аккаунте'); }
  catch(e){ dirty = true; setSync('Не удалось сохранить в аккаунт, сохранено на устройстве'); }
  saving = false; if(dirty) saveTimer = setTimeout(flush, 3000);
}
function setSync(t){ document.getElementById('sync').textContent = t; }
async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc('data/users/'+id+'/state/main');
    const snap = await Promise.race([ref.get(), new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
    dbDoc = ref;
    if(snap.exists){ const remote = sane(snap.data()); if(remote.updated > S.updated){ S = remote; lsWrite(); render(); } else if(S.updated > remote.updated){ dirty=true; flush(); } }
    else if(S.updated){ dirty=true; flush(); }
    setSync('Прогресс сохраняется в аккаунте');
  }catch(e){ /* остаёмся на локальном хранении */ }
}

/* ---------- учёт ответов ---------- */
const today = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function rec(key,dir){ const w = S.words[key] ||= {}; return w[dir] ||= {c:0,x:0,s:0,t:0}; }
function peek(key,dir){ return S.words[key]?.[dir]; }
function record(key,dir,ok){
  const r = rec(key,dir); if(ok){ r.c++; r.s++; } else { r.x++; r.s=0; } r.t = Date.now();
  const d = S.days[today()] ||= {r:0,w:0,q:0}; ok ? d.r++ : d.w++;
  save();
}
function status(key,dir){ const r=peek(key,dir); if(!r) return 0; if(r.s>=MASTER) return 2; if(r.x>0 && r.s<2) return 3; return 1; }

const SET_KEY = 'slova-test-settings';
let cfg = {dir:'er', mode:'type', input:'no', blocks:[0], filter:'smart', count:20};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem(SET_KEY)||'{}')); }catch(e){}
if(cfg.mode!=='type' && cfg.mode!=='sent') cfg.mode = 'type';
if(cfg.input!=='yes') cfg.input = 'no';
if(cfg.voice!=='off') cfg.voice = 'on';
function saveCfg(){ try{ localStorage.setItem(SET_KEY, JSON.stringify(cfg)); }catch(e){} }

function pool(){
  const bl = cfg.blocks.length ? cfg.blocks : BLOCKS.map((_,i)=>i);
  return WORDS.filter(w => bl.some(i => w.n>=BLOCKS[i][0] && w.n<=BLOCKS[i][1]));
}
function dirFor(){ return cfg.dir==='mix' ? (Math.random()<.5?'er':'re') : cfg.dir; }
function buildQuiz(opts={}){
  let base = opts.words || pool();
  const items = [];
  for(const w of base){
    if(cfg.mode==='sent' && !SENT[w.n]) continue;
    const dir = dirFor();
    const r = peek(w.key,dir);
    let weight;
    if(opts.words) weight = 1;
    else if(cfg.filter==='new'){ if(r) continue; weight=1; }
    else if(cfg.filter==='weak'){ if(!r || status(w.key,dir)!==3) continue; weight=1+r.x; }
    else if(cfg.filter==='all') weight = 1;
    else weight = !r ? 2.5 : r.s>=MASTER ? 0.35 : 1 + r.x*1.2 - r.s*0.25 + Math.min(3,(Date.now()-r.t)/864e5/3);
    items.push({w,dir,weight:Math.max(.05,weight)});
  }
  const n = opts.words ? items.length : (cfg.count==='all' ? items.length : Math.min(cfg.count, items.length));
  const out = [];
  while(out.length<n && items.length){
    let tot = items.reduce((a,b)=>a+b.weight,0), r = Math.random()*tot, i = 0;
    for(; i<items.length-1; i++){ r -= items[i].weight; if(r<=0) break; }
    out.push(items.splice(i,1)[0]);
  }
  return out.map(({w,dir})=>({w,dir}));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function options(w,dir){
  const mine = new Set(ruParts(w));
  const cand = shuffle(WORDS.filter(o => o!==w && !ruParts(o).some(p=>mine.has(p)))).slice(0,3);
  return shuffle([w,...cand]).map(o => ({w:o, label: dir==='er' ? o.ru : o.en}));
}

function sayAnswer(it){ const w=it.w, s=SENT[w.n]; if(Q.mode==='sent' && s) speak(it.dir==='er'?s.ru:s.en, it.dir==='er'?'ru':'en'); else speak(it.dir==='er'?w.ru:w.en, it.dir==='er'?'ru':'en'); }

function verdictBtns(){ return `<div class="selfgrade"><button class="big" id="sg-ok" style="background:var(--good)">Верно</button><button class="big" id="sg-no" style="background:var(--bad)">Неверно</button></div>`; }
function bindVerdict(apply){
  const pick = ok => { if(!Q.busy) return; Q.busy = false; apply(ok); next(); };
  document.getElementById('sg-ok').onclick = () => pick(true);
  document.getElementById('sg-no').onclick = () => pick(false);
}
function hl(s, key){ const i = key ? s.indexOf(key) : -1; return i<0 ? esc(s) : esc(s.slice(0,i))+'<mark>'+esc(key)+'</mark>'+esc(s.slice(i+key.length)); }
function stem(x){ const n=x.length; return n>=6 ? x.slice(0,n-2) : n>=4 ? x.slice(0,n-1) : x; }
function kwMatch(ans, targets){
  const toks = norm(ans).split(' ');
  return targets.filter(Boolean).some(tg => { let tt = norm(tg).split(' ').filter(Boolean); if(tt.length>1) tt = tt.filter(x=>x.length>2); if(!tt.length) return false;
    return tt.every(x => { const st = stem(x); return toks.some(k => k.startsWith(st)); }); });
}
let SAMPLE = null;
function sentPrompt(w,dir,s,val){
  const src = dir==='er'?s.en:s.ru, ref = dir==='er'?s.ru:s.en;
  return `Ты проверяешь перевод ученика (взрослый, родной язык русский, уровень английского A2–B1). Направление: ${dir==='er'?'с английского на русский':'с русского на английский'}.

Эталонный перевод: "${ref}"
Ключевое слово: "${dir==='er'?s.ek:s.rk}". По словарю ученика его перевод: "${dir==='er'?w.ru:w.en}". Подходит любая уместная форма или синоним.
Ответ ученика: "${val.trim()}"

Оценивай по смыслу и грамматике, мягко: другой порядок слов, синонимы и стилистические отличия от эталона допустимы.
verdict: "correct" — смысл передан, грамматика в порядке; "minor" — смысл понятен, но есть мелкие ошибки (артикль, окончание, время, опечатка); "wrong" — смысл искажён или предложение переведено не полностью.
wordOk: true, если ключевое слово переведено правильно.
comment: 1–2 коротких предложения по-русски, на «ты», без глаголов прошедшего времени, которые выдают пол (пиши «в твоём ответе», а не «ты написал»). Если ошибки есть, назови главную.
fixed: ответ ученика с минимальными исправлениями, или тот же текст, если ошибок нет.
Ответь только JSON: {"verdict":"correct","wordOk":true,"comment":"...","fixed":"..."}`;
}
function scoreSent(it, ok, wordOk){ Q.answered = true; record(it.w.key, it.dir, wordOk); if(ok) Q.right++; else Q.wrong.push(it); }
function sentFb(it, val, r){
  const w=it.w, dir=it.dir, s=SENT[w.n], ref = dir==='er'?s.ru:s.en, refKey = dir==='er'?s.rk:s.ek;
  const cls = r.self?'mid':r.verdict==='correct'?'ok':r.verdict==='minor'?'mid':'no';
  const head = r.final?'Без ответа.':r.self?'':r.verdict==='correct'?'Claude: верно.':r.verdict==='minor'?'Claude: почти верно.':'Claude: неверно.';
  const fixed = r.fixed && norm(r.fixed)!==norm(val) ? `<span class="k">Твой перевод с исправлениями</span><span>${esc(r.fixed)}</span>` : '';
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="group"><div class="fb ${cls}">${head} ${r.comment?esc(r.comment):''}</div>
    <div class="ref"><span class="k">Эталонный перевод</span><span>${hl(ref, refKey)}</span>${fixed}
    <span class="k">Слово</span><span>${esc(w.en)}${w.tr?` [${esc(w.tr)}]`:''} — ${esc(w.ru)}${r.final?'':` · ${r.wordOk?'<span style="color:var(--good)">в переводе есть</span>':'<span style="color:var(--bad)">в переводе не видно</span>'}`}</span></div>
    ${r.final?`<button class="big" id="next">${Q.i+1<Q.items.length?'Дальше':'Результат'}</button>`:`${verdictBtns()}${r.why?`<div class="hint">${esc(r.why)}</div>`:''}`}</div>`;
  if(r.final){ const nb=document.getElementById('next'); nb.onclick = next; nb.focus({preventScroll:true}); }
  else { Q.busy = true; bindVerdict(ok => scoreSent(it, ok, ok)); }

async function answerSent(val){
  const it = Q.items[Q.i], w = it.w, dir = it.dir, s = SENT[w.n];
  Q.busy = true;
  const inp = document.getElementById('answer'); inp.readOnly = true; document.getElementById('idk').hidden = true; view.querySelector('#f .row').hidden = true; view.querySelector('#f .big').hidden = true;
  const kwOk = kwMatch(val, dir==='er' ? [...ruParts(w), s.rk] : [...enVariants(w), s.ek]);
  if(!val.trim()){ scoreSent(it, false, false); sentFb(it, val, {final:true, verdict:'wrong', wordOk:false, comment:'Посмотри перевод и попробуй запомнить это предложение.'}); return; }
  if(SAMPLE){
    document.getElementById('fb').innerHTML = '<div class="fb mid">Claude проверяет перевод…</div>';
    try{
      const r = await SAMPLE.json(sentPrompt(w,dir,s,val), {modelTier:'quick'});
      if(!Q || Q.items[Q.i]!==it) return;
      const verdict = ['correct','minor','wrong'].includes(r?.verdict) ? r.verdict : (kwOk?'minor':'wrong');
      const wordOk = typeof r?.wordOk==='boolean' ? r.wordOk : kwOk;
      sentFb(it, val, {verdict, wordOk, comment: typeof r?.comment==='string'?r.comment:'', fixed: typeof r?.fixed==='string'?r.fixed:''});
      return;
    }catch(e){
      if(!Q || Q.items[Q.i]!==it) return;
      if(e?.code==='not_granted') SAMPLE = null;
      sentFb(it, val, {self:true, wordOk:kwOk, verdict:kwOk?'minor':'wrong', comment: kwOk?'Нужное слово в переводе есть.':'Нужного слова в переводе не видно.', why: e?.code==='not_granted' ? 'Проверка через Claude не разрешена, поэтому оценка за тобой.' : 'Claude сейчас не ответил, поэтому оценка за тобой.'});
      return;
    }
  }
  sentFb(it, val, {self:true, wordOk:kwOk, verdict:kwOk?'minor':'wrong', comment: kwOk?'Нужное слово в переводе есть.':'Нужного слова в переводе не видно.'});
}
function next(){ Q.answered=false; Q.busy=false; Q.i++; if(Q.i>=Q.items.length){ Q.done=true; finish(); } else render(); }
function finish(){
  const n = Q.right + Q.wrong.length;

}

/* ---------- статистика ---------- */
function streakDays(){ let n=0; const d=new Date(); if(!S.days[today(d)]?.r && !S.days[today(d)]?.w) d.setDate(d.getDate()-1);
  for(;;){ const k=today(d); const x=S.days[k]; if(x && (x.r+x.w)>0){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
function renderStats(){
  let R=0,W=0; for(const k in S.days){ R+=S.days[k].r; W+=S.days[k].w; }
  const tot=R+W, acc = tot?Math.round(R/tot*100):0;
  const cnt = dir => { let m=0,s=0; for(const w of WORDS){ const st=status(w.key,dir); if(st) s++; if(st===2) m++; } return {m,s}; };
  const er=cnt('er'), re=cnt('re');
  // последние 14 дней
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=today(d); days.push({k, d, r:S.days[k]?.r||0, w:S.days[k]?.w||0}); }
  const max = Math.max(10, ...days.map(x=>x.r+x.w)); const nice = Math.ceil(max/10)*10;
  const Wd=380,H=170,L=30,B=24,T=10, bw=(Wd-L-6)/14;
  const y = v => T + (H-T-B)*(1-v/nice);
  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Ответы за 14 дней">`;
  for(const t of [0,nice/2,nice]){ svg+=`<line x1="${L}" x2="${Wd}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="JetBrains Mono,monospace">${t}</text>`; }
  days.forEach((x,i)=>{ const cx=L+i*bw+3, w=bw-6;
    if(x.r) svg+=`<rect x="${cx}" y="${y(x.r)}" width="${w}" height="${y(0)-y(x.r)}" rx="2" fill="var(--good)"><title>${x.k}: верно ${x.r}</title></rect>`;
    if(x.w) svg+=`<rect x="${cx}" y="${y(x.r+x.w)}" width="${w}" height="${y(x.r)-y(x.r+x.w)}" rx="2" fill="var(--bad)"><title>${x.k}: ошибок ${x.w}</title></rect>`;
    if(i%3===1||i===13) svg+=`<text x="${cx+w/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="${i===13?'var(--ink)':'var(--muted)'}" font-family="JetBrains Mono,monospace">${x.d.getDate()}.${String(x.d.getMonth()+1).padStart(2,'0')}</text>`;
  });
  svg+='</svg>';
  const hard = WORDS.map(w=>{ const a=peek(w.key,'er')||{c:0,x:0}, b=peek(w.key,'re')||{c:0,x:0}; return {w, x:a.x+b.x, c:a.c+b.c}; }).filter(o=>o.x>0).sort((a,b)=>b.x-a.x || a.c-b.c).slice(0,15);

    </div>
    <div class="hint">Слово считается выученным после ${MASTER} правильных ответов подряд. Одна ошибка — и оно снова в работе.</div>
  </div>
  <div class="panel">

  </div>
  <div class="panel">
    <div class="lbl">Прогресс по диапазонам</div>
    <div class="blocks">${BLOCKS.map(([a,b])=>{ const ws=WORDS.filter(w=>w.n>=a&&w.n<=b); let m=0,s=0,e=0; ws.forEach(w=>{ for(const d of ['er','re']){ const st=status(w.key,d); if(st===2)m++; else if(st===3)e++; else if(st===1)s++; } }); const T2=ws.length*2;
      return `<div class="blk"><span>${a}–${b}</span><span class="track"><i style="width:${m/T2*100}%;background:var(--good)"></i><i style="width:${s/T2*100}%;background:var(--mark)"></i><i style="width:${e/T2*100}%;background:var(--bad)"></i></span><span style="text-align:right">${Math.round(m/T2*100)}%</span></div>`; }).join('')}</div>
    <div class="legend" style="flex-wrap:wrap"><span><i style="background:var(--good)"></i>выучено</span><span><i style="background:var(--mark)"></i>в процессе</span><span><i style="background:var(--bad)"></i>ошибка</span></div>
    <div class="hint">Считаются оба направления: каждое слово надо выучить и с английского, и с русского.</div>

  </div>`;

/* ---------- тексты ---------- */
const TEXTS = [{"id":1,"title_en":"The House on Silver Lake","title_ru":"Дом на Серебряном озере","genre":"Мистика","summary_ru":"Агент по недвижимости получает странного клиента, который хочет купить дом у озера, где никто не живёт уже шестьдесят лет.","paragraphs":[{"en":"Anna Bell had worked at the small estate agency in Millford for three years, and she managed most of its sales herself. Her boss often said that she could sell a house to a fish. However, nobody had ever managed to sell the old house on Silver Lake.","ru":"Анна Белл три года проработала в маленьком агентстве недвижимости в Миллфорде и сама вела большую часть его продаж. Начальник часто говорил, что она может продать дом даже рыбе. Однако продать старый дом на Серебряном озере не удавалось никому."},{"en":"It was cheap — the cheapest house in the whole area. The price included the furniture, a boat and a small piece of forest. Still, every customer who went to see it came back pale and silent, and nobody wanted to talk about what they had seen there.","ru":"Он был дешёвым — самым дешёвым домом во всей округе. В цену входили мебель, лодка и небольшой кусок леса. И всё же каждый клиент, который ездил его смотреть, возвращался бледным и молчаливым, и никто не хотел рассказывать, что он там видел."},{"en":"Anna's boss had a simple explanation. \"People are afraid of old houses,\" he said. \"They watch too many films.\" Anna agreed with him. She had no time for ghost stories. She had rent to pay, and she often worked until late at night.","ru":"У начальника Анны было простое объяснение. «Люди боятся старых домов, — говорил он. — Они смотрят слишком много фильмов». Анна была с ним согласна. Ей было некогда думать об историях про привидения. Ей нужно было платить за квартиру, и она часто работала до поздней ночи."},{"en":"So Anna was surprised when an old man walked into the office one rainy Monday morning. He was tall and thin, and he wore a grey coat that looked older than he was. \"I would like to buy the house on Silver Lake,\" he said quietly. \"My name is Thomas Reed.\"","ru":"Поэтому Анна удивилась, когда однажды дождливым утром в понедельник в офис вошёл пожилой мужчина. Он был высоким и худым, и на нём было серое пальто, которое выглядело старше его самого. «Я хотел бы купить дом на Серебряном озере, — тихо сказал он. — Меня зовут Томас Рид»."},{"en":"\"With pleasure,\" Anna said, and she smiled. \"Would you like to see it first? I can take you there tomorrow.\"","ru":"«С удовольствием», — сказала Анна и улыбнулась. «Хотите сначала его посмотреть? Я могу отвезти вас туда завтра»."},{"en":"\"No,\" he said. \"I know the house. I only wish to buy it. But I suggest that you go there yourself before we sign anything. Go alone. Explore it. Then come back and tell me if you still want to sell it to me.\"","ru":"«Нет, — сказал он. — Я знаю этот дом. Я лишь желаю его купить. Но я предлагаю вам съездить туда самой, прежде чем мы что-нибудь подпишем. Поезжайте одна. Осмотрите его. А потом возвращайтесь и скажите, хотите ли вы всё ещё продать его мне»."},{"en":"He left before she could ask any more questions. Through the window she watched him walk down the street, and she noticed something strange: although it was raining hard, his coat looked completely dry.","ru":"Он ушёл раньше, чем она успела задать ещё какие-нибудь вопросы. Через окно она смотрела, как он идёт по улице, и заметила кое-что странное: хотя шёл сильный дождь, его пальто выглядело совершенно сухим."},{"en":"For the rest of the day Anna could not stop thinking about him. Something in his eyes had made her sad, as if he had been waiting for something for a very long time.","ru":"Весь остаток дня Анна не могла перестать о нём думать. Что-то в его глазах её опечалило, как будто он чего-то ждал очень-очень долго."},{"en":"That evening Anna looked through the agency's records. The house had belonged to a family called Reed until 1961. Then the government had taken it. There was a copy of an old notice in the file: \"By order of the government, this property will be used for a new dam. The owners must leave within thirty days.\" But the dam had never been built. The house had simply stood empty for more than sixty years.","ru":"В тот вечер Анна просмотрела записи агентства. До 1961 года дом принадлежал семье по фамилии Рид. Потом его забрало правительство. В папке лежала копия старого уведомления: «По распоряжению правительства эта собственность будет использована для новой плотины. Владельцы обязаны покинуть её в течение тридцати дней». Но плотину так и не построили. Дом просто простоял пустым больше шестидесяти лет."},{"en":"\"That was an abuse of power,\" said Mrs. Hall, the old woman who ran the shop next to the agency, when Anna asked her about it the next morning. Mrs. Hall was eighty-five and had the best knowledge of local history in Millford. People said that she was wise; Anna thought that she was simply a good listener.","ru":"«Это было злоупотребление властью», — сказала миссис Холл, пожилая женщина, державшая магазин рядом с агентством, когда Анна спросила её об этом на следующее утро. Миссис Холл было восемьдесят пять, и никто в Миллфорде не знал местную историю лучше неё. Люди говорили, что она мудрая; Анна считала, что она просто умеет хорошо слушать."},{"en":"\"The Reeds didn't want to leave,\" Mrs. Hall went on. \"Thomas Reed and his young wife, Lily. They had built that house with their own hands. When the government men came, Thomas refused to go. A week later there was an accident on the lake. Thomas went out in his boat during a storm and never came back. Lily left the village soon after his death. She was never seen here again.\"","ru":"«Риды не хотели уезжать, — продолжила миссис Холл. — Томас Рид и его молодая жена Лили. Они построили этот дом своими руками. Когда пришли люди из правительства, Томас отказался уезжать. Через неделю на озере случилось несчастье. Томас вышел на лодке в шторм и не вернулся. Лили уехала из деревни вскоре после его смерти. Больше её здесь никогда не видели»."},{"en":"Anna felt cold. \"Thomas Reed?\" she repeated. \"Are you sure that's correct?\"","ru":"Анне стало холодно. «Томас Рид?» — повторила она. «Вы уверены, что это правильно?»"},{"en":"\"Of course I'm sure. I was only a girl, but I remember it. Why?\" Anna did not answer.","ru":"«Конечно, уверена. Я была тогда совсем девочкой, но я это помню. А что?» Анна не ответила."},{"en":"In the afternoon she drove to the lake. The road went up through dark trees, and from its peak she could see the water below, grey and still under the grey sky. The house stood on the far shore. It was larger than she had expected, with a wide wooden porch and tall windows. There was an announcement on the car radio about a storm coming from the north, so she put on her raincoat before she got out.","ru":"Днём она поехала к озеру. Дорога поднималась среди тёмных деревьев, и с самой её высокой точки было видно воду внизу, серую и неподвижную под серым небом. Дом стоял на дальнем берегу. Он оказался больше, чем она ожидала, с широким деревянным крыльцом и высокими окнами. По радио в машине передали объявление о шторме, идущем с севера, поэтому, прежде чем выйти, она надела плащ."},{"en":"The door was not locked. Inside, everything was covered in dust, but the furniture was still there: chairs, a table, a piano, and in the corner an old record player. On the wall hung a photograph of a young couple standing in front of the house. The man was tall and thin. Anna stepped forward to look more closely, and her heart began to beat faster. It was the man from her office — exactly the same face, only sixty years younger.","ru":"Дверь не была заперта. Внутри всё было покрыто пылью, но мебель осталась на месте: стулья, стол, пианино, а в углу — старый проигрыватель. На стене висела фотография молодой пары перед домом. Мужчина был высоким и худым. Анна шагнула вперёд, чтобы рассмотреть получше, и её сердце забилось быстрее. Это был мужчина из её офиса — точно такое же лицо, только на шестьдесят лет моложе."},{"en":"In the background of the photograph, at one of the upstairs windows, there was a third person, or perhaps only a shadow. Anna could not tell.","ru":"На заднем плане фотографии, в одном из окон второго этажа, был кто-то третий — а может, просто тень. Анна не могла понять."},{"en":"Next to the record player there was a single record. On its paper label someone had written by hand: \"For Lily. Play it when you miss me.\" Anna's hands were shaking, but she placed the record on the player and moved the needle.","ru":"Рядом с проигрывателем лежала одна-единственная пластинка. На её бумажной наклейке кто-то написал от руки: «Для Лили. Включи её, когда будешь скучать по мне». У Анны дрожали руки, но она поставила пластинку на проигрыватель и опустила иглу."},{"en":"At first there was only a soft noise. Then a man's voice began to speak — the same quiet voice that she had heard in her office. \"Lily, if you are listening to this record, it means that I didn't come back from the lake. Don't be sad. I wasn't afraid of death. I was only afraid of leaving you alone. I am going to wait for you here, in our house, however long it takes. Come home when you can.\"","ru":"Сначала был слышен только тихий шум. Потом заговорил мужской голос — тот самый тихий голос, который она слышала у себя в офисе. «Лили, если ты слушаешь эту запись, значит, я не вернулся с озера. Не грусти. Я не боялся смерти. Я боялся только оставить тебя одну. Я буду ждать тебя здесь, в нашем доме, сколько бы времени ни прошло. Возвращайся домой, когда сможешь»."},{"en":"The record ended. The house was silent. Outside, the first drops of rain hit the windows, and somewhere upstairs the floor made a sound. Anna looked up. For a moment she saw a shadow move across the top of the stairs.","ru":"Пластинка закончилась. В доме стало тихо. Снаружи первые капли дождя ударили в окна, и где-то наверху скрипнул пол. Анна подняла глаза. На мгновение она увидела, как тень скользнула по верху лестницы."},{"en":"She did not run. Strangely, she was not afraid any more. She understood now why the customers had left so quickly. The house was not empty. It was waiting.","ru":"Она не побежала. Как ни странно, ей больше не было страшно. Теперь она понимала, почему клиенты уезжали так быстро. Дом не был пустым. Он ждал."},{"en":"Before she left, she went upstairs. The bedroom was small and clean, much cleaner than the rooms below, as if someone still lived there. On the bed lay a woman's blue scarf. Anna touched it gently. There was no dust on it at all, and it was warm.","ru":"Перед тем как уйти, она поднялась наверх. Спальня была маленькой и чистой, гораздо чище, чем комнаты внизу, как будто там кто-то всё ещё жил. На кровати лежал женский синий шарф. Анна осторожно его коснулась. На нём совсем не было пыли, и он был тёплым."},{"en":"When she got back to the office, Mr. Reed was already sitting by her desk, as if he had never left. \"Well?\" he asked. \"Do you still want to sell it to me?\"","ru":"Когда она вернулась в офис, мистер Рид уже сидел у её стола, как будто никуда и не уходил. «Ну что?» — спросил он. «Вы всё ещё хотите продать его мне?»"},{"en":"\"You died in 1961,\" Anna said quietly.","ru":"«Вы умерли в 1961 году», — тихо сказала Анна."},{"en":"\"Then why do you need me?\" she asked. \"Why not just stay there?\" He shook his head. \"A house is not only walls. It is also a name on a piece of paper. For sixty years this house has belonged to strangers in an office. Lily will not come through the door of a house that is not hers. She was always like that — very correct about everything.\"","ru":"«Тогда зачем вам я? — спросила она. — Почему бы просто не остаться там?» Он покачал головой. «Дом — это не только стены. Это ещё и имя на листе бумаги. Шестьдесят лет этот дом принадлежал чужим людям в каком-то кабинете. Лили не войдёт в дверь дома, который ей не принадлежит. Она всегда была такой — очень правильной во всём»."},{"en":"\"Yes.\" He looked at his hands. \"And Lily died last month, in a hospital two hundred miles from here. She never came back to the lake. It was too painful for her, I think. But she has come back now. I only need the house to be ours again — on paper, in the same way that the government took it. Then we can both rest.\"","ru":"«Да». Он посмотрел на свои руки. «А Лили умерла в прошлом месяце, в больнице за двести миль отсюда. Она так и не вернулась на озеро. Думаю, ей было слишком больно. Но теперь она вернулась. Мне нужно лишь, чтобы дом снова стал нашим — на бумаге, так же, как его забрало правительство. Тогда мы оба сможем обрести покой»."},{"en":"Anna thought of the photograph, the shadow at the window, the voice on the record. Then she took out the contract. \"There is one advantage to buying a house that nobody wants,\" she said. \"The price is very low.\"","ru":"Анна подумала о фотографии, о тени в окне, о голосе на пластинке. Потом она достала договор. «У покупки дома, который никому не нужен, есть одно преимущество, — сказала она. — Цена очень низкая»."},{"en":"For the first time, he smiled. He paid with old banknotes from 1961. Anna kept them in her drawer and paid the money into the agency's account from her own savings. She never told her boss.","ru":"Впервые он улыбнулся. Он заплатил старыми банкнотами 1961 года. Анна спрятала их в свой ящик и внесла деньги на счёт агентства из собственных сбережений. Начальнику она так ничего и не сказала."},{"en":"Two weeks later she drove up to the peak of the road again and looked down at Silver Lake. The evening was warm and silent. In the house on the far shore, a light was burning in the window, and on the porch she could see two shadows standing close together, looking out at the water.","ru":"Через две недели она снова поднялась на самую высокую точку дороги и посмотрела вниз на Серебряное озеро. Вечер был тёплым и тихим. В доме на дальнем берегу в окне горел свет, а на крыльце она увидела две тени, стоявшие рядом и смотревшие на воду."},{"en":"Anna sat in her car for a long time. She had sold many houses in her life, but she had never felt such deep satisfaction. Then she drove home, and the next morning she put a new announcement in the agency window: \"Old houses. Sold only to the right owners.\"","ru":"Анна долго сидела в машине. За свою жизнь она продала много домов, но никогда не чувствовала такого глубокого удовлетворения. Потом она поехала домой, а на следующее утро повесила в окне агентства новое объявление: «Старые дома. Продаются только правильным владельцам»."}],"gloss":{"a":"(неопр. артикль)","about":"о, об","abuse":"злоупотребление","accident":"несчастный случай","account":"счёт","across":"через, по","advantage":"преимущество","afraid":"испуганный","after":"после","afternoon":"день, после полудня","again":"снова","agency":"агентство","agency's":"агентства","agreed":"соглашалась","all":"совсем (at all)","alone":"один, одна","already":"уже","also":"также","although":"хотя","always":"всегда","am":"(есть) — я","an":"(неопр. артикль)","and":"и","anna":"Анна (имя)","anna's":"Анны","announcement":"объявление","answer":"отвечать","any":"какой-либо; больше","anything":"что-нибудь","are":"(есть) — вы/они","area":"район, округа","as":"как, так как","ask":"спросить","asked":"спросил(а)","at":"в, у, на","back":"назад","background":"задний план","banknotes":"банкноты","be":"быть","beat":"биться","bed":"кровать","bedroom":"спальня","been":"был(о)","before":"до, прежде чем","began":"начал(а)","bell":"Белл (фамилия)","belonged":"принадлежал","below":"внизу","best":"лучший","blue":"синий","boat":"лодка","boss":"начальник","both":"оба","built":"построил(и)","burning":"горящий","but":"но","buy":"купить","buying":"покупка","by":"у, к, от","called":"по имени","came":"пришёл, пришли","can":"могу, можем","car":"машина","chairs":"стулья","cheap":"дешёвый","cheapest":"самый дешёвый","clean":"чистый","cleaner":"чище","close":"близко","closely":"внимательно","coat":"пальто","cold":"холодный row":"завтра","too":"слишком","took":"забрало; достала","top":"верх","touched":"коснулась","trees":"деревья","two":"два","under":"под","understood":"поняла","until":"до","up":"вверх","upstairs":"наверху","used":"использована","very":"очень","village":"деревня","voice":"голос","wait":"ждать","waiting":"ждал","walk":"идти","walked":"вошёл","wall":"стена","walls":"стены","want":"хотеть","wanted":"хотел","wants":"хочет","warm":"тёплый","was":"был(а)","wasn't":"не был","watch":"смотрят","watched":"смотрела","water":"вода","way":"способ, так","we":"мы","week":"неделя","weeks":"недели","well":"ну","went":"шёл, вышел","were":"были","what":"что","when":"когда","who":"кто, который","whole":"весь","why":"почему","wide":"широкий","wife":"жена","will":"будет","window":"окно","windows":"окна","wise":"мудрый","wish":"желаю","with":"с","within":"в течение","woman":"женщина","woman's":"женский","wooden":"деревянный","wore":"носил","worked":"работала","would":"бы","written":"написал","years":"лет, годы","yes":"да","you":"вы, ты","young":"молодой","younger":"моложе","yourself":"сами"},"vocab":{"here":1,"their":21,"put":41,"shadow":61,"shadows":61,"often":81,"knowledge":101,"notice":121,"before":141,"wish":161,"repeated":181,"silent":201,"correct":222,"forward":242,"advantage":262,"miss":282,"explore":303,"customer":323,"customers":323,"death":343,"suggest":363,"government":383,"however":411,"pleasure":431,"wise":458,"satisfaction":482,"included":503,"announcement":525,"background":546,"record":567,"records":567,"abuse":587,"managed":609,"peak":630,"cheap":652}},{"id":2,"title_en":"The Rowe Emeralds","title_ru":"Изумруды Роу","genre":"Детектив","summary_ru":"В крошечном городке пропадает знаменитое ожерелье, и все подозревают новую няню, но у молодого сержанта на этот счёт другое мнение.","paragraphs":[{"en":"The town of Fernley was so small that everyone knew everyone. There was one bakery, one church, one school and one police officer — Sergeant Ellen Price. Usually her work was easy: a lost dog, a broken window, an argument about a fence. So when the phone rang at eleven o'clock on a warm September night, she did not expect anything serious.","ru":"Городок Фернли был таким маленьким, что все знали всех. Там была одна пекарня, одна церковь, одна школа и один полицейский — сержант Эллен Прайс. Обычно её работа была лёгкой: потерявшаяся собака, разбитое окно, спор из-за забора. Поэтому, когда в одиннадцать часов тёплой сентябрьской ночью зазвонил телефон, она не ожидала ничего серьёзного."},{"en":"“Sergeant, you must come immediately,” said a woman's voice. It was Mrs. Agatha Rowe, the richest woman in Fernley. “Someone has stolen my emeralds.”","ru":"«Сержант, вы должны приехать немедленно», — сказал женский голос. Это была миссис Агата Роу, самая богатая женщина в Фернли. «Кто-то украл мои изумруды»."},{"en":"Ellen drove up the hill to the Rowe house. The big iron gate was wide open. Dark clouds were moving across the moon, and the old trees in the garden looked like black giants. Every window in the house was bright.","ru":"Эллен поехала вверх по холму к дому Роу. Большие железные ворота были широко открыты. Тёмные облака плыли по луне, и старые деревья в саду были похожи на чёрных великанов. Все окна в доме ярко светились."},{"en":"Mrs. Rowe met her at the door. She was seventy-five, small and thin, but she stood very straight, like a queen. “Come in, Sergeant. Everybody is in the library.”","ru":"Миссис Роу встретила её у двери. Ей было семьдесят пять, она была маленькой и худой, но держалась очень прямо, как королева. «Входите, сержант. Все в библиотеке»."},{"en":"The library was a cozy room with soft armchairs, thousands of books and a fire in the fireplace. In the corner stood a small glass case under a tall brass lamp. The case was empty. For almost a hundred years, the Rowe emeralds — a necklace of seven green stones — had lain there. Everyone in Fernley knew about them. People said that their value was greater than the value of the whole town.","ru":"Библиотека была уютной комнатой с мягкими креслами, тысячами книг и огнём в камине. В углу под высокой латунной лампой стояла маленькая стеклянная витрина. Витрина была пуста. Почти сто лет там лежали изумруды Роу — ожерелье из семи зелёных камней. Все в Фернли знали о них. Люди говорили, что их ценность больше, чем ценность всего города."},{"en":"Two people were waiting in the room. The first was Victor Rowe, Mrs. Rowe's nephew and her closest relative, a tall man of forty in an expensive suit. His wife had died years ago, and he lived here with his little daughter, Lily. Next to the fire sat Anna Novak, Lily's nanny. Anna was twenty-two and had come to Fernley only a month ago. Her face was white. Lily was asleep upstairs.","ru":"В комнате ждали двое. Первым был Виктор Роу, племянник миссис Роу и её ближайший родственник, высокий сорокалетний мужчина в дорогом костюме. Его жена умерла много лет назад, и он жил здесь со своей маленькой дочерью Лили. У огня сидела Анна Новак, няня Лили. Анне было двадцать два года, и она приехала в Фернли всего месяц назад. Её лицо было белым. Лили спала наверху."},{"en":"“Tell me what happened,” Ellen said, and took out her notebook.","ru":"«Расскажите, что случилось», — сказала Эллен и достала блокнот."},{"en":"“At nine o'clock we heard an explosion,” said Mrs. Rowe. “A terrible noise, from the direction of the old mill. We all ran to the windows in the dining room. When I came back here twenty minutes later, the case was open and the necklace was gone.”","ru":"«В девять часов мы услышали взрыв, — сказала миссис Роу. — Ужасный шум со стороны старой мельницы. Мы все побежали к окнам в столовой. Когда через двадцать минут я вернулась сюда, витрина была открыта, а ожерелья не было»."},{"en":"“The explosion was real,” Ellen said. “An old gas pipe near the mill. Nobody was hurt. Half the town went there to look.” She examined the glass case. It was not broken. Somebody had opened it with a small key. “Who has the key?”","ru":"«Взрыв был настоящий, — сказала Эллен. — Старая газовая труба возле мельницы. Никто не пострадал. Полгорода пошло туда посмотреть». Она осмотрела стеклянную витрину. Она не была разбита. Кто-то открыл её маленьким ключом. «У кого есть ключ?»"},{"en":"“Only I do,” said Mrs. Rowe. “I keep it on a chain around my neck. But it is an old lock, Sergeant. A clever thief could open it with a hairpin.” She looked at Anna for a moment, and everyone in the room understood what she meant.","ru":"«Только у меня, — сказала миссис Роу. — Я ношу его на цепочке на шее. Но это старый замок, сержант. Ловкий вор мог бы открыть его шпилькой». Она на мгновение посмотрела на Анну, и все в комнате поняли, что она имела в виду."},{"en":"Victor was less polite. “Let's be honest,” he said. “We have lived in this house for years and nothing has disappeared. Then a stranger comes, and a month later the emeralds are gone. Where were you, Miss Novak, when we were at the windows?”","ru":"Виктор был менее вежлив. «Давайте будем честными, — сказал он. — Мы живём в этом доме много лет, и ничего не пропадало. Потом приходит чужой человек, и через месяц изумрудов нет. Где были вы, мисс Новак, когда мы стояли у окон?»"},{"en":"Anna stood up. Her hands were shaking. “I was upstairs with Lily. She was frightened by the noise. I stayed with her until she fell asleep. I did not enter the library all evening.” She took a deep breath. “I am poor, Mr. Rowe, but I am not a thief. You should not say such things. You have offended me.”","ru":"Анна встала. Её руки дрожали. «Я была наверху с Лили. Она испугалась шума. Я оставалась с ней, пока она не уснула. Я весь вечер не входила в библиотеку». Она сделала глубокий вдох. «Я бедная, мистер Роу, но я не воровка. Вы не должны говорить такие вещи. Вы меня обидели»."},{"en":"“Nobody is accusing anyone yet,” Ellen said calmly. “Miss Novak, please stay in the house tonight. Nobody should leave. I will come back in the morning.”","ru":"«Пока никто никого не обвиняет, — спокойно сказала Эллен. — Мисс Новак, пожалуйста, останьтесь сегодня ночью в доме. Никто не должен уезжать. Я вернусь утром»."},{"en":"Before she left, Ellen walked slowly around the room. Near the window she noticed something on the carpet: a small dark mark. She bent down and touched it. It was earth — fresh, wet earth, with a tiny white petal in it. She put a little of it in an envelope. At the gate she stopped again. In the soft ground there was a footprint, but only one, and it pointed toward the house, not away from it.","ru":"Перед уходом Эллен медленно обошла комнату. У окна она заметила что-то на ковре: маленькое тёмное пятно. Она наклонилась и потрогала его. Это была земля — свежая, влажная земля с крошечным белым лепестком. Она положила немного в конверт. У ворот она снова остановилась. На мягкой земле был след, но только один, и он был направлен к дому, а не от него."},{"en":"That night Ellen could not sleep. This case was a real challenge, the first big one of her career. She knew how a small town worked. If she could not find the thief, people would talk about Anna for years. The impact of this one night on the girl's life could be terrible. Nobody would give her work again.","ru":"В ту ночь Эллен не могла уснуть. Это дело было настоящим испытанием, первым большим делом в её карьере. Она знала, как живёт маленький город. Если она не найдёт вора, люди будут говорить об Анне годами. Влияние этой одной ночи на жизнь девушки могло быть ужасным. Никто больше не дал бы ей работу."},{"en":"In the morning she passed the bakery and the church and drove to the edge of town, to the house of Mr. Holt, the old gardener who had worked for Mrs. Rowe for thirty years. He was drinking tea in his kitchen. Ellen showed him the earth from the envelope.","ru":"Утром она проехала мимо пекарни и церкви и поехала на окраину города, к дому мистера Холта, старого садовника, который работал у миссис Роу тридцать лет. Он пил чай на кухне. Эллен показала ему землю из конверта."},{"en":"Mr. Holt looked at it for a long time. “That's not from the garden,” he said at last. “Garden earth is brown. This is black, and look — the petal. That's a white violet. Mrs. Rowe keeps them in pots in the winter garden, the glass room at the back of the house. Nobody goes in there except her. She doesn't even let me water them. Lily isn't allowed to touch them, and that nanny obeys every rule, I can tell you.”","ru":"Мистер Холт долго смотрел на неё. «Это не из сада, — сказал он наконец. — Садовая земля коричневая. А эта чёрная, и посмотрите — лепесток. Это белая фиалка. Миссис Роу держит их в горшках в зимнем саду, стеклянной комнате в задней части дома. Никто, кроме неё, туда не ходит. Она даже мне не позволяет их поливать. Лили нельзя их трогать, а эта няня подчиняется каждому правилу, уж поверьте мне»."},{"en":"Ellen thanked him and drove back to the Rowe house. Mrs. Rowe was in the winter garden, sitting among her flowers. She did not look surprised when Ellen came in.","ru":"Эллен поблагодарила его и поехала обратно к дому Роу. Миссис Роу была в зимнем саду, сидела среди своих цветов. Она не выглядела удивлённой, когда вошла Эллен."},{"en":"“The thief did not come from outside,” Ellen said quietly. “The footprint at the gate was made on purpose — one print, pointing toward the house. The case was opened with the key. And the earth on the library carpet came from these pots. Only one person in the house has the key, and only one person comes into this room.”","ru":"«Вор пришёл не снаружи, — тихо сказала Эллен. — След у ворот оставили нарочно — один отпечаток, направленный к дому. Витрину открыли ключом. А земля на ковре в библиотеке — из этих горшков. Только у одного человека в доме есть ключ, и только один человек заходит в эту комнату»."},{"en":"For a long moment Mrs. Rowe said nothing. Then she pushed one of the big pots aside, put her thin fingers into the earth and pulled out a small cloth bag. Inside were seven green stones on a gold chain.","ru":"Долгое мгновение миссис Роу молчала. Потом она отодвинула один из больших горшков, засунула тонкие пальцы в землю и вытащила маленький тканевый мешочек. Внутри были семь зелёных камней на золотой цепочке."},{"en":"“They are glass,” she said. “All of them. I sold the real emeralds twenty years ago, when my husband died and left nothing but debts. I had a copy made, and nobody ever knew. Then Victor told me that he was going to marry, and I promised the emeralds to his bride as a wedding gift. Her father is a jeweller, Sergeant. He would see the truth in one second. The whole town would laugh at me. When I heard the explosion, I suddenly saw a way out.”","ru":"«Это стекло, — сказала она. — Все до одного. Я продала настоящие изумруды двадцать лет назад, когда умер мой муж и не оставил ничего, кроме долгов. Я заказала копию, и никто ничего не узнал. Потом Виктор сказал мне, что собирается жениться, и я пообещала изумруды его невесте в качестве свадебного подарка. Её отец — ювелир, сержант. Он увидел бы правду за одну секунду. Весь город смеялся бы надо мной. Когда я услышала взрыв, я вдруг увидела выход»."},{"en":"“And you let everyone think that Anna was the thief.” Mrs. Rowe looked down at her hands. “I didn't plan that. But when Victor said it, I said nothing. That was wrong. I know it was wrong.”","ru":"«И вы позволили всем думать, что воровка — Анна». Миссис Роу опустила взгляд на свои руки. «Я этого не планировала. Но когда Виктор это сказал, я промолчала. Это было неправильно. Я знаю, что это было неправильно»."},{"en":"“You can't steal your own necklace,” Ellen said, “so I can't arrest you. But you have done real harm to an innocent girl. In a town like Fernley, words travel faster than cars. There is only one thing that can repair it.”","ru":"«Нельзя украсть собственное ожерелье, — сказала Эллен, — поэтому я не могу вас арестовать. Но вы причинили настоящий вред невинной девушке. В таком городе, как Фернли, слова разносятся быстрее машин. Есть только одно, что может это исправить»."},{"en":"That afternoon Mrs. Rowe called everyone into the library. In a quiet, clear voice she told them the whole story. Victor's face went red, then white. Anna sat very still and listened.","ru":"В тот же день миссис Роу позвала всех в библиотеку. Тихим, ясным голосом она рассказала им всю историю. Лицо Виктора покраснело, потом побелело. Анна сидела неподвижно и слушала."},{"en":"When it was over, Victor laughed — a short, surprised laugh. “Aunt Agatha, Claire doesn't care about emeralds. I'm going to marry her, not her father.” Then he turned to Anna. “Miss Novak, I said terrible things yesterday. I'm sorry. I hope you will stay with Lily. She would never forgive me if you left.”","ru":"Когда всё закончилось, Виктор засмеялся — коротко и удивлённо. «Тётя Агата, Клэр нет дела до изумрудов. Я женюсь на ней, а не на её отце». Потом он повернулся к Анне. «Мисс Новак, вчера я сказал ужасные вещи. Простите меня. Надеюсь, вы останетесь с Лили. Она никогда не простит мне, если вы уйдёте»."},{"en":"Anna was silent for a moment. Then she smiled a little bit. “I will stay,” she said. “For Lily.”","ru":"Анна помолчала мгновение. Потом она немного улыбнулась. «Я останусь, — сказала она. — Ради Лили»."},{"en":"Mrs. Rowe took Anna's hand. “And this evening,” she said, “I am going to the bakery, the church and the post office, and I will tell everyone in Fernley what I did. It is the only action that can prove that you are innocent. I am old, but I am not too old to be ashamed.”","ru":"Миссис Роу взяла Анну за руку. «А сегодня вечером, — сказала она, — я пойду в пекарню, в церковь и на почту и расскажу всем в Фернли, что я сделала. Это единственный поступок, который может доказать, что вы невиновны. Я стара, но не настолько, чтобы не стыдиться»."},{"en":"Outside, the clouds had gone and the sun was shining on the wet garden. Ellen walked down to the gate, where Lily was waiting with her nanny. “Did you catch the thief?” the little girl asked.","ru":"Снаружи облака ушли, и солнце светило на мокрый сад. Эллен спустилась к воротам, где её ждала Лили со своей няней. «Вы поймали вора?» — спросила девочка."},{"en":"“In a way,” Ellen smiled. “But nobody is going to prison. See you soon, Lily. See you, Anna.” And she drove down the hill, past the bakery and the church, back to the smallest police station on earth.","ru":"«В каком-то смысле, — улыбнулась Эллен. — Но никто не отправится в тюрьму. Увидимся, Лили. Увидимся, Анна». И она поехала вниз с холма, мимо пекарни и церкви, обратно в самый маленький полицейский участок на земле."}],"gloss":{"a":"(неопр. артикль)","about":"о, из-за","accusing":"обвиняет","across":"по, через","action":"поступок, действие","afternoon":"днём, после полудня","again":"снова","agatha":"Агата (имя)","ago":"назад","all":"все, весь","allowed":"разрешено","almost":"почти","am":"(есть), являюсь","among":"среди","an":"(неопр. артикль)","and":"и, а","anna":"Анна (имя)","anna's":"Анны","anyone":"кого-либо","anything":"что-либо, ничего","are":"есть, являются","argument":"спор","armchairs":"кресла","around":"вокруг, по","arrest":"арестовать","as":"как, в качестве","ashamed":"стыдно","aside":"в сторону","asked":"спросила","asleep":"спящий","at":"в, у, на","aunt":"тётя","away":"прочь","back":"назад, задняя часть","bag":"мешочек","bakery":"пекарня","be":"быть","before":"перед, до","bent":"наклонилась","big":"большой","bit":"немного","black":"чёрный","books":"книги","brass":"латунный","breath":"вдох, дыхание","bride":"невеста","bright":"яркий","broken":"разбитый","brown":"коричневый","but":"но, кроме","by":"(кем-то), от","called":"позвала","calmly":"спокойно","came":"пришла, вошла","can":"может","can't":"не может, нельзя","care":"заботиться","career":"карьера","carpet":"ковёр","cars":"машины","case":"витрина; дело","catch":"поймать","chain":"цепочка","challenge":"испытание","church":"церковь","claire":"Клэр (имя)","clear":"ясный","clever":"ловкий, умный","closest":"ближайший","cloth":"тканевый","clouds
