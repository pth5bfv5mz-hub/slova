,"somewhere":"где-то","son":"сынок","sound":"звук","sounded":"звучал","stairs":"лестница","standing":"стоял","started":"начал","stay":"оставаться","stick":"палка","still":"всё ещё","stone":"камень","stood":"стояла","stopped":"остановил; прекратилось","strange":"странный","strong":"сильный","stuck":"застрявший","such":"такой","suit":"костюм","sunlight":"солнечный свет","supposed":"должен был","switched":"включил","tall":"высокий","ten":"десять","than":"чем","that":"что; тот, это","that's":"это (есть)","the":"(определённый артикль)","them":"их","then":"потом","there":"там; (оборот there is)","they":"они","thin":"худой; тонкий","third":"третий","thirty":"тридцать","this":"этот","three":"три","through":"сквозь","time":"время (пора)","tired":"устало","to":"к, в; (частица инфинитива)","together":"вместе","told":"сказал, велел","took":"взял; сел (на автобус)","top":"вершина","torch":"фонарик","touched":"касались","town":"город","tried":"попробовал","turn":"превратить","twenty":"двадцать","two":"два","under":"под","uniform":"форма","up":"вверх","used":"(раньше) обычно","very":"очень","visited":"навещал","voice":"голос","waited":"ждал","waiting":"ждал","walked":"шёл, ходил","wall":"стена","walsh":"Уолш (фамилия)","wanted":"хотел","wards":"палаты","was":"был","watch":"охранять","weak":"слабый","well":"хорошо","went":"пошёл; погасла","were":"были","what":"что","what's":"что (есть)","when":"когда","where":"где","white":"белый","who's":"кто (есть)","whole":"весь","whom":"которого","wind":"ветер","windows":"окна","with":"с","woke":"проснулся","woman":"женщина","woman's":"женский","wooden":"деревянный","worked":"работал","years":"лет","yes":"да","you":"ты, вы","young":"молодой","your":"твой, ваш","about":"о","always":"всегда","ever":"когда-либо","far":"далеко","faster":"быстрее","fears":"страхи","flat":"квартира","getting":"становился","have":"иметь","hello":"эй, алло","know":"знать","lights":"огни","listened":"прислушался","little":"маленький; немного","midnight":"полночь","month":"месяц","quickly":"быстро","sadly":"печально","see":"видеть","sister":"сестра","sit":"сесть","thought":"думал","turned":"обернулся","turning":"становился","wait":"ждать","ward":"палата","warm":"тёплый","who":"который; кто","will":"(будущее время)","window":"окно","would":"бы","yellow":"жёлтый"},"vocab":{"more":6,"perfect":26,"time":46,"woke":66,"horrible":86,"bus":106,"below":126,"lay":146,"rock":166,"joy":186,"bright":206,"similar":227,"confidence":247,"all":267,"snake":287,"certainly":308,"expected":328,"weak":348,"sight":368,"except":388,"endlessly":416,"grave":437,"rude":466,"impression":488,"increase":509,"rely":530,"dragged":551,"dragging":551,"citizens":572,"collected":593,"restore":614,"restored":614,"hammer":636}},{"id":7,"title_en":"The Lost Package","title_ru":"Потерянная посылка","genre":"Любовная история","summary_ru":"Каждый четверг в бюро находок на вокзале приходит странный мужчина с апельсином и ищет посылку, которую никто никогда не видел.","paragraphs":[{"en":"Lena Morris worked in the lost property office at Northgate Station. It was a small room with no windows, between the ticket office and a cafe that sold bad coffee. All day people came to her with questions and complaints. Someone had left an umbrella on the 8:15 train. Someone had lost a heavy suitcase full of books. Someone wanted to know why the trains were always late, as if Lena could change that.","ru":"Лена Моррис работала в бюро находок на вокзале Нортгейт. Это была маленькая комната без окон, между билетной кассой и кафе, где продавали плохой кофе. Весь день люди приходили к ней с вопросами и жалобами. Кто-то оставил зонт в поезде в 8:15. Кто-то потерял тяжёлый чемодан, полный книг. Кто-то хотел знать, почему поезда всегда опаздывают, как будто Лена могла это изменить."},{"en":"She was twenty-eight, and she was tired. Her salary was small, her boss, Mr Hall, never said thank you, and the only window she could see was the one in the cafe door. Sometimes, when the wind blew through the station, she closed her eyes and imagined the sea.","ru":"Ей было двадцать восемь, и она устала. Зарплата у неё была маленькая, её начальник, мистер Холл, никогда не говорил спасибо, а единственное окно, которое она могла видеть, было в двери кафе. Иногда, когда ветер проносился по вокзалу, она закрывала глаза и представляла море."},{"en":"Then, one Thursday in October, the man in the blue shirt came for the first time.","ru":"А потом, в один из четвергов октября, впервые пришёл мужчина в синей рубашке."},{"en":"He was tall and thin, with dark hair and ears that turned red when he was nervous. He was holding an orange in his hand, and he did not eat it. He just kept it, like a small sun.","ru":"Он был высокий и худой, с тёмными волосами и ушами, которые краснели, когда он нервничал. В руке он держал апельсин и не ел его. Он просто держал его, как маленькое солнце."},{"en":"“Good afternoon,” he said in a soft voice. “I think I lost a package here. On a train from the coast.”","ru":"«Добрый день, — сказал он мягким голосом. — Кажется, я потерял здесь посылку. В поезде с побережья»."},{"en":"“Can you give me a description?” Lena asked, and she took out the big blue book. “We keep everything for three months. But first I have to establish that it really belongs to you.”","ru":"«Можете дать описание?» — спросила Лена и достала большую синюю книгу. «Мы храним всё три месяца. Но сначала я должна установить, что вещь действительно принадлежит вам»."},{"en":"“Of course. It is a small box in brown paper. It is tied with red string. There is something special inside.”","ru":"«Конечно. Это маленькая коробка в коричневой бумаге. Она перевязана красной верёвочкой. Внутри кое-что особенное»."},{"en":"Lena looked through the book and then through the shelves. There were three boxes in brown paper, but none of them fit his description. One was too big, one had blue string, and one was full of old letters to someone called Margaret.","ru":"Лена просмотрела книгу, а потом полки. Там было три коробки в коричневой бумаге, но ни одна не соответствовала его описанию. Одна была слишком большой, на другой была синяя верёвочка, а третья была полна старых писем кому-то по имени Маргарет."},{"en":"“I am sorry,” she said. “It is not here. Try again next week.”","ru":"«Мне жаль, — сказала она. — Её здесь нет. Попробуйте ещё раз на следующей неделе»."},{"en":"He smiled as if this was good news. “Thank you. I will.” And he left the orange on her desk.","ru":"Он улыбнулся так, будто это была хорошая новость. «Спасибо. Обязательно». И он оставил апельсин у неё на столе."},{"en":"He came back the next Thursday, and the Thursday after that. Every week he wore a different shirt, but he always had an orange, and he always asked about the same package. And every week his description was a little different. Once the string was red, once it was green. Once the box was “about the size of a book”, once it was “small enough to hold in one hand”.","ru":"Он вернулся в следующий четверг, и в четверг после него. Каждую неделю на нём была другая рубашка, но у него всегда был апельсин, и он всегда спрашивал об одной и той же посылке. И каждую неделю его описание было немного другим. Однажды верёвочка была красной, однажды — зелёной. Однажды коробка была «размером примерно с книгу», а в другой раз — «достаточно маленькой, чтобы держать в одной руке»."},{"en":"On the fourth Thursday it was raining, and nobody else came into the office. He stayed longer than usual. He asked her if she liked her job, and she surprised herself by telling him the truth: that she hated the room without windows, that she had grown up in a city far from the coast, and that she had always dreamed about living by the sea. “One day,” she said, “I want to wake up and hear the waves.” He listened carefully and did not laugh. Then he looked at his watch, said “Same package next week?” and was gone.","ru":"В четвёртый четверг шёл дождь, и больше никто в бюро не приходил. Он остался дольше обычного. Он спросил, нравится ли ей её работа, и она, к собственному удивлению, сказала ему правду: что ненавидит комнату без окон, что выросла в городе далеко от побережья и что всегда мечтала жить у моря. «Однажды, — сказала она, — я хочу проснуться и услышать волны». Он внимательно слушал и не смеялся. Потом посмотрел на часы, сказал: «Та же посылка на следующей неделе?» — и ушёл."},{"en":"Lena started to feel frustrated. “Your description changes every time,” she told him firmly on the fifth Thursday. Her voice was firm, but she could not stop looking at his red ears.","ru":"Лена начала расстраиваться. «Ваше описание каждый раз меняется», — твёрдо сказала она ему в пятый четверг. Голос её был твёрдым, но она не могла перестать смотреть на его красные уши."},{"en":"“I have a bad memory,” he said simply. “I am sorry.”","ru":"«У меня плохая память», — просто сказал он. — «Простите»."},{"en":"Mr Hall was less patient. “That man is obsessed,” he said after the sixth visit. “Or he is cunning. Maybe he is trying to steal something. People like that make false complaints and want money. You deal with him, Morris. I don’t want to see him.”","ru":"Мистер Холл был менее терпелив. «Этот человек одержим, — сказал он после шестого визита. — Или он хитрый. Может быть, он пытается что-то украсть. Такие люди пишут ложные жалобы и хотят денег. Разбирайтесь с ним сами, Моррис. Я не хочу его видеть»."},{"en":"But Lena did not think he was cunning. A cunning man would tell a better story. This man simply came, asked his question, put an orange on her desk and left. Slowly, Thursday became the best day of her week. She started to wear her nicest sweater on Thursdays. She was glad when she heard his steps in the hall, and she felt strangely empty when he walked away in the direction of the platforms.","ru":"Но Лена не думала, что он хитрый. Хитрый человек придумал бы историю получше. Этот человек просто приходил, задавал свой вопрос, клал апельсин ей на стол и уходил. Постепенно четверг стал лучшим днём её недели. По четвергам она стала надевать свой самый красивый свитер. Она радовалась, когда слышала его шаги в коридоре, и чувствовала странную пустоту, когда он уходил в направлении платформ."},{"en":"Her only friend at work was Danny, a young porter who carried heavy bags for tourists and knew everything that happened in the station. One evening, after work, he sat on her desk and ate one of the oranges.","ru":"Её единственным другом на работе был Дэнни, молодой носильщик, который носил тяжёлые сумки туристов и знал всё, что происходило на вокзале. Однажды вечером, после работы, он сел к ней на стол и съел один из апельсинов."},{"en":"“Your orange man was here again today,” he said. “He asked me what time you finish on Fridays.”","ru":"«Твой апельсиновый мужчина сегодня опять был здесь, — сказал он. — Спросил меня, во сколько ты заканчиваешь по пятницам»."},{"en":"“And what did you tell him?” Danny looked at the ceiling. “Six o’clock.”","ru":"«И что ты ему сказал?» Дэнни посмотрел в потолок. «В шесть»."},{"en":"“Danny! You traitor!” But she was laughing, and her cheeks were warm.","ru":"«Дэнни! Предатель!» Но она смеялась, и щёки у неё горели."},{"en":"On Friday, at six o’clock, Lena walked out of the station. The sky was grey and the wind was cold, and nobody was waiting for her. She told herself that she did not care. She told herself that Mr Hall was right: the man was obsessed with a box that did not exist, not with her. She went home and did not eat dinner.","ru":"В пятницу в шесть часов Лена вышла из вокзала. Небо было серым, ветер был холодным, и никто её не ждал. Она сказала себе, что ей всё равно. Она сказала себе, что мистер Холл прав: этот человек одержим коробкой, которой не существует, а не ею. Она пошла домой и не стала ужинать."},{"en":"The next Thursday he did not come. Nor the Thursday after that. Lena looked at the door every five minutes. Maybe he had found his box. Maybe he had found another office, with another woman behind the desk. She gave wrong answers to simple questions. A woman made a complaint because Lena sent her to the wrong platform.","ru":"В следующий четверг он не пришёл. И в четверг после этого тоже. Лена смотрела на дверь каждые пять минут. Может быть, он нашёл свою коробку. Может быть, он нашёл другое бюро, с другой женщиной за столом. Она давала неправильные ответы на простые вопросы. Одна женщина подала жалобу, потому что Лена отправила её не на ту платформу."},{"en":"Then, on Monday morning, a cleaner brought a package to the office. “Found it on bench number four,” she said. “Under an old newspaper.”","ru":"А потом, в понедельник утром, уборщица принесла в бюро посылку. «Нашла на скамейке номер четыре, — сказала она. — Под старой газетой»."},{"en":"It was a small box in brown paper, small enough to hold in one hand. It was tied with red string, and the string had a green knot. It fit every description he had ever given. On the paper someone had written, in careful letters: “For the woman in the lost property office. Please open. It belongs to you.”","ru":"Это была маленькая коробка в коричневой бумаге, достаточно маленькая, чтобы держать в одной руке. Она была перевязана красной верёвочкой, а на верёвочке был зелёный узел. Она соответствовала каждому описанию, которое он когда-либо давал. На бумаге кто-то написал аккуратными буквами: «Для женщины из бюро находок. Пожалуйста, откройте. Это принадлежит вам»."},{"en":"Her hands were shaking. Inside the package, on a bed of soft paper, there was a small wooden ship with white sails. Under the ship there was a train ticket to Saltwick, a little town on the coast, and a letter.","ru":"Руки у неё дрожали. Внутри упаковки, на подстилке из мягкой бумаги, лежал маленький деревянный корабль с белыми парусами. Под кораблём был билет на поезд до Солтуика, маленького городка на побережье, и письмо."},{"en":"“My name is Tom,” the letter said. “I build model ships in a small shop by the sea. Four months ago I came to your office to ask about a real lost bag, and you smiled at me, and I forgot what I wanted to say. I went home without my bag. After that I needed a reason to see you again, so I invented a package. Every Thursday was practice: practice talking to you without my ears turning red. I never got better. I am sorry I lied. On Friday I waited at six, but I was waiting at the wrong door, and then I lost my courage. This ship is for you, because you once told me you dream about the sea. If you want to see it, there is a train on Saturday at ten. If you don’t come, I will understand.”","ru":"«Меня зовут Том, — говорилось в письме. — Я делаю модели кораблей в маленькой мастерской у моря. Четыре месяца назад я пришёл в ваше бюро спросить о настоящей потерянной сумке, вы мне улыбнулись, и я забыл, что хотел сказать. Я ушёл домой без своей сумки. После этого мне нужен был повод увидеть вас снова, поэтому я придумал посылку. Каждый четверг был практикой: практикой разговора с вами без того, чтобы мои уши краснели. Лучше у меня так и не стало. Простите, что я лгал. В пятницу я ждал в шесть, но ждал не у той двери, а потом потерял смелость. Этот корабль для вас, потому что однажды вы сказали мне, что мечтаете о море. Если хотите его увидеть, в субботу в десять есть поезд. Если вы не приедете, я пойму»."},{"en":"Lena read the letter three times. Then she looked at the blue book, where she had to write every lost thing and its owner. She opened it and wrote: “One wooden ship. Owner: Lena Morris.” For the first time, Mr Hall’s rules made her smile.","ru":"Лена прочитала письмо три раза. Потом она посмотрела на синюю книгу, куда должна была записывать каждую потерянную вещь и её владельца. Она открыла её и написала: «Один деревянный корабль. Владелец: Лена Моррис». Впервые правила мистера Холла заставили её улыбнуться."},{"en":"On Saturday the sky over Saltwick was blue and the wind smelled of salt. Tom was standing on the platform in a white shirt, with a bag of oranges in his hands and his ears as red as ever. When he saw her, he almost dropped the bag. The oranges rolled in every direction, and he went down on one knee to catch them.","ru":"В субботу небо над Солтуиком было голубым, а ветер пах солью. Том стоял на платформе в белой рубашке, с пакетом апельсинов в руках, и уши у него были красными как всегда. Увидев её, он чуть не уронил пакет. Апельсины покатились во все стороны, и он опустился на одно колено, чтобы их поймать."},{"en":"Lena knelt beside him, and their knees almost touched. She picked up one orange and put it in his hand. “I think you lost this,” she said. “Can you give me a description?”","ru":"Лена опустилась на колени рядом с ним, и их колени почти соприкоснулись. Она подняла один апельсин и вложила его ему в руку. «Кажется, вы это потеряли, — сказала она. — Можете дать описание?»"},{"en":"Tom laughed, and then, very carefully, he kissed her on the cheek. “Ten points out of ten,” Lena said softly. “Danny was right about you.” Behind them, the train left in the direction of the city, but neither of them looked at it.","ru":"Том засмеялся, а потом очень осторожно поцеловал её в щёку. «Десять баллов из десяти, — тихо сказала Лена. — Дэнни был прав насчёт тебя». Позади них поезд ушёл в направлении города, но ни один из них на него не посмотрел."}],"gloss":{"a":"(неопр. артикль)","about":"о, примерно","after":"после","afternoon":"день (после полудня)","again":"снова","ago":"назад","all":"весь, все","almost":"почти","always":"всегда","am":"есть (я)","an":"(неопр. артикль)","and":"и","another":"другой","answers":"ответы","as":"как","ask":"спросить","asked":"спросил(а)","at":"в, у, на","ate":"съел","away":"прочь","back":"назад, обратно","bad":"плохой","bag":"сумка, пакет","bags":"сумки","became":"стал","because":"потому что","bed":"подстилка, ложе","behind":"позади, за","belongs":"принадлежит","bench":"скамейка","beside":"рядом с","best":"лучший","better":"лучше","between":"между","big":"большой","blew":"дул","blue":"синий, голубой","book":"книга","books": платформа","platforms":"платформы","please":"пожалуйста","points":"баллы","porter":"носильщик","practice":"практика","property":"имущество, вещи","put":"клал, вложила","question":"вопрос","questions":"вопросы","raining":"шёл дождь","read":"прочитала","real":"настоящий","really":"действительно","reason":"причина, повод","red":"красный","right":"прав","rolled":"покатились","room":"комната","rules":"правила","said":"сказал(а)","sails":"паруса","salary":"зарплата","salt":"соль","saltwick":"Солтуик (город)","same":"тот же","sat":"сел","saturday":"суббота","saw":"увидел","say":"сказать","sea":"море","see":"видеть","sent":"отправила","shaking":"дрожали","she":"она","shelves":"полки","ship":"корабль","ships":"корабли","shirt":"рубашка","shop":"мастерская","simple":"простой","simply":"просто","six":"шесть","sixth":"шестой","size":"размер","sky":"небо","slowly":"постепенно","small":"маленький","smelled":"пах","smile":"улыбаться","smiled":"улыбнулся","so":"поэтому, так","soft":"мягкий","softly":"тихо","sold":"продавали","someone":"кто-то","something":"что-то","sometimes":"иногда","sorry":"жаль, простите","special":"особенный","standing":"стоял","started":"начала","station":"вокзал","stayed":"остался","steal":"украсть","steps":"шаги","stop":"перестать","story":"история","strangely":"странно","string":"верёвочка","suitcase":"чемодан","sun":"солнце","surprised":"удивила","sweater":"свитер","talking":"разговаривать","tall":"высокий","tell":"рассказать","telling":"рассказав","ten":"десять","than":"чем","thank":"спасибо","that":"что, тот","the":"(артикль)","their":"их","them":"их, им","then":"потом","there":"там","thin":"худой","thing":"вещь","think":"думаю","this":"это, этот","three":"три","through":"через, по","thursday":"четверг","thursdays":"четверги","ticket":"билет","tied":"перевязана","time":"раз, время","times":"раз","tired":"уставший","to":"к, в, (инфинитив)","today":"сегодня","told":"сказала","tom":"Том (имя)","too":"слишком","took":"достала","touched":"соприкоснулись","tourists":"туристы","town":"городок","train":"поезд","trains":"поезда","traitor":"предатель","truth":"правда","try":"попробуйте","trying":"пытается","turned":"становились","turning":"становились","twenty":"двадцать","umbrella":"зонт","under":"под","understand":"пойму","up":"вверх","usual":"обычный","very":"очень","visit":"визит","voice":"голос","waited":"ждал","waiting":"ждал","wake":"проснуться","walked":"ушёл","want":"хочу","wanted":"хотел","warm":"тёплый","was":"был(а)","watch":"часы","waves":"волны","we":"мы","wear":"надевать","week":"неделя","went":"пошла","were":"были","what":"что","when":"когда","where":"где, куда","white":"белый","who":"кто, который","why":"почему","will":"(буд. время)","wind":"ветер","window":"окно","windows":"окна","with":"с","without":"без","woman":"женщина","wooden":"деревянный","wore":"носил","work":"работа","worked":"работала","would":"бы","write":"записывать","written":"написал","wrong":"неправильный","wrote":"написала","you":"вы, ты","young":"молодой","your":"ваш, твой"},"vocab":{"practice":7,"firm":27,"soft":47,"cheek":67,"cheeks":67,"ship":87,"ships":87,"orange":107,"oranges":107,"wind":127,"tied":147,"try":167,"trying":167,"sky":187,"keep":208,"kept":208,"points":228,"ears":248,"cunning":268,"shirt":288,"glad":309,"deal":329,"traitor":349,"special":369,"heavy":389,"description":417,"simply":439,"complaint":467,"complaints":467,"direction":489,"fit":510,"package":531,"frustrated":552,"establish":573,"salary":594,"obsessed":615,"knee":637,"knees":637}},{"id":8,"title_en":"The Night of the Turtles","title_ru":"Ночь черепах","genre":"Приключения","summary_ru":"Человек, который не может прожить и часа без телефона, прилетает на маленький остров — и в первый же день остаётся без всего.","paragraphs":[{"en":"Pavel had not spent a single day without his phone for six years. He read the news under the blanket at night, checked messages at red lights, and took photos of every meal before he ate it. When his doctor finally used the word “addiction,” Pavel laughed. Then he saw her face and stopped laughing.","ru":"Павел уже шесть лет не провёл ни одного дня без телефона. Ночью он читал новости под одеялом, проверял сообщения на красном светофоре и фотографировал каждое блюдо, прежде чем съесть его. Когда врач наконец произнесла слово «зависимость», Павел рассмеялся. Затем он увидел её лицо и перестал смеяться."},{"en":"“You need a place where nobody knows you,” she said. “A place where the phone is not the most important thing. Think of it as healing.”","ru":"«Вам нужно место, где вас никто не знает, — сказала она. — Место, где телефон — не самая важная вещь. Считайте это выздоровлением»."},{"en":"So, three weeks later, Pavel was sitting on a small plane flying to Marela, an island country he had found on a map by chance. Next to him sat an old woman in a yellow dress. She wore round glasses with thick lenses, and she watched him with interest as he moved his finger across the screen.","ru":"И вот через три недели Павел сидел в маленьком самолёте, летевшем на Марелу — островную страну, которую он случайно нашёл на карте. Рядом с ним сидела пожилая женщина в жёлтом платье. Она носила круглые очки с толстыми стёклами и с интересом наблюдала, как он водит пальцем по экрану."},{"en":"“You are going to my island,” she said in slow English. “Do you know what Marela means?” Pavel shook his head without looking up. “It means ‘slow water.’ On Marela, time is slow. And a lost thing always finds its way home.” She smiled as if she knew something he didn't. “My name is Odile. Maybe we will meet again.”","ru":"«Вы летите на мой остров, — сказала она на медленном английском. — Вы знаете, что означает “Марела”?» Павел покачал головой, не поднимая глаз. «Это означает “медленная вода”. На Мареле время течёт медленно. И потерянная вещь всегда находит дорогу домой». Она улыбнулась так, будто знала что-то, чего не знал он. «Меня зовут Одиль. Может быть, мы ещё встретимся»."},{"en":"The plane landed in the afternoon. The air was hot and wet, and it smelled of flowers and fish. Pavel took a taxi to the town and decided to walk through the market before he went to his hotel. He wore his favourite blue jacket, although it was too warm for it. All his important things were inside: his passport, his money, his bank card and, of course, his phone.","ru":"Самолёт приземлился днём. Воздух был горячим и влажным и пах цветами и рыбой. Павел доехал на такси до города и решил пройтись по рынку, прежде чем идти в гостиницу. На нём была его любимая синяя куртка, хотя для неё было слишком тепло. Все важные вещи лежали внутри: паспорт, деньги, банковская карта и, конечно, телефон."},{"en":"The market was loud and full of colour. Women sold fruit he had never seen before, men shouted prices, and children ran between the tables. Pavel stopped to look at a little wooden turtle. He took off his jacket for a moment because he was so hot, and he put it on a table next to him.","ru":"Рынок был шумным и полным красок. Женщины продавали фрукты, каких он никогда раньше не видел, мужчины выкрикивали цены, а дети бегали между столами. Павел остановился посмотреть на маленькую деревянную черепаху. Ему было так жарко, что он на минуту снял куртку и положил её на стол рядом с собой."},{"en":"That was enough. A thin boy of about twelve appeared at his side, picked up the jacket and ran.","ru":"Этого было достаточно. Рядом с ним появился худой мальчик лет двенадцати, схватил куртку и убежал."},{"en":"“Hey! Stop! Thief!” Pavel shouted. He ran after the boy with his fist in the air, pushing past people and boxes of bananas. But the boy knew every corner of the market, and in less than a minute he was gone.","ru":"«Эй! Стой! Вор!» — закричал Павел. Он бросился за мальчиком, подняв кулак, расталкивая людей и ящики с бананами. Но мальчик знал на рынке каждый угол, и меньше чем через минуту он исчез."},{"en":"Pavel stood in the middle of the street, breathing hard. People were looking at him. He suddenly felt very embarrassed: a big angry foreigner shouting in a language nobody understood. He put his hands in his pockets. He had a few coins, the clothes he was wearing, and nothing else. No phone. No map. No hotel address. He couldn't even remember the name of the hotel; it was in an email on his phone.","ru":"Павел стоял посреди улицы, тяжело дыша. Люди смотрели на него. Ему вдруг стало очень неловко: большой сердитый иностранец кричит на языке, которого никто не понимает. Он сунул руки в карманы. У него было несколько монет, одежда, которая была на нём, и больше ничего. Ни телефона. Ни карты. Ни адреса гостиницы. Он даже не мог вспомнить название гостиницы: оно было в письме у него в телефоне."},{"en":"He found a police station, but it was closed. A sign on the door said that it would open again in the morning. “Slow water,” Pavel said bitterly. “Of course.” He would have to wait until morning, like everyone else on this island.","ru":"Он нашёл полицейский участок, но тот был закрыт. Табличка на двери сообщала, что он снова откроется утром. «Медленная вода, — горько сказал Павел. — Ну конечно». Ему придётся ждать до утра, как и всем остальным на этом острове."},{"en":"With his last coins he ordered a cup of tea and a piece of bread at a small cafe near the beach. Then he walked along the sand until the town lights were far behind him. He had no idea where to spend the night. In the end, he sat down under a palm tree and looked at the dark sea.","ru":"На последние монеты он заказал чашку чая и кусок хлеба в маленьком кафе у пляжа. Затем он пошёл по песку, пока огни города не остались далеко позади. Он понятия не имел, где провести ночь. В конце концов он сел под пальмой и стал смотреть на тёмное море."},{"en":"At first, the silence was terrible. His hand kept moving to his pocket, again and again, looking for the phone that was not there. He wanted to check the time, the weather, the news, anything. He felt like a man who had lost a part of his body.","ru":"Сначала тишина была ужасной. Его рука снова и снова тянулась к карману в поисках телефона, которого там не было. Ему хотелось проверить время, погоду, новости — что угодно. Он чувствовал себя человеком, который потерял часть тела."},{"en":"But gradually, other things began to fill the empty space. He began to hear the waves, soft and steady. Insects sang in the grass behind him. A small green insect landed on his knee, sat there for a while, and flew away. Above him, there were more stars than he had seen in his whole life.","ru":"Но постепенно пустоту начали заполнять другие вещи. Он начал слышать волны — мягкие и ровные. В траве за его спиной пели насекомые. Маленькое зелёное насекомое село ему на колено, посидело немного и улетело. Над ним было больше звёзд, чем он видел за всю свою жизнь."},{"en":"Around midnight, he heard something else: a slow, heavy sound on the sand. Something big was moving out of the water. Pavel held his breath. It was a turtle, a huge sea turtle, almost a metre long. It crawled slowly up the beach, stopped near the trees and began to dig a hole with its back legs. Pavel had never seen such a thing. He forgot about his phone, his jacket and his hotel. He simply watched.","ru":"Около полуночи он услышал кое-что ещё: медленный тяжёлый звук на песке. Что-то большое выбиралось из воды. Павел затаил дыхание. Это была черепаха — огромная морская черепаха длиной почти в метр. Она медленно ползла вверх по пляжу, остановилась у деревьев и начала копать яму задними лапами. Павел никогда не видел такого. Он забыл про телефон, куртку и гостиницу. Он просто смотрел."},{"en":"Then he saw the lights. Two men with torches were walking along the beach from the other side. They carried a large bag and a long stick. Pavel did not need to understand their language to understand what they wanted. Somewhere in the world, people paid a lot of money for turtle shells and turtle eggs. These men were hunters, and the turtle could not run away.","ru":"Тогда он увидел огни. С другой стороны по пляжу шли двое мужчин с фонарями. Они несли большой мешок и длинную палку. Павлу не нужно было понимать их язык, чтобы понять, чего они хотят. Где-то в мире люди платили большие деньги за черепашьи панцири и черепашьи яйца. Эти люди были охотниками, а черепаха не могла убежать."},{"en":"For a moment, Pavel was afraid. He was alone, he had no phone to call anyone, and he was not a brave man. In Moscow he had never even argued with a waiter. But he looked at the turtle, working so patiently in the sand, and something inside him became very calm.","ru":"На мгновение Павлу стало страшно. Он был один, у него не было телефона, чтобы кому-нибудь позвонить, и он не был смелым человеком. В Москве он ни разу даже не поспорил с официантом. Но он посмотрел на черепаху, которая так терпеливо трудилась в песке, и что-то внутри него стало очень спокойным."},{"en":"He remembered the fishing nets he had seen near the cafe: old nets, left on the sand to dry. He ran back, pulled one of them across the narrow path between the rocks, and tied it to two trees. It wasn't a clever trap, but it was dark, and the men were looking at the sand, not at their feet.","ru":"Он вспомнил рыболовные сети, которые видел возле кафе, — старые сети, оставленные сушиться на песке. Он побежал назад, натянул одну из них поперёк узкой тропинки между скалами и привязал к двум деревьям. Ловушка была не слишком хитрой, но было темно, а мужчины смотрели на песок, а не себе под ноги."},{"en":"Then he stood up in the light of the moon and shouted as loudly as he could. The men turned and ran toward him. The first one hit the net and fell. The second one fell on top of him. Their torches rolled across the sand, and they shouted at each other in angry voices.","ru":"Затем он встал в лунном свете и закричал так громко, как только мог. Мужчины обернулись и бросились к нему. Первый налетел на сеть и упал. Второй упал на него сверху. Их фонари покатились по песку, и они сердито кричали друг на друга."},{"en":"At that moment, more lights appeared, many lights. People from the village were running down to the beach. Someone had heard Pavel's shout. In front of them all was a small old woman in a yellow dress. “Odile?” Pavel said.","ru":"В этот момент появились ещё огни — много огней. Люди из деревни бежали вниз, к пляжу. Кто-то услышал крик Павла. Впереди всех шла маленькая пожилая женщина в жёлтом платье. «Одиль?» — сказал Павел."},{"en":"She looked at the two men in the net, then at the turtle, and then at Pavel. “The cruel ones come every year,” she said. “We guard the beach, but this year they came early. You were capable of stopping them alone. Not many people are.”","ru":"Она посмотрела на двоих мужчин в сети, затем на черепаху, а затем на Павла. «Эти жестокие люди приходят каждый год, — сказала она. — Мы охраняем пляж, но в этом году они пришли рано. Вы оказались способны остановить их в одиночку. Мало кто на это способен»."},{"en":"Pavel didn't know what to say. He didn't know he was capable of it either. He had never had such courage before. Maybe, he thought, he had always had it, but it had been hiding behind a screen.","ru":"Павел не знал, что сказать. Он и сам не знал, что способен на такое. У него никогда раньше не было такой храбрости. Может быть, подумал он, она была у него всегда, просто пряталась за экраном."},{"en":"In the morning, the police took the hunters away. Pavel sat on the steps of Odile's house and drank coffee. A thin boy walked up the path, carrying a blue jacket. “This is my grandson, Teo,” Odile said. “He has something to tell you.”","ru":"Утром полиция увезла охотников. Павел сидел на ступеньках дома Одиль и пил кофе. По тропинке поднялся худой мальчик с синей курткой в руках. «Это мой внук, Тео, — сказала Одиль. — Ему нужно кое-что вам сказать»."},{"en":"The boy looked at his feet. “Grandmother ordered me to take it,” he said quietly. “On the plane she saw you. She said you looked at your phone for three hours and never once at the sea. She said: one night without it, and then he will be able to see.” He held out the jacket. “Everything is inside. I didn't touch anything.”","ru":"Мальчик смотрел себе под ноги. «Бабушка приказала мне взять её, — тихо сказал он. — Она видела вас в самолёте. Она сказала, что вы три часа смотрели в телефон и ни разу — на море. Она сказала: одна ночь без него, и тогда он научится видеть». Он протянул куртку. «Всё внутри. Я ничего не трогал»."},{"en":"Pavel should have been angry. Instead, he started to laugh, and he laughed until his eyes were wet. He checked the pockets: passport, money, card, phone. The screen showed forty-seven new messages.","ru":"Павлу следовало бы рассердиться. Вместо этого он рассмеялся и смеялся, пока у него не намокли глаза. Он проверил карманы: паспорт, деньги, карта, телефон. На экране было сорок семь новых сообщений."},{"en":"This time, he did not open them. He put the phone back in the jacket and looked at the sea.","ru":"На этот раз он не стал их открывать. Он положил телефон обратно в куртку и посмотрел на море."},{"en":"“Odile,” he said, “is there a possibility that someone like me could reside here for a month or two? I think I'd like to help you guard the beach.”","ru":"«Одиль, — сказал он, — есть ли возможность, что кто-то вроде меня мог бы прожить здесь месяц-другой? Думаю, я хотел бы помочь вам охранять пляж»."},{"en":"The old woman smiled behind her thick glasses. “I told you,” she said. “A lost thing always finds its way home.”","ru":"Пожилая женщина улыбнулась за толстыми стёклами очков. «Я же говорила вам, — сказала она. — Потерянная вещь всегда находит дорогу домой»."}],"gloss":{"a":"(неопр. артикль)","able":"способный (be able to — суметь)","about":"около, о","above":"над","across":"по, через, поперёк","addiction":"зависимость","address":"адрес","afraid":"испуганный","after":"после, за","afternoon":"день, после полудня","again":"снова","air":"воздух","all":"все, весь","almost":"почти","alone":"один, в одиночку","along":"вдоль, по","alth целый","will":"(будущее время)","with":"с","without":"без","woman":"женщина","women":"женщины","wooden":"деревянный","word":"слово","wore":"носила; была одета","working":"трудящийся","world":"мир","would":"(бы; будущее в прошлом)","year":"год","years":"годы, лет","yellow":"жёлтый","you":"вы, ты","your":"ваш","each":"друг (each other)"},"vocab":{"thing":8,"things":8,"then":28,"turtle":48,"hear":68,"heard":68,"cruel":88,"under":108,"spend":128,"spent":128,"began":148,"side":168,"night":188,"such":209,"able":229,"this":249,"time":249,"ordered":269,"plane":290,"insect":310,"insects":310,"clothes":330,"thief":350,"means":370,"glasses":390,"possibility":418,"gradually":440,"addiction":468,"embarrassed":490,"healing":511,"fist":532,"capable":553,"reside":574,"jacket":595,"courage":616,"trap":638}},{"id":9,"title_en":"The Thief with a Tail","title_ru":"Вор с хвостом","genre":"Приключения","summary_ru":"После шторма двое мужчин оказываются на пустом острове, и вскоре по ночам из их маленького запаса еды начинают пропадать консервы.","paragraphs":[{"en":"Daniel had always had one dream: to sail across the sea in a small boat, far from his office, his grey computer and his old sofa in front of the TV. When he turned thirty-five, he finally did it. He paid an old sailor named Sam to take him on a two-week trip between the islands.","ru":"У Дэниела всегда была одна мечта: переплыть море на маленькой лодке, подальше от офиса, серого компьютера и старого дивана перед телевизором. Когда ему исполнилось тридцать пять, он наконец решился. Он заплатил старому моряку по имени Сэм, чтобы тот взял его в двухнедельное плавание между островами."},{"en":"Sam was sixty, with white hair and a face brown from the sun. He did not talk much, but he was honest and calm, and Daniel liked him at once. “The sea is not your friend,” Sam said on the first morning. “Here is my advice: respect it, and it will let you live.”","ru":"Сэму было шестьдесят, у него были белые волосы и загорелое от солнца лицо. Он говорил мало, но был честным и спокойным, и Дэниелу он сразу понравился. «Море тебе не друг, — сказал Сэм в первое утро. — Вот мой совет: уважай его, и оно позволит тебе жить»."},{"en":"For five days the weather was perfect. Then, on the sixth afternoon, the sky turned black. The wind began to scream, and huge waves hit the boat from every side. Sam shouted orders, and Daniel tried to follow them, but he could barely stand. Water came in faster than they could throw it out.","ru":"Пять дней погода была прекрасной. Потом, на шестой день после полудня, небо почернело. Ветер начал выть, и огромные волны били лодку со всех сторон. Сэм выкрикивал команды, и Дэниел пытался их выполнять, но едва мог стоять на ногах. Вода прибывала быстрее, чем они успевали её вычерпывать."},{"en":"“Take off your boots!” Sam shouted. “If we go into the water, they will pull you down!” Daniel took off his boots with shaking hands. A second later a wave lifted the boat, turned it over, and everything went dark.","ru":"«Снимай ботинки! — крикнул Сэм. — Если мы окажемся в воде, они утянут тебя на дно!» Дэниел дрожащими руками снял ботинки. Секунду спустя волна подняла лодку, перевернула её, и всё погрузилось во тьму."},{"en":"When Daniel opened his eyes, he was holding a wooden plank from the boat. Sam was next to him, holding the same plank, with blood on his chin. They did not speak. They just held on and continued to kick their legs, hour after hour, while the storm slowly moved away.","ru":"Когда Дэниел открыл глаза, он держался за деревянную доску от лодки. Сэм был рядом, держался за ту же доску, и у него на подбородке была кровь. Они не разговаривали. Они просто держались и продолжали работать ногами, час за часом, пока шторм медленно уходил прочь."},{"en":"In the morning they saw land. It was a small green island with a white beach and tall palm trees. They swam toward it with the last of their strength, and when Daniel finally felt sand under his feet, he fell onto the shore and laughed and cried at the same time.","ru":"Утром они увидели землю. Это был маленький зелёный остров с белым пляжем и высокими пальмами. Они поплыли к нему из последних сил, и когда Дэниел наконец почувствовал под ногами песок, он упал на берег и одновременно смеялся и плакал."},{"en":"“We're alive,” he said. “That's all that matters.” Sam sat down next to him and looked at the sea for a long time. “Alive, yes,” he said at last with a deep sigh. “But my boat is gone.”","ru":"«Мы живы, — сказал он. — Только это и имеет значение». Сэм сел рядом с ним и долго смотрел на море. «Живы, да, — наконец сказал он с глубоким вздохом. — Но моей лодки больше нет»."},{"en":"The first days were hard. They found fresh water in a small stream behind the beach, and Sam showed Daniel how to open coconuts with a sharp stone. The sea also gave them a gift: a box of food from the boat washed up on the sand. Inside there were twelve cans of beans, some biscuits and a bag of rice. Sam counted everything carefully. “If we are careful, this will last two weeks,” he said.","ru":"Первые дни были тяжёлыми. Они нашли пресную воду в маленьком ручье за пляжем, и Сэм показал Дэниелу, как открывать кокосы острым камнем. Море сделало им и подарок: на песок выбросило ящик с едой с лодки. Внутри было двенадцать банок фасоли, немного печенья и мешок риса. Сэм всё внимательно пересчитал. «Если будем осторожны, этого хватит на две недели», — сказал он."},{"en":"They explored the area around the beach, but the island seemed empty. There were no houses, no boats, no people. Only birds and the sound of the waves. At night they slept under a big tree, and Daniel had strange dreams about his office and his familiar, boring life. For the first time, he missed it.","ru":"Они обследовали местность вокруг пляжа, но остров казался пустым. Ни домов, ни лодок, ни людей. Только птицы и шум волн. Ночью они спали под большим деревом, и Дэниелу снились странные сны о его офисе и о привычной, скучной жизни. Впервые он скучал по ней."},{"en":"On the fourth morning Daniel woke up and checked the food. Two cans of beans were missing. He counted again. Ten. He was sure there had been twelve. He looked at Sam, who was still sleeping, and a cold feeling grew in his stomach.","ru":"На четвёртое утро Дэниел проснулся и проверил еду. Двух банок фасоли не хватало. Он пересчитал снова. Десять. Он был уверен, что было двенадцать. Он посмотрел на Сэма, который ещё спал, и в животе у него разрослось холодное чувство."},{"en":"He said nothing that day. But the next morning, the biscuits were gone too. This time Daniel could not keep quiet.","ru":"В тот день он ничего не сказал. Но на следующее утро пропало и печенье. На этот раз Дэниел не смог промолчать."},{"en":"“Sam,” he said, “somebody is eating our food at night. And there are only two of us here.”","ru":"«Сэм, — сказал он, — кто-то ест нашу еду по ночам. А нас здесь только двое»."},{"en":"Sam looked at him with his calm grey eyes. “Are you saying that I steal from you?” “I'm saying that the food is disappearing.”","ru":"Сэм посмотрел на него спокойными серыми глазами. «Ты хочешь сказать, что я ворую у тебя?» — «Я говорю, что еда исчезает»."},{"en":"“I have never stolen anything in my life,” Sam said quietly. “I would rather die of hunger than steal from a friend.”","ru":"«Я за всю жизнь ничего не украл, — тихо сказал Сэм. — Я скорее умру от голода, чем стану воровать у друга»."},{"en":"Daniel wanted to believe him. But hunger makes people think strange things. That night he did not sleep. He lay with his eyes half closed and watched the box. The moon was bright. Hours passed. His eyes were heavy and he almost fell asleep, when suddenly he heard a small sound — the sound of something moving in the sand.","ru":"Дэниелу хотелось ему верить. Но голод заставляет людей думать странное. Той ночью он не спал. Он лежал с полузакрытыми глазами и следил за ящиком. Луна светила ярко. Проходили часы. Глаза слипались, и он почти заснул, как вдруг услышал тихий звук — звук чего-то, что двигалось по песку."},{"en":"A dark shape came out of the bushes. It was not Sam. It was small, with long arms and a long tail. It went straight to the box, opened it with clever little hands, took a can and ran away into the trees.","ru":"Из кустов вышла тёмная фигура. Это был не Сэм. Существо было маленьким, с длинными руками и длинным хвостом. Оно направилось прямо к ящику, открыло его ловкими маленькими руками, взяло банку и убежало в деревья."},{"en":"“A monkey!” Daniel shouted, jumping up. Sam woke up at once. “What? Where?” “It was a monkey! It took a can! I saw its tail!” Sam started to laugh so hard that tears came to his eyes. “So I am not a thief after all,” he said.","ru":"«Обезьяна!» — закричал Дэниел, вскакивая. Сэм сразу проснулся. «Что? Где?» — «Это была обезьяна! Она взяла банку! Я видел её хвост!» Сэм рассмеялся так сильно, что у него на глазах выступили слёзы. «Значит, я всё-таки не вор», — сказал он."},{"en":"Daniel felt his face go red. “I'm sorry, Sam. I should not have thought that. You deserve a better friend.” Sam put a hand on his shoulder. “You're honest now. That is enough.”","ru":"Дэниел почувствовал, как краснеет. «Прости, Сэм. Мне не следовало так думать. Ты заслуживаешь лучшего друга». Сэм положил руку ему на плечо. «Сейчас ты честен. Этого достаточно»."},{"en":"But one thing was strange. How did a monkey know how to open a box? And what did it do with a can? A monkey cannot open a can with its teeth. Sam rubbed his chin and thought. “Wild animals don't eat beans,” he said. “Somebody taught that monkey.”","ru":"Но одно было странно. Откуда обезьяна знала, как открыть ящик? И что она делала с банкой? Обезьяна не может открыть банку зубами. Сэм потёр подбородок и задумался. «Дикие животные не едят фасоль, — сказал он. — Кто-то научил эту обезьяну»."},{"en":"In the morning they found small footprints in the sand and followed them. The prints led them to a narrow path that went up into the hills. Nobody had cut it recently, but it was clearly a path made by people. After an hour they saw something that made Daniel stop: an old wooden sign on a tree. The words were almost gone, but they could still read them: “Weather Station. Private.”","ru":"Утром они нашли на песке маленькие следы и пошли по ним. Следы привели их к узкой тропе, которая поднималась в холмы. Её давно никто не расчищал, но это явно была тропа, проложенная людьми. Через час они увидели то, что заставило Дэниела остановиться: старый деревянный знак на дереве. Слова почти стёрлись, но их ещё можно было прочитать: «Метеостанция. Частная территория»."},{"en":"“A station!” Daniel cried. “There's a station on this island! Maybe there's a radio! Maybe there are people!” He felt confident for the first time since the storm. He ran up the path, and Sam followed him more slowly.","ru":"«Станция! — воскликнул Дэниел. — На этом острове есть станция! Может, там есть радио! Может, там есть люди!» Впервые после шторма он почувствовал себя уверенным. Он побежал вверх по тропе, а Сэм шёл за ним медленнее."},{"en":"At the top of the hill there was a small white house with a metal tower behind it. The door was open. Inside it was dusty and quiet. There was a table, a broken chair and an old green sofa. And on the sofa, among empty cans, sat the monkey, eating beans with a spoon.","ru":"На вершине холма стоял маленький белый дом, а за ним — металлическая вышка. Дверь была открыта. Внутри было пыльно и тихо. Там были стол, сломанный стул и старый зелёный диван. А на диване, среди пустых банок, сидела обезьяна и ела фасоль ложкой."},{"en":"But there were no people. Daniel looked in every room. On the table there was a notebook, and the last page said: “The station is closing. The boat comes for me tomorrow. I am sorry, Coco, they won't let me take you. Be a good girl.” The date was three years ago.","ru":"Но людей не было. Дэниел заглянул в каждую комнату. На столе лежал блокнот, и на последней странице было написано: «Станцию закрывают. Завтра за мной придёт лодка. Прости, Коко, мне не разрешат взять тебя. Будь умницей». Запись была сделана три года назад."},{"en":"Daniel sat down on the sofa. The disappointment was so strong that he could barely breathe. No people. No help. Only a lonely monkey who had learned to eat from cans.","ru":"Дэниел сел на диван. Разочарование было таким сильным, что он едва мог дышать. Ни людей. Ни помощи. Только одинокая обезьяна, которая научилась есть из банок."},{"en":"Sam, however, did not sit down. He was looking at the metal tower through the window. Then he went to a cupboard in the corner and opened it. Inside there was a large old radio and, next to it, a box of batteries. “Daniel,” he said slowly, “don't give up yet.”","ru":"Сэм же не сел. Он смотрел в окно на металлическую вышку. Потом он подошёл к шкафу в углу и открыл его. Внутри стояло большое старое радио, а рядом — коробка с батарейками. «Дэниел, — медленно сказал он, — не сдавайся пока»."},{"en":"It took them the whole afternoon. Most of the batteries were dead, but Sam was patient. He checked them one by one, connected wires and tried again and again. Daniel offered to help, but he knew nothing about radios, so he sat with Coco and gave her pieces of coconut. She ate them, then pulled his hair as if they were old friends.","ru":"На это у них ушло всё время после полудня. Большинство батареек сели, но Сэм был терпелив. Он проверял их одну за другой, соединял провода и пробовал снова и снова. Дэниел предложил помочь, но он ничего не понимал в радио, поэтому сидел с Коко и давал ей кусочки кокоса. Она их съела, а потом подёргала его за волосы, будто они были старыми друзьями."},{"en":"Just before the sun went down, the radio made a noise. Then a voice, far away and unclear, said: “...this is the coast guard... who is calling?” Sam pressed the button and spoke clearly. He gave their names, the name of his lost boat and the sign painted on the tower — the number of the station. The voice said: “We know that station. Stay where you are. We will come tomorrow.”","ru":"Прямо перед закатом радио зашумело. Потом далёкий и неясный голос сказал: «...говорит береговая охрана... кто на связи?» Сэм нажал кнопку и заговорил чётко. Он назвал их имена, название своей пропавшей лодки и знак, нарисованный на вышке, — номер станции. Голос ответил: «Мы знаем эту станцию. Оставайтесь на месте. Мы придём завтра»."},{"en":"That night they did not sleep under the tree. They slept in the little house, Sam on the floor and Daniel on the old sofa. Before bed, they opened the last can of beans and divided it into three parts: one for Sam, one for Daniel and one for Coco. “Bon appetit,” Sam said, and Coco, who seemed to understand, took her spoon.","ru":"Той ночью они спали не под деревом. Они спали в маленьком доме: Сэм на полу, а Дэниел на старом диване. Перед сном они открыли последнюю банку фасоли и разделили её на три части: одну Сэму, одну Дэниелу и одну Коко. «Приятного аппетита», — сказал Сэм, и Коко, которая, казалось, поняла, взяла свою ложку."},{"en":"The boat came at noon the next day. Coco did not want to leave the house at first, but when Daniel held out his arms, she jumped into them and put her tail around his neck. “She's coming with us,” he told the coast guard. Nobody argued.","ru":"Катер пришёл в полдень следующего дня. Сначала Коко не хотела оставлять дом, но когда Дэниел протянул руки, она запрыгнула к нему и обвила хвостом его шею. «Она едет с нами», — сказал он береговой охране. Никто не стал спорить."},{"en":"A month later Daniel was back in his flat, on his familiar sofa, in front of the same TV. But he was not the same man. He had left his job. Coco was sleeping next to him, and on the table lay a letter from Sam: “New boat is ready. The sea is waiting. Are you coming?” Daniel smiled, and this time it was not a sigh but a laugh. He was already packing his bag.","ru":"Месяц спустя Дэниел снова был в своей квартире, на своём привычном диване, перед тем же телевизором. Но он был уже не тем человеком. Он ушёл с работы. Рядом с ним спала Коко, а на столе лежало письмо от Сэма: «Новая лодка готова. Море ждёт. Ты едешь?» Дэниел улыбнулся, и на этот раз это был не вздох, а смех. Он уже собирал сумку."}],"gloss":{"a":"(неопр. артикль)","about":"о, про","across":"через","advice":"совет","after":"после","afternoon":"время после полудня","again":"снова","ago":"назад","alive":"живой","all":"всё, весь","almost":"почти","already":"уже","also":"также","always":"всегда","am":"(есть) — я","among":"среди","an":"(неопр. артикль)","and":"и","animals":"животные","anything":"что-нибудь","appetit":"аппетита (bon appetit)","are":"(есть) — мы/вы/они","area":"местность, площадь","argued":"спорил","arms":"руки","around":"вокруг","as":"как","asleep":"спящий","at":"в, на, у","ate":"съела","away":"прочь","back":"обратно, снова","bag":"сумка, мешок","barely":"едва","batteries":"батарейки","be":"быть","beach":"пляж","beans":"фасоль","bed":"кровать, сон","been":"было (been)","before":"перед, до","began":"начал","behind":"за, позади","believe":"верить","better":"лучший","between":"между","big":"большой","birds":"птицы","biscuits":"печенье","black":"чёрный","blood":"кровь","boat":"лодка","boats":"лодки","bon":"приятного (bon appetit)","boots":"ботинки","boring":"скучный","box":"ящик, коробка","breathe":"дышать","bright":"яркий","broken":"сломанный","brown":"коричневый, загорелый","bushes":"кусты","but":"но","button":"кнопка","by":"(сделанный) кем; по","calling":"звонит, вызывает","calm":"спокойный","came":"пришёл","can":"банка","cannot":"не может","cans":"банки","careful":"осторожный","carefully":"внимательно","chair":"стул","checked":"проверил","chin":"подбородок","clearly":"явно, чётко","clever":"ловкий, умный","closed":"закрытый","closing":"закрывается","coast":"берег (coast guard)","coco":"Коко (кличка)","coconut":"кокос","coconuts":"кокосы","cold":"холодный","come":"прийти","comes":"приходит","coming":"едет, идёт","computer":"компьютер","confident le":"люди","perfect":"отличный","pieces":"кусочки","plank":"доска","pressed":"нажал","prints":"следы","private":"частный","pull":"тянуть","pulled":"дёрнула","put":"положил; обвила","quiet":"тихий","quietly":"тихо","radio":"радио","radios":"радио (мн.)","ran":"побежал","rather":"скорее, лучше","read":"прочитать","ready":"готовый","recently":"недавно","red":"красный","respect":"уважать","rice":"рис","room":"комната","rubbed":"потёр","said":"сказал","sail":"плыть под парусом","sailor":"моряк","sam":"Сэм (имя)","same":"тот же","sand":"песок","sat":"сидел, сел","saw":"увидел","saying":"говоришь","scream":"кричать, выть","sea":"море","second":"секунда","seemed":"казался","shaking":"дрожащий","shape":"фигура","sharp":"острый","she":"она","she's":"она (есть)","shore":"берег","should":"следует","shoulder":"плечо","shouted":"крикнул","showed":"показал","side":"сторона","sigh":"вздох","sign":"знак","since":"с (тех пор как)","sit":"сидеть, садиться","sixth":"шестой","sixty":"шестьдесят","sky":"небо","sleep":"спать","sleeping":"спящий","slept":"спали","slowly":"медленно","small":"маленький","smiled":"улыбнулся","so":"так, поэтому","sofa":"диван","some":"немного","somebody":"кто-то","something":"что-то","sorry":"прости","sound":"звук, шум","speak":"говорить","spoke":"заговорил","spoon":"ложка","stand":"стоять","started":"начал","station":"станция","stay":"оставаться","steal":"воровать","still":"всё ещё","stolen":"украл","stomach":"живот","stone":"камень","stop":"остановиться","storm":"шторм","straight":"прямо","strange":"странный","stream":"ручей","strength":"силы","strong":"сильный","suddenly":"вдруг","sun":"солнце","sure":"уверен","swam":"поплыли","table":"стол","tail":"хвост","take":"взять","talk":"разговаривать","tall":"высокий","taught":"научил","tears":"слёзы","teeth":"зубы","ten":"десять","than":"чем","that":"тот, что, который","that's":"это (есть)","the":"(артикль)","their":"их","them":"их, им","then":"потом","there":"там (there is — есть)","there's":"есть, имеется","they":"они","thief":"вор","thing":"вещь","things":"вещи","think":"думать","thirty":"тридцать","this":"этот, это","thought":"подумал","three":"три","through":"через, сквозь","throw":"выбрасывать","time":"время, раз","to":"к, в, (частица инфинитива)","told":"сказал","tomorrow":"завтра","too":"тоже","took":"взял; снял","top":"вершина","toward":"к, по направлению к","tower":"вышка","tree":"дерево","trees":"деревья","tried":"пытался","trip":"поездка, плавание","turned":"исполнилось; стало; перевернула","tv":"телевизор","twelve":"двенадцать","two":"два","unclear":"неясный","under":"под","understand":"понимать","up":"вверх","us":"нас, нам","voice":"голос","waiting":"ждёт","want":"хотеть","wanted":"хотел","was":"был(а)","washed":"выбросило (волной)","watched":"следил","water":"вода","wave":"волна","waves":"волны","we":"мы","we're":"мы (есть)","weather":"погода","week":"неделя","weeks":"недели","went":"пошёл, стал","were":"были","what":"что","when":"когда","where":"где","while":"пока","white":"белый","who":"кто, который","whole":"весь, целый","wild":"дикий","will":"(буд. время)","wind":"ветер","window":"окно","wires":"провода","with":"с","woke":"проснулся","won't":"не (буд. время)","wooden":"деревянный","words":"слова","would":"бы","years":"годы, лет","yes":"да","yet":"ещё, пока","you":"ты, вы","you're":"ты (есть)","your":"твой"},"vocab":{"continued":9,"tail":29,"off":49,"tree":69,"trees":69,"hair":89,"behind":109,"bon":129,"appetit":129,"shore":149,"leave":169,"plank":189,"toward":210,"afternoon":230,"matters":250,"offered":270,"chin":291,"teeth":311,"honest":331,"sofa":351,"confident":371,"advice":392,"area":419,"sign":441,"steal":469,"stolen":469,"disappointment":491,"familiar":512,"rather":533,"path":554,"deserve":575,"dream":596,"dreams":596,"barely":617,"sigh":639}},{"id":10,"title_en":"The Fisherman's Map","title_ru":"Карта рыбака","genre":"Историческая загадка","summary_ru":"За старым холодильником деда Лена находит карту 1859 года, подписанную человеком, которого весь город полтора века считает вором.","paragraphs":[{"en":"Lena Harper was cleaning her grandfather's kitchen when she found the map. The old man was moving to a smaller apartment, and he had asked her to help. When she and her friend Sam pulled the heavy refrigerator away from the wall, a thin piece of yellow paper fell to the floor.","ru":"Лена Харпер убирала кухню своего деда, когда нашла карту. Старик переезжал в квартиру поменьше и попросил её помочь. Когда они с другом Сэмом отодвинули тяжёлый холодильник от стены, на пол упал тонкий жёлтый листок бумаги."},{"en":"“What's that?” Sam asked. He was a tall man with a red beard, and he worked at the town museum. He bent down and picked up the paper carefully, as if it could break into pieces.","ru":"«Что это?» — спросил Сэм. Это был высокий мужчина с рыжей бородой, он работал в городском музее. Он наклонился и осторожно поднял бумагу, словно она могла рассыпаться на куски."},{"en":"It was a hand-drawn map of the coast of Lake Erie. Lena saw their small town, Port Ashby, the old harbor and, a few miles from the shore, a tiny island. Someone had drawn a black cross on the island. At the bottom of the map there were two letters, T.R., and a date: 1859.","ru":"Это была нарисованная от руки карта побережья озера Эри. Лена увидела их городок Порт-Эшби, старую гавань и в нескольких милях от берега — крошечный остров. Кто-то нарисовал на острове чёрный крестик. Внизу карты стояли две буквы, T.R., и дата: 1859."},{"en":"Sam's eyes grew wide. “T.R.,” he said. “Thomas Reed. Lena, do you know who that is?”","ru":"Глаза Сэма округлились. «T.R., — сказал он. — Томас Рид. Лена, ты знаешь, кто это?»"},{"en":"Of course she knew. Everyone in Port Ashby knew the story. In 1859, a rich merchant called Silas Harlan said that a young fisherman, Thomas Reed, had stolen a bag of gold coins from his house. Reed disappeared the same night with his boat, and nobody ever saw him again. For more than a hundred and sixty years, the town had treated him as a thief. Children still sang a rude little song about him.","ru":"Конечно, она знала. Эту историю знали все в Порт-Эшби. В 1859 году богатый купец по имени Сайлас Харлан заявил, что молодой рыбак Томас Рид украл из его дома мешок золотых монет. Рид исчез в ту же ночь вместе со своей лодкой, и больше его никто не видел. Больше ста шестидесяти лет город относился к нему как к вору. Дети до сих пор пели о нём грубую песенку."},{"en":"“People always said he was guilty,” Lena said slowly. “But there was a lack of real evidence. Nobody found the gold.”","ru":"«Люди всегда говорили, что он виновен, — медленно сказала Лена. — Но настоящих доказательств не хватало. Золото так никто и не нашёл»."},{"en":"“Maybe this map shows where he hid it,” Sam said. He sounded excited, like a boy. “I suppose we have to find out.”","ru":"«Может быть, эта карта показывает, где он его спрятал, — сказал Сэм. Голос у него был взволнованный, как у мальчишки. — Полагаю, нам придётся это выяснить»."},{"en":"Lena called her grandfather, but the line was busy. She tried again ten minutes later, and this time he answered. When she told him about the map, he was quiet for a long moment. Then he said something strange: “Then it's yours now. Think of it as a gift. But promise me one thing: don't skip any part of the story. Read everything.” “Grandpa, did you know it was there?” she asked. But he had already put down the phone.","ru":"Лена позвонила деду, но линия была занята. Через десять минут она попробовала снова, и на этот раз он ответил. Когда она рассказала ему о карте, он долго молчал. Потом сказал что-то странное: «Значит, теперь она твоя. Считай это подарком. Но пообещай мне одно: не пропускай ни одной части этой истории. Прочитай всё». «Дедушка, ты знал, что она там?» — спросила она. Но он уже положил трубку."},{"en":"The next morning was cold and clear. Sam borrowed a small motor boat from his cousin, and they left the harbor at seven. Sam had made a playlist for the trip, old sea songs and country music, but after twenty minutes Lena turned it off. She wanted to observe the coast and compare it with the map. The water was calm, and she could see the reflection of the clouds on its surface.","ru":"Следующее утро было холодным и ясным. Сэм взял у двоюродного брата маленькую моторную лодку, и в семь часов они вышли из гавани. Сэм составил для поездки плейлист — старые морские песни и кантри, — но через двадцать минут Лена его выключила. Ей хотелось наблюдать за берегом и сравнивать его с картой. Вода была спокойной, и на её поверхности было видно отражение облаков."},{"en":"“Look at the shape of the shore,” she said, pointing. “It has changed a little, but the island is in the right place.” “You're clever,” Sam said with a smile. “Maybe you should work at the museum instead of me.”","ru":"«Посмотри на очертания берега, — сказала она, показывая рукой. — Он немного изменился, но остров на своём месте». «Ты умница, — улыбнулся Сэм. — Может, тебе стоит работать в музее вместо меня»."},{"en":"The island was small, rocky and covered with trees. They pulled the boat onto the stones and walked inland, using the map. Sam had to carry a heavy bag with a shovel, a flashlight and some sandwiches. Lena carried the map in a plastic folder to keep it safe from the wind.","ru":"Остров был маленьким, каменистым и заросшим деревьями. Они вытащили лодку на камни и пошли вглубь острова, сверяясь с картой. Сэму пришлось нести тяжёлую сумку с лопатой, фонариком и бутербродами. Лена несла карту в пластиковой папке, чтобы уберечь её от ветра."},{"en":"The black cross on the map was next to a big rock shaped like a bear's head. It took them an hour to find it. Behind the rock there was a narrow opening, almost hidden by bushes. Lena turned on the flashlight and went in first.","ru":"Чёрный крестик на карте был рядом с большой скалой, похожей на медвежью голову. Чтобы найти её, им понадобился час. За скалой был узкий проход, почти скрытый кустами. Лена включила фонарик и вошла первой."},{"en":"Inside, the cave was dry and surprisingly large. On the floor there were the remains of an old fire, some broken plates and a rusty metal pot. Against the wall, someone had built a kind of bed from wooden boards. Sam knelt down and touched the wood.","ru":"Внутри пещера оказалась сухой и неожиданно большой. На полу виднелись остатки старого костра, несколько разбитых тарелок и ржавый металлический котелок. У стены кто-то соорудил что-то вроде кровати из деревянных досок. Сэм опустился на колени и потрогал дерево."},{"en":"“People lived here,” he said quietly. “Not one person. Many people. Look.” On the stone wall, dozens of names and initials had been cut with a knife. Some had dates next to them: 1857, 1858, 1859.","ru":"«Здесь жили люди, — тихо сказал он. — Не один человек. Много людей. Смотри». На каменной стене ножом были вырезаны десятки имён и инициалов. Рядом с некоторыми стояли даты: 1857, 1858, 1859."},{"en":"Suddenly Lena understood. Her heart started to beat faster. “Sam,” she said, “in 1859 slavery was still legal in the South. Canada is on the other side of this lake. People who escaped from slavery came north, and some crossed the lake by boat to reach freedom.”","ru":"Внезапно Лена поняла. Её сердце забилось быстрее. «Сэм, — сказала она, — в 1859 году рабство на Юге ещё было законным. Канада — на другом берегу этого озера. Люди, бежавшие из рабства, шли на север, и некоторые пересекали озеро на лодке, чтобы обрести свободу»."},{"en":"“The Underground Railroad,” Sam whispered. “And this island was a hiding place. A safe stop before the last crossing.”","ru":"«Подземная железная дорога, — прошептал Сэм. — А этот остров был укрытием. Безопасной остановкой перед последней переправой»."},{"en":"Under one of the boards, Lena noticed a loose stone. She pulled it out. Behind it there was a small metal box. Inside the box there was a bag, not with gold, but with a black powder that still had a sharp smell. Sam laughed nervously. “Pepper,” he said. “It's black pepper. People used it to stop dogs from following a scent.” Under the bag there was a letter, folded many times, and a simple silver ring.","ru":"Под одной из досок Лена заметила шатающийся камень. Она вытащила его. За ним оказалась маленькая металлическая коробка. В коробке лежал мешочек — не с золотом, а с чёрным порошком, который всё ещё резко пах. Сэм нервно рассмеялся. «Перец, — сказал он. — Это чёрный перец. Им пользовались, чтобы собаки не могли идти по следу». Под мешочком лежало письмо, сложенное много раз, и простое серебряное кольцо."},{"en":"Lena read the letter aloud. Her voice was shaking. “My dear Anna,” it began. “If you read this, I could not come back. Mr. Harlan has discovered what I do with my boat. Two of the people I carried to Canada last week used to work in his house. He called them his property. Now he says I stole his gold. There was never any gold. He wants me in prison, or worse. The circumstances leave me no choice. Tonight I must cross the lake myself. I am sorry that I will miss our wedding. Keep this ring. I will send for you when it is safe.”","ru":"Лена прочитала письмо вслух. Её голос дрожал. «Моя дорогая Анна, — начиналось оно. — Если ты это читаешь, значит, я не смог вернуться. Мистер Харлан узнал, чем я занимаюсь на своей лодке. Двое из тех, кого я отвёз в Канаду на прошлой неделе, работали в его доме. Он называл их своей собственностью. Теперь он говорит, что я украл его золото. Никакого золота никогда не было. Он хочет, чтобы я оказался в тюрьме или того хуже. Обстоятельства не оставляют мне выбора. Сегодня ночью я сам должен переплыть озеро. Прости, что я пропущу нашу свадьбу. Сохрани это кольцо. Я пошлю за тобой, когда будет безопасно»."},{"en":"For a while neither of them said anything. Outside, the wind was moving the trees. “He wasn't a thief,” Sam said at last. “He was a hero. He was the victim of a lie, and the whole town believed it for a hundred and sixty years.” He shook his head. “Harlan was clever. He couldn't accuse Reed of helping people escape, not here in Ohio, so he invented a crime that everybody would understand.”","ru":"Какое-то время оба молчали. Снаружи ветер качал деревья. «Он не был вором, — наконец сказал Сэм. — Он был героем. Он стал жертвой лжи, и весь город сто шестьдесят лет в неё верил. — Он покачал головой. — Харлан был умён. Он не мог обвинить Рида в том, что тот помогал людям бежать, — только не здесь, в Огайо, — поэтому придумал преступление, понятное всем»."},{"en":"Lena looked at the ring. Something in her memory moved. “Anna,” she repeated. “My grandfather's grandmother was called Anna. Anna Harper. She went to Canada as a young woman, and later she came back with her husband and children.”","ru":"Лена посмотрела на кольцо. Что-то шевельнулось в её памяти. «Анна, — повторила она. — Бабушку моего деда звали Анна. Анна Харпер. Молодой женщиной она уехала в Канаду, а позже вернулась с мужем и детьми»."},{"en":"“Lena,” Sam said slowly, “what was her husband's name?” “I don't know,” she said. “Grandpa never told me.” But now she understood why he had asked her not to skip anything.","ru":"«Лена, — медленно сказал Сэм, — а как звали её мужа?» «Не знаю, — ответила она. — Дедушка никогда мне не говорил». Но теперь она поняла, почему он просил её ничего не пропускать."},{"en":"When they returned to Port Ashby that evening, her grandfather was sitting on a box in his half-empty kitchen. He looked at the ring in her hand and smiled. He didn't seem surprised at all. “You knew,” Lena said. “You knew all the time.”","ru":"Когда вечером они вернулись в Порт-Эшби, дед сидел на коробке в своей полупустой кухне. Он посмотрел на кольцо у неё в руке и улыбнулся. Он совсем не выглядел удивлённым. «Ты знал, — сказала Лена. — Ты всё время знал»."},{"en":"“My father told me when I was a boy,” he said. “Anna married Thomas in Canada. They changed their name to Harper to start a new life. When they came back after the war, Thomas was an old man with a white beard, and nobody recognized him. He had a great skill with boats, and he taught it to his sons. But he never told the town the truth. He said that was not the purpose of what he did. He wasn't looking for attention.”","ru":"«Мне рассказал отец, когда я был мальчишкой, — сказал он. — Анна вышла за Томаса замуж в Канаде. Они сменили фамилию на Харпер, чтобы начать новую жизнь. Когда после войны они вернулись, Томас был стариком с белой бородой, и никто его не узнал. Он прекрасно умел обращаться с лодками и научил этому своих сыновей. Но правду городу он так и не рассказал. Он говорил, что не в этом была цель того, что он делал. Он не искал внимания»."},{"en":"“Then why did you hide the map behind the refrigerator?”","ru":"«Тогда зачем ты спрятал карту за холодильником?»"},{"en":"He laughed. “I didn't hide it. My father did, sixty years ago, when people here were not ready to listen. I always thought I would show it to you one day, but I kept waiting for a better moment, and then I was afraid. It was a difficult decision. Some stories are heavier than gold.”","ru":"Он рассмеялся. «Я её не прятал. Это сделал мой отец, шестьдесят лет назад, когда люди здесь ещё не были готовы слушать. Я всегда думал, что однажды покажу её тебе, но всё ждал подходящего момента, а потом испугался. Это было трудное решение. Некоторые истории тяжелее золота»."},{"en":"Lena sat down next to him. “It's a touching story, Grandpa. And it's true. People should know.”","ru":"Лена села рядом с ним. «Это трогательная история, дедушка. И она правдивая. Люди должны знать»."},{"en":"The next month, Sam's museum opened a new exhibition: The Fisherman of Port Ashby. In the center, under glass, lay the old map, the letter and the silver ring. A lot of people came. Some cried. Even the mayor came and made a short speech about the benefits of knowing your real history, not the comfortable one.","ru":"В следующем месяце в музее Сэма открылась новая выставка: «Рыбак из Порт-Эшби». В центре, под стеклом, лежали старая карта, письмо и серебряное кольцо. Пришло много людей. Некоторые плакали. Пришёл даже мэр и произнёс короткую речь о преимуществах знания своей настоящей истории, а не удобной."},{"en":"On the last evening, after everyone had left, Lena stood alone in front of the glass. In it she saw her own reflection, and behind it, the black cross on the old map. For the first time, she felt she knew exactly where she came from.","ru":"В последний вечер, когда все разошлись, Лена стояла одна перед стеклом. Она видела в нём своё отражение, а за ним — чёрный крестик на старой карте. Впервые она почувствовала, что точно знает, откуда она родом."}],"gloss":{"a":"(артикль)","about":"о, про","accuse":"обвинить","afraid":"испуганный","after":"после","again":"снова","against":"у, к (стене)","ago":"назад","all":"весь, все","almost":"почти","alone":"один","aloud":"вслух","already":"уже","always":"всегда","am":"(есть) я","an":"(артикль)","and":"и","anna":"Анна (имя)","answered":"ответил","any":"какой-либо, любой","anything":"что-либо, ничего","apartment":"квартира","are":"(есть)","as":"как, будто","ashby":"Эшби (название)","asked":"спросил, попросил","at":"в, на, у","attention":"внимание","away":"прочь, от","back":"назад, обратно","bag":"мешок, сумка","bear's":"медвежий","beard":"борода","beat":"биться","bed":"кровать","been":"был","before":"перед, до","began":"начиналось","behind":"за, позади","believed":"верил","benefits":"преимущества","bent":"наклонился","better":"лучший","big":"большой","black":"чёрный","boards":"доски","boat":"лодка","boats":"лодки","borrowed":"одолжил","bottom":"низ","box":"коробка","boy":"мальчик","break":"разломиться","broken":"разбитый","built":"построил","bushes":"кусты","busy":"занята (линия)","but":"но","by":"на, у, кем","called":"по имени, позвонила","calm":"спокойный","came":"пришёл, приехал","canada":"Канада","carefully":"осторожно","carried":"нёс, перевёз","carry":"нести","cave":"пещера","center":"центр","changed":"изменился, сменили","chi
