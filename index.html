"trees":"деревья","tried":"попыталась","trousers":"брюки","true":"правда","trying":"пытаясь","turned":"повернула","twenty":"двадцать","two":"два","uncertainty":"неопределённость","under":"под","uneven":"неровный","up":"вверх, (фраз. глаг.)","upon":"на","usual":"обычно (as usual)","varga":"Варга (фамилия)","visited":"посещал","voice":"голос","waited":"подождала","walked":"шла, поднимался","wall":"стена","walls":"стены","want":"хотеть","wanted":"хотели","was":"был","wasn't":"не была","watch":"наблюдать, смотреть","watched":"смотрела","watching":"наблюдая","way":"образ (that way — так)","we":"мы","we're":"мы (есть)","wear":"носить","weapon":"оружие","week":"неделя","well":"хорошо","were":"были","what":"что","whatever":"что угодно","when":"когда","where":"где","white":"белый","who":"который, кто","whole":"весь, целый","why":"почему, зачем","will":"(будущее время)","with":"с","without":"без","woman":"женщина","wonderful":"чудесный","wooden":"деревянный","word":"слово","words":"слова","wore":"носил","work":"работать","worked":"сработало","world":"мир","would":"бы; (будущее в прошлом)","wrist":"запястье","wrote":"писал","year":"год","years":"годы, лет","yellow":"жёлтый","you":"вы, ты","you'll":"вам придётся (you will)","young":"молодой","your":"твой, ваш","react":"реагировать"},"vocab":{"nursery":18,"sitting":38,"room":38,"spicy":58,"dinner":78,"sword":98,"high":118,"step":138,"stick":158,"pen":178,"mouth":198,"saturday":219,"at":239,"once":239,"compare":259,"compared":259,"meaning":279,"wear":300,"pay":320,"mystery":340,"mysteries":340,"suspect":360,"imagine":380,"imagined":380,"patience":408,"upon":428,"socks":452,"nervous":479,"react":500,"rest":521,"uncertainty":542,"influence":564,"recently":584,"furniture":605,"hurry":627,"hurrying":627,"tool":649}},{"id":19,"title_en":"The Wrong Folder","title_ru":"Не та папка","genre":"Психологическая драма","summary_ru":"Редактор, который тридцать лет не позволял себе ни одной ошибки, однажды нажимает не ту кнопку — и его тщательно выстроенная жизнь начинает меняться.","paragraphs":[{"en":"Peter Lane was forty-two years old, and he had not made a mistake for a very long time. At least, that was what he told himself every morning as he put on his grey coat, checked the time twice and walked the same road to the office.","ru":"Питеру Лейну было сорок два года, и он очень давно не совершал ошибок. По крайней мере, так он говорил себе каждое утро, надевая серое пальто, дважды проверяя время и шагая по той же дороге в офис."},{"en":"He worked as an editor at a small publishing house. His job was to find mistakes in other people's books: a wrong word, a missing comma, a city that did not exist. He was very good at it. Writers were a little afraid of him, though they also respected him. “If Peter has read it,” people said, “it's perfect.”","ru":"Он работал редактором в маленьком издательстве. Его работа заключалась в том, чтобы находить ошибки в чужих книгах: неверное слово, пропущенную запятую, город, которого не существует. У него это очень хорошо получалось. Писатели его немного побаивались, хотя и уважали. «Если Питер прочитал, — говорили люди, — значит, всё идеально»."},{"en":"His life ran on a strict schedule. He arrived at 8:55. He had lunch at 12:30. On Tuesday he always ate the same thing: a meat sandwich and a cup of black tea at the café across the road. He never tried the soup of the day. What if he didn't like it? It seems a small thing, but for Peter every choice was dangerous.","ru":"Его жизнь шла по строгому расписанию. Он приходил в 8:55. Обедал в 12:30. Во вторник он всегда ел одно и то же: бутерброд с мясом и чашку чёрного чая в кафе через дорогу. Он никогда не пробовал суп дня. А вдруг он ему не понравится? Кажется, это мелочь, но для Питера каждый выбор был опасен."},{"en":"He always worked with a pencil, never with a pen. A pencil mark could be erased. A pen mark stayed forever.","ru":"Он всегда работал карандашом, никогда — ручкой. След карандаша можно стереть. След ручки остаётся навсегда."},{"en":"Nobody at work knew why he was like this. Peter himself did not like to think about it. But sometimes, late at night, he remembered his father: a tall, cold man who could not forgive mistakes. When Peter was nine, he painted a picture of the sea for his father's birthday. It was colourful and wild, with a purple sky. His father looked at it and said, “The sky is not purple. Do it again, and do it right.” Then he tore the picture in two.","ru":"Никто на работе не знал, почему он такой. Сам Питер не любил об этом думать. Но иногда, поздно ночью, он вспоминал отца: высокого, холодного человека, который не прощал ошибок. Когда Питеру было девять, он нарисовал картину с морем на день рождения отца. Она была яркой и дикой, с фиолетовым небом. Отец посмотрел на неё и сказал: «Небо не бывает фиолетовым. Переделай, и сделай правильно». Потом он разорвал картину пополам."},{"en":"There was no real violence in that house. His father never hit him. But the sound of the paper tearing stayed with Peter for thirty years. After that day he decided that it was safer to do nothing than to do something wrong.","ru":"Настоящей жестокости в том доме не было. Отец никогда его не бил. Но звук рвущейся бумаги остался с Питером на тридцать лет. После того дня он решил, что безопаснее ничего не делать, чем сделать что-то не так."},{"en":"He had a secret, though. In the evenings, alone in his flat, he still drew. Small things: a tree outside the window, a cat on a roof, the sea from memory. Each time he decided the drawing was bad. But he could never throw them away, so he took photos of them and kept them on his computer, in a folder called “Old documents”. Nobody had ever seen them.","ru":"Однако у него была тайна. По вечерам, один в своей квартире, он всё ещё рисовал. Мелочи: дерево за окном, кошку на крыше, море по памяти. Каждый раз он решал, что рисунок плохой. Но выбросить их он так и не мог, поэтому фотографировал и хранил на компьютере, в папке под названием «Старые документы». Их никто никогда не видел."},{"en":"In October a new illustrator joined the company. Her name was Mira. She was twenty-six, she wore a bright yellow coat and casual clothes, and she laughed loudly in the kitchen. On her first day she spilled coffee all over her desk, laughed, and said, “Well, that's a good start!” Peter watched her curiously, the way you might watch a strange animal in nature.","ru":"В октябре в компанию пришла новая иллюстраторша. Её звали Мира. Ей было двадцать шесть, она носила ярко-жёлтое пальто и повседневную одежду и громко смеялась на кухне. В первый же день она разлила кофе по всему столу, рассмеялась и сказала: «Ну, хорошее начало!» Питер с любопытством наблюдал за ней — так, как наблюдают за странным животным в природе."},{"en":"A week later Mira came to his desk with a pile of drawings. “They told me you check everything,” she said. “Could you look at my book? It's for children. It's about a bear who wants to fly.”","ru":"Через неделю Мира подошла к его столу со стопкой рисунков. «Мне сказали, что вы всё проверяете, — сказала она. — Не могли бы вы посмотреть мою книгу? Она для детей. Про медведя, который хочет летать»."},{"en":"Peter looked through the pages slowly. The drawings were full of life. But he found problems everywhere. “The trees here are blue,” he said. “Trees in nature are green. This bear has five fingers on one paw and four on the other. And here the sun and the moon are in the sky at the same time.”","ru":"Питер медленно пролистал страницы. Рисунки были полны жизни. Но он повсюду находил недочёты. «Деревья здесь синие, — сказал он. — В природе деревья зелёные. У этого медведя пять пальцев на одной лапе и четыре на другой. А здесь солнце и луна на небе одновременно»."},{"en":"Mira smiled. “The blue trees are my intention. It's a dream world. The fingers — OK, you're right, that's a mistake. Thank you. But the sun and the moon are not a mistake either. Haven't you ever seen the moon in the daytime? It's very common.”","ru":"Мира улыбнулась. «Синие деревья — это моё намерение. Это мир мечты. Пальцы — ладно, вы правы, это ошибка. Спасибо. Но солнце и луна — тоже не ошибка. Вы разве никогда не видели луну днём? Это очень обычное явление»."},{"en":"Peter had seen it, of course. He had just never thought that it was allowed in a book.","ru":"Питер, конечно, это видел. Просто он никогда не думал, что такое разрешено в книге."},{"en":"“Can I ask you something?” Mira said. “Where do you find inspiration? What do you love?” “I don't need inspiration,” Peter said. “I need correct information.” She looked at him for a long moment. “I guess that's a very safe way to live,” she said. He did not know if it was a compliment.","ru":"«Можно вас кое о чём спросить? — сказала Мира. — Где вы находите вдохновение? Что вы любите?» — «Мне не нужно вдохновение, — ответил Питер. — Мне нужна правильная информация». Она долго смотрела на него. «Полагаю, это очень безопасный способ жить», — сказала она. Он не понял, был ли это комплимент."},{"en":"After that, Mira often came to talk to him. She told him about her failures: the art school that had not accepted her, the first book that nobody bought, the expensive paints she had wasted. She told these stories as if they were funny. Peter could not understand it. “Aren't you worried about what people think?” he asked once. “Of course I am,” she said. “But if I wait until I'm perfect, I'll never do anything.”","ru":"После этого Мира часто приходила к нему поговорить. Она рассказывала о своих неудачах: о художественной школе, которая её не приняла, о первой книге, которую никто не купил, о дорогих красках, которые она истратила зря. Она рассказывала эти истории так, будто они были смешными. Питер не мог этого понять. «Вас не беспокоит, что подумают люди?» — спросил он однажды. «Конечно, беспокоит, — сказала она. — Но если я буду ждать, пока стану идеальной, я никогда ничего не сделаю»."},{"en":"That night Peter could not sleep. He opened the folder “Old documents” and looked at his drawings for a long time. Some of them were not bad. Some of them, he thought, were even good. He imagined showing one to Mira. Then he imagined her face, and his father's face behind it, and he quickly closed the computer. It was easier not to try. It was always easier not to try.","ru":"Той ночью Питер не мог уснуть. Он открыл папку «Старые документы» и долго смотрел на свои рисунки. Некоторые были неплохими. Некоторые, подумал он, были даже хорошими. Он представил, как показывает один из них Мире. Потом он представил её лицо, а за ним — лицо отца, и быстро закрыл компьютер. Легче было не пытаться. Всегда было легче не пытаться."},{"en":"Then, one Tuesday, something happened that changed everything.","ru":"А потом, в один вторник, случилось то, что изменило всё."},{"en":"Peter came back from lunch — meat sandwich, black tea, exactly twenty-five minutes — and found two emails from the director. The first said that the new book of fairy tales needed a cover, and anyone in the company could send ideas. The second asked Peter to send her the corrected text of the book before the evening. It was three hundred pages long.","ru":"Питер вернулся с обеда — бутерброд с мясом, чёрный чай, ровно двадцать пять минут — и нашёл два письма от директора. В первом говорилось, что новой книге сказок нужна обложка и что любой в компании может прислать идеи. Во втором Питера просили отправить ей исправленный текст книги до вечера. В нём было триста страниц."},{"en":"He worked late. The office was empty and dark. At ten o'clock he was very tired. He opened the email, attached a file, pressed “Send” and went home. For the first time in years, he did not check it twice.","ru":"Он задержался допоздна. Офис был пуст и тёмен. В десять часов он очень устал. Он открыл письмо, прикрепил файл, нажал «Отправить» и пошёл домой. Впервые за много лет он не проверил дважды."},{"en":"The next morning the director was standing by his desk. On her laptop he saw a picture of the sea under a purple sky. It was his. He had not attached the book. He had attached the folder “Old documents”: forty drawings that nobody was supposed to see.","ru":"На следующее утро у его стола стояла директор. На её ноутбуке он увидел картину с морем под фиолетовым небом. Это была его картина. Он прикрепил не книгу. Он прикрепил папку «Старые документы» — сорок рисунков, которые никто не должен был видеть."},{"en":"Peter felt cold. His hands began to shake. “I'm so sorry,” he said. “It was a mistake. A terrible mistake. Please delete them. I'll send the right file at once.”","ru":"Питеру стало холодно. Руки начали дрожать. «Простите, пожалуйста, — сказал он. — Это была ошибка. Ужасная ошибка. Пожалуйста, удалите их. Я сейчас же пришлю нужный файл»."},{"en":"“A mistake?” The director looked at him as if he were crazy. “Peter, these are wonderful. What do you mean, delete them? This one is going on the cover.”","ru":"«Ошибка?» Директор посмотрела на него так, будто он сошёл с ума. «Питер, они чудесные. Что значит — удалить? Вот эта пойдёт на обложку»."},{"en":"He tried to convince her. He said the drawings were not finished, that the sky was the wrong colour, that his behavior had been unprofessional. She did not listen. Every attempt only made her more sure.","ru":"Он пытался её переубедить. Говорил, что рисунки не закончены, что небо не того цвета, что он повёл себя непрофессионально. Она не слушала. Каждая попытка только сильнее убеждала её."},{"en":"The book came out in spring, with a purple sky on the cover. Children loved it. A newspaper wrote a short article about “the editor who painted in secret”, and for a few weeks Peter had a little fame. A journalist asked him to convey what he felt when he painted. Peter thought for a long time and then said, “Fear, mostly. And then, under the fear, something like joy.”","ru":"Книга вышла весной, с фиолетовым небом на обложке. Детям она понравилась. Одна газета напечатала короткую статью о «редакторе, который тайно рисовал», и на несколько недель к Питеру пришла маленькая слава. Журналист попросил его передать, что он чувствует, когда рисует. Питер долго думал, а потом сказал: «В основном страх. А потом, под страхом, что-то вроде радости»."},{"en":"One day Mira sat down next to him at lunch. “So,” she said. “The man who never makes mistakes made a big one.” “The biggest mistake of my life,” Peter agreed. “And the best.”","ru":"Однажды за обедом Мира села рядом с ним. «Итак, — сказала она. — Человек, который никогда не ошибается, совершил большую ошибку». — «Самую большую ошибку в моей жизни, — согласился Питер. — И самую лучшую»."},{"en":"Mira looked at him curiously. “Can I tell you what I think? The book file was called ‘Fairy Tales — Final’. Your folder was called ‘Old documents’. The names don't have anything in common. And you are the most careful person I have ever met. Do you really believe it was an accident?”","ru":"Мира с любопытством посмотрела на него. «Можно я скажу, что думаю? Файл книги назывался „Сказки — финал“. Ваша папка называлась „Старые документы“. В этих названиях нет ничего общего. А вы самый внимательный человек из всех, кого я встречала. Вы правда верите, что это была случайность?»"},{"en":"Peter opened his mouth to answer, and then closed it. He remembered that evening: the dark office, his tired eyes, his finger above the button. He remembered that, for one second, he had seen the name of the folder. And he had pressed anyway.","ru":"Питер открыл рот, чтобы ответить, и закрыл его. Он вспомнил тот вечер: тёмный офис, усталые глаза, палец над кнопкой. Он вспомнил, что на одну секунду увидел название папки. И всё равно нажал."},{"en":"Maybe it had not been a mistake at all. Maybe a nine-year-old boy had been waiting thirty years for somebody to see his purple sky.","ru":"Может быть, это вовсе не было ошибкой. Может быть, девятилетний мальчик тридцать лет ждал, чтобы кто-нибудь увидел его фиолетовое небо."},{"en":"The next Tuesday Peter did not order the meat sandwich. He ordered the soup of the day. It was terrible, much too salty. He laughed and ate all of it. Then he took a pen out of his pocket, not a pencil, and began to draw on a napkin.","ru":"В следующий вторник Питер не заказал бутерброд с мясом. Он заказал суп дня. Суп был ужасный, слишком солёный. Питер рассмеялся и съел его весь. Потом он достал из кармана ручку, а не карандаш, и начал рисовать на салфетке."}],"gloss":{"a":"(неопр. артикль)","about":"о, про","above":"над","accepted":"приняла","accident":"случайность","across":"через","afraid":"боящийся","after":"после","again":"снова","agreed":"согласился","all":"всё, весь","allowed":"разрешено","alone":"один","also":"также","always":"всегда","am":"(есть) — я","an":"(неопр. артикль)","and":"и","animal":"животное","answer":"ответить","anyone":"любой","anything":"что-нибудь","anyway":"всё равно","are":"(есть) — мы/вы/они","aren't":"не (есть) — вы","arrived":"приходил","art":"искусство, художественный","article":"статья","as":"как, когда","ask":"спросить","asked":"спросил, попросил","at":"в, на, у","ate":"ел, съел","attached":"прикрепил","attempt":"попытка","away":"прочь","back":"обратно","bad":"плохой","be":"быть","bear":"медведь","been":"было (been)","before":"перед, до","began":"начал","behavior":"поведение","behind":"за, позади","believe":"верить","best":"лучший","big":"большой","biggest":"самый большой","birthday":"день рождения","black":"чёрный","blue":"синий","book":"книга","books":"книги","bought":"купил","boy":"мальчик","bright":"яркий","but":"но","button":"кнопка","by":"у, возле","caf":"кафе (café)","called":"называемый, назывался","came":"пришёл","can":"мочь, можно","careful":"осторожный","casual":"повседневный","cat":"кошка","changed":"изменило","check":"проверять","checked":"проверил","children":"дети","choice":"выбор","city":"город","closed":"закрыл","clothes":"одежда","coat":"пальто","coffee":"кофе","cold":"холодный","colour":"цвет","colourful":"яркий, красочный","comma":"запятая", по всему (all over)","pages":"страницы","painted":"рисовал","paints":"краски","paper":"бумага","paw":"лапа","pen":"ручка","pencil":"карандаш","people":"люди","people's":"людей, чужие","perfect":"отличный","person":"человек","peter":"Питер (имя)","photos":"фотографии","picture":"картина","pile":"стопка","please":"пожалуйста","pocket":"карман","pressed":"нажал","problems":"проблемы","publishing":"издательский","purple":"фиолетовый","put":"надевал (put on)","quickly":"быстро","ran":"шла (о жизни)","read":"прочитал","real":"настоящий","really":"правда, действительно","remembered":"вспомнил","respected":"уважали","right":"правильно; правый, нужный","road":"дорога","roof":"крыша","safe":"безопасный","safer":"безопаснее","said":"сказал","salty":"солёный","same":"тот же","sandwich":"бутерброд","sat":"села","saw":"увидел","schedule":"расписание","school":"школа","sea":"море","second":"секунда","secret":"тайна, тайно (in secret)","see":"видеть","seems":"кажется","seen":"видел","send":"отправить","shake":"дрожать","she":"она","short":"короткий","showing":"показывает","six":"шесть","sky":"небо","sleep":"спать","slowly":"медленно","small":"маленький","smiled":"улыбнулся","so":"так, поэтому","some":"немного","somebody":"кто-то","something":"что-то","sometimes":"иногда","sorry":"прости","sound":"звук","soup":"суп","spilled":"разлила","spring":"весна","standing":"стояла","start":"начало","stayed":"остался","still":"всё ещё","stories":"истории","strange":"странный","strict":"строгий","sun":"солнце","supposed":"должен (was supposed to)","sure":"уверен","tales":"сказки (fairy tales)","talk":"разговаривать","tall":"высокий","tea":"чай","tearing":"рвущийся","tell":"сказать","ten":"десять","terrible":"ужасный","text":"текст","than":"чем","thank":"благодарить (thank you)","that":"тот, что, который","that's":"это (есть)","the":"(артикль)","them":"их, им","then":"потом","there":"там (there is — есть)","these":"эти","they":"они","thing":"вещь","things":"вещи","think":"думать","thirty":"тридцать","this":"этот, это","though":"хотя; однако","thought":"подумал","three":"три","through":"через, сквозь","throw":"выбрасывать","time":"время, раз","tired":"усталый","to":"к, в, (частица инфинитива)","told":"сказал","too":"тоже","took":"сделал (фото); достал","tore":"разорвал","tree":"дерево","trees":"деревья","tried":"пытался; пробовал","try":"пытаться","tuesday":"вторник","twenty":"двадцать","twice":"дважды","two":"два","under":"под","understand":"понимать","unprofessional":"непрофессиональный","until":"до тех пор, пока","very":"очень","violence":"насилие, жестокость","wait":"ждать","waiting":"ждал","walked":"шёл","wants":"хочет","was":"был(а)","wasted":"потратила зря","watch":"наблюдать","watched":"наблюдал","way":"способ; так, как","week":"неделя","weeks":"недели","well":"ну","went":"пошёл, стал","were":"были","what":"что","when":"когда","where":"где","who":"кто, который","why":"почему","wild":"дикий","window":"окно","with":"с","wonderful":"чудесный","word":"слово","wore":"носила","work":"работа","worked":"работал","world":"мир","worried":"обеспокоенный","writers":"писатели","wrong":"неправильный, не тот","wrote":"написала","year":"год","years":"годы, лет","yellow":"жёлтый","you":"ты, вы","you're":"ты (есть)","your":"твой"},"vocab":{"colourful":19,"coat":39,"meat":59,"lunch":79,"seems":99,"tall":119,"common":139,"though":159,"pencil":179,"late":199,"tuesday":220,"nature":240,"exist":260,"mean":280,"expensive":301,"attempt":321,"violence":341,"intention":361,"schedule":381,"road":409,"guess":429,"curiously":454,"worried":480,"fame":501,"pressed":522,"casual":544,"convey":565,"behavior":585,"until":606,"convince":628,"inspiration":650}},{"id":20,"title_en":"The Man Without a Shadow","title_ru":"Человек без тени","genre":"Сказка для взрослых","summary_ru":"Жадный торговец из городка Велмар продаёт незнакомцу в сером пальто свою тень — и вскоре узнаёт, чего она стоила на самом деле.","paragraphs":[{"en":"In the town of Velmar, where the streets were narrow and the market smelled of bread and onions, there lived a merchant called Anselm Brask. He sold vegetables and fruit: onions in winter, cherries in summer, and cherry juice in tall green bottles all year round. His juice was excellent, and people came from other towns to buy it.","ru":"В городке Велмар, где улицы были узкими, а рынок пах хлебом и луком, жил торговец по имени Ансельм Браск. Он продавал овощи и фрукты: зимой лук, летом вишню, а вишнёвый сок в высоких зелёных бутылках — круглый год. Сок у него был превосходный, и люди приезжали за ним из других городов."},{"en":"But Anselm was never happy. He had an obsession, and its name was money. He counted his coins every night before he went to sleep, and every morning he felt that he did not have enough. He rarely smiled. He rarely took a break, even on Sundays. He paid no regard to his neighbors, and sometimes, when an old woman could not see well, he gave her less change than he owed her. In his heart he knew that this was the same as robbing her, but he told himself that everybody did it.","ru":"Но Ансельм никогда не был счастлив. У него была одержимость, и звали её деньги. Каждый вечер перед сном он пересчитывал монеты, а каждое утро чувствовал, что их недостаточно. Он редко улыбался. Он редко делал перерыв, даже по воскресеньям. Он не обращал внимания на соседей, а иногда, если старушка плохо видела, давал ей меньше сдачи, чем был должен. В глубине души он знал, что это всё равно что грабить её, но говорил себе, что так делают все."},{"en":"He had only one beloved thing besides money: Mira, the baker's daughter. She laughed at his serious face and called him “the onion man,” because, she said, he had many layers and all of them made people cry. Anselm wanted to marry her, but first, he decided, he had to become rich. Really rich.","ru":"Кроме денег, у него было лишь одно любимое сокровище — Мира, дочь пекаря. Она смеялась над его серьёзным лицом и называла его «луковым человеком», потому что, по её словам, у него было много слоёв и от каждого люди плакали. Ансельм хотел жениться на ней, но сначала, решил он, ему нужно разбогатеть. По-настоящему разбогатеть."},{"en":"One hot afternoon in July, a stranger came to his stall. He was tall and thin, dressed in a grey coat in spite of the heat, and he had very pale eyes. He did not look at the cherries or the juice. He looked at the ground, at Anselm's shadow.","ru":"Однажды жарким июльским днём к его прилавку подошёл незнакомец. Он был высоким и худым, несмотря на жару, одет в серое пальто, а глаза у него были очень светлые. Он не смотрел ни на вишню, ни на сок. Он смотрел на землю — на тень Ансельма."},{"en":"“That is an excellent shadow,” the stranger said. “Long, dark, very clear. I would like to buy it.”","ru":"«Превосходная тень, — сказал незнакомец. — Длинная, тёмная, очень чёткая. Я хотел бы её купить»."},{"en":"Anselm laughed. “A shadow? You can't sell a shadow.”","ru":"Ансельм рассмеялся. «Тень? Тень нельзя продать»."},{"en":"“You can sell anything,” said the stranger, “if someone wants to buy it. I will give you a hundred gold coins. Every month. For the rest of your life.” He took a small paper from his pocket. “Just sign here.”","ru":"«Продать можно что угодно, — сказал незнакомец, — если кто-то хочет это купить. Я дам вам сто золотых монет. Каждый месяц. До конца жизни. — Он достал из кармана небольшую бумагу. — Просто подпишите здесь»."},{"en":"Anselm's mind worked quickly. A shadow was nothing. It did not eat, it did not work, it did not bring him money. A hundred gold coins every month was more than he earned in a year. He felt no resistance at all. He signed.","ru":"Ум Ансельма заработал быстро. Тень — это ничто. Она не ест, не работает, не приносит ему денег. Сто золотых монет каждый месяц — больше, чем он зарабатывал за год. Он не почувствовал никакого сопротивления. Он подписал."},{"en":"The stranger bent down, took the edge of the shadow between two fingers, as if it were a piece of black silk, and rolled it up. Then he put it under his arm and walked away. When Anselm looked down, the ground at his feet was bright and empty.","ru":"Незнакомец наклонился, взял край тени двумя пальцами, словно это был кусок чёрного шёлка, и свернул её. Потом сунул её под мышку и ушёл прочь. Когда Ансельм посмотрел вниз, земля у его ног была светлой и пустой."},{"en":"At first, it was wonderful. The gold arrived on the first day of every month, in a heavy bag that appeared on his table while he was sleeping. He bought a large house on the hill. He bought new clothes, a carriage and a picture by a famous painter for his living room. He stopped selling onions. Instead, he paid other people to sell them for him.","ru":"Поначалу всё было чудесно. Золото приходило в первый день каждого месяца — тяжёлый мешок появлялся у него на столе, пока он спал. Он купил большой дом на холме. Он купил новую одежду, карету и картину знаменитого художника для гостиной. Он перестал продавать лук. Вместо этого он платил другим, чтобы они продавали его за него."},{"en":"But soon people began to notice. Children pointed at him in the sunny square. Dogs barked at him. Old women crossed the street when they saw him coming. Then the town newspaper printed an article with the title: “Is our richest man a ghost?” After that, it was evident to everyone that something was wrong with Anselm Brask. His sellers lost their customers, because nobody wanted to buy onions from a man without a shadow.","ru":"Но вскоре люди начали замечать. Дети показывали на него пальцами на солнечной площади. Собаки лаяли на него. Старушки переходили на другую сторону улицы, завидев его. Потом городская газета напечатала статью под заголовком: «Наш самый богатый человек — призрак?» После этого всем стало очевидно, что с Ансельмом Браском что-то не так. Его продавцы теряли покупателей, потому что никто не хотел покупать лук у человека без тени."},{"en":"Worst of all was Mira. When he finally came to her father's bakery with a ring, she looked at him for a long time. Then she looked at the floor next to his feet.","ru":"Хуже всего была Мира. Когда он наконец пришёл в пекарню её отца с кольцом, она долго смотрела на него. Потом посмотрела на пол рядом с его ногами."},{"en":"“Where is your shadow, Anselm?” she asked quietly.","ru":"«Где твоя тень, Ансельм?» — тихо спросила она."},{"en":"“It doesn't matter,” he said. “I'm ready to marry you now. I have a house, gold, everything.”","ru":"«Это неважно, — сказал он. — Теперь я готов на тебе жениться. У меня есть дом, золото, всё»."},{"en":"“A man without a shadow is a man without a past,” she said. “My grandmother always told me that. I'm sorry. I don't know who you are anymore.” And she sent him away.","ru":"«Человек без тени — это человек без прошлого, — сказала она. — Так всегда говорила мне бабушка. Прости. Я больше не знаю, кто ты». И она прогнала его прочь."},{"en":"That night Anselm could not sleep. He lay under his thick blanket in his big cold bedroom and listened to the silence. The house felt empty. His life felt empty. He understood that the gold could not buy him the one thing he really wanted. He tried to read, but the words meant nothing. He looked at the expensive picture on the wall, and for the first time he noticed that the people in it had shadows. Even the painted trees had shadows. Only he had none.","ru":"В ту ночь Ансельм не мог уснуть. Он лежал под толстым одеялом в своей большой холодной спальне и слушал тишину. Дом казался пустым. Его жизнь казалась пустой. Он понял, что золото не может купить ему то единственное, чего он по-настоящему хотел. Он попытался читать, но слова ничего не значили. Он посмотрел на дорогую картину на стене и впервые заметил, что у людей на ней есть тени. Даже у нарисованных деревьев были тени. Только у него не было."},{"en":"The next morning he went to a lawyer, an old man called Dorn who had an office above the post office. Dorn read the contract three times, slowly, through his small round glasses.","ru":"На следующее утро он пошёл к юристу — старику по имени Дорн, чья контора находилась над почтой. Дорн медленно прочитал договор три раза сквозь свои маленькие круглые очки."},{"en":"“The issue is simple,” he said at last. “The contract is legal. But there is one line at the end, in very small letters. It says that the seller may buy back his shadow at any time, for a different price.”","ru":"«Проблема простая, — сказал он наконец. — Договор законный. Но в конце есть одна строчка очень мелкими буквами. В ней сказано, что продавец может выкупить свою тень в любое время, но за другую цену»."},{"en":"“What price?” Anselm asked.","ru":"«Какую цену?» — спросил Ансельм."},{"en":"“It doesn't say. You must ask the buyer. Here is his address.” The lawyer wrote something on a piece of paper. “I must warn you. People who go to that address rarely come back the same.”","ru":"«Здесь не сказано. Вы должны спросить покупателя. Вот его адрес. — Юрист что-то написал на листке бумаги. — Должен вас предупредить. Люди, которые идут по этому адресу, редко возвращаются прежними»."},{"en":"The address led Anselm out of town, through the forest and up into the hills. It was evening when he reached a small grey house. The stranger opened the door before Anselm knocked, as if he had been waiting for this meeting.","ru":"Адрес привёл Ансельма за город, через лес и вверх, в холмы. Был уже вечер, когда он добрался до маленького серого дома. Незнакомец открыл дверь прежде, чем Ансельм постучал, словно давно ждал этой встречи."},{"en":"Inside, the walls were covered with shadows. Hundreds of them hung there like coats: the shadows of men and women, children, a dog, even a horse. Some of them moved a little, as if they were dreaming. Anselm recognized his own shadow at once. It was standing in a corner, with its head down. The room was cold, and it smelled of dust and old rain.","ru":"Внутри стены были увешаны тенями. Сотни теней висели там, как пальто: тени мужчин и женщин, детей, собаки и даже лошади. Некоторые слегка шевелились, будто видели сны. Ансельм сразу узнал свою тень. Она стояла в углу, опустив голову. В комнате было холодно, пахло пылью и старым дождём."},{"en":"“I want it back,” Anselm said. “I'll give you all the gold.”","ru":"«Я хочу её вернуть, — сказал Ансельм. — Я отдам вам всё золото»."},{"en":"The stranger smiled. “I don't want gold. I have enough of it. I collect shadows because a shadow keeps everything a man has forgotten: every kind word he didn't say, every coin he took that wasn't his. Your shadow is very heavy, Anselm. Do you know why?”","ru":"Незнакомец улыбнулся. «Мне не нужно золото. У меня его достаточно. Я собираю тени, потому что тень хранит всё, что человек забыл: каждое доброе слово, которое он не сказал, каждую монету, которую он взял, хотя она была не его. Ваша тень очень тяжёлая, Ансельм. Знаете почему?»"},{"en":"Anselm said nothing. He thought of the old women at his stall, and his face burned.","ru":"Ансельм ничего не ответил. Он вспомнил старушек у своего прилавка, и лицо его вспыхнуло."},{"en":"“Here is my price,” the stranger said. “Tomorrow you will go back to the market. You will give back every coin you ever took dishonestly, and the gold I gave you too. And you will announce to the whole town what you have done. Then you will get your shadow back.”","ru":"«Вот моя цена, — сказал незнакомец. — Завтра вы вернётесь на рынок. Вы отдадите каждую монету, которую когда-либо взяли нечестно, и золото, которое дал вам я, тоже. И вы объявите всему городу о том, что сделали. Тогда вы получите свою тень обратно»."},{"en":"Anselm's first feeling was fear. To lose everything, and to lose it in front of all the people who already laughed at him! But then he thought of Mira's face, and he felt something different: relief. It was as if a heavy bag had fallen from his back. For years his obsession had been like a hand around his neck. Now, for the first time, it was letting go.","ru":"Первым чувством Ансельма был страх. Потерять всё, да ещё на глазах у всех людей, которые и так над ним смеялись! Но потом он подумал о лице Миры и почувствовал нечто другое — облегчение. Словно у него со спины упал тяжёлый мешок. Много лет его одержимость была словно рука на его шее. Теперь, впервые, она его отпускала."},{"en":"The next day, in the middle of the market, Anselm Brask stood on an empty box and told the town everything. He gave money to the old women, to the farmers, to the children who had bought juice from him. When he finished, he was poor again. The sun was hot and bright, and the people were silent. Some people shouted at him. Some people cried. One old woman, the one he had cheated most often, took his hand and held it for a moment without a word.","ru":"На следующий день посреди рынка Ансельм Браск встал на пустой ящик и рассказал городу всё. Он раздал деньги старушкам, фермерам, детям, которые покупали у него сок. Когда он закончил, он снова был беден. Солнце светило жарко и ярко, и люди молчали. Кто-то кричал на него. Кто-то плакал. Одна старушка, которую он обманывал чаще всех, взяла его за руку и подержала её мгновение, не говоря ни слова."},{"en":"Then a little girl shouted, “Look!” On the stones at Anselm's feet, a long dark shadow was slowly appearing, as if someone were painting it.","ru":"Вдруг маленькая девочка закричала: «Смотрите!» На камнях у ног Ансельма медленно проступала длинная тёмная тень, словно кто-то её рисовал."},{"en":"Mira was standing at the edge of the crowd. She did not say anything. But Anselm saw that her shadow, on the ground, had already moved across the square and was holding his shadow's hand. Shadows, the old people of Velmar say, always know the truth a little earlier than we do.","ru":"Мира стояла на краю толпы. Она ничего не сказала. Но Ансельм увидел, что её тень на земле уже перебралась через площадь и держит за руку его тень. Тени, как говорят старики Велмара, всегда узнают правду чуть раньше нас."}],"gloss":{"a":"(артикль)","above":"над","across":"через","address":"адрес","after":"после","afternoon":"день, после полудня","again":"снова","all":"весь, все","already":"уже","always":"всегда","an":"(артикль)","and":"и","announce":"объявить","anselm":"Ансельм (имя)","anselm's":"Ансельма","any":"любой","anymore":"больше (не)","anything":"что-либо, ничего","appeared":"появлялся","appearing":"появлялась","are":"(есть)","arm":"рука; under his arm — под мышкой","around":"вокруг","arrived":"приходило","article":"статья","as":"как, будто","ask":"спросить","asked":"спросил","at":"в, на, у","away":"прочь","back":"назад; спина","bag":"мешок","baker's":"пекаря","bakery":"пекарня","barked":"лаяли","because":"потому что","become":"стать","bedroom":"спальня","been":"был","before":"до, перед","began":"начали","beloved":"любимый","bent":"наклонился","besides":"кроме","between":"между","big":"большой","black":"чёрный","blanket":"одеяло","bottles":"бутылки","bought":"купил","box":"ящик","brask":"Браск (фамилия)","bread":"хлеб","break":"перерыв","bright":"светлый, яркий","bring":"приносить","burned":"горело, вспыхнуло","but":"но","buy":"купить","buyer":"покупатель","by":"у (кого-то), кем","called":"по имени, называла","came":"пришёл","can":"может","can't":"нельзя","carriage":"карета","change":"сдача","cheated":"обманывал","cherries":"вишня","cherry":"вишнёвый","children":"дети","clear":"чёткий","clothes":"одежда","coat":"пальто","coats":"пальто","coin":"монета","coins":"монеты","cold":"холодный","collect":"собирать","come":"прийти, вернуться","coming":"идущий","contract":"договор","corner":"угол","could":"мог","counted":"пересчитывал","covered":"покрытый, увешанный","crossed":"переходили","crowd":"толпа","cry":"плакать","customers":"покупатели","dark":"тёмный","daughter":"дочь","day":"день","decided":"решил","did":"(вспом.), делали","didn't":"не (прош. вр.)","different":"другой, иной","dishonestly":"нечестно","do":"(вспом.), делать","doesn't":"не (3 л.)","dog":"собака","dogs":"собаки","don't":"не","done":"сделал","door":"дверь","dorn":"Дорн (фамилия)","down":"вниз","dreaming":"видели сны","dressed":"одетый","dust":"пыль","earlier":"раньше","earned":"зарабатывал","eat":"есть","edge":"край","empty":"пустой","end":"конец","enough":"достаточно","evening":"вечер","even":"даже","ever":"когда-либо","every":"каждый","everybody":"все","everyone":"все","everything":"всё","evident":"очевидный","excellent":"превосходный","expensive":"дорогой","eyes":"глаза","face":"лицо","fallen":"упал","famous":"знаменитый","farmers":"фермеры","father's":"отца","fear":"страх","feeling":"чувство","feet":"ноги","felt":"почувствовал, казался","finally":"наконец","fingers":"пальцы","finished":"закончил","first":"первый; at first — сначала","floor":"пол","for":"за, для, в течение","forest":"лес","forgotten":"забыл","from":"из, от, у","front":"in front of — перед","fruit":"фрукты","gave":"дал","get":"получить","ghost":"призрак","girl":"девочка","give":"дать, отдать","glasses":"очки","go":"идти; let go — отпускать","gold":"золото, золотой","grandmother":"бабушка","green":"зелёный","grey":"серый","ground":"земля","had":"имел, (вспом.)","hand":"рука","happy":"счастливый","has":"(вспом.)","have":"иметь, (вспом.)","he":"он","head":"голова","heart":"сердце","heat":"жара","heavy":"тяжёлый","held":"держала","her":"её, ей","here":"здесь, вот","hill":"холм","hills":"холмы","him":"его, ему","himself":"себе","his":"его, свой","holding":"держала","horse":"лошадь","hot":"жаркий","house":"дом","hundred":"сто","hundreds":"сотни","hung":"висели","i":"я","i'll":"я (буд. вр.)","i'm":"я","if":"если","in":"в","inside":"внутри","instead":"вместо этого","into":"в","is":"есть, является","issue":"проблема","it":"это, он, она","its":"его, её","juice":"сок","july":"июль","just":"просто","keeps":"хранит","kind":"добрый","knew":"знал","knocked":"постучал","know":"знать","large":"большой","last":"at last — наконец","laughed":"смеялся","lawyer":"юрист","lay":"лежал","layers":"слои","led":"привёл","legal":"законный","less":"меньше","letters":"буквы","letting":"lett const BYNUM = Object.fromEntries(WORDS.map(w=>[w.n,w]));
let reading = null;
function wordCount(tx){ return tx.paragraphs.reduce((a,p)=>a+(p.en.match(/[A-Za-z]+/g)||[]).length,0); }
function renderTexts(){
  const done = TEXTS.filter(t=>S.read[t.id]?.done).length;
  view.innerHTML = `<div class="tlist">
    <div class="hint">${TEXTS.length} историй со словами из твоего списка. Нажми на любое слово, чтобы увидеть перевод. Слова из словаря подчёркнуты. Прочитано: ${done} из ${TEXTS.length}.</div>
    ${TEXTS.map(tx=>{ const r=S.read[tx.id]; const wc=wordCount(tx); const nv=new Set(Object.values(tx.vocab)).size;
      return `<button class="tcard" data-id="${tx.id}"><span class="meta"><span class="g">${esc(tx.genre)}</span><span>${Math.max(1,Math.round(wc/120))} мин · ${nv} слов из словаря</span>${r?.done?'<span class="badge done">Прочитано</span>':r?'<span class="badge go">Начато</span>':''}</span>
        <span class="t" lang="en">${esc(tx.title_en)}</span><span class="tr2">${esc(tx.title_ru)}</span><span class="s">${esc(tx.summary_ru)}</span></button>`; }).join('')}
  </div>`;
  view.querySelectorAll('.tcard').forEach(c => c.onclick = () => { reading = +c.dataset.id; if(!S.read[reading]){ S.read[reading]={t:Date.now()}; save(); } render(); window.scrollTo(0,0); });
}
function tokenize(s){ return s.split(/([A-Za-z]+(?:['’][A-Za-z]+)*)/); }
function renderReader(){
  const tx = TEXTS.find(t=>t.id===reading); if(!tx){ reading=null; return renderTexts(); }
  const words = [...new Set(Object.values(tx.vocab))].map(n=>BYNUM[n]).filter(Boolean);
  view.innerHTML = `<article class="reader">
    <div class="row" style="flex-wrap:nowrap"><button class="ghost" id="back" style="flex:0 0 auto">← Все тексты</button></div>
    <div class="group"><span class="g" style="font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)">${esc(tx.genre)}</span><h1 lang="en">${esc(tx.title_en)}</h1><div class="hint" style="font-size:15px">${esc(tx.title_ru)}</div></div>
    ${tx.paragraphs.map((p,i)=>`<div class="para"><p lang="en">${tokenize(p.en).map((s,k)=> k%2 ? `<span class="tw${tx.vocab[s.toLowerCase().replace(/’/g,"'")]?' v':''}">${esc(s)}</span>` : esc(s)).join('')}</p>
      <div class="ptools"><button class="pbtn" data-tr="${i}">Перевод</button>${TTS?`<button class="pbtn" data-say="${i}">Слушать</button>`:''}</div>
      <div class="pru" id="pru${i}" hidden>${esc(p.ru)}</div></div>`).join('')}
    <div class="panel"><div class="lbl">Слова из словаря в этом тексте (${words.length})</div>
      <div class="list">${words.map(w=>`<div class="li"><div class="w"><span class="num">${w.n}</span>${esc(w.en)}<small>${esc(w.ru)}</small></div></div>`).join('')}</div>
      <div class="row"><button class="big" id="trainTx">Тренировать эти слова</button><button class="ghost" id="doneTx">${S.read[tx.id]?.done?'Прочитано ✓':'Отметить прочитанным'}</button></div></div>
  </article>`;
  document.getElementById('back').onclick = () => { closeSheet(); reading=null; render(); window.scrollTo(0,0); };
  view.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { const el=document.getElementById('pru'+b.dataset.tr); el.hidden=!el.hidden; b.textContent = el.hidden?'Перевод':'Скрыть перевод'; });
  view.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(tx.paragraphs[+b.dataset.say].en,'en',true));
  view.querySelectorAll('.tw').forEach(el => el.onclick = e => { e.stopPropagation(); showWord(tx, el); });
  document.getElementById('doneTx').onclick = () => { S.read[tx.id] = {...(S.read[tx.id]||{}), done:true, d:Date.now()}; save(); document.getElementById('doneTx').textContent='Прочитано ✓'; };
  document.getElementById('trainTx').onclick = () => { closeSheet(); tab='test'; startQuiz(words); window.scrollTo(0,0); };
}
let sheetEl = null, selEl = null;
function closeSheet(){ if(sheetEl){ sheetEl.remove(); sheetEl=null; } if(selEl){ selEl.classList.remove('sel'); selEl=null; } }
function showWord(tx, el){
  closeSheet();
  const raw = el.textContent, key = raw.toLowerCase().replace(/’/g,"'");
  const g = tx.gloss[key] || tx.gloss[key.replace(/'s$/,'')] || '—';
  const n = tx.vocab[key]; const w = n && BYNUM[n];
  selEl = el; el.classList.add('sel');
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet';
  sheetEl.innerHTML = `<div class="in"><div class="row1"><span class="wd" lang="en">${esc(raw)}</span>${TTS?`<button class="say" id="sheetSay" aria-label="Произнести"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>`:''}<button class="x" id="sheetX" aria-label="Закрыть">×</button></div>
    <div class="gl">${esc(g)}</div>${w?`<div class="dv">Из твоего словаря, №${w.n}: ${esc(w.en)} — ${esc(w.ru)}</div>`:''}</div>`;
  document.body.appendChild(sheetEl);
  document.getElementById('sheetX').onclick = closeSheet;
  const sb = document.getElementById('sheetSay'); if(sb) sb.onclick = () => speak(raw,'en',true);
  speak(raw,'en');
}
document.addEventListener('click', e => { if(sheetEl && !sheetEl.contains(e.target) && !e.target.closest('.tw')) closeSheet(); });

/* ---------- словарь ---------- */
let dq = '';
function renderDict(){
  view.innerHTML = `<div class="panel">
    <input class="inp" id="search" placeholder="Поиск по-английски или по-русски" value="${esc(dq)}" autocomplete="off" style="font-size:16px">
    <div class="legend" style="flex-wrap:wrap"><span>Точки: EN→RU, RU→EN</span><span><i style="background:var(--good)"></i>выучено</span><span><i style="background:var(--mark)"></i>в процессе</span><span><i style="background:var(--bad)"></i>ошибка</span></div>
    <div class="list" id="dlist"></div>
  </div>`;
  const s = document.getElementById('search');
  const fill = () => { const q = norm(dq); const ws = q ? WORDS.filter(w => norm(w.en).includes(q) || norm(w.ru).includes(q) || String(w.n)===q) : WORDS;
    document.getElementById('dlist').innerHTML = ws.length ? ws.map(w=>`<div class="li"><div class="w"><span class="num">${w.n}</span>${esc(w.en)}${w.tr?` <span class="hint">[${esc(w.tr)}]</span>`:''}<small>${esc(w.ru)}</small></div><div class="n"><span class="dot s${status(w.key,'er')}" title="EN→RU"></span><span class="dot s${status(w.key,'re')}" title="RU→EN"></span></div></div>`).join('') : '<div class="empty">Ничего не найдено.</div>'; };
  s.oninput = () => { dq = s.value; fill(); };
  fill();
}

/* ---------- клавиатура ---------- */
document.addEventListener('keydown', e => {
  if(tab!=='test' || !Q || Q.done || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(Q.mode==='choice' && !Q.answered && /^[1-4]$/.test(e.key)) answerChoice(+e.key-1);
  else if(!Q.input && !Q.busy && !Q.answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); document.getElementById('reveal')?.click(); }
  else if(Q.answered && e.key==='Enter' && document.activeElement?.id!=='next'){ e.preventDefault(); next(); }
});

render();
connect();
if(window.claude?.use) claude.use('sample').then(s => { SAMPLE = s; }).catch(()=>{});
</script>

<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
